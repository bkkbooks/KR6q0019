家但恁麼舉似雲巖代云無手腳者始解打師與洞山渡水山曰莫錯下腳師曰錯即過不得也山曰不錯底事作麼生師曰共長老過水一日與洞山鉏茶園山擲下钁頭曰我今日一點氣力也無師曰若無氣力爭解恁麼道山曰汝將謂有氣力底是裴大夫問僧供養佛佛還喫否僧曰如大夫祭家神大夫舉似雲巖巖曰這僧未出家在曰和尚又如何巖曰有幾般飯食但一時下來巖却問師一時下來又作麼生師曰合取鉢盂巖肯之問一地不見二地時如何師曰汝莫錯否汝是何地問生死事乞師一言師曰汝何時死去來曰某甲不會請師說師曰不會須死一場始得師與洞山行次忽見白兔走過師曰俊哉洞曰作麼生師曰大似白衣拜相洞曰老老大大作這箇說話師曰你作麼生洞曰積代簪纓暫時落魄師把針次洞山問曰作甚麼師曰把針洞曰把針事作麼生師曰針針相似洞曰二十年同行作這箇語話豈有與麼工夫師曰長老又作麼生洞曰如大地火發底道理師問洞山智識所通莫不遊踐徑截處乞師一言洞曰師伯意何得取功師因斯頓覺下語非常後與洞山過獨木橋洞先過了拈起木橋曰過來師喚價闍黎洞乃放下橋木幽溪和尚僧問大用現前不存軌則時如何師起繞禪牀一匝而坐僧擬進語師與一踏僧歸位而立師曰汝恁麼我不恁麼汝不恁麼我却恁麼僧再擬進語師又與一踏曰三十年後吾道大行問如何是祖師禪師曰泥牛步步出人前問處處該不得時如何師曰夜半石人無影像縱橫不辨往來源船子誠禪師法嗣澧州夾山善會禪師廣州廖氏子幼歲出家依年受戒聽習經論該練三學出住潤州鶴林因道吾勸發往見船子由是師資道契微朕不留語見船子章恭稟遺命遁世忘機尋以學者交湊廬室星布曉夕參依咸通庚寅海衆卜于夾山遂成院宇上堂有祖以來時人錯會相承至今以佛祖言句為人師範若或如此却成狂人無智人去他祇指示汝無法本是道道無一法無佛可成無道可得無法可取無法可捨所以老僧道目前無法意在目前他不是目前法若向佛祖邊學此人未具眼在何故皆屬所依不得自在本祗為生死茫茫識性無自由分千里萬里求善知識須具正眼永脫虗謬之見定取目前生死為復實有為復實無若有人定得許汝出頭上根之人言下明道中下根器波波浪走何不向生死中定當取何處更疑佛疑祖替汝生死有智人笑汝汝若不會更聽一頌勞持生死法唯向佛邊求目前迷正理撥火覓浮漚僧問從上立祖意教意和尚為甚麼却言無師曰三年不喫飯目前無饑人曰既是無饑人某甲為甚麼不悟師曰祇為悟迷却闍黎復示偈曰明明無悟法悟法却迷人長腳兩舒睡無僞亦無真問十二分教及祖意和尚為甚麼不許人問師曰是老僧坐具曰和尚以何法示人師曰虗空無挂針之路子虗徒撚線之功又曰會麼曰不會師曰金粟之苗裔舍利之真身罔象之玄談是野狐之窟宅上堂不知天曉悟不由師龍門躍鱗不墮漁人之手但意不寄私緣舌不親玄旨正好知音此名俱生話若向玄旨疑去賺殺闍黎困魚止濼鈍鳥棲蘆雲水非闍黎闍黎非雲水老僧於雲水而得自在闍黎又作麼生西川座主罷講遍參到襄州華嚴和尚處問曰祖意教意是同是別嚴曰如車二輪如鳥二翼主曰將為禪門別有長處元來無遂歸蜀後聞師道播諸方令小師持此語問師曰雕砂無鏤玉之談結草乖道人之意主聞舉遙禮曰元來禪門中別有長處上堂聞中生解意下丹青目前即美久蘊成病青山與白雲從來不相到機絲不挂梭頭事文彩縱橫意自殊嘉祥一路智者知疏瑞草無根賢者不貴問如何是道師曰太陽溢目萬里不挂片雲曰不會師曰清清之水遊魚自迷問如何是本師曰飲水不迷源問古人布髮掩泥當為何事師曰九烏射盡一翳猶存一箭墮地天下黯黑問祖意教意是同是別師曰風吹荷葉滿池青十里行人較一程問撥塵見佛時如何師曰直須揮劒若不揮劒漁父棲巢僧後問石霜撥塵見佛時如何霜曰渠無國土甚處逢渠僧回舉似師師上堂舉了乃曰門庭施設不如老僧入理深談猶較石霜百步問兩鏡相照時如何師曰蚌呈無價寶龍吐腹中珠問如何是寂默中事師曰寢殿無人師喫茶了自烹一碗過與侍者者擬接師乃縮手曰是甚麼者無對座主問若是教意某甲即不疑祇如禪門中事如何師曰老僧祇解變生為熟問如何是實際之理師曰石上無根樹山含不動雲問如何是出窟師子師曰虗空無影像足下野雲生師在溈山作典座溈問今日喫甚菜師曰二年同一春溈曰好好修事著師曰龍宿鳳巢問如何識得家中寶師曰忙中爭得作間人問如何是相似句師曰荷葉團團團似鏡菱角尖尖尖似錐復曰會麼曰不會師曰風吹柳絮毛毬走雨打梨花蛺蝶飛問如何是一老一不老師曰青山元不動㵎水鎮長流手執夜明符幾箇知天曉上堂金烏玉兔交互爭輝坐却日頭天下黯黑上唇與下唇從來不相識明明向君道莫令眼顧著何也日月未足為明天地未足為大空中不運斤巧匠不遺蹤見性不留佛悟道不存師尋常老僧道目睹瞿曇猶如黃葉一大藏教是老僧坐具祖師玄旨是破草鞋寧可赤腳不著最好僧問如何是佛師曰此問無賓主曰尋常與甚麼人對談師曰文殊與吾擕水去普賢猶未折花來上堂我二十年住此山未曾舉著宗門中事有僧問承和尚有言二十年住此山未曾舉著宗門中事是否師曰是僧便掀倒禪牀師休去至明日普請掘一坑令侍者請昨日僧至曰老僧二十年說無義語今日請上座打殺老僧埋向坑裡便請便請若不打殺老僧上座自著打殺埋在坑中始得其僧歸堂束裝潛去上堂百草頭薦取老僧閙市裏識取天子虎頭上座參師問甚處來曰湖南來師曰曾到石霜麼曰要路經過爭得不到師曰聞石霜有毬子話是否曰和尚也須急著眼始得師曰作麼生是毬子曰跳不出師曰作麼生是毬杖曰沒手足師曰且去老僧未與闍黎相見明日升座師曰昨日新到在麼頭出應諾師曰目前無法意在目前不是目前法非耳目之所到頭曰今日雖問要且不是師曰片月難明非關天地頭曰莫沸便作掀禪牀勢師曰且緩緩虧著上座甚麼處頭竪起拳曰目前還著得這箇麼師曰作家作家頭又作掀禪牀勢師曰大衆看這一員戰將若是門庭布列山僧不如他若據入理之談也較山僧一級地上堂眼不挂戶意不停玄直得靈草不生猶是五天之位珠光月魄不是出頭時此間無老僧五路頭無闍黎問如何是夾山境師曰猿抱子歸青嶂裏鳥銜華落碧巖前法眼云我二十年祇作境話會師問僧甚麼處來曰洞山來師曰洞山有何言句示徒曰尋常教學人三路學師曰何者三路曰玄路鳥道展手師曰實有此語否曰實有師曰軌持千里鈔林下道人悲師再闡玄樞逮于一紀唐中和元年十一月七日召主事曰吾與衆僧話道纍歲佛法深旨各應自知吾今幻質時盡即去汝等善保護如吾在日勿得雷同世人輒生惆悵言訖奄然而逝塔于本山諡傳明大師翠微學禪師法嗣鄂州清平山安樂院令遵禪師東平人也初參翠微便問如何是西來的的意微曰待無人即向汝說師良久曰無人也請和尚說微下禪牀引師入竹園師又曰無人也請和尚說微指竹曰這竿得恁麼長那竿得恁麼短師雖領其微言猶未徹其玄旨出住大通上堂舉初見翠微機緣謂衆曰先師入泥入水為我自是我不識好惡師自此化導次遷清平上堂諸上座夫出家人須會佛意始得若會佛意不在僧俗男女貴賤但隨家豐儉安樂便得諸上座盡是久處叢林遍參尊宿且作麼生會佛意試出來大家商量莫空氣高至後一事無成一生空度若未會佛意直饒頭上出水足下出火燒身鍊臂聰慧多辨聚徒一千二千說法如雲如雨講得天華亂墜祇成箇邪說爭競是非去佛法大遠在諸人幸值色身安健不值諸難何妨近前著些工夫體取佛意好僧問如何是大乘師曰井索曰如何是小乘師曰錢貫問如何是清平家風師曰一斗作三箇蒸餅問如何是禪師曰猢猻上樹尾連顛問如何是有漏師曰笊籬曰如何是無漏師曰木杓曰覿面相呈時如何師曰分付與典座自餘逗機方便靡狥時情逆順卷舒語超格量天祐十六年終于本山諡法喜禪師舒州投子山大同禪師本州懷寧劉氏子幼歲依洛下保唐滿禪師出家初習安般觀次閲華嚴教發明性海復謁翠微頓悟宗旨語見翠微章由是放意周遊後旋故土隱投子山結茅而居一日趙州和尚至桐城縣師亦出山途中相遇乃逆而問曰莫是投子山主麼師曰茶鹽錢布施我州先歸庵中坐師後擕一瓶油歸州曰久嚮投子及乎到來祇見箇賣油翁師曰汝祇識賣油翁且不識投子州曰如何是投子師提起油瓶曰油油州問大死底人却活時如何師曰不許夜行投明須到州曰我早候白伊更候黑上堂汝諸人來這裏擬覓新鮮語句攢華四六圖口裏有可道我老兒氣力稍劣脣舌遲鈍亦無間言語與汝汝若問我便隨汝答也無玄妙可及於汝亦不教汝垛根終不說向上向下有佛有法有凡有聖亦不存坐繫縛汝諸人變現千般總是汝自生見解擔帶將來自作自受我這裏無可與汝也無表無裏說似諸人有疑便問僧問表裏不收時如何師曰汝擬向這裏垛根便下座問大藏教中還有奇特事也無師曰演出大藏教問如何是眼未開時事師曰目淨修廣如青蓮問一切諸佛及諸佛法皆從此經出如何是此經師曰以是名字汝當奉持問枯木中還有龍吟也無師曰我道髑髏裏有師子吼問一法普潤一切羣生如何是一法師曰雨下也問一塵含法界時如何師曰早是數塵也問金鎖未開時如何師曰開也問學人擬欲修行時如何師曰虗空不曾爛壞巨榮禪客參次師曰老僧未曾有一言半句挂諸方唇齒何用要見老僧榮曰到這裏不施三拜要且不甘師曰出家兒得恁麼沒記榮乃繞禪牀一匝而去師曰有眼無耳朵六月火邊坐問一切聲是佛聲是不師曰是曰和尚莫𡱰沸碗鳴聲師便打問粗言及細語皆歸第一義是不師曰是曰喚和尚作頭驢得麼師便打問如何是十身調御師下禪牀立師指庵前一片石謂雪峰曰三世諸佛總在裏許峰曰須知有不在裏許者師曰不快漆桶師與雪峰遊龍眠有兩路峰問那箇是龍眠路師以杖指之峰曰東去西去師曰不快漆桶問一槌便就時如何師曰不是性燥漢曰不假一槌時如何師曰不快漆桶峰問此間還有人參也無師將钁頭拋向峰面前峯曰恁麼則當處掘去也師曰不快漆桶峯辭師送出門召曰道者峯回首應諾師曰途中善為問故歲已去新歲到來還有不涉二途者也無師曰有曰如何是不涉二途者師曰元正啓祚萬物咸新問依稀似半月倣佛若三星乾坤收不得師於何處明師曰道甚麼曰想師祇有湛水之波且無滔天之浪師曰間言語問類中來時如何師曰人類中來馬類中來問祖祖相傳傳箇甚麼師曰老僧不解妄語問如何是出門不見佛師曰無所覩曰如何是入室別爺娘師曰無所生問如何是火焰裏身師曰有甚麼掩處曰如何是炭庫裏藏身師曰我道汝黑似漆問的的不明時如何師曰明也問如何是末後一句師曰最初明不得問從苗辨地因語識人未審將何辨識師曰引不著問院中有三百人還有不在數者也無師曰一百年前五十年後看取問僧久嚮疏山薑頭莫便是否僧無對法眼代云嚮重和尚日久問抱璞投師請師雕琢師曰不為棟梁材曰恁麼則卞和無出身處也師曰擔帶即竛竮辛苦曰不擔帶時如何師曰不教汝抱璞投師請師雕琢問那吒析骨還父析肉還母如何是那吒本來身師放下拂子叉手問佛法二字如何辨得清濁師曰佛法清濁曰學人不會師曰汝適來問箇甚麼問一等是水為甚麼海鹹河淡師曰天上星地下木法眼別云大似相違問如何是祖師意師曰彌勒覓箇受記處不得問不斷煩惱而入涅槃時如何師作色曰這箇師僧好發業殺人問和尚自住此山有何境界師曰丫角女子白頭絲問如何是無情說法師曰惡問如何是毗盧師曰已有名字曰如何是毗盧師師曰未有毗盧時會取問歷落一句請師道師曰好問四山相逼時如何師曰五蘊皆空問一念未生時如何師曰真箇謾語問凡聖相去幾何師下禪牀立問學人一問即和尚答忽若千問萬問時如何師曰如雞抱卵問天上天下唯我獨尊如何是我師曰推倒這老胡有甚麼罪過問如何是和尚師師曰迎之不見其首隨之罔眺其後問鑄像未成身在甚麼處師曰莫造作曰爭奈現不現何師曰隱在甚麼處問無目底人如何進步師曰遍十方曰無目為甚麼遍十方師曰還更著得目也無問如何是西來意師曰不諱問月未圓時如何師曰吞却三箇四箇曰圓後如何師曰吐却七箇八箇問日月未明佛與衆生在甚麼處師曰見老僧嗔便道嗔見老僧喜便道喜問僧甚麼處來曰東西山禮祖師來師曰祖師不在東西山僧無語法眼代云和尚識祖師問如何是玄中的師曰不到汝口裏道問牛頭未見四祖時如何師曰與人為師曰見後如何師曰不與人為師問諸佛出世為一大事因緣和尚出世當為何事師曰尹司空請老僧開堂問如何是佛師曰幻不可求問千里投師乞師一接師曰今日老僧腰痛菜頭請益師曰且去待無人時來頭明日伺得無人又來師曰近前來頭近前師曰輒不得舉似於人問併却咽㗋脣吻請師道師曰汝祇要我道不得問達磨未來時如何師曰遍天遍地曰來後如何師曰蓋覆不得問如何是無情說法師曰莫惡口問和尚未見先師時如何師曰通身不奈何曰見後如何師曰通身撲不碎曰還從師得也無師曰終不相孤負曰恁麼得從師得也師曰得箇甚麼曰恁麼則孤負先師也師曰非但孤負先師亦乃孤負老僧問七佛是文殊弟子文殊還有師也無師曰適來恁麼道也大似屈己推人問金雞未鳴時如何師曰無這箇音響曰鳴後如何師曰各自知時問師子是獸中之王為甚麼被六塵吞師曰不作大無人我師居投子山三十餘載往來激發請益者常盈于室縱以無畏之辨隨問遽答啐啄同時微言頗多今録少分而已中和中巢寇暴起天下喪亂有狂徒持刃問師曰住此何為師乃隨宜說法渠魁聞而拜伏脫身服施之而去乾化四年四月六日示微疾大衆請醫師謂衆曰四大動作聚散常程汝等勿慮吾自保矣言訖跏趺而寂諡慈濟大師安吉州道場山如訥禪師僧問如何是教意師曰汝自看僧禮拜師曰明月鋪霄漢山川勢自分問如何得聞性不隨緣去師曰汝聽看僧禮拜師曰聾人也唱胡笳調好惡高低自不聞曰恁麼則聞性宛然也師曰石從空裏立火向水中焚問虗空還有邊際否師曰汝也太多知僧禮拜師曰三尺杖頭挑日月一塵飛起任遮天問如何是道人師曰行運無蹤跡起坐絶人知曰如何即是師曰三爐力盡無煙𦦨萬頃平田水不流問一念不生時如何師曰堪作甚麼僧無語師又曰透出龍門雲雨合山川大地入無蹤師目有重瞳手垂過膝自翠微受訣止于此山剃草卓庵學徒四至廣闡法化遂成叢社焉建州白雲約禪師僧問不坐遍空堂不居無學位此人合向甚麼處安置師曰青天無電影韶國師參師問甚麼處來韶曰江北來師曰船來陸來曰船來師曰還逢見魚鱉麼曰往往遇之師曰遇時作麼生韶曰咄縮頭去師大笑孝義性空禪師法嗣歙州茂源禪師因平田參師欲起身田乃把住曰開口即失閉口即喪去此二途請師速道師以手掩耳田放手曰一步易兩步難師曰有甚麼死急田曰若非此箇師不免諸方點檢師不對棗山光仁禪師上堂衆集師於座前謂衆曰不負平生行腳眼目致箇問來還有麼衆無對師曰若無即升座去也便登座僧出禮拜師曰負我且從大衆何也便歸方丈翌日有僧請辨前語意旨如何師曰齊時有飯與汝喫夜後有牀與汝眠一向煎迫我作甚麼僧禮拜師曰苦苦僧曰請師直指師乃垂足曰舒縮一任老僧
