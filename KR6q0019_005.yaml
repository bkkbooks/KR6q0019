body:
  text: 六祖大鑒禪師法嗣吉州青原山靜居寺行思禪師本州安城劉氏子幼歲出家每羣居論道師唯默然聞曹溪法席乃往參禮問曰當何所務即不落階級祖曰汝曾作甚麼來師曰聖諦亦不為祖曰落何階級師曰聖諦尚不為何階級之有祖深器之會下學徒雖衆師居首焉亦猶二祖不言少林謂之得髓矣一日祖謂師曰從上衣法雙行師資遞授衣以表信法乃印心吾今得人何患不信吾受衣以來遭此多難況乎後代爭競必多衣即留鎮山門汝當分化一方無令斷絶師既得法歸住青原六祖將示滅有沙彌希遷即石頭和尚問曰和尚百年後希遷未審當依附何人祖曰尋思去及祖順世遷每於靜處端坐寂若忘生第一座問曰汝師已逝空坐奚為遷曰我稟遺誡故尋思爾座曰汝有師兄思和尚今住吉州汝因緣在彼師言甚直汝自迷耳遷聞語便禮辭祖龕直詣靜居參禮師曰子何方來遷曰曹溪師曰將得甚麼來曰未到曹溪亦不失師曰若恁麼用去曹溪作甚麼曰若不到曹溪爭知不失遷又曰曹溪大師還識和尚否師曰汝今識吾否曰識又爭能識得師曰衆角雖多一麟足矣遷又問和尚自離曹溪甚麼時至此間師曰我却知汝早晚離曹溪曰希遷不從曹溪來師曰我亦知汝去處也曰和尚幸是大人莫造次他日師復問遷汝甚麼處來曰曹溪師乃舉拂子曰曹溪還有這箇麼曰非但曹溪西天亦無師曰子莫曾到西天否曰若到即有也師曰未在更道曰和尚也須道取一半莫全靠學人師曰不辭向汝道恐已後無人承當師令遷持書與南嶽讓和尚曰汝達書了速回吾有箇鈯斧子與汝住山遷至彼未呈書便問不慕諸聖不重己靈時如何嶽曰子問太高生何不向下問遷曰寧可永劫受沉淪不從諸聖求解脫嶽便休玄沙曰大小石頭被南嶽推倒直至如今起不得遷便回師問子返何速書信達否遷曰書亦不通信亦不達去日蒙和尚許箇鈯斧子祇今便請師垂一足遷便禮拜尋辭往南嶽荷澤神會來參師問甚處來曰曹溪師曰曹溪意旨如何會振身而立師曰猶帶瓦礫在曰和尚此間莫有真金與人麼師曰設有汝向甚麼處著玄沙云果然雲居錫云祇如玄沙道果然是真金是瓦礫僧問如何是佛法大意師曰廬陵米作麼價師既付法石頭唐開元二十八年十一月十三日升堂告衆跏趺而逝僖宗諡弘濟禪師歸真之塔青原思禪師法嗣第一世南嶽石頭希遷禪師端州高要陳氏子母初懷娠不喜葷茹師雖在孩提不煩保母既冠然諾自許鄉洞獠民畏鬼神多淫祀殺牛釃酒習以為常師輒往毀叢祠奪牛而歸歲盈數十鄉老不能禁後直造曹溪得度未具戒屬祖圓寂稟遺命謁青原乃攝衣從之緣會語句青原章敘之一日原問師曰有人道嶺南有消息師曰有人不道嶺南有消息曰若恁麼大藏小藏從何而來師曰盡從這裏去原然之師於唐天寶初荐之衡山南寺寺之東有石狀如臺乃結庵其上時號石頭和尚師因看肇論至會萬物為己者其唯聖人乎師乃拊几曰聖人無己靡所不己法身無象誰云自他圓鑑靈照於其間萬象體玄而自現境智非一孰云去來至哉斯語也遂掩卷不覺寢夢自身與六祖同乘一龜游泳深池之內覺而詳之靈龜者智也池者性海也吾與祖師同乘靈智遊性海矣遂著參同契曰竺土大仙心東西密相付人根有利鈍道無南北祖靈源明皎潔枝派暗流注執事元是迷契理亦非悟門門一切境回互不回互回而更相涉不爾依位住色本殊質象聲元異樂苦暗合上中言明明清濁句四大性自復如子得其母火熱風動搖水濕地堅固眼色耳音聲鼻香舌鹹醋然依一一法依根葉分布本末須歸宗尊卑用其語當明中有暗勿以暗相遇當暗中有明勿以明相覩明暗各相對比如前後步萬物自有功當言用及處事存函蓋合理應箭鋒拄承言須會宗勿自立規矩觸目不會道運足焉知路進步非近遠迷隔山河固謹白參玄人光陰莫虗度上堂吾之法門先佛傳受不論禪定精進唯達佛之知見即心即佛心佛衆生菩提煩惱名異體一汝等當知自己心靈體離斷常性非垢淨湛然圓滿凡聖齊同應用無方離心意識三界六道唯自心現水月鏡像豈有生滅汝能知之無所不備時門人道悟問曹溪意旨誰人得師曰會佛法人得曰師還得否師曰不得曰為甚麼不得師曰我不會佛法曰問如何是解脫師曰誰縛汝問如何是淨土師曰誰垢汝問如何是涅槃師曰誰將生死與汝師問新到從甚麼處來曰江西來師曰見馬大師否曰見師乃指一橛柴曰馬師何似這箇僧無對却回舉似馬祖祖曰汝見橛柴大小曰沒量大祖曰汝甚有力僧曰何也祖曰汝從南嶽負一橛柴來豈不是有力問如何是西來意師曰問取露柱曰學人不會師曰我更不會大顛問古人云道有道無俱是謗請師除師曰一物亦無除箇甚麼師却問併却咽㗋脣吻道將來顛曰無這箇師曰若恁麼汝即得入門道悟問如何是佛法大意師曰不得不知悟曰向上更有轉處也無師曰長空不礙白雲飛問如何是禪師曰碌甎問如何是道師曰木頭自餘門屬領旨所有問答各於本章出焉南嶽鬼神多顯迹聽法師皆與授戒廣德二年門人請下于梁端廣闡玄化貞元六年順寂塔于東嶺德宗諡無際大師塔曰見相青原下二世石頭遷禪師法嗣澧州藥山惟儼禪師絳州韓氏子年十七依朝陽西山慧照禪師出家納戒于衡嶽希操律師博通經論嚴持戒律一日自歎曰大丈夫當離法自淨誰能屑屑事細行於布巾邪首造石頭之室便問三乘十二分教某甲粗知嘗聞南方直指人心見性成佛實未明了伏望和尚慈悲指示頭曰恁麼也不得不恁麼也不得恁麼不恁麼總不得子作麼生師罔措頭曰子因緣不在此且往馬大師處去師稟命恭禮馬祖仍伸前問祖曰我有時教伊揚眉瞬目有時不教伊揚眉瞬目有時揚眉瞬目者是有時揚眉瞬目者不是子作麼生師於言下契悟便禮拜祖曰你見甚麼道理便禮拜師曰某甲在石頭處如蚊子上鐵牛祖曰汝既如是善自護持侍奉三年一日祖問子近日見處作麼生師曰皮膚脫落盡唯有一真實祖曰子之所得可謂協於心體布於四肢既然如是將三條篾束取肚皮隨處住山去師曰某甲又是何人敢言住山祖曰不然未有常行而不住未有常住而不行欲益無所益欲為無所為宜作舟航無久住此師乃辭祖返石頭一日在石上坐次石頭問曰汝在這裏作麼曰一物不為頭曰恁麼即間坐也曰若間坐即為也頭曰汝道不為不為箇甚麼曰千聖亦不識頭以偈讚曰從來共住不知名任運相將祇麼行自古上賢猶不識造次凡流豈可明後石頭垂語曰言語動用沒交涉師曰非言語動用亦沒交涉頭曰我這裏針劄不入師曰我這裏如石上栽華頭然之後居澧州藥山海衆雲會師與道吾說茗溪上世為節察來吾曰和尚上世曾為甚麼師曰我痿痿羸羸且恁麼過時吾曰憑何如此師曰我不曾展他書卷石霜別云書卷不曾展院主報打鐘也請和尚上堂師曰汝與我擎鉢盂去曰和尚無手來多少時師曰汝祇是枉披袈裟曰某甲祇恁麼和尚如何師曰我無這箇眷屬謂雲巖曰與我喚沙彌來巖曰喚他來作甚麼師曰我有箇折腳鐺子要他提上挈下巖曰恁麼則與和尚出一隻手去也師便休園頭栽菜次師曰栽即不障汝栽莫教根生曰既不教根生大衆喫甚麼師曰汝還有口麼頭無對道吾雲巖侍立次師指按山上枯榮二樹問道吾曰枯者是榮者是吾曰榮者是師曰灼然一切處光明燦爛去又問雲巖枯者是榮者是巖曰枯者是師曰灼然一切處放教枯淡去高沙彌忽至師曰枯者是榮者是彌曰枯者從他枯榮者從他榮師顧道吾雲巖曰不是不是問如何得不被諸境惑師曰聽他何礙汝曰不會師曰何境惑汝問如何是道中至寶師曰莫諂曲曰不諂曲時如何師曰傾國不換有僧再來依附師問阿誰曰常坦師呵曰前也是常坦後也是常坦師久不升堂院主白曰大衆久思和尚示誨師曰打鐘著衆才集師便下座歸方丈院主隨後問曰和尚既許為大衆說話為甚麼一言不措師曰經有經師論有論師爭怪得老僧師問雲巖作甚麼巖曰擔屎師曰那箇聻巖曰在師曰汝來去為誰曰替他東西師曰何不教並行曰和尚莫謗他師曰不合恁麼道曰如何道師曰還曾擔麼師坐次僧問兀兀地思量甚麼師曰思量箇不思量底曰不思量底如何思量師曰非思量問學人擬歸鄉時如何師曰汝父母遍身紅爛臥在荊棘林中汝歸何所曰恁麼則不歸去也師曰汝却須歸去汝若歸鄉我示汝箇休糧方子曰便請師曰二時上堂不得咬破一粒米問如何是涅槃師曰汝未開口時喚作甚麼問僧甚處來曰湖南來師曰洞庭湖水滿也未曰未師曰許多時雨水為甚麼未滿僧無語道吾云滿也雲巖云湛湛地洞山云甚麼劫中曾增減來雲門云祇在這裏師問僧甚處來曰江西來師以拄杖敲禪牀三下僧曰某甲粗知去處師拋下拄杖僧無語師召侍者點茶與這僧踏州縣困師問龐居士一乘中還著得這箇事麼士曰某甲祇管日求升合不知還著得麼師曰道居士不見石頭得麼士曰拈一放一未為好手師曰老僧住持事繁士珍重便出師曰拈一放一的是好手士曰好箇一乘問宗今日失却也師曰是是上堂祖師祇教保護若貪嗔癡起來切須防禁莫教掁觸是你欲知枯木石頭却須擔荷實無枝葉可得雖然如此更宜自看不得絶言語我今為你說這箇語顯無語底他那箇本來無耳目等貌師與雲巖遊山腰間刀響巖問甚麼物作聲師抽刀驀口作斫勢洞山舉示衆云看他藥山橫身為這箇事今時人欲明向上事須體此意始得遵布衲浴佛師曰這箇從汝浴還浴得那箇麼遵曰把將那箇來師乃休長慶云邪法難扶玄覺云且道長慶恁麼道在賓在主衆中喚作浴佛語亦曰兼帶語且道盡善不盡善問學人有疑請師決師曰待上堂時來與闍黎決疑至晚上堂衆集師曰今日請決疑上座在甚麼處其僧出衆而立師下禪牀把住曰大衆這僧有疑便與一推却歸方丈玄覺曰且道與伊決疑否若決疑甚麼處是決疑若不與決疑又道待上堂時與汝決疑師問飯頭汝在此多少時也曰三年師曰我總不識汝飯頭罔測發憤而去問身命急處如何師曰莫種雜種曰將何供養師曰無物者師令供養主抄化甘行者問甚處來曰藥山來甘曰來作麼曰教化甘曰將得藥來麼曰行者有甚麼病甘便捨銀兩錠意山中有人此物却回無人即休主便歸納疏師問曰子歸何速主曰問佛法相當得銀兩鋌師令舉其語主舉已師曰速送還他子著賊了也主便送還甘曰由來有人遂添銀施之同安顯云早知行者恁麼問終不道藥山來問僧見說汝解算是否曰不敢師曰汝試算老僧看僧無對雲巖舉問洞山汝作麼生山曰請和尚生月師書佛字問道吾是甚麼字吾曰佛字師曰多口阿師問己事未明乞和尚指示師良久曰吾今為汝道一句亦不難祇宜汝於言下便見去猶較些子若更入思量却成吾罪過不如且各合口免相纍及大衆夜參不點燈師垂語曰我有一句子待特牛生兒即向你道有僧曰特牛生兒也祇是和尚不道師曰侍者把燈來其僧抽身入衆雲巖舉似洞山山曰這僧却會祇是不肯禮拜問僧甚處來曰南泉來師曰在彼多少時曰粗經冬夏師曰恁麼則成一頭水牯牛去也曰雖在彼中且不曾上他食堂師曰口欱東南風那曰和尚莫錯自由拈匙把筯人在問達磨未來時此土還有祖師意否師曰有曰既有祖師又來作甚麼師曰祇為有所以來看經次僧問和尚尋常不許人看經為甚麼却自看師曰我祇圖遮眼曰某甲學和尚還得也無師曰汝若看牛皮也須穿長慶云眼有何過玄覺云且道長慶