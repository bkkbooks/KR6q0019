曰師何不鑒師乃拭目而視之僧無語時謂小朗汾州石樓禪師上堂僧問未識本來性乞師方便指師曰石樓無耳朵曰某甲自知非師曰老僧還有過曰和尚過在甚麼處師曰過在汝非處僧禮拜師便打問僧近離甚處曰漢國師曰漢國主人還重佛法麼曰苦哉賴遇問著某甲若問別人即禍生師曰作麼生曰人尚不見有何佛法可重師曰汝受戒得多少夏曰三十夏師曰大好不見有人便打鳳翔府法門寺佛陀禪師尋常持一串數珠念三種名號曰一釋迦二元和三佛陀自餘是甚麼碗躂丘乃過一珠終而復始事迹異常時人莫測水空和尚一日廊下見一僧乃問時中事作麼生僧良久師曰祇恁便得麼曰頭上安頭師打曰去去已後惑亂人家男女在澧州大同濟禪師米胡領衆來才欲相見師便拽轉禪牀面壁而坐米於背後立少時却回客位師曰是即是若不驗破已後遭人貶剝令侍者請米來却拽轉禪牀便坐師乃繞禪牀一匝便歸方丈米却拽倒禪牀領衆便出師訪龐居士士曰憶在母胎時有一則語舉似阿師切不得作道理主持師曰猶是隔生也士曰向道不得作道理師曰驚人之句爭得不怕士曰如師見解可謂驚人師曰不作道理却成作道理士曰不但隔一生兩生師曰粥飯底僧一任檢責士鳴指三下師一日見龐居士來便掩却門曰多知老翁莫與相見士曰獨坐獨語過在阿誰師便開門才出被士把住曰師多知我多知師曰多知且置閉門開門卷之與舒相較幾許士曰祇此一問氣急殺人師默然士曰弄巧成拙僧問此箇法門如何繼紹師曰冬寒夏熱人自委知曰恁麼則蒙分付去也師曰頑嚚少智勔臔多癡問十二時中如何合道師曰汝還識十二時麼曰如何是十二時師曰子丑寅卯僧禮拜師示頌曰十二時中那事別子丑寅卯吾今說若會唯心萬法空釋迦彌勒從茲決青原下三世藥山儼禪師法嗣潭州道吾山宗智禪師豫章海昏張氏子幼依槃和尚受教登戒預藥山法會密契心印一日山問子去何處來師曰遊山來山曰不離此室速道將來師曰山上烏兒頭似雪㵎底遊魚忙不徹師離藥山見南泉泉問闍黎名甚麼師曰宗智泉曰智不到處作麼生宗師曰切忌道著泉曰灼然道著即頭角生三日後師與雲巖在後架把針泉見乃問智頭陀前日道智不到處切忌道著道著即頭角生合作麼生行履師便抽身入僧堂泉便歸方丈師又來把針巖曰師弟適來為甚不祇對和尚師曰你不妨靈利巖不薦却問南泉適來智頭陀為甚不祇對和尚某甲不會乞師垂示泉曰他却是異類中行巖曰如何是異類中行泉曰不見道智不到處切忌道著道著即頭角生直須向異類中行巖亦不會師知雲巖不薦乃曰此人因緣不在此却同回藥山山問汝回何速巖曰祇為因緣不契山曰有何因緣巖舉前話山曰子作麼生會他這箇時節便回巖無對山乃大笑巖便問如何是異類中行山曰吾今日困倦且待別時來巖曰某甲特為此事歸來山曰且去巖便出師在方丈外聞巖不薦不覺咬得指頭血出師却下來問巖師兄去問和尚那因緣作麼生巖曰和尚不與某甲說師便低頭僧問雲居切忌道著意作麼生居云此語最毒云如何是最毒底語居云一棒打殺龍蛇雲巖臨遷化遣書辭師師覽書了謂洞山密師伯曰雲巖不知有我悔當時不向伊道雖然如是要且不違藥山之子玄覺云古人恁麼道還知有也未又云雲巖當時不會且道甚麼處是伊不會處藥山上堂曰我有一句子未曾說向人師出曰相隨來也僧問藥山一句子如何說山曰非言說師曰早言說了也師一日提笠出雲巖指笠曰用這箇作甚麼師曰有用處巖曰忽遇黑風猛雨來時如何師曰蓋覆著巖曰他還受蓋覆麼師曰然雖如是且無滲漏溈山問雲巖菩提以何為座巖曰以無為為座巖却問溈山山曰以諸法空為座又問師作麼生師曰坐也聽伊坐臥也聽伊臥有一人不坐不臥速道速道山休去溈山問師甚麼處去來師曰看病來山曰有幾人病師曰有病底有不病底山曰不病底莫是智頭陀麼師曰病與不病總不干他事速道速道山曰道得也與他沒交涉僧問萬里無雲未是本來天如何是本來天師曰今日好曬麥雲嚴問師弟家風近日如何師曰教師兄指點堪作甚麼巖曰無這箇來多少時也師曰牙根猶帶生澀在僧問如何是今時著力處師曰千人萬人喚不回頭方有少分相應曰忽然火起時如何師曰能燒大地師却問僧除却星與焰那箇是火曰不是火別一僧却問師還見火麼師曰見曰見從何起師曰除却行住坐臥別請一問有施主施裩藥山提起示衆曰法身還具四大也無有人道得與他一腰裩師曰性地非空空非性地此是地大三大亦然山曰與汝一腰裩師指佛桑花問僧曰這箇何似那箇曰直得寒毛卓竪師曰畢竟如何曰道吾門下底師曰十里大王雲巖不安師乃謂曰離此殼漏子向甚麼處相見巖曰不生不滅處相見師曰何不道非不生不滅處亦不求相見雲巖補鞋次師問作甚麼巖曰將敗壞補敗壞師曰何不道即敗壞非敗壞師聞僧念維摩經云八千菩薩五百聲聞皆欲隨從文殊師利師問曰甚麼處去其僧無對師便打後僧問禾山山曰給侍者方諧師到五峰峰問還識藥山老宿否師曰不識峯曰為甚麼不識師曰不識不識問如何是祖師西來意師曰東土不曾逢因設先師齊僧問未審先師還來也無師曰汝諸人用設齊作甚麼石霜問和尚一片骨敲著似銅鳴向甚麼處去也師喚侍者者應諾師曰驢年去唐太和九年九月示疾有苦僧衆慰問體候師曰有受非償子知之乎衆皆愀然越十日將行謂衆曰吾當西邁理無東移言訖告寂闍維得靈骨數片建塔道吾後雷遷于石霜山之陽潭州雲巖曇晟禪師鍾陵建昌王氏子少出家於石門參百丈海禪師二十年因緣不契後造藥山山問甚處來曰百丈來山曰百丈有何言句示徒師曰尋常道我有一句子百味具足山曰鹹則鹹味淡則淡味不鹹不淡是常味作麼生是百味具足底句師無對山曰爭奈目前生死何師曰目前無生死山曰在百丈多少時師曰二十年山曰二十年在百丈俗氣也不除他日侍立次山又問百丈更說甚麼法師曰有時道三句外省去六句內會取山曰三千里外且喜沒交涉山又問更說甚麼法師曰有時上堂大衆立定以拄杖一時趂散復召大衆衆回首丈曰是甚麼山曰何不早恁麼道今日因子得見海兄師於言下頓省便禮拜一日山問汝除在百丈更到甚麼處來師曰曾到廣南來曰見說廣州城東門外有一片石被州主移去是否師曰非但州主闔國人移亦不動山又問聞汝解弄師子是否師曰是曰弄得幾出師曰弄得六出曰我亦弄得師曰和尚弄得幾出曰我弄得一出師曰一即六六即一後到溈山溈問承聞長老在藥山弄師子是否師曰是曰長弄有置時師曰要弄即弄要置即置曰置時師子在甚麼處師曰置也置也僧問從上諸聖甚麼處去師良久曰作麼作麼問暫時不在如同死人時如何師曰好埋却問太保任底人與那箇是一是二師曰一機之絹是一段是兩段洞山代云如人接樹師煎茶次道吾問煎與阿誰師曰有一人要曰何不教伊自煎師曰幸有某甲在師問石霜甚麼處來曰溈山來師曰在彼中得多少時曰粗經冬夏師曰恁麼即成山長也曰雖在彼中却不知師曰他家亦非知非識石霜無對道吾聞云得恁麼無佛法身心住後上堂示衆曰有箇人家兒子問著無有道不得底洞山出問曰他屋裏有多少典籍師曰一字也無曰爭得恁麼多知師曰日夜不曾眠山曰問一段事還得否師曰道得却不道問僧甚處來曰添香來師曰還見佛否曰見師曰甚麼處見曰下界見師曰古佛古佛道吾問大悲千手眼那箇是正眼師曰如人夜間背手摸枕子吾曰我會也師曰作麼生會吾曰遍身是手眼師曰道也太煞道祇道得八成吾曰師兄作麼生師曰通身是手眼掃地次道吾曰太區區生師曰須知有不區區者吾曰恁麼則有第二月也師竪起掃帚曰是第幾月吾便行玄沙聞云正是第二月問僧甚處來曰石上語話來師曰石還點頭也無僧無對師自代曰未語話時却點頭師作草鞋次洞山近前曰乞師眼睛得麼師曰汝底與阿誰去也曰良價無師曰設有汝向甚麼處著山無語師曰乞眼睛底是眼否山曰非眼師便喝出尼僧禮拜師問汝爺在否曰在師曰年多少曰年八十師曰汝有箇爺不年八十還知否曰莫是恁麼來者師曰恁麼來者猶是兒孫洞山代云直是不恁麼來者亦是兒孫僧問一念瞥起便落魔界時如何師曰汝因甚麼却從佛界來僧無對師曰會麼曰不會師曰莫道體不得設使體得也祇是左之右之院主遊石室回師問汝去入到石室裏許為祇恁麼便回主無對洞山代曰彼中已有人占了也師曰汝更去作甚麼山曰不可人情斷絶去也會昌元年辛酉十月二十六日示疾命澡身竟喚主事令備齊來日有上座發去至二十七夜歸寂茶毗得舍利一千餘粒瘞于石塔諡無住大師秀州華亭船子德誠禪師節操高邈度量不羣自印心於藥山與道吾雲巖為同道交洎離藥山乃謂二同志曰公等應各據一方建立藥山宗旨豫率性疏野唯好山水樂情自遣無所能也他後知我所止之處若遇靈利座主指一人來或堪雕琢將授生平所得以報先師之恩遂分擕至秀州華亭泛一小舟隨緣度日以接四方往來之者時人莫知其高蹈因號船子和尚一日泊船岸邊間坐有官人問如何是和尚日用事師竪橈子曰會麼官人曰不會師曰棹撥清波金鱗罕遇師有偈曰三十年來坐釣臺鉤頭往往得黃能金鱗不遇空勞力收取絲綸歸去來千尺絲綸直下垂一波才動萬波隨夜靜水寒魚不食滿船空載月明歸三十年來海上遊水清魚現不吞鉤釣竿斫盡重栽竹不計功程得便休有一魚兮偉莫裁混融包納信奇哉能變化吐風雷下線何曾釣得來別人祇看採芙蓉香氣長粘繞指風兩岸映一船紅何曾解染得虗空問我生涯祇是船子孫各自賭機緣不由地不由天除却簑衣無可傳道吾後到京口遇夾山上堂僧問如何是法身山曰法身無相曰如何是法眼山曰法眼無瑕道吾不覺失笑山便下座請問道吾某甲適來祇對這僧話必有不是致令上座失笑望上座不吝慈悲吾曰和尚一等是出世未有師在山曰某甲甚處不是望為說破吾曰某甲終不說請和尚却往華亭船子處去山曰此人如何吾曰此人上無片瓦下無卓錐和尚若去須易服而往山乃散衆束裝直造華亭船子才見便問大德住甚麼寺山曰寺即不住住即不似師曰不似似箇甚麼山曰不是目前法師曰甚處學得來山曰非耳目之所到師曰一句合頭語萬劫繫驢橛師又問垂絲千尺意在深潭離鉤三寸子何不道山擬開口被師一橈打落水中山才上船師又曰道道山擬開口師又打山豁然大悟乃點頭三下師曰竿頭絲線從君弄不犯清波意自殊山遂問拋綸擲釣師意如何師曰絲懸淥水浮定有無之意山曰語帶玄而無路舌頭談而不談師曰釣盡江波金鱗始遇山乃掩耳師曰如是如是遂囑曰汝向去直須藏身處沒蹤迹沒蹤迹處莫藏身吾三十年在藥山祇明斯事汝今已得他後莫住城隍聚落但向深山裏钁頭邊覓取一箇半箇接續無令斷絶山乃辭行頻頻回顧師遂喚闍黎山乃回首師竪起橈子曰汝將謂別有乃覆船入水而逝宣州椑樹慧省禪師洞山參師問來作甚麼山曰來親近和尚師曰若是親近用動這兩片皮作麼山無對曹山云一子親得僧問如何是佛師曰猫兒上露柱曰學人不會師曰問取露柱去鄂州百巖明哲禪師藥山看經次師曰和尚休猱人好山置經曰日頭早晚也師曰正當午山曰猶有文彩在師曰某甲無亦無山曰汝太煞聰明師曰某甲祇恁麼和尚作麼生山曰跛跛挈挈百醜千拙且恁麼過洞山與密師伯到參師問二上座甚處來山曰湖南師曰觀察使姓甚麼曰不得姓師曰名甚麼曰不得名師曰還治事也無曰自有郎幕在師曰還出入也無曰不出入師曰豈不出入山拂袖便出師次早入堂召二上座曰昨日老僧對闍黎一轉語不相契一夜不安今請闍黎別下一轉語若愜老僧意便開粥相伴過夏山曰請和尚問師曰豈不出入山曰太尊貴生師乃開粥同共過夏澧州高沙彌初參藥山山問甚處來師曰南嶽來山曰何處去師曰江陵受戒去山曰受戒圖甚麼師曰圖免生死山曰有一人不受戒亦無生死可免汝還知否師曰恁麼則佛戒何用山曰這沙彌猶挂唇齒在師禮拜而退道吾來侍立山曰適來有箇跛腳沙彌却有些子氣息吾曰未可全信更須勘過始得至晚山上堂召曰早來沙彌在甚麼處師出衆立山問我聞長安甚閙你還知否師曰我國晏然法眼別云見誰說山曰汝從看經得請益得師曰不從看經得亦不從請益得山曰大有人不看經不請益為甚麼不得師曰不道他不得祇是不肯承當山顧道吾雲巖曰不信道師一日辭藥山山問甚麼處去師曰某甲在衆有妨且往路邊卓箇草庵接待往來茶湯去山曰生死事大何不受戒去師曰知是般事便休更喚甚麼作戒山曰汝既如是不得離吾左右時復要與子相見師住菴後一日歸來值雨山曰你來也師曰是山曰可煞濕師曰不打這箇鼓笛雲巖曰皮也無打甚麼鼓道吾曰鼓也無打甚麼皮山曰今日大好一場曲調僧問一句子還有該不得處否師曰不順世藥山齊時自打鼓師捧鉢作舞入堂山便擲下鼓槌曰是第幾和師曰是第二和山曰如何是第一和師就桶舀一杓飯便出鼎州李翱刺史嚮藥山玄化屢請不赴乃躬謁之山執經卷不顧侍者曰太守在此守性褊急乃曰見面不如聞名拂袖便出山曰太守何得貴耳賤目守回拱謝問曰如何是道山以手指上下曰會麼守曰不會山曰雲在青天水在瓶守欣愜作禮而述偈曰鍊得身形似鶴形千株松下兩函經我來問道無餘說雲在青天水在瓶玄覺云且道李太守是讚他語明他語須是行腳眼始得守又問如何是戒定慧山曰貧道這裏無此間家具守莫測玄旨山曰太守欲得保任此事直須向高高山頂立深深海底行閨閣中物捨不得便為滲漏守見老宿獨坐問曰端居丈室當何所務宿曰法身凝寂無去無來法眼別云汝作甚麼來法燈別云非公境界丹霞然禪師法嗣京兆府翠微無學禪師初問丹霞如何是諸佛師霞咄曰幸自可憐生須要執巾帚作麼師退身三步霞曰錯師進前霞曰錯錯師翹一足旋身一轉而出霞曰得即得孤他諸佛師由是領旨住後投子問未審二祖初見達磨有何所得師曰汝今見吾復何所得投子頓悟玄旨一日師在法堂內行投子進前接禮問曰西來密旨和尚如何示人師駐步少時子曰乞師垂示師曰更要第二杓惡水那子便禮謝師曰莫垛根子曰時至根苗自生師因供養羅漢僧問丹霞燒木佛和尚為甚麼供養羅漢師曰燒也不燒著供養亦一任供養曰供養羅漢羅漢還來也無師曰汝每日還喫飯麼僧無語師曰少有靈利底吉州孝義寺性空禪師僧參師乃展手示之僧近前却退後師曰父母俱喪略不慘顏僧呵呵大笑師曰少間與闍黎舉哀僧打筋斗而出師曰蒼天蒼天僧參人事畢師曰與麼下去還有佛法道理也無曰某甲結舌有分師曰老僧又作麼生曰素非好手師便仰身合掌僧亦合掌師乃撫掌三下僧拂袖便出師曰烏不前兔不後幾人於此茫然走祇有闍黎達本源結舌何曾著空有米倉和尚新到參繞師三匝敲禪牀曰不見主人公終不下參衆師曰甚麼處情識去來曰果然不在師便打一拄杖僧曰幾落情識師曰村草步頭逢著一箇有甚麼話處曰且參衆去丹霞山義安禪師僧問如何是佛師曰如何是上座曰恁麼即無異去也師曰誰向汝道本童禪師因僧寫師真呈師曰此若是我更呈阿誰曰豈可分外也師曰若不分外汝却收取僧擬收師打曰正是分外強為曰若恁麼即須呈於師也師曰收取收取大川禪師法嗣仙天禪師新羅僧參方展坐具擬禮拜師捉住云未發本國時道取一句僧無語師便推出曰問伊一句便道兩句僧參展坐具師曰這裏會得孤負平生去也曰不向這裡會得又作麼生師曰不向這裏會更向那裏會便打出僧參才展坐具師曰不用通時暄還我文彩未生時道理來曰某甲有口啞却即間苦死覓箇臘月扇子作麼師拈棒作打勢僧把住曰還我未拈棒時道理師曰隨我者隨之南北不隨我者死住東西曰隨與不隨且置請師指出東西南北師便打披雲和尚來才入方丈師便問未見東越老人時作麼生為物雲曰祇見雲生碧嶂焉知月落寒潭師曰祇與麼也難得曰莫是未見時麼師便喝雲展兩手師曰錯怪人者有甚麼限雲掩耳而出師曰死却這漢平生也洛瓶和尚參師問甚處來瓶曰南溪師曰還將南溪消息來麼曰消即消已息即未息師曰最苦是未息瓶曰且道未息箇甚麼師曰一回見面千載忘名瓶拂袖便出師曰弄死蛇手有甚麼限僧參擬禮拜師曰野狐兒見甚麼了便禮拜曰老禿奴見甚麼了便恁麼問師曰苦哉苦哉仙天今日忘前失後曰要且得時終不補失師曰爭不如此曰誰甘師呵呵大笑曰遠之遠矣僧四顧便出福州普光禪師僧侍立次師以手開胸曰還委老僧事麼曰猶有這箇在師却掩胸曰不妨太顯曰有甚麼避處師曰的是無避處曰即今作麼生師便打大顛通禪師法嗣漳州三平義忠禪師福州楊氏子初參石鞏鞏常張弓架箭接機師詣法席鞏曰看箭師乃撥開胸曰此是殺人箭活人箭又作麼生鞏彈弓弦三下師乃禮拜鞏曰三十年張弓架箭祇射得半箇聖人遂拗折弓箭後參大顛舉前話顛曰既是活人箭為甚麼向弓弦上辨平無對顛曰三十年後要人舉此話也難得師問大顛不用指東劃西便請直指顛曰幽州江口石人蹲師曰猶是指東劃西顛曰若是鳳凰兒不向那邊討師作禮顛曰若不得後句前話也難圓師住三平上堂曰今時人出來盡學馳求造作將當自己眼目有甚麼相當阿汝欲學麼不要諸餘汝等各有本分事何不體取作麼心憤憤口悱悱有甚麼利益分明向汝說若要修行路及諸聖建立化門自有大藏教文在若是宗門中事宜汝切不得錯用心僧問宗門中還有學路也無師曰有一路滑如苔曰學人還攝得否師曰不擬心汝自看問黑豆未生芽時如何師曰佛亦不知講僧問三乘十二分教某甲不疑如何是祖師西來意師曰龜毛拂子兔角拄杖大德藏向甚麼處曰龜毛兔角豈是有邪師曰肉重千斤智無銖兩上堂諸人若未曾見知識即不可若曾見作者來便合體取些子意度向巖谷間木食草衣恁麼去方有少分相應若馳求知解義句即萬里望鄉關去也珍重問侍者姓甚麼者曰與和尚同姓師曰你道三平姓甚麼者曰問頭何在師曰幾時問汝者曰問姓者誰師曰念汝初機放汝三十棒師有偈曰即此見聞非見聞無餘聲色可呈君箇中若了全無事體用何妨分不分升座次有道士出衆從東過西一僧從西過東師曰適來道士却有見處師僧未在士便出禮曰謝師接引師便打僧出作禮曰乞師指示師亦打復謂衆曰此兩件公案作麼生斷還有人斷得麼如是三問衆無對師曰既無人斷得老僧為斷去乃擲下拄杖歸方丈馬頰山本空禪師上堂祇這施為動轉還合得本來祖翁麼若合得十二時中無虗棄底道理若合不得喫茶說話往往喚作茶話在僧便問如何免得不成茶話去師曰你識得口也未曰如何是口師曰兩片皮也不識曰如何是本來祖翁師曰大衆前不要牽爺恃娘曰大衆欣然去也師曰你試點大衆性看僧作禮師曰伊往往道一性一切性在僧欲進語師曰孤負平生行腳眼問去却即今言句請師直指本來性師曰你迷源來得多少時曰即今蒙和尚指示師曰若指示你我即迷源曰如何即是師示頌曰心是性體性是心用心性一如誰別誰共妄外迷源祇者難洞古今凡聖如幻如夢本生禪師拈拄杖示衆曰我若拈起你便向未拈起時作道理我若不拈起你便向拈起時作主宰且道老僧為人在甚處時有僧出曰不敢妄生節目師曰也知闍黎不分外曰低低處平之有餘高高處觀之不足師曰節目上更生節目僧無語師曰掩鼻偷香空招罪犯長髭曠禪師法嗣潭州石室善道禪師作沙彌時長髭遣令受戒謂之曰汝回日須到石頭和尚處禮拜師受戒後乃參石頭一日隨頭遊山次頭曰汝與我斫却面前樹子免礙我師曰不將刀來頭乃抽刀倒與師曰何不過那頭來頭曰你用那頭作甚麼師即大悟便歸長髭髭問汝到石頭否師曰到即到祇是不通號髭曰從誰受戒師曰不依他髭曰在彼即恁麼來我這裏作麼生師曰不違背髭曰太忉忉生師曰舌頭未曾點著在髭喝曰沙彌出去師便出髭曰爭得不遇於人師尋值沙汰乃作行者居于石室每見僧便竪起杖子曰三世諸佛盡由這箇對者少得冥契長沙聞乃曰我若見即令放下拄杖別通箇消息三聖將此語祇對被師認破是長沙語杏山聞三聖失機乃親到石室師見杏山僧衆相隨潛入碓坊碓米杏曰行者接待不易貧道難消師曰開心碗子盛將來無蓋盤子合取去說甚麼難消杏便休仰山問佛之與道相去幾何師曰道如展手佛似握拳曰畢竟如何的當可信可依師以手撥空三下曰無恁麼事無恁麼事曰還假看教否師曰三乘十二分教是分外事若與他作對即是心境兩法能所雙行便有種種見解亦是狂慧未足為道若不與他作對一事也無所以祖師道本來無一物汝不見小兒出胎時可道我解看教不解看教當恁麼時亦不知有佛性義無佛性義及至長大便學種種知解出來便道我能我解不知總是客塵煩惱十六行中嬰兒行為最哆哆和和時喻學道之人離分別取捨心故讚歎嬰兒可況喻取之若謂嬰兒是道今時人錯會師一夕與仰山玩月山問這箇月尖時圓相甚麼處去圓時尖相又甚麼處去師曰尖時圓相隱圓時尖相在雲巖云尖時圓相在圓時無尖相道吾云尖時亦不尖圓時亦不圓仰山辭師送出門乃召曰闍黎山應諾師曰莫一向去却回這邊來僧問曾到五臺否師曰曾到曰還見文殊麼師曰見曰文殊向行者道甚麼師曰文殊道你生身父母在深草裏青原下四世道吾智禪師法嗣潭州石霜山慶諸禪師廬陵新淦陳氏子依洪井西山紹鑾禪師落髮詣洛下學毗尼教雖知聽制終為漸宗回抵溈山為米頭一日篩米次溈曰施主物莫拋散師曰不拋撒溈於地上拾得一粒曰汝道不拋撒這箇是甚麼師無對溈又曰莫輕這一粒百千粒盡從這一粒生師曰百千粒從這一粒生未審這一粒從甚麼處生溈呵呵大笑歸方丈溈至晚上堂曰大衆米裡有蟲諸人好看後參道吾問如何是觸目菩提吾喚沙彌彌應諾吾曰添淨瓶水著良久却問師汝適來問甚麼師擬舉吾便起去師於此有省吾將順世垂語曰我心中有一物久而為患誰能為我除之師曰心物俱非除之益患吾曰賢哉賢哉師後避世混俗于長沙瀏陽陶家坊朝遊夕處人莫能識後因僧自洞山來師問和尚有何言句示徒曰解夏上堂云秋初夏末兄弟或東去西去直須向萬里無寸草處去良久曰祇如萬里無寸草處作麼生去師曰有人下語否曰無師曰何不道出門便是草僧回舉似洞山山曰此是一千五百人善知識語因茲囊錐始露果熟香飄衆命住持上堂汝等諸人自有本分事不用馳求無你是非處無你咬嚼處一代時教整理時人腳手凡有其由皆落今時直至法身非身此是教家極則我輩沙門全無肯路若分則差不分則坐著泥