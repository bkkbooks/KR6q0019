塚不為家曰如何是道師曰徒勞車馬迹曰如何是教師曰貝葉收不盡新羅國大嶺禪師僧問古人道祇到潼關便即休會了便休未會便休師曰祇為迷途中活計曰離却迷途還得其中活計也無師曰體即得當即不得曰既是體得為甚麼當不得師曰體是甚麼人分上事曰其中事如何師曰不作尊貴問如何是一切處清淨師曰截瓊枝寸寸是寶析旃檀片片皆香問如何是用中無礙師曰一片白雲繚亂飛中雲葢禪師法嗣潭州雲葢山證覺景禪師僧問國土晏清功歸何處師曰銀臺門下不展賀曰轉功無位時如何師曰王家事宛然曰如何是閫外底事師曰畵鼓聲終後將軍不點頭吉州禾山師陰禪師僧問王子未來登誰人當治化師曰閫外不行邊塞令將軍自致太平年曰恁麼則治化之功猶不當師曰亦有當曰如何是當師曰十方國土盡屬於王問久久尋源為甚麼不見師曰為步數太多曰恁麼則不覓去也師曰還同避溺而投火問如何是佛師曰承當者不是好手幽州柘溪從實禪師僧問如何是道師曰箇中無紫皁曰如何是禪師曰不與白雲連師問僧作甚麼來曰親近來師曰任你白雲朝嶽頂爭奈青山不展眉洛浦安禪師法嗣蘄州烏牙山彥賓禪師僧問未作人身已前作甚麼來師曰三脚石牛坡上走一枝瑞草目前分問疋馬單鎗直入時如何師曰饒你雄信解拈鎗猶較秦王百步在問久戰沙場為甚麼功名不就師曰雙鵰隨箭落李廣不當名問百步穿楊中的者誰師曰將軍不上便橋金牙徒勞拈筈問螮蝀飲雲根時如何師曰金輪天子下閻浮鐵縵頭上金花異曰正當恁麼時如何師曰當今不坐靈明殿畵鼓休停八佾音鳳翔府青峯傳楚禪師涇州人也一日洛浦問曰院主去甚麼處來師曰掃雪來浦曰雪深多少師曰樹上總是浦曰得即得汝向後住箇雪窟定矣後訪白水水曰見說洛浦有生機一路是否師曰是水曰止却生路向熟路上來師曰生路上死人無數熟路上不著活漢水曰此是洛浦底你底作麼生師曰非但洛浦夾山亦不奈何水曰夾山為甚麼不奈何師曰不見道生機一路住後僧問佛魔未現向甚麼處應師曰諸上座聽祇對問大事已明為甚麼也如喪考妣師曰不得春風花不開及至花開又吹落問如何是一色師曰全無一滴水浪激似銀山問如何是臨機一句師曰便道將來曰請和尚道師曰穿過髑髏不知痛痒問如何是明了底人一句師曰駿馬寸步不移鈍鳥昇騰出路京兆府永安院善靜禪師郡之王氏子母夢金像覺而有娠師幼習儒學博通羣言年二十七忽厭浮幻潛詣終南山禮廣度禪師披削唐天復中南謁洛浦浦器之容其入室乃典園務力營眾事一日有僧辭浦浦曰四面是山闍黎向甚麼處去僧無對浦曰限汝十日下語得中即從汝去其僧經行冥搜偶入園中師問曰上座既是辭去今何在此僧具陳所以堅請代語師曰竹密豈妨流水過山高那阻野雲飛其僧喜踊師囑之曰不得道是某甲語僧遂白浦曰誰語曰某甲語浦曰非汝語僧具言園頭見教浦至晚上堂謂眾曰莫輕園頭他日座下有五百人在後住汞安眾餘五百果符洛浦之記僧問知有道不得時如何師曰知有箇甚麼曰不可無去也師曰恁麼則合道得曰道即不無爭奈語偏師曰水凍魚難躍山寒花發遲問如何是和尚家風師曰木馬背斜陽入草無蹤跡問如何是一色師曰易分雪裏粉難辯墨中煤問如何是衲衣向上事師曰龍魚不出海水月不吞光問不可以智知不可以識識時如何師曰鶴鷺竝頭踏雪睡月明驚起兩遲疑問牛頭未見四祖時如何師曰異境靈松覩者皆羨曰見後如何師曰葉落已枝摧風來不得韻問如何得生如來家師曰披衣望曉論劫不明曰明後如何師曰一句不可得曰如何是不坐如來座師曰抱頭石女歸來晚祇園會裡沒蹤由師往遊僰道避昭宗蒙塵之亂以漢開運丙午冬鳴犍槌集僧囑累入方丈東向右脇而化諡淨悟禪師鄧州中度禪師僧問海內不逢師如何是寰中主師曰金鷄常報曉時人自不聞問如何是暗中明鏡師曰昧不得曰未審照何物師曰甚麼物不照問如何是實際理地不受一塵佛事門中不捨一法師曰真常塵不染海納百川流曰請和尚離聲色外答師曰木人常對語有性不能言嘉州洞谿戒定禪師初問洛浦月樹無枝長覆蔭請師直指妙玄微浦曰森羅秀處事不相依淥水千波孤峯自異師於是領旨住後僧問蛇師為甚麼被蛇吞師曰幾度扣門招不出將身直入裏頭看有官人問既是清淨伽藍為甚打魚鼓師曰直須打出青霄外免見龍門點額人京兆府臥龍禪師僧問杲日符天際珠光照舊都浦津通法海今日意如何師曰寶劒揮時豈該明暗逍遙忠禪師法嗣泉州福清院師巍通玄禪師僧問枝分夾嶺的紹逍遙寶座既登法雷請震師曰逍遙迥物外物外霞不生問如何是西來的的意師曰立雪未為勞斷臂方為的曰恁麼則一華開五葉芬芳直至今師曰因圓三界外果滿十方知京兆府白雲無休禪師僧問路逢猛虎如何降伏師曰歸依佛法僧問如何是白雲境師曰月夜樓邊海客愁蟠龍文禪師法嗣廬山永安淨悟禪師僧問如何是出家底事師曰萬丈懸崖撒手去曰如何是不出家底事師曰迥殊雪嶺安巢節有異許由挂一瓢問六門不通如何達信師曰闍黎外邊與誰相識問脫籠頭卸角䭾來時如何師曰換骨洗腸投紫塞鴈門切忌更銜蘆問從上諸聖將何示人師曰有異祖龍行化節逈超棲鳳越揚塵問如何是解作客底人師曰寶御珍裝猶尚棄誰能歷劫傍他門問如何是西來意師曰海底泥牛吼雲中木馬嘶問眾手淘金誰是得者師曰黃帝不曾遊赤水神珠罔象也虗然問雪覆蘆華時如何師曰雖則沍凝呈瑞色太陽暉後却迷人袁州木平山善道禪師初謁洛浦問一漚未發已前如何辨其水脉浦曰移舟諳水脉舉棹別波瀾師不契乃參蟠龍語同前問龍曰移舟不別水舉棹即迷源師從此悟入僧問如何是西來意師曰石羊頭子向東看問如何是正法眼師曰拄杖孔問如何是不動尊師曰浪浪蕩蕩問如何是木平一句師曰畐塞虗空曰畐塞虗空即不問如何是一句師便打凡有新到未許參禮先令運土三擔而示偈曰南山路側東山低新到莫辭三轉泥嗟汝在途經日久明明不曉却成迷師肉髻螺紋金陵李氏嚮其道譽迎請供養待以師禮甞問如何是木平師曰不勞斤斧曰為甚麼不勞斤斧師曰木平法眼禪師有偈贈曰木平山裏人貌古言復少相看陌路同論心秋月皎壞衲線非蠶助歌聲有鳥城闕今日來一漚曾已曉滅後門人建塔諡真寂禪師崇福志禪師僧問供養百千諸佛不如供養一無心道人未審諸佛有何過無心道人有何德師曰雪深宜近火身煖覺春遲問貧子獻珠時如何師曰甚麼處得來問如何是道師曰回車有分陝府龍溪禪師上堂僧問如何是無縫塔師曰百寶莊嚴今已了四門開豁幾多時師乃曰直饒說似箇無縫塔也不免老僧下箇橛作麼生免得去眾無對師曰下去黃山輪禪師法嗣郢州桐或作潼泉山禪師參黃山山問天門一合十方無路有人道得擺手出漳江師曰蟄戶不開龍無龍句山曰是你恁麼道師曰是即直言是不是直言不是山曰擺手出漳江山復問卞和到處荊山秀玉印從他天子傳時如何師曰靈鶴不於林下憩野老不重太平年山深肯之住後僧問如何是相傳底事師曰龍吐長生水魚吞無盡漚曰請師挑剔師曰擂鼓轉船頭棹穿波裏月韶山普禪師法嗣潭州文殊禪師僧問如何是祝融峰前事師曰巖前瑞草生問仁王登位萬姓霑恩和尚出世有何祥瑞師曰萬里長沙駕鐵船問如何是本爾莊嚴師曰菊花原上景行人去路長耀州密行禪師僧問密室之言請師垂示師曰南方水濶北地風多曰不會乞師再指師曰鳥棲林麓易人出是非難思明禪師法嗣襄州鷲嶺善本禪師浴次僧問和尚是離垢人為甚麼却浴師曰定水湛然滿浴此無垢人問祖意教意是同是別師曰鷲嶺峯上青草參天鹿野苑中狐兔交橫青原下七世藤霞禪師法嗣澧州藥山禪師上堂夫學般若菩薩不懼得失有事近前時有僧問藥山祖裔請師舉唱師曰萬機挑不出曰為甚麼萬機挑不出師曰他緣岸谷問如何是藥山家風師曰葉落不如初問法雷哮吼時如何師曰宇宙不曾震曰為甚麼不曾震師曰徧地娑婆未甞哮吼曰不哮吼底事如何師曰闔國無人知雲蓋景禪師法嗣衡嶽南臺寺藏禪師僧問遠遠投師請師一接師曰不隔戶問如何是南臺境師曰松韻拂時石不點孤峰山下壘難齊曰如何是境中人師曰巖前栽野菓接待往來賓曰恁麼則謝師供養師曰怎生滋味問如何是法堂師曰無壁落問不顧諸緣時如何師良久潭州雲蓋山證覺禪師僧問如何是和尚家風師曰四海不曾通問如何是一塵含法界師曰通身體不圓曰如何是九世剎那分師曰繁興不布彩師如何是宗門中的的意師曰萬里胡僧不入波瀾烏牙賓禪師法嗣安州大安山興古禪師僧問亡僧遷化向甚麼處去也師曰昨夜三更拜南郊問維摩默然意旨如何師曰黯黑石牛兒超然不出戶問如何是那邊事師曰黑漆牧童不展手銀籠鶴畔野雲飛蘄州烏牙山行朗禪師僧問未作人身已前作甚麼來師曰海上石牛歌三拍一條紅線掌間分問迦葉上行衣何人合得披師曰天然無相子不挂出塵衣青峯楚禪師法嗣西川靈龕禪師僧問如何是諸佛出身處師曰出處非干佛春來草自青問碌碌地時如何師曰試進一步看京兆府紫閣山端己禪師僧問四相俱盡立甚麼為真師曰你甚麼處去來問渭水正東流時如何師曰從來無間斷房州開山懷晝禪師僧問作何行業即得不違於千聖師曰妙行無倫匹情玄體自殊問有耳不臨清水洗無心誰為白雲幽時如何師曰無木挂千金曰挂後如何師曰杳杳人難辯問如何是塵中師師曰荊棘林中隨處到旃檀林裡任縱橫問如何是祖師西來意師曰月隱澄潭金輝正午幽州傳法禪師僧問教意祖意是同是別師曰華開金線秀古洞白雲深問別人為甚麼徒弟多師為甚麼無徒弟師曰海島龍多隱茅茨鳳不棲益州淨眾寺歸信禪師僧問蓮華未出水時如何師曰菡萏滿池流曰出水後如何師曰葉落不知秋問不假浮囊便登巨海時如何師曰紅觜飛超三界外綠毛也解道煎茶問如何是自在底人師曰劒樹霜林去便行曰如何是不自在底人師曰釋迦在闍黎後青峰山清勉禪師僧問久醞蒲萄酒今日為誰開師曰飲者方知問如何是祖師西來意師曰耨池無一滴四海自滔滔宋世玉音宋太宗皇帝一日幸相國寺見僧看經問曰是甚麼經僧曰仁王經帝曰既是寡人經因甚却在卿手裏僧無對雪竇代云皇天無親唯德是輔幸開寶塔問僧卿是甚人對曰塔主帝曰朕之塔為甚麼卿作主僧無對雪竇代曰合國咸知一日因僧朝見帝問甚處來對曰廬山臥雲庵帝曰朕聞臥雲深處不朝天為甚到此僧無對雪竇代云難逃至化僧入對次奏曰陛下還記得麼帝曰甚處相見來奏曰靈山一別直至如今帝曰卿以何為驗僧無對雪竇代曰貧道得得而來京寺回祿藏經悉為煨燼僧欲乞宣賜召問昔日摩騰不燒如今為甚却燒僧無對雪竇代云陛下不忘付囑帝嘗夢神人報曰請陛下發菩提心因早朝宣問左右街菩提心作麼生發街無對雪竇代云實謂今古罕聞智寂大師進三界圖帝問朕在那一界中寂無對保寧勇代曰陛下何處不稱尊一日朝罷帝擎鉢問丞相王隨曰既是大庾嶺頭提不起為甚麼却在朕手裏隨無對徽宗皇帝政和三年嘉州巡捕官奏本部路傍有大古樹因風摧折中有一僧禪定鬚髮被體指爪遶身帝降旨令肩輿入京命西天總持三藏以金磬出其定遂問何代僧曰我乃東林遠法師之弟名慧持因遊峨嵋入定於樹遠法師無恙否藏曰遠法師晉人也化去七百年矣持不復語藏問師既至此欲歸何所持曰陳留縣復入定帝製三偈令繪像頒行偈曰七百年來老古錐定中消息許誰知爭如隻履西歸去生死何勞木作皮藏山於澤亦藏身天下無藏道可親寄語莊周休擬議樹中不是負趍人有情身不是無情彼此人人定裏身會得菩提本無樹不須辛苦問盧能孝宗皇帝宣問靈隱佛照光禪師曰釋迦佛入山修道六年而成所成者何事請師明說對曰將謂陛下忘却
