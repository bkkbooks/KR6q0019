body:
  text: 青原下五世石霜諸禪師法嗣潭州大光山居誨禪師京兆人也初造石霜長坐不臥麻衣草履亡身為法霜遂令主性空塔院一日霜知緣熟試其所得問曰國家每年放舉人及第朝門還得拜也無師曰有一人不求進霜曰憑何師曰他且不為名霜曰除却今日別更有時也無師曰他亦不道今日是如是酬問往復無滯盤桓二十餘祀眾請出世僧問祇如達磨是祖否師曰不是祖曰既不是祖又來作甚麼師曰祇為汝不薦曰薦後如何師曰方知不是祖問混沌未分時如何師曰時教阿誰敘上堂一代時教祇是整理時人手脚直饒剝盡到底也祇成得箇了事人不可將當衲衣下事所以道四十九年明不盡標不起倒這裏合作麼生更若忉忉恐成負累珍重瑞州九峯道䖍禪師福州人也甞為石霜侍者洎霜歸寂眾請首座繼住持師白眾曰須明得先師意始可座曰先師有甚麼意師曰先師道休去歇去冷湫湫地去一念萬年去寒灰枯木去古廟香爐去一條白練去其餘則不問如何是一條白練去座曰這箇祇是明一色邊事師曰元來未會先師意在座曰爾不肯我那但裝香來香煙斷處若去不得即不會先師意遂焚香香煙未斷座已脫去師拊座背曰坐脫立亡即不無先師意未夢見在住後僧問無間中人行甚麼行師曰畜生行曰畜生復行甚麼行師曰無間行曰此猶是長生路上人師曰汝須知有不共命者曰不共甚麼命師曰長生氣不常師乃曰諸兄弟還識得命麼欲知命流泉是命湛寂是身千波競涌是文殊境界一亘晴空是普賢牀榻其次借一句子是指月於中事是話月從上宗門中事如節度使信旗相似且如諸方先德未建許多名目指陳已前諸兄弟約甚麼體格商量到這裏不假三寸試話會看不假耳試釆聽看不假眼試辯白看所以道聲前拋不出句後不藏形盡乾坤大地都來是汝當人箇體向甚麼處安眼耳鼻舌莫但向意根下圖度作解盡未來際亦未有休歇分所以洞山道擬將心意學玄宗大似西行却向東珍重問承古有言向外紹則臣位向內紹則王種是否師曰是曰如何是外紹師曰若不知事極頭祇得了事喚作外紹是為臣種曰如何是內紹師曰知向裏許承當擔荷是為內紹曰如何是王種師曰須見無承當底人無擔荷底人始得同一色同一色了所以借為誕生是為王種曰恁麼則內紹亦須得轉師曰灼然有承當擔荷爭得不轉汝道內紹便是人王種你且道如今還有紹底道理麼所以古人道紹是功紹了非是功轉功位了始喚作人王種曰未審外紹還轉也無師曰外紹全未知有且教渠知有曰如何是知有師曰天明不覺曉問如何是外紹師曰不借別人家裏事曰如何是內紹師曰推爺向裏頭曰二語之中那語最親師曰臣在門裏王不出門曰恁麼則不出門者不落二邊師曰渠也不獨坐世界裏紹王種名外紹王種姓所以道紹是功名臣是偏中正紹了轉功名君是正中偏問誕生還更知聞也無師曰更知聞阿誰曰恁麼則莫便是否師曰若是古人為甚麼道誕生王有父曰既有父為甚麼不知聞師曰同時不識祖問古人云直得不恁麼來者猶是兒孫意旨如何師曰古人不謾語曰如何是來底兒孫師曰猶守珍御在曰如何是父師曰無家可坐無世可興問諸聖間出祇是箇傳語底人豈不是和尚語師曰是曰祇如世尊生下一手指天一手指地云天上天下唯我獨尊為甚麼喚作傳語底人師曰為他指天指地所以喚作傳語底人僧禮拜而退問九重無信恩赦何來師曰流光雖徧閫內不周曰流光與閫內相去多少師曰綠水騰波青山秀色問人人盡言請益未審師將何拯濟師曰汝道巨嶽還曾乏寸土也無曰恁麼則四海參尋當為何事師曰演若迷頭心自狂曰還有不狂者麼師曰有曰如何是不狂者師曰突曉途中眼不開問如何是學人自己師曰更問阿誰曰便恁麼承當時如何師曰須彌還更戴須彌問祖祖相傳復傳何事師曰釋迦慳迦葉富曰如何是釋迦慳師曰無物與人曰如何是迦葉富師曰國內孟甞君曰畢竟傳底事作麼生師曰百歲老人分夜燈問諸佛非我道如何是我道師曰我非諸佛曰既非諸佛為甚麼却立我道師曰適來暫喚來如今却遣出曰為甚麼却遣出師曰若不遣出眼裏塵生問一切處覓不得豈不是聖師曰是甚麼聖曰牛頭未見四祖時豈不是聖師曰是聖境未忘曰二聖相去幾何師曰塵中雖有隱形術爭奈全身入帝鄉問古人道因真立妄從妄顯真是否師曰是曰如何是真心師曰不雜食是曰如何是妄心師曰攀緣起倒是曰離此二途如何是本體師曰本體不離曰為甚麼不離師曰不敬功德天誰嫌黑暗女問盡乾坤都來是箇眼如何是乾坤眼師曰乾坤在裏許曰乾坤眼何在師曰正是乾坤眼曰還照矚也無師曰不借三光勢曰既不借三光勢憑何喚作乾坤眼師曰若不如是髑髏前見鬼人無數問一筆丹青為甚麼邈誌公真不得師曰僧繇却許誌公曰未審僧繇得甚麼人證旨却許誌公師曰烏龜稽首須彌柱問動容沉古路身沒乃方知此意如何師曰偷佛錢買佛香曰學人不會師曰不會即燒香供養本爺娘師後住泐潭而終諡大覺禪師台州涌泉景欣禪師泉州人也自石霜開示而止涌泉一日不披袈裟喫飯有僧問莫成俗否師曰即今豈是僧邪彊德二禪客於路次見師騎牛不識師忽曰蹄角甚分明爭柰騎者不鑒師驟牛而去彊德憩於樹下煎茶師回却下牛問曰二禪客近離甚麼處彊曰那邊師曰那邊事作麼生彊提起茶盞師曰此猶是這邊事那邊事作麼生彊無對師曰莫道騎者不鑒好上堂我四十九年在這裏尚自有時走作汝等諸人莫開大口見解人多行解人萬中無一箇見解言語總要知通若識不盡敢道輪回去在為何如此蓋為識漏未盡汝但盡却今時始得成立亦喚作立中功轉功就他去亦喚作就中功親他去我所以道親人不得度渠不度親人恁麼譬喻尚不會薦取渾崙底但管取性亂動舌頭不見洞山道相續也大難汝須知有此事若不知有啼哭有日在上堂拍盲不見佛開眼遇途人借問途中事渠無丈六身不從五天來漢地不曾踏不是張家生誰云李家子三人拄一杖臥一牀似伊不似伊拈來搭肩上為他十八兒論不奈伊何潭州雲葢山志元圓淨禪師遊方時問雲居曰志元不奈何時如何居曰祇為闍黎功力不到師不禮拜直造石霜亦如前問霜曰非但闍黎老僧亦不奈何師曰和尚為甚麼不奈何霜曰老僧若奈何拈過汝不奈何師便禮拜僧問石霜萬戶俱閉即不問萬戶俱開時如何霜曰堂中事作麼生僧無對經半年方始下一轉語曰無人接得渠霜曰道即太煞道祇道得八成曰和尚又且如何霜曰無人識得渠師知乃禮拜乞為舉霜不肯師乃抱霜上方丈曰和尚若不道打和尚去在霜曰得在師頻禮拜霜曰無人識得渠師於言下頓省住後僧問如何是佛師曰黃面底是曰如何是法師曰藏裏是問然燈未出時如何師曰昧不得問蛇為甚麼吞却師師曰通身色不同問如何是衲僧師曰參尋訪道潭州道正表聞馬王乞師論義王請師上殿相見茶罷師就王乞劒師握劒問道正曰你本教中道恍恍惚惚其中有物是何物杳杳冥冥其中有精是何精道得不斬道不得即斬道正茫然便禮拜懺悔師謂王曰還識此人否王曰識師曰是誰王曰道正師曰不是其道若正合對得臣僧此祇是箇無主孤魂因茲道士更不紛紜潭州谷山藏禪師僧問法尚應捨何況非法如何是法尚應捨師曰空裏撒醍醐曰如何是非法師曰嵩山道士詐明頭問逼迫出來時如何師曰還曾拶著汝麼潭州中雲葢禪師僧問和尚開堂當為何事師曰為汝驢漢曰諸佛出世當為何事師曰為汝驢漢問祖佛未出世時如何師曰像不得曰出世後如何師曰闍黎也須側身始得問如何是向上一句師曰文殊失却口曰如何是門頭一句師曰頭上插花子問如何是超百億師曰超人不得肯河中南際山僧一禪師僧問幸獲親近乞師指示師曰我若指示即屈著汝曰教學人作麼生即是師曰切忌是非問如何是衲僧氣息師曰還曾薰著汝也無問同類即不問如何是異類師曰要頭斫將去問如何是法身主師曰不過來問如何是毗盧師師曰不超越師終于長慶諡本淨大師廬山棲賢懷祐禪師泉州人也僧問如何是五老峰前事師曰萬古千秋曰恁恁則成絕嗣去也師曰躊躇欲與誰問自遠趨風請師激發師曰他不憑時曰請師憑時師曰我亦不換問如何是法法無差師曰雪上更加霜上堂若會此箇事無有下口處問如何是祖師西來意師曰井底寒蟾天中明月福州覆船山洪薦禪師僧問如何是本來面目師便閉目吐舌又開目吐舌曰本來有許多面目師曰適來見甚麼僧無語問如何是師子師曰善哮吼僧拊掌曰好手好手師曰青天白日却被鬼迷僧作掀禪牀勢師便打曰驢事未去馬事到來師曰灼然作家僧拂袖便出師曰將甌盛水擬比大洋問如何是玄妙師曰未聞已前道吾問久嚮和尚會禪是否師曰蒼天蒼天吾近前掩師口曰低聲低聲師與一掌吾曰蒼天蒼天師把住曰得恁麼無禮吾却與一掌師曰老僧罪過吾拂袖便行師呵呵大笑曰早知如是不見如是僧參師便作起勢僧便出師曰闍黎且來人事僧回作抽坐具勢師却歸方丈僧曰蒼天蒼天師曰龍頭蛇尾僧近前叉手立師曰敗將投王不存性命問抱璞投師師還接否師以手拍香臺僧禮拜師曰禮拜則不無其中事作麼生僧却拍香臺師曰舌頭不出口師將示寂三日前令侍者喚第一座來師臥出氣一聲座喚侍者曰和尚渴要湯水喫師乃面壁而臥臨終令集眾乃展兩手出舌示之時第三座曰諸人和尚舌根硬也師曰苦哉苦哉誠如第三座所言舌根硬去也言訖而寂諡紹隆大師鼎州德山存德慧空禪師僧問如何是一句師曰更請問問如何是和尚仙陀婆師曰昨夜三更見月明吉州崇恩禪師僧問祖意教意是同是別師曰少林雖有月葱嶺不穿雲問如何是類師曰奈何橋畔嘶聲切劒樹林中去復來石霜腪禪師僧問世尊出世先度五俱輪和尚出世先度何人師曰總不度曰為甚麼不度師曰為伊不是五俱輪郢州芭蕉禪師僧問從上宗乘如何舉唱師曰已被人冷眼破了問不落諸緣請師直指師曰有問有答問如何是和尚為人一句師曰祇恐闍黎不問問如何是向去底人師曰董家稚子聲聲哭曰如何是却來底人師曰枯木驪龍露爪牙潭州肥田慧覺伏禪師僧問如何是未出世邊事師曰髻中珠未解石女斂雙眉曰出世後如何師曰靈龜呈卦兆失却自家身問此地名甚麼師曰肥田曰宜種甚麼師便打師有偈曰修多好句枉工夫返本還源是大愚祖佛不從修證得縱行玄略也崎嶇潭州鹿苑暉禪師僧問不假諸緣請師道師敲火爐曰會麼曰不會師曰瞌睡漢問牛頭未見四祖時如何師曰如月在水曰見後如何師曰如水在月問祖祖相傳未審傳箇甚麼師曰汝問我我問汝曰恁麼則緇素不分也師曰甚麼處去來潭州寶葢約禪師僧問寶葢高高挂其中事若何請師言下旨一句不消多師曰寶葢挂空中有路不曾通儻求言下旨便是有西東越州雲門山拯迷寺海晏禪師僧問如何是衲衣下事師曰如齩硬石頭問如何是古寺一爐香師曰歷代無人齅曰齅者如何師曰六根俱不到問久嚮拯迷到來為甚麼不見拯迷師曰闍黎不識拯迷湖南文殊禪師僧問僧繇為甚麼邈誌公真不得師曰非但僧繇誌公也邈不得曰誌公為甚麼邈不得師曰彩繪不將來曰和尚還邈得也無師曰我亦邈不得曰和尚為甚麼邈不得師曰渠不以苟我顏色教我作麼生邈問如何是密室師曰緊不就曰如何是密室中人師曰不坐上色牛鳳翔府石柱禪師遊方時到洞山時虔和尚垂語曰有四種人一人說過佛祖一步行不得一人行過佛祖一句說不得一人說得行得一人說不得行不得阿那箇是其人師出眾曰一人說過佛祖行不得者祇是無舌不許行一人行過佛祖一句說不得者祇是無足不許說一人說得行得者祇是函葢相稱一人說不得行不得者如斷命求活此是石女兒披枷帶鎻山曰闍黎分上作麼生師曰該通分上卓卓寧彰山曰祇如海上明公秀又作麼生師曰幻人相逢拊掌呵呵河中府棲巖山大通院存壽禪師初講經論後於石霜之室忘筌住後僧問如何是和尚得力處師曰不居無理位豈坐白牛車問蓮華未出水時如何師曰汝莫問出水後蓮華事麼僧無語師平居罕言叩之則應諡真寂禪師南嶽玄泰禪師沉靜寡言未甞衣帛時謂之泰布衲始見德山陞于堂矣後謁石霜遂入室焉掌翰二十年與貫休齊己為友後居蘭若曰金剛臺誓不立門徒四方後進依附皆用交友之禮甞以衡山多被山民斬伐燒畬為害滋甚乃作畬山謠曰畬山兒畬山兒無所知年年斫斷青山嵋就中最好衡嶽色杉松利斧摧貞枝靈禽野鶴無因依白雲回避青煙飛猿猱路絕巖崖出芝术失根茆草肥年年斫罷仍再鉏千秋終是難復初又道今年種不多來年更斫當陽坡國家嶽域尚如此不知此理如之何遠邇傳播達於九重有詔禁止故嶽中蘭若無復延燎師之力也將示滅乃召一僧令備薪蒸留偈曰今年六十五四大將離主其道自玄玄箇中無佛祖不用剃頭不須澡浴一堆猛火千足萬足端坐垂一足而逝闍維收舍利建塔於迎雲亭側潭州雲葢禪師僧問佛未出世時如何師曰月中藏玉兔曰出後如何師曰日裏背金烏問不可以情測時如何師曰無舌童兒機智盡風穴參師問石角穿雲路擕笻意若何穴曰紅霞籠玉象擁嶂照川源師曰相隨來也穴曰和尚也須低聲師曰且坐喫茶邵武軍龍湖普聞禪師唐僖宗太子也幼不茹葷長無經世意僖宗鍾愛之然百計陶寫終不能回中和初僖宗幸蜀師斷髮逸遊人無知者造石霜問曰祖師別傳事肯以相付乎霜曰莫謗祖師師曰天下宗旨盛大豈妄為之邪霜曰是實事那師曰師意如何霜曰待案山點頭即向汝道師於言下頓省辭去至邵武城外見山鬱然深秀遂撥草至煙起處有一苦行居焉苦行見師至乃曰上人當興此長揖而去師居十餘年一日有一老人拜謁師問住在何處至此何求老人曰住在此山然非人龍也行雨不職上天有罰當死願垂救護師曰汝得罪上帝我何能致力雖然可易形來俄失老人所在視坐傍有一小蛇延緣入袖至暮雷電震山風雨交作師危坐不傾達旦晴霽垂袖蛇墮地而去有頃老人拜而泣曰自非大士慈悲為血腥穢此山矣念何以報斯恩即穴巖下為泉曰此泉為他日多眾之設今號龍湖人聞其事施財施力相與建寺衲子雲趨師闡化三十餘年臨示寂聲鍾集眾說偈曰我逃世難來出家宗師指示箇歇處住山聚眾三十年尋常不欲輕分付今日分明說似君我斂目時齊聽取安然而逝塔於本山諡圓覺禪師張拙秀才因禪月大師指參石霜霜問秀才何姓曰姓張名拙霜曰覓巧尚不可得拙自何來公忽有省乃呈偈曰光明寂照徧河沙凡聖含靈共我家一念不生全體現六根纔動被雲遮斷除煩惱重增病趣向真如亦是邪隨順世緣無罣礙涅槃生死等空花夾山會禪師法嗣澧州洛浦山元安禪師鳳翔麟遊人也丱年出家具戒通經論問道臨濟後為侍者濟甞對眾美之曰臨濟門下一隻箭誰敢當鋒師蒙印可自謂已足一日侍立次有座主參濟濟問有一人於三乘十二分教明得有一人不於三乘十二分教明得且道此二人是同是別主曰明得即同明不得即別師曰這裏是甚麼所在說同說別濟顧師曰汝又作麼生師便喝濟送座主回問師汝豈不是適來喝老僧者師曰是濟便打師後辭濟濟問甚麼處去師曰南方去濟以拄杖畫一畫曰過得這箇便去師乃喝濟便打師作禮而去濟明日陞堂曰臨濟門下有箇赤梢鯉魚搖頭擺尾向南方去不知向誰家虀甕裏淹殺師遊歷罷直往夾山卓庵經年不訪夾山山乃修書令僧馳往師接得便坐却再展手索僧無對師便打曰歸去舉似和尚僧回舉似山曰這僧若開書三日內必來若不開書斯人救不得也師果三日後至見夾山不禮拜乃當面叉手而立山曰鷄棲鳳巢非其同類出去師曰自遠趨風請師一接山曰目前無闍黎此間無老僧師便喝山曰住住且莫草草怱怱雲月是同谿山各異截斷天下人舌頭即不無闍黎爭教無舌人解語師佇思山便打因茲服膺興化代云但知作佛莫愁眾生一日問山佛魔不到處如何體會山曰燭明千里像闇室老僧迷又問朝陽已昇夜月不現時如何山曰龍銜海珠遊魚不顧山將示滅垂語曰石頭一枝看看即滅矣師曰不然山曰何也師曰他家自有青山在山曰苟如是即吾宗不墜矣暨夾山順世師抵于涔陽遇故人因話武陵事問曰倐忽數年何處逃難師曰祇在闤闠中曰何不向無人處去師曰無人處有何難曰闤闠中如何逃避師曰雖在闤闠中要且人不識故人罔測又問佛佛相應祖祖相傳彼此不垂曲時如何師曰野老前門不話朝堂之事曰合譚何事師曰未逢別者終不開拳曰有人不從朝堂來相逢還話會否師曰量外之機徒勞目擊師尋之澧陽洛浦山卜築宴處後遷止朗州蘇谿四方玄侶憧憧奔湊上堂末後一句始到牢關鎻斷要津不通凡聖尋常向諸人道任從天下樂欣欣我獨不肯欲知上流之士不將佛祖言教貼在額頭上如龜負圖自取喪身之兆鳳縈金網趍霄漢以何期直須旨外明宗莫向言中取則是以石人機似汝也解唱巴歌汝若似石人雪曲也應和指南一路智者知疏僧問瞥然便見時如何師曰曉星分曙色爭似太陽輝又問恁麼來不立恁麼去不泯時如何師曰鬻薪樵子貴衣錦道人輕問供養百千諸佛不如供養一箇無心道人未審百千諸佛有何過無心道人有何德師曰一片白雲橫谷口幾多歸鳥盡迷巢問日未出時如何師曰水竭滄溟龍尚隱雲騰碧漢鳳猶飛問如何是本來事師曰一粒在荒田不耘苗自秀曰若也不耘莫被草埋却也無師曰肌骨異蒭蕘稊稗終難隱問不傷物命者如何師曰眼花山影轉迷者謾彷徨問不譚今古時如何師曰靈龜無卦兆空殻不勞鑽曰爭奈空殻何師曰見盡無機所邪正不可立曰恁麼則無棲泊處也師曰玄象始於未形虗勞煩於飾彩問龍機不吐霧滋益事如何師曰道本無名不有明暗曰不挂明暗底事又作麼生師曰言中易舉意外難提問不生如來家不坐華王座時如何師曰汝道火爐重多少問祖意教意是同是別師曰師子窟中無異獸象王行處絕狐蹤問一時舉來時如何師曰獻璞不知機徒勞招刖足問僧近離甚處曰荊南師曰有一人與麼去還逢麼曰不逢師曰為甚不逢曰若逢即頭粉碎師曰闍黎三寸甚密雲門於江西見其僧乃問還有此語否曰是門曰洛浦倒退三千里問行不思議處如何師曰青山常舉足白日不移輪問枯盡荒田獨立事如何師曰鷺倚雪巢猶可辯烏投漆立事難分問如何是主中賓師曰逢人常問路足下鎮長迷曰如何是賓主雙舉師曰枯樹無橫枝鳥來難措足問終日朧時如何師曰擲寶混沙中識者天然異曰恁麼則展手不逢師也師曰莫將鶴唳悞作鶯啼問圓伊三點人皆會洛浦家風事若何師曰雷霆一震布鼓聲銷問正當亭午時如何師曰亭午猶虧半烏沈始得圓要會箇中意牛頭尾上安問如何是祖師西來意師曰颯颯當軒竹經霜不自寒僧擬進語師曰祇聞風擊響知是幾千竿上堂孫臏收鋪去也有卜者出來僧曰請和尚卜師曰汝家爺死僧無對法眼代拊掌三下問如何是西來意師以拂子擊禪牀曰會麼曰不會師曰天上忽雷驚宇宙井底蝦蟇不舉頭問如何是佛法大意師曰雪覆孤峰峰不白兩滋石笋笋須生問法身無為不墮諸數是否師曰惜取眉毛好曰如何免得斯咎師曰泥龜任你千年終不解隨雲鶴曰直是孫臏也遭貶剝師曰不穿鼻孔底牛有甚禦處僧便作牛吼師曰這畜生僧便喝師曰掩尾露牙終非好手問萬丈懸崖撒手去如何免得喪於身時如何師曰須彌繫藕絲曰是何境界師曰剎竿頭上仰蓮心曰恁麼則湛湛澄澄去也師曰須彌頂上再翻身曰恁麼則競競切切去也師曰空隨媒鴿走虗喪網羅身曰如何得不隨去師曰罌鵝缾項小擬透望天飛問露不垂羣木時如何師曰有虎鴉須噪無人鳥不驚問撥亂乾坤底人來師還接否師竪拂子僧曰恁麼則得遇明君去也師曰依稀似曲纔堪聽又被風吹別調中問佛魔不到處如何辨得師曰演若頭非失鏡中認取乖問如何是救離生死師曰執水苟延生不聞天樂妙問四大從何而有師曰湛水無波漚因風激曰漚滅歸水時如何師曰不渾不濁魚龍任躍問如何離得生死去師曰一念忘機太虗無玷問如何是道師曰存機猶滯迹去杌却通途問如何是一大藏教收不得者師曰雨滋三草秀片玉本來輝問一毫吞盡巨海於中更復何言師曰家有白澤之圖必無如是妖怪保福別云家無白澤之圖亦無如是妖怪問凝然時如何師曰時雷應節震嶽驚蟄曰千般運動不異箇凝然時如何師曰靈鶴翥空外鈍鳥不離巢曰如何師曰白首拜少年舉世人難信問諸聖恁麼來將何供養師曰土宿雖持錫不是婆羅門問祖意教意是同是別師曰日月並輪輝誰家別有路曰恁麼則顯晦殊途事非一槩師曰但自不亡羊何須泣岐路問人擬學歸鄉時如何師曰家破人亡子歸何處曰恁麼則不歸去也師曰庭前殘雪日輪消室內游塵遣誰掃乃有偈曰決志歸鄉去乘船渡五湖舉篙星月隱停棹日輪孤解纜離邪岸張帆出正途到來家蕩盡免作屋中愚問動是法王苗寂是法王根根苗即不問如何是法王師舉拂子僧曰此猶是法王苗師曰龍不出洞誰人奈何侍者謂師曰肇法師制得四論甚奇怪師曰肇公甚奇怪要且不見祖師者無對法燈代云和尚甚麼處是雲居錫云甚麼處是肇公不見祖師處莫是有許多言語麼又云肇公有多少言語問如何是生機一路師曰敲空有響擊木無聲師兩山開法語播諸方光化元年八月誡主事曰出家之法長物不留播種之時切宜減省締搆之務悉從廢停流光迅速大道玄深苟或因循曷由體悟雖激厲懇切眾以為常略不相儆至冬示微疾亦不倦參請十二月一日告眾曰吾非明即後也今有一事問汝等若道這箇是即頭上安頭若道不是即斬頭求活第一座對曰青山不舉足日下不挑燈師曰是甚麼時節作這箇語話時有彥從上座對曰離此二途請和尚不問師曰未在更道曰彥從道不盡師曰我不管汝盡不盡曰彥從無侍者祇對和尚師便休至夜令侍者喚從問曰闍黎今日祇對甚有道理汝合體得先師意先師道目前無法意在目前不是目前法非耳目之所到且道那句是賓那句是主若擇得出分付鉢袋子曰彥從不會師曰汝合會曰彥從實不會師喝出乃曰苦苦玄覺云且道從上座實不會是怕見鉢袋子拈著伊二日午時別僧舉前話問師師曰慈舟不棹清波上劒峽徒勞放木鵝便告寂撫州逍遙山懷忠禪師僧問不似之句還有人道得否師曰或即五日齋前或即五日齋後問劒鏡明利毫毛何惑師曰不空罥索問洪鑪猛燄烹鍛何物師曰烹佛烹祖曰佛祖作麼生烹師曰業在其中曰喚作甚麼業師曰佛力不如問四十九年不說一句如何是不說底句師曰隻履西行道人不顧曰莫便是和尚消停處也無師曰馬是官馬不用印問如何是一老一不老師曰三從六義曰如何是奇特一句師曰坐佛牀斫佛朴問祖與佛阿那箇最親師曰真金不肯博誰肯換泥丸曰恁麼則不肯去也師曰汝貴我賤問懸劒萬年松時如何師曰非言可及曰當為何事師曰為汝道話曰言外事如何明得師曰日久年多筋骨成問不敵魔軍如何證道師曰海水不勞杓子舀問不住有雲山常居無底船時如何師曰果熟自然香曰更請師道師曰門前真佛子曰學人為甚麼不見師曰處處王老師袁州蟠龍山可文禪師僧問亡僧遷化向甚麼處去也師曰石牛㳂古路日裏夜明燈問如何是佛師曰癡兒捨父逃撫州黃山月輪禪師福唐許氏子初謁三峯機緣靡契尋聞來山盛化乃往叩之山問名甚麼師曰月輪山作一圓相曰何似這箇師曰和尚恁麼語話諸方大有人不肯在山曰闍黎作麼生師曰還見月輪麼山曰闍黎恁麼道此間大有人不肯諸方師乃服膺參訊一日夾山抗聲問曰子是甚麼處人師曰閩中人山曰還識老僧麼師曰和尚還識學人麼山曰不然子且還老僧草鞋錢然後老僧還子廬陵米價師曰恁麼則不識和尚也未委廬陵米作麼價山曰真師子兒善能哮吼乃入室受印依附七年眾請住黃山上堂祖師西來特唱此事自是諸人不薦向外馳求投赤水以尋珠就荊山而覓玉所以道從門入者不是家珍認影迷頭豈非大錯僧問如何是祖師西來意師曰梁殿不施功魏絕心迹問如何是道師曰石牛頻吐三春霧木馬嘶聲滿道途問如何得見本來面目師曰不勞懸石鏡天曉自鷄鳴問宗乘一句請師商量師曰黃峰獨脫物外秀年來月往冷颼颼問不辨中言如何指撥師曰劒去遠矣爾方刻舟問如何是衲衣下事師曰石牛水上臥東西得自由問如何是目前意師曰秋風有韻片月無方問如何是學人用心處師曰覺戶不掩對月莫迷問如何是青霄路師曰鶴棲雲外樹不倦苦風霜問過去事如何師曰龍呌清潭波瀾自肅師於同光三年示寂塔於院之西北隅洛京韶山寰普禪師有僧到參禮拜起立師曰大才藏拙戶僧過一邊立師曰喪却棟梁材問如何是韶山境師曰古今猿鳥呌翠色薄煙籠曰如何是境中人師曰退後看僧參師問莫是多口白頭因麼因曰不敢師曰有多少口曰通身是師曰尋常向甚麼處屙曰向韶山口裏屙師曰有韶山口即得無韶山口向甚麼處屙因無語師便打遵布衲訪師在山下相見遵問韶山路向甚麼處去師以手指曰嗚那青青黯黯處去遵近前把住曰久嚮韶山莫便是否師曰是即是闍黎有甚麼事遵曰擬伸一問師還答否師曰看君不是金牙作爭解彎弓射尉遲遵曰鳳凰直入煙霄去誰怕林間野雀兒師曰當軒畵鼓從君擊試展家風似老僧遵曰一句迥超千聖外松蘿不與月輪齊師曰饒君直出威音外猶較韶山半月程遵曰過在甚處師曰倜儻之辭時人知有遵曰恁麼則真玉泥中異不撥萬機塵師曰魯般門下徒施巧妙遵曰學人即恁麼未審師意如何師曰玉女夜拋梭織錦於西舍遵曰莫便是和尚家風也無師曰耕夫製玉漏不是行家作遵曰此猶是文言如何是和尚家風師曰橫身當宇宙誰是出頭人遵無語師遂同歸山纔人事了師召近前曰闍黎有衝天之氣老僧有入地之謀闍黎橫吞巨海老僧背負須彌闍黎按劒上來老僧掗鎗相待向上一路速道速道遵曰明鏡當臺請師一鑒師曰不鑒遵曰為甚不鑒師曰水淺無魚徒勞下釣遵無對師便打僧問如何是一如相師曰鷺飛霄漢白山遠色深青問是非不到處還有句也無師曰有曰是甚麼句師曰一片白雲不露醜終後諡無畏禪師洪州上藍令超禪師初住瑞州上藍山唱夾山之道學侶俱會後於洪井創禪苑還以上藍為名化道益盛僧問如何是上藍本分事師曰不從千聖借豈向萬機求曰祇如不借不求時如何師曰不可拈放汝手裏得麼問鋒前如何辨的師曰鋒前不露影莫向舌頭尋問如何是無舌人唱歌師曰韻震青霄宮商不犯問二龍爭珠誰是得者師曰其珠徧地目覩如泥問善財見文殊後為甚却往南方師曰學𠗦入室知乃通方曰為甚麼彌勒却遣見文殊師曰道廣無涯逢人不盡至唐大順正月初告眾曰吾本約住此十年今化事既畢當即行矣齋畢聲鐘端坐長往諡元真禪師鄆州四禪禪師僧問古人有請不背今請和尚入井還去也無師曰深深無別源飲者消諸患問如何是和尚家風師曰會得底人意須知月色寒問諸佛未出世時如何師曰王宮絕消息曰出世後如何師曰榮枯各不同太原海湖禪師因有人請灌頂三藏供養敷坐訖師乃就彼位坐時有雲涉座主問曰和尚甚麼年行道師曰座主近前來涉近前師曰祇如憍陳如是甚麼年行道涉茫然師喝曰這尿牀鬼問和尚院內人何太少定水院人何太多師曰草深多野鹿巖高獬豸稀問如何是無問而自答師曰松韻琴聲響嘉州白水禪師僧問如何是西來意師曰四溟無窟宅一滴潤乾坤問曹溪一路合譚何事師曰㵎松千載鶴來聚月中香桂鳳凰歸問如何是此經師曰拋梭石女遼空響海底泥牛夜呌頻鳳翔府天葢山幽禪師僧問如何是天葢水師曰四海滂沲不犯涓滴問學人擬看經時如何師曰既是大商何求小利問對境不動時如何師曰邊方雖有令不是太平年清平遵禪師法嗣靳州三角山令珪禪師初參清平平問來作麼師曰來禮拜平曰禮拜阿誰師曰特來禮拜和尚平咄曰這鈍根阿師師乃禮拜平以手斫師頸一下從此領旨住後僧問如何是佛師曰明日來向汝道如今道不得投子同禪師法嗣投子感溫禪師僧問師登寶座接示何人師曰如月赴千溪曰恁麼則滿地不虧也師曰莫恁麼道問父不投為甚麼却投子師曰豈是別人屋裡事曰父與子還屬功也無師曰不屬曰不屬功底如何師曰父子各自脫曰為甚麼如此師曰汝與我會師遊山見蟬蛻侍者問曰殻在這裏蟬向甚麼處去也師拈殻就耳畔搖三五下作蟬聲侍者於是開悟福州牛頭微禪師上堂三世諸佛用一點伎倆不得天下老師口似匾擔諸人作麼生大不容易除非知有餘莫能知僧問如何是和尚家風師曰山畬脫粟飯野菜澹黃虀曰忽遇上客來又作麼生師曰喫即從君喫不喫任東西問不問驪龍頷下珠如何識得家中寶師曰忙中爭得作閑人西川青城香山澄照禪師僧問諸佛有難向火燄裏藏身未審衲僧有難向甚麼處藏身師曰水精甕裏著波斯問如何是初生月師曰太半人不見陝府天福禪師僧問如何是佛法大意師曰黃河無滴水華嶽總平沈興元府中梁山遵古禪師僧問空劫無人能問法即今有問法何安師曰大悲菩薩甕裏坐問如何是祖師西來意師曰道士擔漏巵襄州谷隱禪師僧問如何是不觸白雲機師曰鶴帶鵶顏浮生不棄安州九嵕山禪師僧問遠聞九嵕及乎到來祇見一嵕師曰闍黎祇見一嵕不見九嵕曰如何是九嵕師曰水急浪花麤幽州盤山禪師二世僧問如何出得三界師曰在裏頭來多少時邪曰如何出得師曰青山不礙白雲飛問承教有言如化人煩惱如石女兒此理如何師曰闍黎直如石女兒去九嵕敬慧禪師僧問解脫深坑如何過得師曰不求過曰如何過得師曰求過亦非東京觀音院巖俊禪師者邢臺廉氏子初參祖席徧歷衡廬岷蜀甞經鳳林深谷欻覩珍寶發現同侶相顧意將取之師曰古人鉏園觸黃金若瓦礫待吾菅覆頂須此供四方僧言訖捨去謁投子子問昨夜宿何處師曰不動道場子曰既言不動曷由至此師曰至此豈是動邪子曰元來宿不著處投子默許之尋住觀音眾常數百周高祖世宗二帝潛隱時每登方丈必施禮及即位特賜紫衣署淨戒大師示寂垂誡門人訖怡顏合掌而逝濠州思明禪師在眾時僧問如何是上座沙彌童行師曰諾問如何是清淨法身師曰屎裏蛆兒頭出頭沒鳳翔府招福禪師僧問東牙烏牙皆出隊和尚為甚麼不出隊師曰住持各不同闍黎爭得怪青原下六世大光誨禪師法嗣潭州谷山有緣禪師僧間竛竮之子如何得歸向師曰會人路不通曰恁麼則無奉重處也師曰我道你鉢盂落地拈不起問一撥便轉時如何師曰野馬走時鞭轡斷石人撫掌笑呵呵潭州龍興禪師僧問一撥便轉時如何師曰根不利問得坐披衣時如何師曰不端嚴曰為甚麼不端嚴師曰不從修證得問如何是道中人師曰終日寂攢眉問文不加點時如何師曰無目童兒不出戶問賓主未分時如何師曰雙陸盤中不喝彩曰分後如何師曰骰子未曾拋潭州伏龍山禪師第一世僧問攪長河為酥酥變大地作黃金時如何師曰臂長衫袖短問隨緣認得時如何師曰雪內牡丹花問如何是祖師西來意師曰你得恁麼不識痛痒京兆白雲善藏禪師僧問如何是和尚深深處師曰矮子渡深谿問赤脚時如何師曰何不脫却問如何是法法不生師曰萬類千差曰如何是法法不滅師曰縱橫滿目伏龍山禪師第二世僧問隨緣認得時如何師曰汝道興國門樓高多少問子不譚父德時如何師曰闍黎且低聲陝府龍峻山禪師僧問如何是不知善惡底人師曰千聖近不得曰此人還知有向上事也無師曰不知曰為甚麼不知師曰不識善惡說甚麼向上事曰畢竟如何師曰不見道犴𤞞問如何是佛向上人師曰不帶容問凡有展拓盡落今時不展拓時如何師曰不展不展曰畢竟如何師曰不拓不拓伏龍山和尚第三世僧問行盡千山路玄機事若何師曰鳥道不曾棲問既是師為甚却無位次師曰古今排不出三際豈能安曰恁麼則某甲隨手去也師曰春風吹柳絮往復幾時休問如何是真際師曰曠劫無異不存階級九峰虔禪師法嗣新羅國清院禪師僧問奔馬爭毬誰是得者師曰誰是不得者曰恁麼則不在爭也師曰直得不爭亦有過在曰如何免得此過師曰要且不曾失曰不失處如何鍛鍊師曰兩手捧不起洪州泐潭神黨禪師僧問四威儀中如何辨主師曰正遇寶峰不脫鞋問如何是佛法大意師曰虗空駕鐵船岳頂浪滔天袁州南源行修慧觀禪師亦曰光睦僧問如何是南源境師曰幾處峰巒猿鳥呌一帶平川遊子迷問如何是南源深深處師曰眾人皆見曰恁麼則淺也師曰也是兩頭搖問有口談不得無心未見伊時如何師曰古洞有龍吟不出巖前木馬喊無形泐潭明禪師一日下到客位眾請師歸方丈師曰道得即去時牟和尚對曰大眾請師乃上法堂僧問非思量處識情難測時如何師曰我不欲違古人曰不違古人意作麼生師曰也合消得汝三拜僧問碓擣磨磨不得忘却此意如何師曰虎口裏活雀兒問定慧不生時如何師曰鐵牛草上臥昏昏不舉頭問如何是道者師曰毛𣯶𣯶地曰如何是道者家風師曰佛殿前逢尊者問如何是和尚終日事師曰鉢盂裏無折筋曰如何是沙門日用事師曰轟轟不借萬人機吉州禾山禪師僧問如何是祖師西來意師曰杉樹子問文殊以何為師師曰風箏有韻真堪聽聽得由來曲不成泐潭延茂禪師僧問如何是古佛心師曰終不道土木瓦礫是問日落西山去林中事若何師曰庭前花盛發室內不知春問如何是閉門造車師曰失却斑猫兒曰如何是出門合轍師曰坐地到長安問如何是和尚正主師曰畵鼓連槌響耳畔不聞聲洪州鳳棲同安院常察禪師僧問如何是鳳棲家風師曰鳳棲無家風曰既是鳳棲為甚麼無家風師曰不迎賓不待客曰恁麼則四海參尋當為何事師曰盤飣自有旁人施問如何是鳳棲境師曰千峯連岳秀萬嶂不知春曰如何是境中人師曰孤巖倚石坐不下白雲心問祖意教意是同是別師曰鐵狗吠石牛幻人看月色問如何是披毛戴角底人師曰蓑衣箬笠賣黃金幾箇相逢不解喚問學人未曉時機乞師指示師曰參差松竹煙籠薄重疊峰巒月上遲僧擬進語師曰劒甲未施賊身已露僧曰何也師曰精陽不剪霜前竹水墨徒誇海上龍僧遶禪牀而出師曰閉目食蝸牛一場酸澁苦問返本還源時如何師曰蟭蟟雖脫殻不免抱寒枝問