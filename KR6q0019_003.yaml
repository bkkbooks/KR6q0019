body:
  text: 六祖大鑒禪師法嗣南嶽懷讓禪師者姓杜氏金州人也於唐儀鳳二年四月八日降誕感白氣應於玄象在安康之分太史瞻見奏聞高宗皇帝帝乃問是何祥瑞太史對曰國之法器不染世榮帝傳勑金州太守韓偕親往存慰其家家有三子唯師最小炳然殊異性唯恩讓父乃安名懷讓年十歲時唯樂佛書時有三藏玄靜過含告其父母曰此子若出家必獲上乘廣度眾生至垂拱三年方十五歲辭親往荊州玉泉寺依弘景律師出家通天二年受戒後習毗尼藏一日自歎曰夫出家者為無為法天上人間無有勝者時同學坦然知師志氣高邁勸師謁嵩山安和尚安啟發之乃直指詣曹谿參六祖祖問甚麼處來曰嵩山來祖曰甚麼物恁麼來師無語遂經八載忽然有省乃白祖曰某甲有箇會處祖曰作麼生師曰說似一物即不中祖曰還假修證否師曰修證則不無污染即不得祖曰祇此不污染諸佛之所護念汝既如是吾亦如是西天般若多羅讖汝足下出一馬駒踏殺天下人病在汝心不須速說師執侍左右一十五年先天二年往衡嶽居般若寺開元中有沙門道一即馬祖也在衡嶽山常習坐禪師知是法器往問曰大德坐禪圖甚麼一曰圖作佛師乃取一甎於彼庵前石上磨一曰磨作甚麼師曰磨作鏡一曰磨甎豈得成鏡邪師曰磨甎既不成鏡坐禪豈得作佛一曰如何即是師曰如牛駕車車若不行打車即是打牛即是一無對師又曰汝學坐禪為學坐佛若學坐禪禪非坐臥若學坐佛佛非定相於無住法不應取捨汝若坐佛即是殺佛若執坐相非達其理一聞示誨如飲醍醐禮拜問曰如何用心即合無相三昧師曰汝學心地法門如下種子我說法要譬彼天澤汝緣合故當見其道又問道非色相云何能見師曰心地法眼能見乎道無相三昧亦復然矣一曰有成壞否師曰若以成壞聚散而見道者非見道也聽吾偈曰心地含諸種遇澤悉皆萌三昧華無相何壞復何成一蒙開悟心意超然侍奉十秋日益玄奧入室弟子總有六人師各印可曰汝等六人同證吾身各契其一一人得吾眉善威儀常浩一人得吾眼善顧盻智達一人得吾耳善聽理坦然一人得吾鼻善知氣神照一人得吾舌善譚說嚴峻一人得吾心善古今道一又曰一切法皆從心生心無所生法無所住若達心地所作無礙非遇上根宜慎辭哉有一大德問如鏡鑄像像成後未審光向甚麼處去師曰如大德為童子時相貌何在法眼別云阿那箇是太德鑄成底像曰祇如像成後為甚麼不鑑照師曰雖然不鑑照謾他一點不得後馬大師闡化於江西師問眾曰道一為眾說法否眾曰已為眾說法師曰總未見人持箇消息來眾無對因遣一僧去囑曰待伊上堂時但問作麼生伊道底言語記將來僧去一如師旨回謂師曰馬師曰自從胡亂後三十年不曾少鹽醬師然之天寶三年八月十一日圓寂於衡嶽諡大慧禪師最勝輪之塔南嶽讓禪師法嗣第一世江西道一禪師漢州什邡縣人也姓馬氏本邑羅漢寺出家容貌奇異牛行虎視引舌過鼻足下有二輪文幼歲依資州唐和尚落髮受具於渝州圓律師唐開元中習禪定於衡嶽山中遇讓和尚同參六人唯師密受心印讓之一猶思之遷也同源而異派故禪法之盛始于二師劉軻云江西主大寂湖南主石頭徃來憧憧不見二大士為無知矣西天般若多羅記達磨云震旦雖濶無別路要假兒孫脚下行金雞解銜一粒粟供養十方羅漢僧又六祖謂讓和尚曰向後佛法從汝邊去馬駒蹋殺天下人厥後江西嗣法布於天下時號馬祖始自建陽佛迹嶺遷至臨川次至南康龔公山大曆中隷名於鍾陵開元寺時連帥路嗣恭聆風景慕親受宗旨由是四方學者雲集座下一日謂眾曰汝等諸人各信自心是佛此心即是佛心達磨大師從南天竺國來至中華傳上乘一心之法令汝等開悟又引楞伽經文以印眾生心地恐汝顛倒不自信此一心之法各各有之故楞伽經以佛語心為宗無門為法門夫求法者應無所求心外無別佛佛外無別心不取善不捨惡淨穢兩邊俱不依怙達罪性空念念不可得無自性故故三界唯心森羅萬象一法之所印凡所見色皆是見心心不自心因色故有汝但隨時言說即事即理都無所礙菩提道果亦復如是於心所生即名為色知色空故生即不生若了此意乃可隨時著衣喫飯長養聖胎任運過時更有何事汝受吾教聽吾偈曰心地隨時說菩提亦祗寧事理俱無礙當生即不生僧問和尚為甚麼說即心即佛師曰為止小兒啼曰啼止時如何師曰非心非佛曰除此二種人來如何指示師曰向伊道不是物曰忽遇其中人來時如何師曰且教伊體會大道問如何是西來意師曰即今是甚麼意龐居士問不昧本來人請師高著眼師直下士曰一等沒絃琴唯師彈得妙師直上士禮拜師歸方丈居士隨後曰適來弄巧成拙又問如水無筋骨能勝萬斛舟此理如何師曰這裏無水亦無舟說甚麼筋骨一夕西堂百丈南泉隨侍翫月次師問正恁麼時如何堂曰正好供養丈曰正好修行泉拂袖便行師曰經入藏禪歸海唯有普願獨超物外百丈問如何是佛法旨趣師曰正是汝放身命處師問百丈汝以何法示人丈竪起拂子師曰祇這箇為當別有丈拋下拂子僧問如何得合道師曰我早不合道問如何是西來意師便打曰我若不打汝諸方笑我也有小師耽源行脚回於師前畫箇圓相就上拜了立師曰汝莫欲作佛否曰某甲不解揑目師曰吾不如汝小師不對鄧隱峯辭師師曰甚麼處去曰石頭去師曰石頭路滑曰竿木隨身逢場作戲便去纔到石頭即繞禪牀一匝振錫一聲問是何宗旨石頭曰蒼天蒼天峯無語却回舉似師師曰汝更去問待他有答汝便噓兩聲峯又去依前問石頭乃噓兩聲峯又無語回舉似師師曰向汝道石頭路滑有僧於師前作四畫上一畫長下三畫短曰不得道一畫長三畫短離此四字外請和尚答師乃畫地一畫曰不得道長短答汝了也忠國師聞別云何不問老僧有講僧來問曰未審禪宗傳持何法師却問曰座主傳持何法主曰忝講得經論二十餘本師曰莫是師子兒否主曰不敢師作噓噓聲主曰此是法師曰是甚麼法主曰師子出窟法師乃默然主曰此亦是法師曰是甚麼法主曰師子在窟法師曰不出不入是甚麼法主無對百丈代云見麼遂辭出門師召曰座主主回首師曰是甚麼主亦無對師曰這鈍根阿師洪州廉使問曰喫酒肉即是不喫即是師曰若喫是中丞祿不喫是中丞福師入室弟子一百三十九人各為一方宗主轉化無窮師於真元四年正月中登建昌石門山於林中經行見洞壑平坦謂侍者曰吾之朽質當於來月歸茲地矣言訖而回既而示疾院主問和尚近日尊候如何師曰日面佛月面佛二月一日沐浴跏趺入滅元和中諡大寂禪師塔曰大莊嚴南嶽下二世馬祖一禪師法嗣洪州百丈山懷海禪師者福州長樂人也姓王氏丱歲離塵三學該練屬大寂闡化江西乃傾心依附與西堂智藏南泉普願同號入室時二大士為角立焉師侍馬祖行次見一羣野鴨飛過祖曰是甚麼師曰野鴨子祖曰甚處去也師曰飛過去也祖遂把師鼻扭負痛失聲祖曰又道飛過去也師於言下有省却歸侍者寮哀哀大哭同事問曰汝憶父母邪師曰無曰被人罵邪師曰無曰哭作甚麼師曰我鼻孔被大師扭得痛不徹同事曰有甚因緣不契師曰汝問取和尚去同事問大師曰海侍者有何因緣不契在寮中哭告和尚為某甲說大師曰是伊會也汝自問取他同事歸寮曰和尚道汝會也教我自問汝師乃呵呵大笑同事曰適來哭如今為甚却笑師曰適來哭如今笑同事罔然次日馬祖陞堂眾纔集師出卷却席祖便下座師隨至方丈祖曰我適來未曾說話汝為甚便卷却席師曰昨日被和尚扭得鼻頭痛祖曰汝昨日向甚處留心師曰鼻頭今日又不痛也祖曰汝深明昨日事師作禮而退師再參侍立次祖目視繩牀角拂子師曰即此用離此用祖曰汝向後開兩片皮將何為人師取拂子竪起祖曰即此用離此用師挂拂子於舊處祖振威一喝師直得三日耳聾自此雷音將震檀信請於洪州新吳界住大雄山以居處巖巒峻極故號百丈既處之未朞月參玄之賓四方至溈山黃檗當其首一日師謂眾曰佛法不是小事老僧昔被馬大師一喝直得三日耳聾黃檗聞舉不覺吐舌師曰子已後莫承嗣馬祖去麼檗曰不然今日因和尚舉得見馬祖大機之用然且不識馬祖若嗣馬祖已後喪我兒孫師曰如是如是見與師齊減師半德見過於師方堪傳授子甚有超師之見檗便禮拜溈山問仰山百丈再參馬祖因緣此二尊宿意旨如何仰云此是顯大機大用溈云馬祖出八十四人善知識幾人得大機幾人得大用仰云百丈得大機黃檗得大用餘者盡是唱導之師溈云如是如是有僧哭入法堂來師曰作麼曰父母俱喪請師選日師曰明日來一時埋却溈山五峯雲巖侍立次師問溈山併却咽喉唇吻作麼生道山曰却請和尚道師曰不辭向汝道恐已後喪我兒孫又問五峯峯曰和尚也須併却師曰無人處斫額望汝又問雲巖巖曰和尚有也未師曰喪我兒孫師謂眾曰我要一人傳語西堂阿誰去得五峯曰某甲去師曰汝作麼生傳語峯曰待見西堂即道師曰見後道甚麼峯曰却來說似和尚師每上堂有一老人隨眾聽法一日眾退唯老人不去師問汝是何人老人曰某非人也於過去迦葉佛時曾住此山因學人問大修行人還落因果也無某對云不落因果遂五百生墮野狐身今請和尚代一轉語貴脫野狐身師曰汝問老人曰大修行人還落因果也無師曰不昧因果老人於言下大悟作禮曰某已脫野狐身住在山後敢乞依亡僧津送師令維那白椎告眾食後送亡僧大眾聚議一眾皆安涅槃堂又無病人何故如是食後師領眾至山後巖下以杖挑出一死野狐乃依法火塟師至晚上堂舉前因緣黃檗便問古人錯祇對一轉語墮五百生野狐身轉轉不錯合作箇甚麼師曰近前來向汝道檗近前打師一掌師拍手笑曰將謂胡鬚赤更有赤鬚胡溈山舉問仰山仰曰黃檗常用此機溈曰汝道天生得從人得仰曰亦是稟受師承亦是自性宗通溈曰如是如是時溈山在會下作典座司馬頭陀舉野狐話問典座作麼生座撼門扇三下司馬曰大麤生座曰佛法不是這箇道理問如何是奇特事師曰獨坐大雄峯僧禮拜師便打上堂靈光獨耀迥脫根塵體露真常不拘文字心性無染本自圓成但離妄緣即如如佛問如何是佛師曰汝是阿誰曰某甲師曰汝識某甲否曰分明箇師乃舉起拂子曰汝還見麼曰見師乃不語普請钁地次忽有一僧聞鼓鳴舉起钁頭大笑便歸師曰俊哉此是觀音入理之門師歸院乃喚其僧問適來見甚麼道理便恁麼曰適來肚饑聞鼓聲歸喫飯師乃笑問依經解義三世佛冤離經一字如同魔說時如何師曰固守動靜三世佛冤此外別求即同魔說因僧問西堂有問有答即且置無問無答時如何堂曰怕爛却那師聞舉乃曰從來疑這箇老兄曰請和尚道師曰一合相不可得師謂眾曰有一人長不喫飯不道饑有一人終日喫飯不道飽眾無對雲巖問和尚每日區區為阿誰師曰有一人要巖曰因甚麼不教伊自作師曰他無家活問如何是大乘頓悟法要師曰汝等先歇諸緣休息萬事善與不善世出世間一切諸法莫記憶莫緣念放捨身心令其自在心如木石無所辨別心無所行心地若空慧日自現如雲開日出相似但歇一切攀緣貪嗔愛取垢淨情盡對五欲八風不動不被見聞覺知所縛不被諸境所惑自然具足神通妙用是解脫人對一切境心無靜亂不攝不散透過一切聲色無有滯礙名為道人善惡是非俱不運用亦不愛一法亦不捨一法名為大乘人不被一切善惡空有垢淨有為無為世出世間福德智慧之所拘繫名為佛慧是非好醜是理非理諸知見情盡不能繫縛處處自在名為初發心菩薩便登佛地問對一切境如何得心如木石去師曰一切諸法本不自言空不自言色亦不言是非垢淨亦無心繫縛人但人自虗妄計著作若干種解會起若干種知見生若干種愛畏但了諸法不自生皆從自己一念妄想顛倒取相而有知心與境本不相到當處解脫一一諸法當處寂滅當處道場又本有之性不可名目本來不是凡不是聖不是垢淨亦非空有亦非善惡與諸染法相應名人天二乘界若垢淨心盡不住繫縛不住解脫無一切有為無為縛脫心量處於生死其心自在畢竟不與諸妄虗幻塵勞蘊界生死諸入和合逈然無寄一切不拘去留無礙往來生死如門開相似夫學道人若遇種種苦樂稱意不稱意事心無退屈不念名聞利養衣食不貪功德利益不為世間諸法之所滯礙無親無愛苦樂平懷麤衣遮寒糲食活命兀兀如愚如聾稍有相應分若於心中廣學知解求福求智皆是生死於理無益却被知解境風之所漂溺還歸生死海裏佛是無求人求之即乖理是無求理求之即失若著無求復同於有求若著無為復同於有為故經云不取於法不取非法不取非非法又云如來所得法此法無實無虗若能一生心如木石相似不被陰界五欲八風之所漂溺即生死因斷去住自由不為一切有為因果所縛不被有漏所㧦他時還以無因縛為因同事利益以無著心應一切物以無礙慧解一切縛亦云應病與藥問如今受戒身口清淨已具諸善得解脫否師曰少分解脫未得心解脫亦未得一切處解脫曰如何是心解脫及一切處解脫師曰不求佛法僧乃至不求福智知解等垢淨情盡亦不守此無求為是亦不住盡處亦不欣天堂畏地獄縛脫無礙即身心及一切處皆名解脫汝莫言有少分戒身口意淨便以為了不知河沙戒定慧門無漏解脫都未涉一毫在努力向前須猛究取莫待耳聾眼暗面皺髮白老苦及身悲愛纏綿眼中流淚心裏慞惶一無所據不知去處到恁麼時節整理脚手不得也縱有福智名聞利養都不相救為心眼未開唯念諸境不知返照復不見佛道一生所有善惡業緣悉現於前或忻或怖六道五蘊俱時現前盡敷嚴好舍宅舟船車轝光明顯赫皆從自心貪愛所現一切惡境皆變成殊勝之境但隨貪愛重處業識所引隨著受生都無自由分龍畜良賤亦總未定問如何得自由分師曰如今得即得或對五欲八風情無取舍慳嫉貪愛我所情盡垢淨俱亡如日月在空不緣而照心心如木石念念如救頭然亦如香象渡河截流而過更無疑滯此人天堂地獄所不能攝也夫讀經看教語言皆須宛轉歸就自己但是一切言教祇明如今鑒覺自性但不被一切有無諸境轉是汝導師能照破一切有無諸境是金剛慧即有自由獨立分若不能恁麼會得縱然誦得十二韋陀典祇成憎上慢却是謗佛不是修行但離一切聲色亦不住於離亦不住於知解是修行讀經看教若准世間是好事若向明理人邊數此是壅塞人十地之人脫不去流入生死河但是三乘教皆治貪瞋等病祇如今念念若有貪瞋等病先須治之不用求覔義句知解知解屬貪貪變成病祇如今但離一切有無諸法亦離於離透過三句外自然與佛無差既自是佛何慮佛不解語祇恐不是佛被有無諸法縛不得自由以理未立先有福智被福智載去如賤使貴不如先立理後有福智若要福智臨時作得撮土成金撮金為土變海水為酥酪破須彌為微塵攝四大海水入一毛孔於一義作無量義於無量義作一義伏惟珍重師有時說法竟大眾下堂乃召之大眾回首師曰是甚麼藥山目之為百丈下堂句師兒時隨母入寺拜佛指佛像問母此是何物母曰是佛師曰形容似人無異我後亦當作焉師凡作務執勞必先於眾主者不忍密收作具而請息之師曰吾無德爭合勞於人既徧求作具不獲而亦妄飡故有一日不作一日不食之語流播寰宇矣唐元和九年正月十七日歸寂諡大智禪師塔曰大寶勝輪池州南泉普願禪師者鄭州新鄭人也姓王氏幼慕空宗唐至德二年依大隗山大慧禪師受業詣嵩嶽受具足戒初習相部舊章究毗尼篇聚次遊諸講肆歷聽楞伽華嚴入中百門觀精練玄義後扣大寂之室頓然忘筌得遊戲三昧一日為眾僧行粥次馬祖問桶裏是甚麼師曰這老漢合取口作恁麼語話祖便休自餘同參之流無敢詰問貞元十一年憩錫于池陽自建禪齋不下南泉三十餘載大和初宣城廉使陸公亘嚮師道風遂與監軍同請下山伸弟子之禮大振玄綱自此學徒不下數百言滿諸方目為郢匠上堂然燈佛道了也若心相所思出生諸法虗假不實何以故心尚無有云何出生諸法猶如形影分別虗空如人取聲安置篋中亦如吹網欲令氣滿故老宿云不是心不是佛不是物且教你兄弟行履據說十地菩薩住首楞嚴三昧得諸佛秘密法藏自然得一切禪定解脫神通妙用至一切世界普現色身或示現成等正覺轉大法輪入涅槃使無量入毛孔演一句經無量劫其義不盡教化無量億千眾生得無生法忍尚喚作所知愚極微細所知愚與道全乖大難大難珍重上堂曰王老師自小養一頭水牯牛擬向溪東牧不免食他國王水草擬向溪西牧亦不免食他國王水草不如隨分納些些總不見得師問僧曰夜來好風曰夜來好風師曰吹折門前一枝松曰吹折門前一枝松次問一僧曰夜來好風曰是甚麼風師曰吹折門前一枝松曰是甚麼松師曰一得一失師有書與茱萸曰理隨事變寬廓非外事得理融寂寥非內僧達書了便問萸如何是寬廓非外萸曰問一答百也無妨曰如何是寂寥非內萸曰覩對聲色不是好手僧又問長沙沙瞪目視之僧又進後語沙乃閉目示之僧又問趙州州作喫飯勢僧又進後語州以手作拭口勢後僧舉似師師曰此三人不謬為吾弟子南泉山下有一庵主人謂曰近日南泉和尚出世何不去禮見主曰非但南泉出世直饒千佛出興我亦不去師聞乃令趙州去勘州去便設拜主不顧州從西過東又從東過西主亦不顧州曰草賊大敗遂拽下簾子便歸舉似師師曰我從來疑著這漢次日師與沙彌擕茶一瓶盞三隻到庵擲向地上乃曰昨日底昨日底主曰昨日底是甚麼師於沙彌背上拍一下曰賺我來賺我來拂袖便回上堂道箇如如早是變了也今時師僧須向異類中行歸宗曰雖行畜生行不得畜生報師曰孟八郎漢又恁麼去也上堂文殊普賢昨夜三更相打每人與二十棒趁出院去也趙州曰和尚棒教誰喫師曰且道王老師過在甚處州禮拜而出師因至莊所莊主預備迎奉師曰老僧居常出入不與人知何得排辦如此莊主曰昨夜土地報道和尚今日來師曰王老師修行無力被鬼神見侍者便問和尚既是善知識為甚麼被鬼神見師曰土地前更下一分飯玄覺云甚麼處是土地前更下一分飯雲居錫云是賞伊罰伊只如土地前見是南泉不是南泉師有時曰江西馬祖說即心即佛王老師不恁麼道不是心不是佛不是物恁麼道還有過麼趙州禮拜而出時有一僧隨問趙州曰上座禮拜便出意作麼生州曰汝却問取和尚僧乃問適來諗上座意作麼生師曰他却領得老僧意旨黃檗與師為首座一日捧鉢向師位上坐師入堂見乃問曰長老甚麼年中行道檗曰威音王已前師曰猶是王老師兒孫在下去檗便過第二位坐師便休師一日問黃檗黃金為世界白銀為壁落此是甚麼人居處檗曰是聖人居處師曰更有一人居何國土檗乃叉手立師曰道不得何不問王老師檗却問更有一人居何國土師曰可惜許師問黃檗定慧等學明見佛性此理如何檗曰十二時中不依倚一物師曰莫是長老見處麼檗曰不敢師曰漿水錢且置草鞋錢教阿誰還師見僧斫木次師乃擊木三下僧放下斧子歸僧堂師歸法堂良久却入僧堂見僧在衣鉢下坐師曰賺殺人問師歸丈室將何指南師曰昨夜三更失却牛天明起來失却火師因東西兩堂爭猫兒師遇之白眾曰道得即救取猫兒道不得即斬却也眾無對師便斬之趙州自外歸師舉前語示之州乃脫履安頭上而出師曰子若在即救得猫兒也師在方丈與杉山向火次師曰不用指東指西直下本分事道來山插火箸叉手師曰雖然如是猶較王老師一線道有僧問訊叉手而立師曰太俗生其僧便合掌師曰太僧生僧無對一僧洗鉢次師乃奪却鉢其僧空手而立師曰鉢在我手裏汝口喃喃作麼僧無對師因入菜園見一僧師乃將瓦子打之其僧回顧師乃翹足僧無語師便歸方丈僧隨後入問訊曰和尚適來擲瓦子打某甲豈不是警覺某甲師曰翹足又作麼生僧無對後有僧問石霜云南泉翹足意作麼生霜舉手云還恁麼無上堂王老師賣身去也還有人買麼一僧出曰某甲買師曰不作貴不作賤汝作麼生買僧無對臥龍代云屬某甲去也禾山代云是何道理趙州代云明年與和尚縫一領布衫師與歸宗麻谷同去參禮南陽國師師於路上畫一圓相曰道得即去宗便於圓相中坐谷作女人拜師曰恁麼則不去也宗曰是甚麼心行師乃相喚便回更不去禮國師玄覺云只如南泉恁麼道是肯語是不肯語雲居錫云比來去禮拜國師南泉為甚麼却相喚回且道古人意作麼生師在山上作務僧問南泉路向甚麼處去師拈起鎌子曰我這茆鎌子三十錢買得曰不問茆鎌子南泉路向甚麼處去師曰我使得正快有一座主辭師師問甚麼處去對曰山下去師曰第一不得謗王老師對曰爭敢謗和尚師乃噴嚏曰多少主便出去雲居膺云非師本意先曹山云賴也石霜云不為人斟酌長慶云請領話雲居錫云座主當時出去是會不會師一日掩方丈門將灰圍却門外曰若有人道得即開或有祇對多未愜師意趙州曰蒼天師便開門師翫月次僧問幾時得似這箇去師曰王老師二十年前亦恁麼來曰即今作麼生師便歸方丈陸亘大夫問弟子從六合來彼中還更有身否師曰分明記取舉似作家曰和尚不可思議到處世界成就師曰適來總是大夫分上事陸異日謂師曰弟子亦薄會佛法師便問大夫十二時中作麼生曰寸絲不挂師曰猶是堦下漢師又曰不見道有道君王不納有智之臣上堂次陸大夫曰請和尚為眾說法師曰教老僧作麼生說曰和尚豈無方便師曰道他欠少甚麼曰為甚麼有六道四生師曰老僧不教他陸大夫與師見人雙陸指骰子曰恁麼不恁麼正恁麼信彩去時如何師拈起骰子曰臭骨頭十八又問弟子家中有一片石或時坐或時臥如今擬鐫作佛還得否師曰得陸曰莫不得否師曰不得雲巖云坐即佛不坐即非佛洞山云不坐即佛坐即非佛趙州問道非物外物外非道如何是物外道師便打州捉住棒曰已後莫錯打人去師曰龍蛇易辨衲子難謾師喚院主主應諾師曰佛九十日在忉利天為母說法時優填王思佛請目連運神通三轉攝匠人往彼彫佛像祇雕得三十一相為甚麼梵音相雕不得主問如何是梵音相師曰賺殺人師問維那今日普請作甚麼對曰拽磨師曰磨從你拽不得動著磨中心樹子那無語保福代云比來拽磨如今却不成法眼代云恁麼即不拽也一日有大德問師曰即心是佛又不得非心非佛又不得師意如何師曰大德且信即心是佛便了更說甚麼得與不得祇如大德喫飯了從東廊上西廊下不可總問人得與不得也師住庵時有一僧到庵師向伊道我上山去作務待齋時作飯自喫了送一分上來少時其僧自作飯喫了却一時打破家事就牀臥師待不見來便歸庵見僧臥師亦就伊邊臥僧便起去師住後曰我往前住庵時有箇靈利道者直至如今不見師拈起毬子問僧那箇何似這箇對曰不似師曰甚麼處見那箇便道不似曰若問某甲見處和尚放下手中物師曰許你具一隻眼陸大夫向師道肇法師也甚奇怪解道天地與我同根萬物與我一體師指庭前牡丹花曰大夫時人見此一株花如夢相似陸罔測又問天王居何地位師曰若是天王即非地位曰弟子聞說天王是居初地師曰應以天王身得度者即現天王身而為說法陸辭歸宣城治所師問大夫去彼將何治民曰以智慧治民師曰恁麼則彼處生靈盡遭塗炭去也師入宣州陸大夫出迎接指城門曰人人盡喚作雍門未審和尚喚作甚麼門師曰老僧若道恐辱大夫風化曰忽然賊來時作麼生師曰王老師罪過陸又問大悲菩薩用許多手眼作甚麼師曰祇如國家又用大夫作甚麼師洗衣次僧問和尚猶有這箇在師拈起衣曰爭奈這箇何玄覺云且道是一箇是兩箇師問僧良欽空劫中還有佛否對曰有師曰是阿誰對曰良欽師曰居何國土欽無語問祖祖相傳合傳何事師曰一二三四五問如何是古人底師曰待有即道曰和尚為甚麼妄語師曰我不妄語盧行者却妄語問十二時中以何為境師曰何不問王老師曰問了也師曰還曾與汝為境麼問青蓮不隨風火散時是甚麼師曰無風火不隨是甚麼僧無對師問不思善不思惡思總不生時還我本來面目來曰無容止可露洞山云還曾將示人麼師問座主你與我講經得麼曰某甲與和尚講經和尚須與某甲說禪始得師曰不可將金彈子博銀彈子去曰某甲不會師曰汝道空中一片雲為復釘釘住為復藤著問空中有一珠如何取得師曰斫竹布梯空中取曰空中如何布梯師曰汝擬作麼生取僧辭問曰學人到諸方有人問和尚近日作麼生未審如何祇對師曰但向道近日解相撲曰作麼生師曰一拍雙泯問父母未生時鼻孔在甚麼處師曰父母已生了鼻孔在甚麼處師將順世第一座問和尚百年後向甚麼處去師曰山下作一頭水牯牛去座曰某甲隨和尚去還得也無師曰汝若隨我即須銜取一莖草來師乃示疾告門人曰星翳燈幻亦久矣勿謂吾有去來也言訖而逝杭州鹽官海昌院齊安國師海門郡人也姓李氏生時神光照室後有異僧謂之曰建無勝幢使佛日回照者豈非汝乎長依本郡雲琮禪師落髮受具後聞大寂行化於龔公山乃振錫而造焉師有奇相大寂一見深器之乃令入室密示正法僧問如何是本身盧舍那師曰與老僧過淨瓶來僧將淨瓶至師曰却安舊處著僧送至本處復來詰問師曰古佛過去久矣有講僧來參師問座主蘊何事業對曰講華嚴經師曰有幾種法界曰廣說則重重無盡略說有四種師竪起拂子曰這箇是第幾種法界主沉吟師曰思而知慮而解是鬼家活計日下孤燈果然失照保福聞云若禮拜即喫和尚棒禾山代云某甲不煩和尚莫怪法眼代拊掌三下僧問大梅如何是西來意大梅曰西來無意師聞乃曰一箇棺材兩箇死漢玄沙云鹽官是作家師一日喚侍者曰將犀牛扇子來者曰破也師曰扇子既破還我犀牛兒來者無對投子代云不辭將出恐頭角不全資福代作圓相心中書牛字石霜代云若還和尚即無也保福云和尚年尊別請人好師一日謂眾曰虗空為鼓須彌為椎甚麼人打得眾無對有人舉似南泉泉云王老師不打這破鼓法眼別云王老師不打有法空禪師到請問經中諸義師一一答了却曰自禪師到來貧道總未得作主人法空曰請和尚便作主人師曰今日夜也且歸本位安置明日却來法空下去至明旦師令沙彌屈法空禪師法空至師顧沙彌曰咄這沙彌不了事教屈法空禪師屈得箇守堂家人來法空無語法听院主來參師問汝是誰對曰法昕師曰我不識汝昕無語師後不疾宴坐示滅諡悟空禪師廬山歸宗寺智常禪師上堂從上古德不是無知解他高尚之士不同常流今時不能自成自立虗度時光諸子莫錯用心無人替汝亦無汝用心處莫就他覔從前祇是依他解發言皆滯光不透脫祇為目前有物僧問如何是玄旨師曰無人能會曰向者如何師曰有向即乖曰不向者如何師曰誰求玄旨又曰去無汝用心處曰豈無方便門令學人得入師曰觀音妙智力能救世間苦曰如何是觀音妙智力師敲鼎蓋三下曰子還聞否曰聞師曰我何不聞僧無語師以棒趂下師甞與南泉同行後忽一日相別煎茶次南泉問曰從來與師兄商量語句彼此已知此後或有人問畢竟事作麼生師曰這一片地大好卓庵泉曰卓庵且置畢竟事作麼生師乃打飜茶銚便起泉曰師兄喫茶了普願未喫茶師曰作這箇語話滴水也難銷僧問此事久遠又如何用心師曰牛皮鞔露柱露柱啾啾呌凡耳聽不聞諸聖呵呵笑師因官人來乃拈起帽子兩帶曰還會麼曰不會師曰莫怪老僧頭風不卸帽子師入園取菜次乃畫圓相圍却一株語眾曰輙不得動著這箇眾不敢動少頃師復來見菜猶在便以棒趂眾僧曰這一隊漢無一箇有智慧底師問新到甚麼處來曰鳳翔來師曰還將得那箇來否曰將得來師曰在甚麼處僧以手從頂擎捧呈之師即舉手作接勢拋向背後僧無語師曰這野狐兒師剗草次有講僧來參忽有一蛇過師以鉏斷之僧曰久嚮歸宗元來是箇麤行沙門師曰你麤我麤曰如何是麤師竪起鉏頭曰如何是細師作斬蛇勢曰與麼則依而行之師曰依而行之且置你甚處見我斬蛇僧無對雲巖來參師作挽弓勢巖良久作劍勢師曰來太遲生上堂吾今欲說禪諸子總近前大眾近前師曰汝聽觀音行善應諸方所問如何是觀音行師乃彈指曰諸人還聞否曰聞師曰一隊漢向這裏覔甚麼以棒趂出大笑歸方丈僧辭師問甚麼處去曰諸方學五味禪去師曰諸方有五味禪我這裏祇有一味禪曰如何是一味禪師便打僧曰會也會也師曰道道僧擬開口師又打僧後到黃檗舉前話檗上堂曰馬大師出八十四人善知識問著箇箇屙漉漉地祇有歸宗較些子江州刺史李㴾問教中所言須彌納芥子㴾即不疑芥子納須彌莫是妄譚否師曰人傳使君讀萬卷書籍還是否曰然師曰摩頂至踵如椰子大萬卷書向何處著李俛首而已李異日又問一大藏教明得箇甚麼邊事師舉拳示之曰還會麼曰不會師曰這箇措大拳頭也不識曰請師指示師曰遇人即途中授與不遇即世諦流布師以目有重瞳遂將藥手按摩以致兩目俱赤世號赤眼歸宗焉後示滅諡至真禪師明州大梅山法常禪師者襄陽人也姓鄭氏幼歲從師於荊州玉泉寺初參大寂問如何是佛寂曰即心是佛師即大悟遂之四明梅子真舊隱縛茆燕處唐真元中鹽官會下有僧因採拄杖迷路至庵所問和尚在此多少時師曰祇見四山青又黃又問出山路向甚麼處去師曰隨流去僧歸舉似鹽官官曰我在江西時曾見一僧自後不知消息莫是此僧否遂令僧去招之師答以偈曰摧殘枯木倚寒林幾度逢春不變心樵客遇之猶不顧郢人那得苦追尋一池荷葉衣無盡數樹松花食有餘剛被世人知住處又移茅舍入深居大寂聞師住山乃令僧問和尚見馬大師得箇甚麼便住此山師曰大師向我道即心是佛我便向這裏住僧曰大師近日佛法又別師曰作麼生曰又道非心非佛師曰這老漢惑亂人未有了日任他非心非佛我祇管即心即佛其僧回舉似馬祖祖曰梅子熟也僧問禾山大梅恁麼道意作麼生禾山云真師子兒龐居士聞之欲驗師實特去相訪纔相見士便問久嚮大梅未審梅子熟也未師曰熟也你向甚麼處下口士曰百雜碎師伸手曰還我核子來士無語自此學者漸臻師道彌著上堂汝等諸人各自回心達本莫逐其末但得其本其末自至若欲識本唯了自心此心元是一切世間出世間法根本故心生種種法生心滅種種法滅心且不附一切善惡而生萬法本自如如問如何是佛法大意師曰蒲花柳絮竹針麻線夾山與定山同行言話次定山曰生死中無佛即無生死夾山曰生死中有佛即不迷生死互相不肯同上山見師夾山便舉問未審二人見處那箇較親師曰一親一疎夾山復問那箇親師曰且去明日來夾山明日再上問師曰親者不問問者不親夾山住後自云當時失一隻眼新羅僧參師問發足甚處曰欲通來處恐遭怪責師曰不可無來處也曰新羅師曰爭怪得汝僧作禮師曰是與不是知與不知祇是新羅國裏人忽一日謂其徒曰來莫可抑往莫可追從容間聞鼯鼠聲乃曰即此物非他物汝等諸人善自護持吾今逝矣言訖示滅永明壽禪師讚曰師初得道即心是佛最後示徒物非他物窮萬法源徹千聖骨真化不移何妨出沒洛京佛光如滿禪師曾住五臺山金閣寺唐順宗問佛從何方來滅向何方去既言常住世佛今在何處師答曰佛從無為來滅向無為去法身等虗空常住無心處有念歸無念有住歸無住來為眾生來去為眾生去清淨真如海湛然體常住智者善思惟更勿生疑慮帝又問佛向王宮生滅向隻林滅住世四十九又言無法說山河與大海天地及日月時至皆歸盡誰言不生滅疑情猶若斯智者善分別師答曰佛體本無為迷情妄分別法身等虗空未曾有生滅有緣佛出世無緣佛入滅處處化眾生猶如水中月非常亦非斷非生亦非滅生亦未曾生滅亦未曾滅了見無心處自然無法說帝聞大悅益重禪宗婺州五洩山靈默禪師毗陵人也姓宣氏初謁馬祖遂得披剃受具後遠謁石頭便問一言相契即住不契即去石頭據坐師便行頭隨後召曰闍黎師回首頭曰從生至死祇是這箇回頭轉腦作麼師言下大悟乃抝折拄杖而棲止焉洞山云當時若不是五洩先師大難承當然雖如此猶涉在途長慶云險玄覺云那箇是涉在途處有僧云為伊三寸途中薦得所以在途玄覺云為復薦得自己為復薦得三寸若是自己為甚麼成三寸若是三寸為甚麼悟去且道洞山意作麼生莫亂說子細好唐貞元初住白沙道場復居五洩僧問何物大於天地師曰無人識得伊曰還可雕琢也無師曰汝試下手看問此箇門中始終事如何師曰汝道目前底成來得多少時也曰學人不會師曰我此間無汝問底曰和尚豈無接人處師曰待汝求接我即接曰便請和尚接師曰汝少欠箇甚麼問如何得無心去師曰傾山覆海晏然靜地動安眠豈釆伊元和十三年三月二十三日沐浴焚香端坐告眾曰法身圓寂示有去來千聖同源萬靈歸一吾今漚散胡假興哀無自勞神須存正念若遵此命真報吾恩儻固違言非吾之子時有僧問和尚向甚麼處去師曰無處去曰某甲何不見師曰非眼所覩洞山云作家言畢奄然順化幽州盤山寶積禪師因於市肆行見一客人買猪肉語屠家曰精底割一斤來屠家放下刀叉手曰長史那箇不是精底師於此有省又一日出門見人舁喪謌郎振鈴云紅輪決定沉西去未委魂靈往那方幕下孝子哭曰哀哀師忽身心踊躍歸舉似馬祖祖印可之住後僧問如何是道師便咄僧曰學人未領旨師曰去上堂心若無事萬法不生意絕玄機纖塵何立道本無體因體而立名道本無名因名而得號若言即心即佛今時未入玄微若言非心非佛猶是指蹤極則向上一路千聖不傳學者勞形如猿捉影上堂夫大道無中復誰先後長空絕際何用稱量空既如斯道復何說上堂夫心月孤圓光吞萬象光非照境境亦非存光境俱亡復是何物禪德譬如擲劒揮空莫論及之不及斯乃空輪無迹劒刃無虧若能如是心心無知全心即佛全佛即人人佛無異始為道矣上堂禪德可中學道似地擎山不知山之孤峻如石含玉不知玉之無瑕若如此者是名出家故導師云法本不相礙三際亦復然無為無事人猶是金鎻難所以靈源獨耀道絕無生大智非明真空無迹真如凡聖皆是夢言佛及涅槃並為增語禪德直須自看無人替代上堂三界無法何處求心四大本空佛依何住璿璣不動寂爾無言覿面相呈更無餘事珍重師將順世告眾曰有人邈得吾真否眾將所寫真呈皆不契師意普化出曰某甲邈得師曰何不呈似老僧化乃打筋斗而出師曰這漢向後掣風狂去在師乃奄化諡凝寂大師蒲州麻谷山寶徹禪師侍馬祖行次問如何是大涅槃祖曰急師曰急箇甚麼祖曰看水師使扇次僧問風性常住無處不周和尚為甚麼却搖扇師曰你祇知風性常住且不知無處不周曰作麼生是無處不周底道理師却搖扇僧作禮師曰無用處師僧著得一千箇有甚麼益問僧甚處來僧不審師又問甚處來僧珍重師下牀擒住曰這箇師僧問著便作佛法祇對曰大似無眼師放手曰放汝命通汝氣僧作禮師欲扭住僧拂袖便行師曰休將三歲竹擬比萬年松師同南泉二三人去謁徑山路逢一婆乃問徑山路向甚處去婆曰驀直去師曰前頭水深過得否婆曰不濕脚師又問上岸稻得與麼好下岸稻得與麼怯婆曰總被螃蠏喫却也師曰禾好香婆曰沒氣息師又問婆住在甚處婆曰祇在這裏三人至店婆煎茶一瓶携盞三隻至謂曰和尚有神通者即喫茶三人相顧間婆曰看老朽自逞神通去也於是拈盞傾茶便行僧問如何是佛法大意師默然僧又問石霜此意如何霜曰主人擎拳帶累闍黎拖泥涉水湖南東寺如會禪師始興曲江人也初謁徑山後參大寂學徒既眾僧堂牀榻為之陷折時稱折牀會也自大寂去世師常患門徒以即心即佛之譚誦憶不已且謂佛於何住而曰即心心如畫師而云即佛遂示眾曰心不是佛智不是道劒去遠矣爾方刻舟時號東寺為禪窟焉相國崔公羣出為湖南觀察使見師問曰師以何得師曰見性得師方病眼公譏曰既云見性其柰眼何師曰見性非眼眼病何害公稽首謝之法眼別云是相公眼公見鳥雀於佛頭上放糞乃問鳥雀還有佛性也無師曰有公曰為甚麼向佛頭上放糞師曰是伊為甚麼不向鷂子頭上放仰山參師問汝是甚處人仰曰廣南人師曰我聞廣南有鎮海明珠是否仰曰是師曰此珠如何仰曰黑月即隱白月即現師曰還將得來也無仰曰將得來師曰何不呈似老僧仰叉手近前曰昨到溈山亦被索此珠直得無言可對無理可伸師曰真師子兒善能哮吼仰禮拜了却入客位具威儀再上人事師纔見乃曰已相見了也仰曰恁麼相見莫不當否師歸方丈閉却門仰歸舉似溈山溈曰寂子是甚麼心行仰曰若不恁麼爭識得他後復有人問師曰某甲擬請和尚開堂得否師曰待將物裹石頭煖即得彼無語藥山代云石頭煖也唐長慶癸卯歲歸寂諡傳明大師虔州西堂智藏禪師虔化廖氏子八歲從師二十五具戒有相者覩其殊表謂之曰骨氣非凡當為法王之輔佐也師遂參禮大寂與百丈海禪師同為入室皆承印記一日大寂遣師詣長安奉書于忠國師國師問曰汝師說甚麼法師從東過西而立國師曰祇這箇更別有師却從西過東邊立國師曰這箇是馬師底仁者作麼生師曰早箇呈似和尚了也尋又送書上徑山語在國一章屬連帥路嗣恭延請大寂居府應期盛化師回郡得大寂付授衲袈裟令學者親近僧問馬祖離四句絕百非請師直指西來意祖曰我今日勞倦不能為汝說得問取智藏其僧乃來問師師曰汝何不問和尚僧曰和尚令某甲來問上座師曰我今日頭痛不能為汝說得問取海兄去僧又去問海百丈和尚海曰我到這裏却不會僧乃舉似馬祖祖曰藏頭白海頭黑馬祖一日問師曰子何不看經師曰經豈異邪祖曰然雖如此汝向後為人也須得曰智藏病思自養敢言為人祖曰子末年必興於世師便禮拜馬祖滅後師唐貞元七年眾請開堂李尚書甞問僧馬大師有甚麼言教僧曰大師或說即心即佛或說非心非佛李曰總過這邊李却問師馬大師有甚麼言教師呼李翱李應諾師曰鼓角動也師普請次曰因果歷然爭柰何爭柰何時有僧出以手托地師曰作甚麼曰相救相救師曰大眾這箇師僧猶較些子僧拂袖便走師曰師子身中蟲自食師子肉僧問有問有答賓主歷然無問無答時如何師曰怕爛却那後有僧舉問長慶慶云相逢盡道休官去林下何曾見一人制空禪師謂師曰日出太早生師曰正是時師住西堂後有一俗士問有天堂地獄否師曰有曰有佛法僧寶否師曰有更有多問盡答言有曰和尚恁麼道莫錯否師曰汝曾見尊宿來邪曰某甲曾參徑山和尚來師曰徑山向汝作麼生道曰他道一切總無師曰汝有妻否曰有師曰徑山和尚有妻否曰無師曰徑山和尚道無即得俗士禮謝而去師元和九年四月八日歸寂憲宗諡大宣教禪師穆宗重諡大覺禪師京兆府章敬寺懷腪禪師泉州謝氏子上堂至理亡言時人不悉強習他事以為功能不知自性元非塵境是箇微妙大解脫門所有鑒覺不染不礙如是光明未曾休廢曩劫至今固無變易猶如日輪遠近斯照雖及眾色不與一切和合靈燭妙明非假鍛鍊為不了故取於物象但如揑目妄起空華徒自疲勞枉經劫教若能返照無第二人舉措施為不虧實相僧問心法雙亡指歸何所師曰郢人無汙徒勞運斤曰請師不返之言師曰即無返句後僧舉問洞山山云道即甚道罕遇作家百丈和尚令僧來候師上堂次展坐具禮拜了起來拈師一隻靸鞋以衫袖拂却塵了倒覆向下師曰老僧罪過或問祖師傳心地法門為是真如心妄想心非真非妄心為是三乘教外別立心師曰汝見目前虗空麼曰信知常在目前人自不見師曰汝莫認影像曰和尚作麼生師以手撥空三下曰作麼生即是師曰汝向後會去在有僧來遶師三匝振錫而立師曰是是長慶代云和尚佛法身心何在其僧又到南泉亦遶南泉三匝振錫而立泉曰不是不是此是風力所轉終成敗壞僧曰章敬道是和尚為甚麼道不是泉曰章敬即是是汝不是長慶代云和尚是甚麼心行雲居錫云章敬未必道是南泉未必道不是又云這僧當初但持錫出去恰好小師行脚回師問曰汝離此間多少年邪曰離和尚左右將及八年師曰辦得箇甚麼小師於地畫一圓相師曰祇這箇更別有小師乃畫破圓相便禮拜師曰不是不是僧問四大五蘊身中阿那箇是本來佛性師乃呼僧名僧應諾師良久曰汝無佛性唐元和十三年示滅諡大覺禪師越州大珠慧海禪師建州朱氏子依越州大雲寺智和尚受業初參馬祖祖問從何處來曰越州大雲寺來祖曰來此擬須何事曰來求佛法祖曰我這裏一物也無求甚麼佛法自家寶藏不顧拋家散走作麼曰阿那箇是慧海寶藏祖曰即今問我者是汝寶藏一切具足更無欠少使用自在何假外求師於言下自識本心不由知覺踊躍禮謝師事六載後以受業師老遽歸奉養乃晦迹藏用外示癡訥自撰頓悟入道要門論一卷法姪玄晏竊出江外呈馬祖祖覧訖告眾曰越州有大珠圓明光透自在無遮障處也眾中有知師姓朱者相推來越尋訪依附時號大珠和尚師謂曰禪客我不會禪並無一法可示於人不勞久立且自歇去時學侶漸多日夜叩激事不得已隨問隨答其辯無礙時有法師數人來謁曰擬伸一問師還對否師曰深潭月影任意撮摩問如何是佛師曰清譚對面非佛而誰眾皆茫然法眼云是即沒交涉僧良久又問師說何法度人師曰貧道未曾有一法度人曰禪師家渾如此師却問大德說何法度人曰講金剛經師曰講幾座來曰二十餘座師曰此經是阿誰說僧抗聲曰禪師相弄豈不知是佛說邪師曰若言如來有所說法則為謗佛是人不解我所說義若言此經不是佛說則是謗經請大德說看僧無對師少頃又問經云若以色見我以音聲求我是人行邪道不能見如來大德且道阿那箇是如來曰某甲到此却迷去師曰從來未悟說甚却迷曰請禪師為說師曰大德講經二十餘座却不識如來僧禮拜曰願垂開示師曰如來者是諸法如義何得忘却曰是諸法如義師曰大德是亦未是曰經文分明那得未是師曰大德如否曰如師曰木石如否曰如師曰大德如同木石如否曰無二師曰大德與木石何別僧無對良久却問如何得大涅槃師曰不造生死業曰如何是生死業師曰求大涅槃是生死業捨垢取淨是生死業有得有證是生死業不脫對治門是生死業曰云何即得解脫師曰本自無縛不用求解直用直行是無等等曰禪師如和尚者實謂希有禮謝而去有行者問即心即佛那箇是佛師曰汝疑那箇不是佛指出看者無對師曰達即徧境是不悟永乖疎律師法明謂師曰禪師家多落空師曰却是座主家落空明大驚曰何得落空師曰經論是紙墨文字紙墨文字者俱是空設於聲上建立名句等法無非是空座主執滯教體豈不落空明曰禪師落空否師曰不落空明曰何得却不落空師曰文字等皆從智慧而生大用現前那得落空明曰故知一法不達不名悉達師曰律師不唯落空兼乃錯會名言明作色曰何處是錯處師曰未辨華竺之音如何講說明曰請禪師指出錯處師曰豈不知悉達是梵語邪明雖省過而心猶憤然梵語具云婆曷剌他悉陀中國翻云一切義成舊云悉達多猶是訛略梵語也又曰夫經律論是佛語讀誦依教奉行何故不見性師曰如狂狗趂塊師子齩人經律論是性用讀誦者是性法明曰阿彌陀佛有父母及姓否師曰阿彌陀姓憍尸迦父名月上母名殊勝妙顏明曰出何教文師曰出鼓音王經法明禮謝讚歎而退有三藏法師問真如有變易否師曰有變易藏曰禪師錯也師却問三藏有真如否曰有師曰若無變易決定是凡僧也豈不聞善知識者能回三毒為三聚淨戒回六識為六神通回煩惱作菩提回無明為大智真如若無變易三藏真是自然外道也藏曰若爾者真如即有變易也師曰若執真如有變易亦是外道曰禪師適來說真如有變易如今又道不變易如何即是的當師曰若了了見性者如摩尼珠現色說變亦得說不變亦得若不見性人聞說真如變易便作變易解會說不變易便作不變易解會藏曰故知南宗實不可測有道流問世間還有法過於自然否師曰有曰何法過得師曰能知自然者曰元氣是道不師曰元氣自元氣道自道曰若如是者則應有二也師曰知無兩人又問云何為邪云何為正師曰心逐物為邪物從心為正源律師問和尚修道還用功否師曰用功曰如何用功師曰饑來喫飯困來即眠曰一切人總如是同師用功否師曰不同曰何故不同師曰他喫飯時不肯喫飯百種須索睡時不肯睡千般計較所以不同也律師杜口韞光大德問禪師自知生處否師曰未曾死何用論生知生即是無生法無離生法有無生祖師曰當生即不生曰不見性人亦得如此否師曰自不見性不是無性何以故見即是性無性不能見識即是性故名識性了即是性喚作了性能生萬法喚作法性亦名法身馬鳴祖師云所言法者謂眾生心若心生故一切法生若心無生法無從生亦無名字迷人不知法身無象應物現形遂喚青青翠竹總是法身鬱鬱黃華無非般若黃華若是般若般若即同無情翠竹若是法身法身即同草木如人喫筍應總喫法身也如此之言寧堪齒錄對面迷佛長劫希求全體法中迷而外覔是以解道者行住坐臥無非是道悟法者縱橫自在無非是法光又問太虗能生靈智否真心緣於善惡否貪欲人是道否執是執非人向後心通否觸境生心人有定否住寂莫人有慧否懷傲物人有我否執空執有人有智否尋文取證人苦行求佛人離心求佛人執心是佛人此智稱道否請禪師一一為說師曰太虗不生靈智真心不緣善惡嗜欲深者機淺是非交爭者未通觸境生心者少定寂莫忘機者慧沉傲物高心者我壯執空執有者皆愚尋文取證者益滯苦行求佛者俱迷離心求佛者外道執心是佛者為魔曰若如是畢竟無所有也師曰畢竟是大德不是畢竟無所有光踊躍禮謝而去問儒釋道三教同異如何師曰大量者用之即同小機者執之即異總從一性上起用機見差別成三迷悟由人不在教之同異也洪州百丈山惟政禪師有老宿見日影透窻問師為復窻就日日就窻師曰長老房中有客歸去好師問南泉諸方善知識還有不說似人底法也無曰有師曰作麼生曰不是心不是佛不是物師曰恁麼則說似人了也曰某甲即恁麼和尚作麼生師曰我又不是善知識爭知有說不說底法曰某甲不會請和尚說師曰我太煞與汝說了也僧問如何是佛佛道齊師曰定也師因入京路逢官人喫飯忽見驢鳴官人召曰頭陀師舉頭官人却指驢師却指官人法眼別云但作驢鳴洪州泐潭法會禪師問馬祖如何是祖師西來意祖曰低聲近前來向汝道師便近前祖打一摑曰六耳不同謀且去來日來師至來日獨入法堂曰請和尚道祖曰且去待老漢上堂出來問與汝證明師忽有省遂曰謝大眾證明乃繞法堂一匝便去池州杉山智堅禪師初與歸宗南泉行脚時路逢一虎各從虎邊過了泉問歸宗適來見虎似箇甚麼宗曰似箇猫兒宗却問師師曰似箇狗子又問南泉泉曰我見是箇大蟲師喫飯次南泉收生飯乃曰生聻師曰無生泉曰無生猶是末泉行數步師召曰長老泉回頭曰作麼師曰莫道是末普請擇蕨次南泉拈起一莖曰這箇大好供養師曰非但這箇百味珍羞他亦不顧泉曰雖然如是箇箇須甞過始得玄覺云是相見語不是相見語僧問如何是本來身師曰舉世無相似洪州泐潭惟建禪師一日在法堂後坐禪馬祖見乃吹師耳兩吹師起見是祖却復入定祖歸方丈令侍者持一椀茶與師師不顧便自歸堂澧州茗谿道行禪師甞曰吾有大病非世所醫後僧問曹山古人曰吾有大病非世所醫未審是甚麼病山曰攢簇不得底病曰一切眾生還有此病也無山曰人人盡有曰和尚還有此病也無山曰正覔起處不得曰一切眾生為甚麼不病山曰一切眾生若病即非眾生曰未審諸佛還有此病也無山曰有曰既有為甚麼不病山曰為伊惺惺僧問如何修行師曰好箇阿師莫客作曰畢竟如何師曰安置即不堪問如何是正修行路師曰涅槃後有曰如何是涅槃後有師曰不洗面曰學人不會師曰無面得洗撫州石鞏慧藏禪師本以弋獵為務惡見沙門因逐鹿從馬祖庵前過祖乃逆之師遂問還見鹿過否祖曰汝是何人曰獵者祖曰汝解射否曰解射祖曰汝一箭射幾箇曰一箭射一箇祖曰汝不解射曰和尚解射否祖曰解射曰一箭射幾箇祖曰一箭射一羣曰彼此生命何用射他一羣祖曰汝既知如是何不自射曰若教某甲自射直是無下手處祖曰這漢嚝劫無明煩惱今日頓息師擲下弓箭投祖出家一日在廚作務次祖問作甚麼曰牧牛祖曰作麼生牧曰一回入草去驀鼻拽將回祖曰子真牧牛師便休師住後常以弓箭接機載三平章師問西堂汝還解捉得虗空麼堂曰捉得師曰作麼生捉堂以手撮虗空師曰汝不解捉堂却問師兄作麼生捉師把西堂鼻孔拽堂作忍痛聲曰太煞拽人鼻孔直欲脫去師曰直須恁麼捉虗空始得眾參次師曰適來底甚麼處去也有僧曰在師曰在甚麼處僧彈指一聲問如何免得生死師曰用免作甚麼曰如何免得師曰這底不生死江西北蘭讓禪師湖塘亮長老問承聞師兄畫得先師真暫請瞻禮師以兩手擘胷開示之亮便禮拜師曰莫禮莫禮亮曰師兄錯也某甲不禮師兄師曰汝禮先師真那亮曰因甚麼教莫禮師曰何曾錯袁州南源道明禪師上堂快馬一鞭快人一言有事何不出頭來無事各自珍重僧問一言作麼生師乃吐舌云待我有廣長舌相即向汝道洞山參方上法堂師曰已相見了也山便下去明日却上問曰昨日已蒙和尚慈悲不知甚麼處是與某甲已相見處師曰心心無間斷流入於性海山曰幾合放過山辭師曰多學佛法廣作利益山曰多學佛法即不問如何是廣作利益師曰一物莫違僧問如何是佛師曰不可道你是也忻州酈村自滿禪師上堂古今不異法爾如然更復何也雖然如此這箇事大有人罔措在僧問不落古今請師直道師曰情知汝罔措僧欲進語師曰將謂老僧落伊古今曰如何即是師曰魚騰碧漢階級難飛曰如何免得此過師曰若是龍形誰論高下僧禮拜師曰苦哉屈哉誰人似我上堂除却日明夜暗更說甚麼即得珍重問如何是無諍之句師曰喧天動地朗州中邑洪恩禪師每見僧來拍口作和和聲仰山謝戒師亦拍口作和和聲仰從西過東師又拍口作和和聲仰從東過西師又拍口作和和聲仰當中而立然後謝戒師曰甚麼處得此三昧仰曰於曹谿印子上脫來師曰汝道曹谿用此三昧接甚麼人仰曰接一宿覺仰曰和尚甚處得此三昧師曰我於馬大師處得此三昧仰問如何得見佛性義師曰我與汝說箇譬喻如一室有六窻內有一獼猴外有獼猴從東邊喚猩猩猩猩即應如是六窻俱喚俱應仰山禮謝起曰適蒙和尚譬喻無不了知更有一事祇如內獼猴睡著外獼猴欲與相見又且如何師下繩牀執仰山手作舞曰猩猩與汝相見了譬如蟭螟蟲在蚊子眼睫上作窠向十字街頭呌云土曠人稀相逢者少雲居錫云中邑當時若不得仰山這一句語何處有中邑也崇壽稠云還有人定得此道理麼若定不得只是箇弄精魂脚手佛性義在甚麼處玄覺云若不是仰山爭得見中邑且道甚麼處是仰山得見中邑處洪州泐潭常興禪師僧問如何是曹谿門下客師曰南來燕曰學人不會師曰養羽候秋風問如何是宗乘極則事師曰秋雨草離披南泉至見師面壁乃拊師背師問汝是阿誰曰普願師曰如何曰也尋常師曰汝何多事汾州無業禪師商州上洛杜氏子母李氏聞空中言寄居得否乃覺有娠誕生之夕神光滿室甫及丱歲行必直視坐即跏趺九歲依開元寺志本禪師受大乘經五行俱下諷誦無遺十二落髮二十受具戒於襄州幽律師習四分律疏纔終便能敷演每為眾僧講涅槃大部冬夏無廢後聞馬大師禪門鼎盛特往瞻禮祖覩其狀貌奇偉語音如鐘乃曰巍巍佛堂其中無佛師禮跪而問曰三乘文學粗窮其旨常聞禪門即心是佛實未能了祖曰祇未了底心即是更無別物師曰如何是祖師西來密傳心印祖曰大德正閙在且去別時來師纔出祖召曰大德師回首祖曰是甚麼師便領悟乃禮拜祖曰這鈍漢禮拜作麼雲居錫云甚麼處是汾州正閙自得旨後詣曹溪禮祖塔及廬嶽天台徧尋聖迹後住開元精舍學者致問多答之曰莫妄想唐憲宗屢召師皆辭疾不赴暨穆宗即位思一瞻禮乃命兩街僧錄靈阜等齎詔迎請至彼作禮曰皇上此度恩旨不同常時願和尚且順天心不可言疾也師微笑曰貧道何德累煩世主且請前行吾從別道去矣乃澡身剃髮至中夜告弟子惠愔等曰汝等見聞覺知之性與太虗同壽不生不滅一切境界本自空寂無一法可得迷者不了即為境惑一為境感流轉不窮汝等當知心性本自有之非因造作猶如金剛不可破壞一切諸法如影如響無有實者經云唯此一事實餘二則非真常了一切空無一物當情是諸佛用心處汝等勤而行之言訖跏趺而逝茶毗日祥雲五色異香四徹所獲舍利璨若珠玉弟子等貯以金缾塟于石塔當長慶三年諡大達國師澧州大同廣澄禪師僧問如何得六根滅去師曰輪劒擲空無傷於物問如何是本來人師曰共坐不相識曰恁麼則學人禮謝去也師曰暗寫愁腸寄與誰信州鵝湖大義禪師衢州須江徐氏子唐憲宗甞詔入內於麟德殿論義有法師問如何是四諦師曰聖上一帝三帝何在又問欲界無禪禪居色界此土憑何而立禪師曰法師祇知欲界無禪不知禪界無欲曰如何是禪師以手點空法師無對帝曰法師講無窮經論祇這一點尚不柰何師却問諸碩德曰行住坐臥畢竟以何為道有對知者是道師曰不可以智知不可以識識安得知者是乎有對無分別者是師曰善能分別諸法相於第一義而不動安得無分別是乎有對四禪八定是師曰佛身無為不墮諸數安在四禪八定邪眾皆杜口師却舉順宗問尸利禪師大地眾生如何得見性成佛利曰佛性猶如水中月可見不可取因謂帝曰佛性非見必見水中月如何攫取帝乃問何者是佛性師對曰不離陛下所問帝默契真宗益加欽重有一僧乞置塔李翱尚書問曰教中不許將屍塔下過又作麼生僧無對僧却問師師曰他得大闡提元和十三年歸寂諡慧覺禪師伊闕伏牛山自在禪師吳興李氏子初依國一禪師受具後參馬祖發明心地祖令送書與忠國師國師曰馬大師以何法示徒曰即心即佛國師曰是甚麼語話良久又問曰此外更有何言教師曰非心非佛或曰不是心不是佛不是物國師曰猶較些子師曰馬大師即恁麼未審和尚此間如何國師曰三點如流水曲似刈禾鎌師後居伏牛山上堂曰即心即佛是無病求藥句非心非佛是藥病對治句僧問如何是脫灑底句師曰伏牛山下古今傳示滅於隨州開元寺京兆興善寺惟寬禪師衢州信安祝氏子年十三見殺生者衋然不忍食乃求出家初習毗尼修止觀後參大寂乃得心要唐貞元六年始行化於吳越間八年至鄱陽山神求受八戒十三年止嵩山少林寺僧問如何是道師曰大好山曰學人問道師何言好山師曰汝祇識好山何曾達道問狗子還有佛性否師曰有曰和尚還有否師曰我無曰一切眾生皆有佛性和尚因何獨無師曰我非一切眾生曰既非眾生莫是佛否師曰不是佛曰究竟是何物師曰亦不是物曰可見可思否師曰思之不及議之不得故曰不可思議元和四年憲宗詔至闕下侍郎白居易甞問曰既曰禪師何以說法師曰無上菩提者被於身為律說於口為法行於心為禪應用者三其致一也譬如江湖淮漢在處立名名雖不一水性無二律即是法法不離禪云何於中妄起分別曰既無分別何以修心師曰心本無損傷云何要修理無論垢與淨一切勿念起曰垢即不可念淨無念可乎師曰如人眼睛上一物不可住金屑雖珍寶在眼亦為病曰無修無念又何異凡夫邪師曰凡夫無明二乘執著離此二病是曰真修真修者不得勤不得忘勤即近執著忘即落無明此為心要云爾僧問道在何處師曰祇在目前曰我何不見師曰汝有我故所以不見曰我有我故即不見和尚還見否師曰有汝有我展轉不見曰無我無汝還見否師曰無汝無我阿誰求見元和十二年二月晦日陞堂說法訖就化諡大徹禪師鄂州無等禪師尉氏人也出家於龔公山密受心要出住隨州土門一日謁州牧主常侍辭退將出門牧召曰和尚師回顧牧敲柱三下師以手作圓相復三撥之便行後住武昌大寂寺一日大眾晚參師見人人上來師前道不審廼謂眾曰大眾適來聲向甚麼處去也有一僧竪起指頭師曰珍重其僧至來朝上參師乃轉身面壁而臥佯作呻吟聲曰老僧三兩日來不多安樂大德身邊有甚麼藥物與老僧些小僧以手拍淨缾曰這箇淨缾甚麼處得來師曰這箇是老僧底大德底在甚麼處曰亦是和尚底亦是某甲底潭州三角山總印禪師僧問如何是三寶師曰禾麥豆曰學人不會師曰大眾欣然奉持上堂若論此事眨上眉毛早已蹉過也麻谷便問眨上眉毛即不問如何是此事師曰蹉過也谷乃掀倒禪牀師便打長慶代云悄然池州魯祖山寶雲禪師僧問如何是諸佛師師曰頭上有寶冠者不是曰如何即是師曰頭上無寶冠洞山來參禮拜起侍立少頃而出却再入來師曰祇恁麼祇恁麼所以如此山曰大有人不肯師曰作麼取汝口辯山便禮拜僧問如何是不言言師曰汝口在甚麼處曰無口師曰將甚麼喫飯僧無對洞山代云他不飢喫甚麼飯師尋常見僧來便面壁南泉聞曰我尋常向師僧道向佛未出世時會取尚不得一箇半箇他恁麼驢年去玄覺云為復唱和語不肯語保福問長慶祇如魯祖節文在甚麼處被南泉恁麼道長慶云退己讓於人萬中無一箇羅山云陳老師當時若見背上與五火抄何故為伊解放不解收玄沙云我當時若見也與五火抄雲居錫云羅山玄沙總恁麼道為復一般別有道理若擇得出許上座佛法有去處玄覺云且道玄沙五火抄打伊著不著常州芙蓉山太毓禪師金陵范氏子因行食到龐居士前士擬接師乃縮手曰生心受施淨名早訶去此一機居士還甘否士曰當時善現豈不作家師曰非關他事士曰食到口邊被他奪却師乃下食士曰不消一句士又問馬大師著實為人處還分付吾師否師曰某甲尚未見他作麼生知他著實處士曰祇此見知也無討處師曰居士也不得一向言說士曰一向言說師又失宗若作兩向三向師還開得口否師曰直是開口不得可謂實也士撫掌而出寶曆中歸齊雲入滅諡大寶禪師唐州紫玉山道通禪師盧江何氏子隨父守官泉南因而出家詣建陽謁馬祖祖尋遷龔公山師亦隨之祖將歸寂謂師曰夫玉石潤山秀麗益汝道業遇可居之師不曉其言是秋遊洛回至唐州西見一山四面懸絕峯巒秀異因詢鄉人曰紫玉山師乃陟山頂見石方正瑩然紫色歎曰此其紫玉也先師之言懸記耳遂剪茅構舍而居焉後學徒四集僧問如何出得三界去師曰汝在裏許得多少時也曰如何出離師曰青山不礙白雲飛于頔相公問如何是黑風吹其船舫漂墮羅剎鬼國師曰于頔客作漢問恁麼事作麼于公失色師乃指曰這箇便是漂墮羅剎鬼國公又問如何是佛師喚相公公應諾師曰更莫別求藥山聞曰噫可惜于家漢生埋向紫玉山中公聞乃謁見藥山山問曰聞相公在紫玉山中大作佛事是否公曰不敢乃曰承聞有語相救今日特來山曰有疑但問公曰如何是佛山召于軸公應諾山曰是甚麼公於此有省元和八年弟子金藏參百丈回師曰汝其來矣此山有主也於是囑付訖筞杖徑去襄州道俗迎之至七月十五日無疾而終五臺山隱峯禪師邵武軍鄧氏子時稱鄧隱峯幼若不慧父母聽其出家初遊馬祖之門而未能覩奧復來往石頭雖兩番不捷語見馬祖章而後於馬祖言下相契師問石頭如何得合道去頭曰我亦不合道師曰畢竟如何頭曰汝被這箇得多少時邪石頭剗草次師在左側叉手而立頭飛剗子向師前剗一株草師曰和尚祇剗得這箇不剗得那箇頭提起剗子師接得便作剗草勢頭曰汝祇剗得那箇不解剗得這箇師無對洞山云還有堆阜麼師一日推車次馬祖展脚在路上坐師曰請師收足祖曰已展不縮師曰已進不退乃推車碾損祖脚祖歸法堂執斧子曰適來碾損老僧脚底出來師便出於祖前引頸祖乃置斧師到南泉覩眾僧參次泉指淨瓶曰銅瓶是境瓶中有水不得動著境與老僧將水來師拈起淨瓶向泉面前瀉泉便休師後到溈山便入堂於上板頭解放衣鉢溈聞師叔到先具威儀下堂內相看師見來便作臥勢溈便歸方丈師乃發去少間溈山問侍者師叔在否曰已去溈曰去時有甚麼語曰無語溈曰莫道無語其聲如雷師冬居衡嶽夏止清涼唐元和中荐登五臺路出淮西屬吳元濟阻兵違拒王命官軍與賊軍交鋒未決勝負師曰吾當去解其患乃擲錫空中飛身而過兩軍將士仰觀事符預夢鬪心頓息師既顯神異慮成惑眾遂入五臺於金剛窟前將示滅先問眾曰諸方遷化坐去臥去吾甞見之還有立化也無曰有師曰還有到立者否曰未甞見有師乃倒立而化亭亭然其衣順體時眾議舁就茶毗屹然不動遠近瞻覩驚歎無已師有妹為尼時亦在彼乃拊而咄曰老兄疇昔不循法律死更熒惑於人於是以手推之僨然而踣遂就闍維收舍利建塔潭州石霜亦作龍大善禪師僧問如何是佛法大意師曰春日雞鳴曰學人不會師曰中秋犬吠上堂大眾出來出來老漢有箇法要百年後不累汝眾曰便請和尚說師曰不消一堆火泉州龜洋無了禪師本郡沈氏子年七歲父𢹂入白重院視之如家因而捨愛至十八剃度受具於靈巖寺後參大寂了達祖乘即還本院之北樵采路絕師一日筞杖披榛而行遇六眸巨龜斯須而失乃庵此峯因號龜洋一日有虎逐鹿入庵師以杖格虎遂存鹿命洎將示化乃述偈曰八十年來辨西東如今不要白頭翁非長非短非大小還與諸人性相同無來無去兼無住了却本來自性空偈畢儼然告寂瘞于正堂垂二十載為山泉淹沒門人發塔見全身水中而浮閩王聞之遣使舁入府庭供養忽臭氣遠聞王焚香祝之曰可還龜洋舊址建塔言訖異香普熏傾城瞻禮本道奏諡真寂大師塔曰靈覺後弟子慧忠塟于塔左今龜洋二真身存焉忠得法於草庵義和尚南嶽西園蘭若曇藏禪師受心印於大寂後謁石頭瑩然明徹出住西園禪侶日盛師一日自燒浴次僧問何不使沙彌師撫掌三下僧舉似曹山山云一等是拍手撫掌就中西園奇恠俱𦙆一指頭禪葢為承當處不諦當僧却問曹山西園撫掌豈不是奴兒婢子邊事山云是云向上更有事也無山云有云如何是向上事山叱云這奴兒婢子師養一犬常夜經行時其犬銜師衣師即歸方丈又常於門側伏守忽一夜頻吠奮身作猛噬之勢詰旦東廚有一大蟒長數丈張口呀氣毒燄熾然侍者請避之師曰死可逃乎彼以毒來我以慈受毒無實性激發則強慈苟無緣冤親一揆言訖其蟒按首徐行倐然不見復一夕有群盜至犬亦銜衣師語盜曰茅舍有可意物一任將去終無所吝盜感其言皆稽首而散袁州楊岐山甄叔禪師上堂羣靈一源假名為佛體竭形銷而不滅金流朴散而常存性海無風金波自涌心靈絕非萬象齊照體斯理者不言而徧歷沙界不用而功益玄化如何背覺反合塵勞於陰界中妄自囚執禪月問如何是祖師西來意師呈起數珠月罔措師曰會麼曰不會師曰某甲參見石頭來曰見石頭得何意旨師指庭前鹿曰會麼曰不會師曰渠儂得自由唐元和十五年歸寂茶毗獲舍利七百粒於東峯下建塔磁州馬頭峯神藏禪師上堂知而無知不是無知而說無知便下座南泉云恁麼依師道始道得一半黃檗云不是南泉駁他要圓前話潭州華林善覺禪師常持錫杖夜出林麓間七步一振錫一稱觀音名號夾山問遠聞和尚念觀音是否師曰然山曰騎却頭時如何師曰出頭即從汝騎不出頭騎甚麼山無對僧參方展坐具師曰緩緩曰和尚見甚麼師曰可惜許磕破鐘樓其僧從此悟入觀察使裴休訪之問曰還有侍者否師曰有一兩箇祗是不可見客裴曰在甚麼處師乃喚大空小空時二虎自庵後而出裴覩之髮悸師語二虎曰有客且去二虎哮吼而去裴問曰師作何行業感得如斯師乃良久曰會麼曰不會師曰山僧常念觀音汀州水塘和尚問歸宗甚麼人宗曰陳州人師曰年多少宗曰二十二師曰闍黎未生時老僧去來宗曰和尚幾時生師竪起拂子宗曰這箇豈有生邪師曰會得即無生曰未會在師無語濛谿和尚僧問一念不生時如何師良久僧便禮拜師曰汝作麼生會曰某甲終不敢無慙愧師曰汝却信得及問本分事如何體悉師曰汝何不問曰請師答話師曰汝却問得好僧大笑而出師曰祇有這僧靈利有僧從外來師便僧喝曰好箇來由師曰猶要棒在僧珍重便出師曰得能自在溫州佛㠗和尚尋常見人來以拄杖卓地曰前佛也恁麼後佛也恁麼問正恁麼時作麼生師畫一圓相僧作女人拜師便打問如何是佛法大意師曰賊也賊也問如何是異類師敲椀曰花奴花奴喫飯來烏臼和尚玄紹二上座參師乃問二禪客發足甚麼處玄曰江西師便打玄曰久知和尚有此機要師曰汝既不會後面箇師僧祇對看紹擬近前師便打曰信知同坑無異土參堂去問僧近離甚處曰定州師曰定州法道何似這裏曰不別師曰若不別更轉彼中去便打僧曰棒頭有眼不得草草打人師曰今日打著一箇也又打三下僧便出去師曰屈棒元來有人喫在曰爭柰杓柄在和尚手裏師曰汝若要山僧回與汝僧近前奪棒打師三下師曰屈棒屈棒曰有人喫在師曰草草打著箇漢僧禮拜師曰却與麼去也僧大笑而出師曰消得恁麼消得恁麼古寺和尚丹霞來參經宿明旦粥熟行者祇盛一鉢與師又盛一椀自喫殊不顧丹霞霞亦自盛粥喫者曰五更侵早起更有夜行人霞問師何不教訓行者得恁麼無禮師曰淨地上不要點污人家男女霞曰幾不問過這老漢石臼和尚初參馬祖祖問甚麼處來師曰鳥臼來祖曰烏臼近日有何言句師曰幾人於此茫然祖曰茫然且置悄然一句作麼生師乃近前三步祖曰我有七棒寄打烏臼你還甘否師曰和尚先喫某甲後甘本谿和尚因龐居士問丹霞打侍者意在何所師曰大老翁見人長短在士曰為我與師同參方敢借問師曰若恁麼從頭舉來共你商量士曰大老翁不可共你說人是非師曰念翁年老士曰罪過罪過石林和尚見龐居士來乃竪起拂子曰不落丹霞機試道一句子士奪却拂子却自竪起拳師曰正是丹霞機士曰與我不落看師曰丹霞患瘂龐公患聾士曰恰是師無語士曰向道偶爾又一日問士某甲有箇借問居士莫惜言語士曰便請舉來師曰元來惜言語士曰這箇問訊不覺落他便宜師乃掩耳士曰作家作家亮座主蜀人也頗講經論因參馬祖祖問見說座主大講得經論是否師曰不敢祖曰將甚麼講師曰將心講祖曰心如工伎兒意如和伎者爭解講得師抗聲曰心既講不得虗空莫講得麼祖曰却是虗空講得師不肯便出將下堦祖召曰座主師回首祖曰是甚麼師豁然大悟便禮拜祖曰這鈍根阿師禮拜作麼師曰某甲所講經論將謂無人及得今日被大師一問平生功業一時氷釋禮謝而退乃隱于洪州西山更無消息黑眼和尚僧問如何是不出世師師曰善財拄杖子問如何是佛法大意師曰十年賣炭漢不知秤畔星米嶺和尚僧問如何是衲衣下事師曰醜陋任君嫌不挂雲霞色師將示滅遺偈曰祖祖不思議不許常住世大眾審思惟畢竟祇這是言訖而寂齊峯和尚龐居士來師曰俗人頻頻入僧院討箇甚麼士回顧兩邊曰誰恁麼道師乃咄之士曰在這裏師曰莫是當陽道麼士曰背後底聻師回首曰看看士曰草賊大敗士却問此去峯頂有幾里師曰甚麼處去來士曰可謂峻硬不得問著師曰是多少士曰一二三師曰四五六士曰何不道七師曰纔道七便有八士曰住得也師曰一任添取士喝便出去師隨後亦喝大陽和尚因伊禪師相見乃問伊禪近日有一般知識向目前指教人了取目前事作這箇為人還會文彩未兆時也無曰擬向這裏致一問不知可否師曰答汝已了莫道可否曰還識得目前也未師曰若是目前作麼生識曰要且遭人檢點師曰誰曰某甲師便喝伊退步而立師曰汝祇解瞻前不解顧後曰雪上更加霜師曰彼此無便宜幽州紅螺山和尚有頌示門人曰紅螺山子近邊夷度得之流半是奚共語問醻都不會可憐祇解那斯祁百靈和尚一日與龐居士路次相逢問曰南嶽得力句還曾舉向人也無士曰曾舉來師曰舉向甚麼人士以手自指曰龐公師曰直是妙德空生也讚歎不及士却問阿師得力句是誰得知師戴笠子便行士曰善為道路師更不回首鎮州金牛和尚每自做飯供養眾僧至齋時舁飯桶到堂前作舞呵呵大笑曰菩薩子喫飯來僧問長慶古人撫掌喚僧喫飯意旨如何慶云大似因齋慶讚僧問大光未審慶讚箇甚麼光作舞僧禮拜光云這野狐精東禪齊云古人自出手作飯舞了喚人來喫意作麼生還會麼祇如長慶與大光是明古人意別為他分忻今問上座每日持鉢掌盂時迎來送去時為當與古人一般別有道理若道別且作麼生得別來若一般恰到他舞又被喚作野狐精有會處麼若未會行脚眼在甚麼處洛京黑㵎和尚僧問如何是密室師曰截耳臥街曰如何是密室中人師乃換手槌胷利山和尚僧問眾色歸空空歸何所師曰舌頭不出口曰為甚麼不出口師曰內外一如故問不歷僧祇獲法身請師直指師曰子承父業曰如何領會師曰貶剝不施曰恁麼則大眾有賴去也師曰大眾且置作麼生是法身僧無對師曰汝問我與汝道僧問如何是法身師曰空華陽燄問如何是西來意師曰不見如何曰為甚麼如此師曰祇為如此韶州乳源和尚上堂西來的的意不妨難道眾中莫有道得者出來試道看時有僧出禮拜師便打曰是甚麼時節出頭來便歸方丈僧舉似長慶慶云不妨不妨資福代云為和尚不惜身命仰山作沙彌時念經聲高師咄曰這沙彌念經恰似哭曰慧寂祇恁麼未審和尚如何師乃顧視仰曰若恁麼與哭何異師便休松山和尚同龐居士喫茶士舉槖子曰人人盡有分為甚麼道不得師曰祗為人人盡有所以道不得士曰阿兄為甚麼却道得師曰不可無言也士曰灼然灼然師便喫茶士曰阿兄喫茶為甚麼不揖客師曰誰士曰龐公師曰何須更揖後丹霞聞乃曰若不是松山幾被箇老翁惑亂一上士聞之乃令人傳語霞曰何不會取未舉槖子時則川和尚蜀人也龐居士相看次師曰還記得見石頭時道理否士曰猶得阿師重舉在師曰情知久參事慢士曰阿師老耄不啻龐公師曰二彼同時又爭幾許士曰龐公鮮徤且勝阿師師曰不是勝我祇欠汝箇幞頭士拈下幞頭曰恰與師相似師大笑而已師摘茶次士曰法界不容身師還見我否師曰不是老師洎答公話士曰有問有答葢是尋常師乃摘茶不聽士曰莫怪適來容易借問師亦不顧士喝曰這無禮儀老漢待我一一舉向明眼人師乃拋却茶籃便歸方丈忻州打地和尚自江西領旨常晦其名凡學者致問唯以棒打地示之時謂之打地和尚一日被僧藏却棒然後致問師但張其口僧問門人曰祇如和尚每日有人問便打地意旨如何門人即於竈內取柴一片擲在釜中潭州秀溪和尚谷山問聲色純真如何是道師曰亂道作麼山却從東過西立師曰若不恁麼即禍事也山又從西過東立師乃下禪牀方行兩步被谷山捉住曰聲色純真事作麼生師便打一掌山曰三十年後要箇人下茶也無在師曰要谷山這漢作甚麼山呵呵大笑江西樹和尚臥次道吾近前牽被覆之師曰作麼吾曰葢覆師曰臥底是坐底是吾曰不在這兩處師曰爭奈葢覆何吾曰莫亂道師向火次吾問作麼師曰和合吾曰恁麼即當頭脫去也師曰隔濶來多少時邪吾便拂袖而去吾一日從外歸師問甚麼處去來吾曰親近來師曰用簸這兩片皮作麼吾曰借師曰他有從汝借無作麼生吾曰祇為有所以借京兆草堂和尚自罷參大寂至海昌和尚處昌問甚麼處來師曰道場來昌曰這裏是甚麼處師曰賊不打貧人家僧問未有一法時此身在甚麼處師作一圓相於中書身字洞安和尚有僧辭師曰甚麼處去曰本無所去師曰善為闍黎曰不敢師曰到諸方分明舉似僧侍立次師問今日是幾曰不知師曰我却記得曰今日是幾師曰今日昏晦京兆興平和尚洞山來禮拜師曰莫禮老朽山曰禮非老朽師曰非老朽者不受禮山曰他亦不止洞山却問如何是古佛心師曰即汝心是山曰雖然如此猶是某甲疑處師曰若恁麼即問取木人去山曰某甲有一句子不借諸聖口師曰汝試道看山曰不是某甲山辭師曰甚麼處去山曰㳂流無定止師曰法身㳂流報身㳂流山曰總不作此解師乃拊掌保福云洞山自是一家乃別云覔得幾人逍遙和尚鹿西和尚問念念攀緣心心永寂師曰昨晚也有人恁麼道西曰道箇甚麼師曰不知西曰請和尚說師以拂子驀口打西拂袖便出師召眾曰頂門上著眼福谿和尚僧問古鏡無瑕時如何師良久僧曰師意如何師曰山僧耳背僧再問師曰猶較些子問如何是自己師曰你問甚麼曰豈無方便師曰你適來問甚麼曰得恁麼顛倒師曰今日合喫山僧手裏棒問緣散歸空空歸何所師乃召僧僧應諾師曰空在何處曰却請和尚道師曰波斯喫胡椒洪州水潦和尚初參馬祖問曰如何是西來的的意祖曰禮拜著師纔禮拜祖乃當胷蹋倒師大悟起來拊掌呵呵大笑曰也大奇也大奇百千三昧無量妙義祇向一毫頭上識得根源去禮謝而退住後每告眾曰自從一喫馬祖蹋直至如今笑不休有僧作一圓相以手撮向師身上師乃三撥亦作一圓相却指其僧僧便禮拜師打曰這虗頭漢問如何是沙門行師曰動則影現覺則冰生問如何是佛法大意師乃拊掌呵呵大笑凡接機大約如此浮盃和尚凌行婆來禮拜師與坐喫茶婆乃問盡力道不得底句分付阿誰師曰浮盃無剩語婆曰未到浮盃不妨疑著師曰別有長處不妨拈出婆斂手哭曰蒼天中更添冤苦師無語婆曰語不知偏正理不識倒邪為人即禍生後有僧舉似南泉泉曰苦哉浮盃被這老婆摧折一上婆後聞笑曰王老師猶少機關在澄一禪客逢見行婆便問怎生是南泉猶少機關在婆乃哭曰可悲可痛一罔措婆曰會麼一合掌而立婆曰伎死禪和如麻似粟一舉似趙州州曰我若見這臭老婆問教口瘂一曰未審和尚怎生問他州便打一曰為甚麼却打某甲州曰似這伎死漢不打更待幾時連打數棒婆聞却曰趙州合喫婆手裏棒後僧舉似趙州州哭曰可悲可痛婆聞此語合掌歎曰趙州眼光爍破四天下州令僧問如何是趙州眼婆乃竪起拳頭僧回舉似趙州州作偈曰當機覿面提覿面當機疾報汝凌行婆哭聲何得失婆以偈答曰哭聲師已曉已曉復誰知當時摩竭國幾喪目前機潭州龍山和尚亦云隱山問僧甚麼處來曰老宿處來師曰老宿有何言句曰說則千句萬句不說則一字也無師曰恁麼則蠅子放卵僧禮拜師便打洞山與密師伯經由見溪流菜葉洞曰深山無人因何有菜隨流莫有道人居否乃共議撥草溪行五七里間忽見師羸形異貌放下行李問訊師曰此山無路闍黎從何處來洞曰無路且置和尚從何而入師曰我不從雲水來洞曰和尚住此山多少時邪師曰春秋不涉洞曰和尚先住此山先住師曰不知洞曰為甚麼不知師曰我不從人天來洞曰和尚得何道理便住此山師曰我見兩箇泥牛鬪入海直至于今絕消息洞山始具威儀禮拜便問如何是主中賓師曰青山覆白雲曰如何是賓中主師曰長年不出戶曰賓主相去幾何師曰長江水上波曰賓主相見有何言說師曰清風拂白月洞山辭退師乃述偈曰三間茅屋從來住一道神光萬境閑莫把是非來辨我浮生穿鑿不相關因茲燒庵入深山不見後人號為隱山和尚襄州居士龐蘊者衡州衡陽縣人也字道玄世本儒業少悟塵勞志求真諦唐貞元初謁石頭乃問不與萬法為侶者是甚麼人頭以手掩其口豁然有省後與丹霞為友一日石頭問曰子見老僧以來日用事作麼生士曰若問日用事即無開口處乃呈偈曰日用事無別唯吾自偶諧頭頭非取捨處處沒張乖朱紫誰為號丘山絕點埃神通并妙用運水及搬柴頭然之曰子以緇邪素邪士曰願從所慕遂不剃染後參馬祖問曰不與萬法為侶者是甚麼人祖曰待汝一口吸盡西江水即向汝道士於言下頓領玄旨乃留駐參承二載有偈曰有男不婚有女不嫁大家團欒頭共說無生話自爾機辯迅捷諸方嚮之因辭藥山山命十禪客相送至門首士乃指空中雪曰好雪片片不落別處有全禪客曰落在甚處士遂與一掌全曰也不得草草士曰恁麼稱禪客閻羅老子未放你在全曰居士作麼生士又掌曰眼見如盲口說如瘂甞遊講肆隨喜金剛經至無我無人處致問曰座主既無我無人是誰講誰聽主無對士曰某甲雖是俗人粗知信向主曰祇如居士意作麼生士以偈答曰無我復無人作麼有疎親勸君休歷座不似直求真金剛般若性外絕一纖塵我聞并信受總是假名陳主聞偈欣然仰歎居士所至之處老宿多往復問醻皆隨機應響非格量軌轍之可拘也元和中北避襄漢隨處而居有女名靈照常鬻竹漉籬以供朝夕士有偈曰心如境亦如無實亦無虗有亦不管無亦不拘不是賢聖了事凡夫易復易即此五蘊有真智十方世界一乘同無相法身豈有二若捨煩惱人菩提不知何方有佛地護生須是殺殺盡始安居會得箇中意鐵船水上浮士坐次問靈照曰古人道明明百草頭明明祖師意如何會照曰老老大大作這箇語話士曰你作麼生照曰明明百草頭明明祖師意士乃笑士因賣漉籬下橋喫撲靈照見亦去爺邊倒士曰你作甚麼照曰見爺倒地某甲相扶士將入滅謂靈照曰視日早晚及午以報照遽報日已中矣而有蝕也士出戶觀次靈照即登父座合掌坐亡士笑曰我女鋒捷矣於是更延七日州牧于公頔問疾次士謂之曰但願空諸所有慎勿實諸所無好住世間皆如影響言訖枕于公膝而化遺命焚棄江湖緇白傷悼謂禪門龐居士即毗耶淨名矣有詩偈三百餘篇傳於世
