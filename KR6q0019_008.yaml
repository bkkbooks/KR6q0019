body:
  text: 南嶽下七世瑞巖彥禪師法嗣南嶽橫龍和尚初住金輪僧問如何是金輪第一句師曰鈍漢問如何是金輪一隻箭師曰過也問如何是祖師燈師曰八風吹不滅曰恁麼則暗冥不生也師曰白日沒間人溫州瑞峰院神祿禪師福州人也久為瑞巖侍者後開山創院學侶依附師有偈曰蕭然獨處意沉吟誰信無絃發妙音終日法堂唯靜坐更無人問本來心時有朋彥上座問曰如何是本來心師召朋彥彥應諾師曰與老僧點茶來彥於是信入玄泉彥禪師法嗣鄂州黃龍山誨機超慧禪師清河張氏子初參巖頭問如何是祖師西來意頭曰你還解救糍麼師曰解頭曰且救糍去後到玄泉問如何是祖師西來意泉拈起一莖皂角曰會麼師曰不會泉放下皂角作洗衣勢師便禮拜曰信知佛法無別泉曰你見甚麼道理師曰某甲曾問巖頭頭曰你還解救糍麼救糍也祇是解粘和尚提起皂角亦是解粘所以道無別泉呵呵大笑師遂有省住後僧問不問祖佛邊事如何是平常之事師曰我住山得十五年也問如何是和尚家風師曰琉璃鉢盂無底問如何是君王劒師曰不傷萬類曰佩者如何師曰血濺梵天曰大好不傷萬類師便打問佛在日為衆生說法佛滅後有人說法否師曰慚愧佛問毛吞巨海芥納須彌不是學人本分事如何是學人本分事師曰封了合盤市裏揭問急切相投請師通信師曰火燒裙帶香問如何是大疑底人師曰對坐盤中弓落盞曰如何是不疑底人師曰再坐盤中弓落盞問風恬浪靜時如何師曰百尺竿頭五兩垂師將順世僧問百年後鉢囊子甚麼人將去師曰一任將去曰裏面事如何師曰線綻方知曰甚麼人得師曰待海燕雷聲即向汝道言訖而寂洛京柏谷和尚僧問普滋法雨時如何師曰有道傳天位不汲鳳凰池問九旬禁足三月事如何師曰不墜蠟人機懷州玄泉二世和尚僧問辭窮理盡時如何師曰不入理豈同盡問妙有玄珠如何取得師曰不似摩尼絶影豔碧眼胡人豈能見曰有口道不得時如何師曰三寸不能齊鼓韻啞人解唱木人歌潞府妙勝玄密禪師僧問四山相逼時如何師曰紅日不垂影暗地莫知音曰學人不會師曰鶴透羣峰何伸向背問雪峰一曲千人唱月裏挑燈誰最明師曰無音和不齊明暗豈能收羅山間禪師法嗣婺州明招德謙禪師受羅山印記靡滯於一隅激揚玄旨諸老宿皆畏其敏捷後學鮮敢當其鋒者嘗到招慶指壁畫問僧那箇是甚麼神曰護法善神師曰會昌沙汰時向甚麼處去來僧無對師令僧問演侍者演曰汝甚麼劫中遭此難來僧回舉似師師曰直饒演上座他後聚一千衆有甚麼用處僧禮拜請別語師曰甚麼處去也次到坦長老處坦曰夫參學一人所在亦須到半人所在亦須到師便問一人所在即不問作麼生是半人所在坦無對後令小師問師師曰汝欲識半人所在麼也祇是弄泥團漢清上座舉仰山插鍬話問師古人意在叉手處插鍬處師召清清應諾師曰還夢見仰山麼清曰不要上座下語祇要商量師曰若要商量堂頭自有一千五百人老師在又到雙巖巖請喫茶次曰某甲致一問若道得便捨院與闍黎住若道不得即不捨院遂舉金剛經云一切諸佛及諸佛阿耨多羅三藐三菩提法皆從此經出且道此經是何人說師曰說與不說拈向這邊著祇如和尚決定喚甚麼作此經巖無對師又曰一切賢聖皆以無為法而有差別則以無為法為極則憑何而有差別祇如差別是過不是過若是過一切賢聖悉皆是過若不是過決定喚甚麼作差別巖亦無語師曰噫雪峰道底師訪保寧於中路相遇便問兄是道伴中人乃點鼻頭曰這箇礙塞我不徹與我拈却少時得麼寧曰和尚有來多少時師曰噫洎賺我踏破一緉草鞋便回國泰代曰非但某甲諸佛亦不奈何師曰因甚麼以己方人師在婺州智者寺居第一座尋常不受淨水主事嗔曰上座不識觸淨為甚麼不受淨水師跳下牀提起淨瓶曰這箇是觸是淨事無語師乃撲破自爾道聲遐播衆請居明招山開法四來禪者盈於堂室上堂全鋒敵勝罕遇知音同死同生萬中無一尋言逐句其數河沙舉古舉今滅胡種族向上一路啐猶乖儒士相逢握鞭回首沙門所見誠實苦哉拋却真金隨隊撮土報諸稚子莫謾波波解得他玄猶兼瓦礫不如一擲騰過太虗祇者靈鋒阿誰敢近任君來箭方稱丈夫擬欲吞聲不消一攫僧問師子未出窟時如何師曰俊鷂趂不及曰出窟後如何師曰萬里正紛紛曰欲出不出時如何師曰嶮曰向去事如何師曰劄問如何是透法身外一句子師曰北斗後翻身問十二時中如何趣向師曰拋向金剛地上著問文殊與維摩對談何事師曰葛巾紗帽已拈向這邊著也問如何是和尚家風師曰咬得著是好手問放鶴出籠和煙去時如何師曰爭奈頭上一點何問無煙之火是甚麼人向得師曰不惜眉毛底曰和尚還向得麼師曰汝道我有多少莖眉毛在新到參才上法堂師舉拂子却擲下其僧珍重便下去師曰作家作家問全身佩劒時如何師曰忽遇正恁麼時又作麼生僧無對一日天寒上堂衆才集師曰風頭稍硬不是汝安身立命處且歸暖室商量便歸方丈大衆隨至立定師又曰才到暖室便見瞌睡以拄杖一時趂下師問國泰古人道俱胝祇念三行呪便得名超一切人作麼生與他拈却三行呪便得名超一切人泰竪起一指師曰不因今日爭識得瓜洲客師有師叔在廨院不安附書來問曰某甲有此大病如今正受疼痛一切處安置伊不得還有人救得麼師回信曰頂門上中此金剛箭透過那邊去也會下有僧去住庵一年後却來禮拜曰古人道三日不相見莫作舊時看師撥開胸曰汝道我有幾莖蓋膽毛僧無對師却問汝甚麼時離庵曰今朝師曰來時折腳鐺子分付與阿誰僧又無語師乃喝出問承師有言我住明招頂興傳古佛心如何是明招頂師曰換却眼曰如何是古佛心師曰汝還氣急麼問學人拏雲浪上來請師展鉢師曰拶破汝頂曰也須仙陀去師便打趂出師有頌示衆曰明招一拍和人稀此是真宗上妙機石火瞥然何處去朝生之子合應知臨遷化上堂告衆囑付訖僧問和尚百年後向甚麼處去師擡起一足曰足下看取中夜問侍者昔日靈山會上釋迦如來展開雙足放百寶光遂展足曰吾今放多少者曰昔日世尊今宵和尚師以手撥眉曰莫孤負麼乃說偈曰驀刀叢裏逞全威汝等諸人善護持火裏鐵牛生犢子臨岐誰解湊吾機偈畢端坐而逝塔院存焉洪州大寧院隱微覺寂禪師豫章新淦楊氏子誕夕有光明貫室年七歲依本邑石頭院道堅禪師出家受具歷參宗匠至羅山山導以師子在窟出窟之要因而省悟後回江表會龍泉宰李孟俊請居十善道場闡揚宗旨上堂還有騰空底麼出來衆無出者師說偈曰騰空正是時應須眨上眉從茲出倫去莫待白頭兒僧問如何是十善橋師曰險曰過者如何師曰喪問資福和尚遷化向甚麼處去師曰草鞋破問如何是黃梅一句師曰即今作麼生曰如何通信師曰九江路絶問初心後學如何是學師曰頭戴天曰畢竟如何師曰腳踏地問如何是法王劒師曰露曰還殺人也無師曰作麼問如何是龍泉劒師曰不出匣曰便請出匣師曰星辰失位問國界安寧為甚麼珠不現師曰落在甚麼處衡州華光範禪師僧問靈臺不立還有出身處也無師曰有曰如何是出身處師曰出問如何是西來意師曰道問如何是佛法大意師曰驗問牛頭未見四祖時如何師曰自由自在曰見後如何師曰自由自在問如何是佛法中事師曰了福州羅山紹孜禪師上堂有數僧爭出問話師曰但一齊出來問待老僧一齊與汝答僧便問學人一齊問請師一齊答師曰得問學人乍入叢林祖師的的意請師直指師曰好西川定慧禪師初參羅山山問甚麼處來師曰遠離西蜀近發開元却近前問即今事作麼生山揖曰喫茶去師擬議山曰秋氣稍熱去師出至法堂歎曰我在西蜀峨嵋山腳下拾得一隻蓬蒿箭擬撥亂天下今日打羅山寨弓折箭盡也休休乃下參衆山來日上堂師出問豁開戶牖當軒者誰山便喝師無語山曰毛羽未備且去師因而摳衣久承印記後謁台州勝光光坐次師直入身邊叉手而立光問甚處來師曰猶待答話在便出光拈得拂子趂至僧堂前見師乃提起拂子曰闍黎喚這箇作甚麼師曰敢死喘氣光低頭歸方丈建州白雲令弇禪師上堂遣往先生門誰云對喪主珍重僧問己事未明以何為驗師曰木鏡照素容曰驗後如何師曰不爭多問三台有請四衆臨筵既處當仁請師一唱師曰要唱也不難曰便請師曰夜靜水寒魚不食滿船空載月明歸䖍州天竺義澄常真禪師在羅山數載後因山示疾師問百年後忽有人問和尚以何指示山乃放身便倒師從此契悟即禮謝住後僧問如何是佛法大意師曰寒暑相催吉州清平惟曠真寂禪師上堂不動神情便有輸贏之意還有麼出來時有僧出禮拜師曰不是作家便歸方丈問如何是第一句師曰要頭將取去問如何是活人劒師曰會麼曰如何是殺人刀師叱之問如何是師子兒師曰毛頭排宇宙婺州金柱山義昭禪師僧問如何是和尚家風師曰開門作活計曰忽遇賊來又作麼生師曰然新到參師揭簾以手作除帽勢僧擬欲近前師曰賺殺人因事有偈曰虎頭生角人難措石火電光須密布假饒烈士也應難懵底那能解回互潭州谷山和尚僧問省要處乞師一言師便起去問𦏪羊挂角時如何師曰你向甚麼處覓曰挂角後如何師曰走湖南道吾從盛禪師初住龍回僧問如何是覿面事師曰新羅國去也問如何是龍回家風師曰縱橫射直問窮子投師乞師拯濟師曰莫是屈著汝麼曰爭奈窮何師曰大有人見福州羅山義因禪師上堂良久曰若是宗師門下客必不怪於羅山珍重僧問承古有言自從認得曹溪路了知生死不相關曹溪路即不問如何是羅山路師展兩手僧曰恁麼則一路得通諸路亦然師曰甚麼諸路僧近前叉手師曰靈鶴煙霄外鈍鳥不離窠問教中道順法身萬象俱寂隨智用萬象齊生如何是萬象俱寂師曰有甚麼曰如何是萬象齊生師曰繩牀倚子灌州靈巖和尚僧問如何是道中寶師曰地傾東南天高西北曰學人不會師曰落照機前異師頌石鞏接三平曰解擘當胸箭因何祇半人為從途路曉所以不全身吉州𭅕山和尚示徒頌曰𭅕山路𭅕山路巖崖嶮峻人難措遊人擬議隔千山一句分明超佛祖白牛頌曰我有古壇真白牛父子藏來經幾秋出門直往孤峰頂回來暫跨虎溪頭福州興聖重滿禪師上堂覿面分付不待文宣對眼投機喚作參玄上士若能如此所以宗風不墜僧問如何是宗風不墜底句師曰老僧不忍問昔日靈山會裏今朝興聖筵中和尚親傳如何舉唱師曰缺汝一問潭州寶應清進禪師僧問如何是實相師曰沒却汝問至理無言如何通信師曰千差萬別曰得力處乞師指示師曰瞌睡漢玄沙備禪師法嗣漳州羅漢院桂琛禪師常山李氏子為童兒時日一素食出言有異既冠親事本府萬歲寺無相大師披削登戒學毗尼一日為衆升臺宣戒本布薩已乃曰持戒但律身而已非真解脫也依文作解豈發聖智乎於是訪南宗初謁雲居雪峰參訊勤恪然猶未有所見後造玄沙一言啓發廓爾無惑沙問三界唯心汝作麼生會師指椅子曰和尚喚這箇作甚麼曰椅子師曰和尚不會三界唯心曰我喚這箇作竹木汝喚作甚麼師曰桂琛亦喚作竹木曰盡大地覓一箇會佛法底人不可得師自爾愈加激勵沙每因誘迪學者流出諸三昧皆命師為助發師雖處衆韜晦然聲譽甚遠時漳牧王公建精舍曰地藏請師開法因插田次見僧乃問從甚處來曰南州師曰彼中佛法如何曰商量浩浩地師曰爭如我這裏栽田博飯喫曰爭奈三界何師曰喚甚麼作三界問僧甚處來曰南方來師曰南方知識有何言句示徒曰彼中道金屑雖貴眼裏著不得師曰我道須彌在汝眼裏一日同中塔侍玄沙沙打中塔一棒曰就名就體中塔不對沙乃問師作麼生會師曰這僧著一棒不知來處僧報曰保福已遷化也師曰保福遷化地藏入塔僧問法眼古人意旨如何眼云蒼天蒼天後遷羅漢大闡玄要上堂宗門玄妙為當祇恁麼也更別有奇特若別有奇特汝且舉將來看若無去不可將兩箇字便當却宗乘也何者兩箇字謂宗乘教乘也汝才道著宗乘便是宗乘道著教乘便是教乘禪德佛法宗乘元來由汝口裏安立名字作取說取便是也斯須向這裏說平說實說圓說常禪德汝喚甚麼作平實把甚麼作圓常傍家行腳理須甄別莫相埋沒得些子聲色名字貯在心頭道我會解善能揀辨汝且會箇甚麼揀箇甚麼記持得底是名字揀辨得底是聲色若不是聲色名字汝又作麼生記持揀辨風吹松樹也是聲蝦蟇老鴉呌也是聲何不那裏聽取揀擇去若那裏有箇意度模樣祇如老師口裏又有多少意度與上座莫錯即今聲色摐摐地為當相及不相及若相及即汝靈性金剛祕密應有壞滅去也何以如此為聲貫破汝耳色穿破汝眼因緣即塞却汝幻妄走殺汝聲色體爾不可容也若不相及又甚麼處得聲色來會麼相及不相及試裁辨看少間又道是圓常平實甚麼人恁麼道未是黃夷村裏漢解恁麼說是他古聖乖些子相助顯發今時不識好惡便安圓實道我別有宗風玄妙釋迦佛無舌頭不如汝些子便恁麼點胸若論殺盜淫罪雖重猶輕尚有歇時此箇謗般若瞎却衆生眼入阿鼻地獄吞鐵丸莫將為等間所以古人道過在化主不干汝事珍重僧問如何是羅漢一句師曰我若向汝道便成兩句也問不會底人來師還接否師曰誰是不會者曰適來道了也師曰莫自屈麼保福僧到師問彼中佛法如何曰有時示衆道塞却你眼教你不見塞却你耳教你聽不聞坐却你意教你分別不得師曰吾問你不塞你眼見箇甚麼不塞你耳聞箇甚麼不坐你意作麼生分別東禪齊云那僧聞了忽然省去更不他遊上座如今還會麼若不會每日見箇甚麼問以字不成八字不是未審是甚麼字師曰汝實不會那曰學人實不會師曰看取下頭注腳問如何是沙門正命食師曰喫得麼曰欲喫此食作何方便師曰塞却你口問如何是羅漢家風師曰不向你道曰為甚麼不道師曰是我家風問如何是法王身師曰汝今是甚麼身曰恁麼即無身也師曰苦痛深上堂才坐有二僧一時禮拜師曰俱錯問如何是撲不破底句師曰撲問一佛出世普為羣生和尚今日為箇甚麼師曰甚麼處遇一佛曰恁麼即學人罪過師曰謹退問如何是諸聖玄旨師曰四楞塌地問大事未肯時如何師曰由汝問如何是十方眼師曰眨上眉毛著請保福齊令人傳語曰請和尚慈悲降重福曰慈悲為阿誰師曰和尚恁麼道渾是不慈悲玩月次乃曰雲動有雨去有僧曰不是雲動是風動師曰我道雲亦不動風亦不動曰和尚適來又道雲動師曰阿誰罪過師見僧舉拂子曰還會麼曰謝和尚慈悲示學人師曰見我竪拂子便道示學人汝每日見山見水可不示汝又見僧來舉拂子其僧讚歎禮拜師曰見我竪拂子便禮拜讚歎那裏掃地竪起掃帚為甚麼不讚歎問承教有言若見諸相非相即見如來如何是非相師曰燈籠子問如何是出家師曰喚甚麼作家問僧甚處來曰秦州師曰將得甚麼物來曰不將得物來師曰汝為甚麼對衆謾語其僧無對師却問秦州豈不是出鸚鵡曰鸚鵡出在隴西師曰也不較多問僧甚處來曰報恩師曰何不且在彼中曰僧家不定師曰既是僧家為甚麼不定僧無對玄覺代云謝和尚顧問王大傅上雪峰施衆僧衣時從弇上座不在師弟代上名受衣弇歸弟曰某甲為師兄上名了弇曰汝道我名甚麼弟無對師代云師兄得恁麼貪又曰甚麼處是貪處又代云兩度上名雲居錫云甚麼處是弇上座兩度上名處師與長慶保福入州見牡丹障子保福曰好一朵牡丹花長慶曰莫眼花師曰可惜許一朵花玄覺云三尊宿語還有親疏也無祇如羅漢恁麼道落在甚麼處問僧汝在招慶有甚麼異聞底事試舉看曰不敢錯舉師曰真實底事作麼生舉曰和尚因甚麼如此師曰汝話墮也衆僧晚參聞角聲師曰羅漢三日一度上堂王太傅二時相助問如何是學人本來心師曰是你本來心問師居寶座說法度人未審度甚麼人師曰汝也居寶座度甚麼人問鏡裏看形見不難如何是鏡師曰還見形麼問但得本莫愁末如何是末師曰總有也師因疾僧問和尚尊候較否師以杖拄地曰汝道這箇還痛否曰和尚問阿誰師曰問汝曰還痛否師曰元來共我作道理天成三年秋復屆閩城舊止遍遊近城梵宇已乃示寂茶毗收舍利建塔於院之西隅諡真應禪師杭州天龍寺重機明真禪師台州人也得法玄沙復回浙中錢武肅王請出世開法上堂若直舉宗風獨唱本分事便同於頑石若言絶凡聖消息無大地山河盡十方世界都是一隻眼此乃事不獲已恁麼道還會麼若更不會聽取一頌盲聾瘖啞是仙陀滿眼時人不奈何祇向目前須體妙身心萬象與森羅僧問如何是璇璣不動師曰青山數重曰如何是寂爾無垠師曰白雲一帶問如何是歸根得旨師曰兔角生也曰如何是隨照失宗師曰龜毛落也問蓮花未出水時如何師曰誰人不知曰出水後如何師曰馨香目擊問朗月輝空時如何師曰正是分光景何消指玉樓福州仙宗院契符清法禪師開堂日僧問師登寶座合談何事師曰剔開耳孔著曰古人為甚麼却道非耳目之所到師曰金櫻樹上不生梨曰古今不到處請師道師曰汝作麼生問問衆手淘金誰是得者師曰舉手隔千里休功任意看問飛岫巖邊華子秀仙境臺前事若何師曰無價大寶光中現暗客惛惛爭奈何曰優曇華拆人皆覩向上宗乘意若何師曰闍黎若問宗乘意不如靜處薩婆訶問如何是閩中諸佛境界師曰造化終難測春風徒自輕問如何是道中寶師曰雲孫淚亦垂問諸聖收光歸源後如何師曰三聲猿屢斷萬里客愁聽曰未審今時人如何湊得古人機師曰好心向子道切忌未生時婺州國泰院禪師上堂不離當處咸是妙明真心所以玄沙和尚道會我最後句出世少人知爭似國泰有末頭一句僧問如何是國泰末頭一句師曰闍黎問太遲生便歸方丈問如何是毗盧師曰某甲與老兄是弟子問達磨來時即不問如何是未來時事師曰親遇梁王問古鏡未磨時如何師曰古鏡曰磨後如何師曰古鏡福州升山白龍院道希禪師本郡人也上堂不要舉足是誰威光還會麼若道自家去處本自如是且喜沒交涉問如何是西來意師曰汝從甚處來問如何是佛法大意師曰汝早禮三拜問不責上來請師直道師曰得問如何是正真道師曰騎驢覓驢問請師答無賓主話師曰昔年曾記得曰即今如何師曰非但耳聾亦兼眼暗問情忘體合時如何師曰別更夢見箇甚麼問學人擬伸一問請師裁師曰不裁曰為甚麼不裁師曰須知好手問大衆雲集請師舉揚宗教師曰少遇聽者問不涉唇鋒乞師指示師曰不涉唇鋒問將來曰恁麼即羣生有賴師曰莫間言語問請和尚生機答話師曰把紙筆來録將去問如何是思大口師曰出來向你道曰學人即今見出師曰曾賺幾人來福州安國院慧球寂照禪師亦曰中塔泉州莆田人也玄沙室中參訊居首因問如何是第一月沙曰用汝箇月作麼師從此悟入梁開平二年玄沙將示滅閩帥王氏遣子至問疾仍請密示繼踵說法者誰沙曰球子得王默記遺旨乃問鼓山臥龍法席孰當其任鼓山舉城下宿德具道眼者十有二人皆堪出世王亦默之至開堂日官僚與僧侶俱會法筵王忽問衆曰誰是球上座於是衆人指出師王氏便請升座師良久曰莫嫌寂寞莫道不堪未詳涯際作麼生論量所以尋常用其音響聊撥一兩下助他發機若論來十方世界覓一人為伴侶不可得僧問佛法大意從何方便頓入師曰入是方便問雲自何山起風從何㵎生師曰盡力施為不離中塔上堂我此間粥飯因緣為兄弟舉唱終是不常欲得省要却是山河大地與汝發明其道既常亦能究竟若從文殊門入者一切無為土木瓦礫助汝發機若從觀音門入者一切音響蝦蟇蚯蚓助汝發機若從普賢門入者不動步而到以此三門方便示汝如將一隻折箸攪大海水令彼魚龍知水為命會麼若無智眼而審諦之任汝百般巧妙不為究竟問學人近入叢林不明己事乞師指示師以杖指之曰會麼曰不會師曰我恁麼為汝却成抑屈人還知麼若約當人分上從來底事不論初入叢林及過去諸佛不曾乏少如大海水一切魚龍初生及至老死所受用水悉皆平等問不謬正宗請師真實師曰汝替我道曰或有不辨者作麼生師曰待不辨者來問諸佛還有師否師曰有曰如何是諸佛師師曰一切人識不得上堂良久有僧出禮拜師曰莫教髑髏拶損僧參問曰去却僕從便請相見師曰眨上眉毛看曰不與麼時如何師曰山北去也問從上宗乘事如何師良久僧再問師便喝出問如何是大庾嶺頭事師曰料汝承當不得曰重多少師曰這般底論劫不奈何師問了院主祇如先師道盡十方世界是真實人體你還見僧堂麼了曰和尚莫眼花師曰先師遷化肉猶暖在衡嶽南臺誠禪師僧問玄沙宗旨請師舉揚師曰甚麼處得此消息曰垂接者何師曰得人不迷己問潭清月現是何境界師曰不干你事曰借問又何妨師曰覓潭月不可得問離地四指為甚麼却有魚紋師曰有聖量在曰此量為甚麼人施師曰不為聖人福州螺峰冲奧明法禪師上堂人人具足人人成現爭怪得山僧珍重僧問諸法寂滅相不可以言宣如何是寂滅相師曰問答俱備曰恁麼則真如法界無自無他師曰特地令人愁問牛頭未見四祖時如何師曰德重鬼神欽曰見後如何師曰通身聖莫測問如何是螺峰一句師曰苦問如何是本來人師曰惆悵松蘿境界危泉州睡龍山和尚僧問如何是觸目菩提師以杖趂之僧乃走師曰住住向後遇作家舉看上堂舉拄杖曰三十年住山得他氣力時有僧問和尚得他甚麼氣力師曰過溪過嶺東拄西拄招慶云我不恁麼道僧問和尚作麼生道慶以杖下地拄行天台山雲峰光緒至德禪師上堂但以衆生日用而不知譬如三千大千世界日月星辰江河淮濟一切含靈從一毛孔入一毛孔毛孔不小世界不大其中衆生不覺不知若要易會上座日用亦復不知時有僧問日裏僧䭾像夜裏像䭾僧未審此意如何師曰闍黎豈不是從茶堂裏來福州大章山契如庵主本郡人也素蘊孤操志探祖道預玄沙之室頴悟幽旨玄沙記曰子禪已逸格則他後要一人侍立也無師自此不務聚徒不畜童侍隱於小界山刳大朽杉若小庵但容身而已凡經游僧至隨叩而應無定開示僧問生死到來如何回避師曰符到奉行曰恁麼則被生死拘將去也師曰阿㖿㖿問西天持錫意作麼生師拈錫杖卓地振之僧曰未審此是甚麼義師曰這箇是張家打僧擬進語師以錫攛之僧問雲臺欽和尚如何是真言欽曰南無佛陀耶師別云作麼作麼清豁冲煦二長老嚮師名未嘗會遇一旦同訪之值師採粟豁問道者如庵主在何所師曰從甚麼處來曰山下來師曰因甚麼得到這裏曰這裏是甚麼處所師揖曰那下喫茶去二公方省是師遂詣庵所頗味高論晤坐於左右不覺及夜覩豺虎奔至庵前自然馴繞豁因有詩曰行不等間行誰知去住情一餐猶未飽萬戶勿聊生非道應難伏空拳莫與爭龍吟雲起處間嘯兩三聲二公尋於大章山創庵請師居之兩處孤坐垂五十二載而卒福州蓮華山永興神祿禪師閩王請開堂日未升座先於座前立曰大王大衆聽已有真正舉揚也此一會總是得聞豈有不聞者若有不聞彼此相謾去也方乃登座僧問大王請師出世未委今日一會何似靈山師曰徹古傳今問如何是和尚家風師曰毛頭顯沙界日月現其中天台國清寺師靜上座始遇玄沙示衆曰汝諸人但能一生如喪考妣吾保汝究得徹去師躡前語問曰祇如教中道不得以所知心測度如來無上知見又作麼生沙曰汝道究得徹底所知心還測度得及否師從此信入後居天台三十餘載不下山博綜三學操行孤立禪寂之餘常閲龍藏遐邇欽重時謂大靜上座嘗有人問弟子每當夜坐心念紛飛未明攝伏之方願垂示誨師曰如或夜間安坐心念紛飛却將紛飛之心以究紛飛之處究之無處則紛飛之念何存反究究心則能究之心安在又能照之智本空所緣之境亦寂寂而非寂者蓋無能寂之人也照而非照者蓋無所照之境也境智俱寂心慮安然外不尋枝內不住定二途俱泯一性怡然此乃還源之要道也師因覩教中幻義乃述一偈問諸學流曰若道法皆如幻有造諸過惡應無咎云何所作業不忘而藉佛慈興接誘時有小靜上座答曰幻人興幻幻輪圍幻業能招幻所治不了幻生諸幻苦覺知如幻幻無為二靜上座竝終於本山長慶稜禪師法嗣泉州招慶院道𭅕禪師潮州人也稜和尚始居招慶師乃入室參侍遂作桶頭常與衆僧語話一日慶見乃曰爾每日口嘮嘮底作麼師曰一日不作一日不食慶曰與麼則磨弓錯箭去也師曰專待尉遲來慶曰尉遲來後如何師曰教伊筋骨遍地眼睛突出慶便出去洎慶被召師繼踵住持上堂聲前薦得孤負平生句後投機殊乖道體為甚麼如此大衆且道從來合作麼生又曰招慶與諸人一時道却還委落處麼時有僧出曰大衆一時散去還稱師意也無師曰好與二十拄杖僧禮拜師曰雖有盲龜之意且無曉月之程曰如何是曉月之程師曰此是盲龜之意問如何是沙門行師曰非行不行問如何是西來意師曰蚊子上鐵牛問如何是在匣劒師良久僧罔措師曰也須感荷招慶始得問如何是提宗一句師曰不得昧著招慶其僧禮拜起師又曰不得昧著招慶囑汝作麼生是提宗一句僧無對問文殊劒下不承當時如何師曰未是好手人曰如何是好手人師曰是汝話墮也問如何是招慶家風師曰寧可清貧自樂不作濁富多憂問如何是南泉一線道師曰不辭向汝道恐較中更較去問如何是佛法大意師曰七顛八倒問學人根思遲回乞師曲運慈悲開一線道師曰這箇是老婆心曰悲華剖坼以領尊慈從上宗乘事如何師曰恁麼須得汝親問始得問僧甚處去來曰劈柴來師曰還有劈不破底也無曰有師曰作麼生是劈不破底僧無語師曰汝若道不得問我我與汝道曰作麼生是劈不破底師曰賺殺人師拈鉢囊問僧你道直幾錢僧無對歸宗柔代云留與人增價因地動僧問還有不動者也無師曰有曰如何是不動者師曰動從東來却歸西去問法雨普霑還有不潤處否師曰有曰如何是不潤處師曰水灑不著問如何是招慶深深處師曰和汝沒却問如何是九重城裏人師曰還共汝知聞麼上堂次大衆擁法座而立師曰這裏無物諸人苦恁麼相促相拶作麼擬心早沒交涉更上門上戶千里萬里今既上來各著精彩招慶一時拋與諸人好麼乃曰還接得也無衆無對師曰勞而無功便升座復曰汝諸人得恁麼鈍看他古人一兩箇得恁麼快才見便負將去也較些子若有此箇人非但四事供養便以琉璃為地白銀為壁亦未為貴帝釋引前梵王隨後攪長河為酥酪變大地作黃金亦未為足直得如是猶更有一級在還委得麼珍重婺州報恩院寶資曉悟禪師僧問學人初心請師示箇入路師遂側掌示之曰還會麼曰不會師曰獨掌不浪鳴問如何是報恩家風師曰也知闍黎入衆日淺問古人拈槌竪拂意旨如何師曰報恩截舌有分僧曰為甚麼如此師曰屈著作麼問如何是文殊劒師曰不知曰秖如一劒下活得底人作麼生師曰山僧秖管二時齊粥問如何是觸目菩提師曰背後是甚麼立地曰學人不會乞師再示師提拄杖曰汝不會合喫多少拄杖問如何是具大慙愧底人師曰開口取合不得曰此人行履如何師曰逢茶即茶逢飯即飯問如何是金剛一隻箭師曰道甚麼僧再問師曰過新羅國去也問波騰鼎沸起必全真未審古人意如何師乃叱之曰恁麼則非次也師曰你話墮也又曰我話亦墮汝作麼生僧無對問去却賞罰如何是吹毛劒師曰延平屬劒州曰恁麼則喪身失命去也師曰錢塘江裏潮處州翠峰從欣禪師上堂曰更不展席也珍重便歸方丈却問侍者還會麼曰不會師曰將謂汝到百丈來襄州鷲嶺明遠禪師初參長慶慶問汝名甚麼師曰明遠慶曰那邊事作麼生師曰明遠退兩步慶曰汝無端退兩步作麼師無語慶曰若不退步爭知明遠師乃諭旨住後向火次僧問無一法當前應用無虧時如何師以手卓火其僧於此有省杭州龍華寺彥球實相得一禪師開堂日謂衆曰今日既升法座又爭解諱得秖如不諱底事此衆還有人與作證明麼若有即出來相共作箇榜樣僧問此座為從天降下為從地涌出師曰是甚麼曰此座高廣如何升得師曰今日幾被汝安頓著問靈山一會迦葉親聞今日一會何人得聞師曰同我者擊其大節曰灼然俊哉師曰去搬水漿茶堂裏用去師復曰從前佛法付囑國王大臣及有力檀越今日郡尊及諸官僚特垂相請不勝荷愧山僧更有末後一句子賤賣與諸人師乃起身立曰還有人買麼若有人買即出來若無人買即賤貨自收去也久立珍重僧問如何是學人自己師曰雪上更加霜杭州保安連禪師僧問如何是保安家風師曰問有甚麼難問如何是吹毛劒師曰豫章鐵柱堅曰學人不會師曰漳江親到來問如何是沙門行師曰師僧頭上戴冠子問如何是西來意師曰死虎足人看問一問一答彼此興來如何是保安不驚人之句師曰汝到別處作麼生舉福州報慈院光雲慧覺禪師上堂瘥病之藥不假驢駝若據如今各自歸堂去珍重問僧近離甚處曰臥龍師曰在彼多少時曰經冬過夏師曰龍門無宿客為甚在彼許多時曰師子窟中無異獸師曰汝試作師子吼看曰若作師子吼即無和尚師曰念汝新到放汝三十棒問承聞超覺有鎖口訣如何示人師曰賴我拄杖不在手曰恁麼則深領尊慈也師曰待我肯汝即得閩王問報慈與神泉相去近遠師曰若說近遠不如親到師却問大王日應千差是甚麼心王曰甚麼處得心來師曰豈有無心者王曰那邊事作麼生師曰請向那邊問王曰大師謾別人即得問大衆臻湊請師舉揚師曰更有幾人未聞曰恁麼則不假上來也師曰不上來且從汝向甚麼處會曰若有處所即孤負和尚去也師曰秖恐不辨精麁問夫說法者當如法說此意如何師曰有甚麼疑訛問古人面壁意旨如何師便打問不假言詮請師徑直師曰何必更待商量廬山開先寺紹宗圓智禪師姑蘇人也江南李主巡幸洪井入山瞻謁請上堂令僧問如何是開先境師曰最好是一條界破青山色曰如何是境中人師曰拾枯柴煮布水國主益加欽重後終於本山靈塔存焉杭州傾心寺法瑫宗一禪師上堂良久曰大衆不待一句語便歸堂去還有紹繼宗風分也無還有人酬得此問麼若有人酬得這裏與諸人為怪笑若酬不得諸人與這裏為怪笑珍重僧問如何朴實免見虗頭師曰汝問若當衆人盡鑒曰有恁麼來皆不丈夫祇如不恁麼來還有紹繼宗風分也無師曰出兩頭致一問來曰甚麼人辨得師曰波斯養兒問佛法去處乞師全示師曰汝但全致一問來曰為甚麼却拈此問去師曰汝適來問甚麼曰若不遇於師幾成走作師曰賊去後關門問別傳一句如何分付師曰可惜許曰恁麼則別酬亦不當去也師曰也是間辭問如何是不朝天子不羡王侯底人師曰每日三條線長年一衲衣曰未審此人還紹宗風也無師曰鵲來頭上語雲向眼前飛問承古有言不斷煩惱此意如何師曰又是發人業曰如何得不發業師曰你話墮也問請去賞罰如何是吹毛劒師曰如法禮三拜師後住龍冊寺歸寂福州水陸院洪儼禪師上堂大衆集定師下座捧香爐巡行大衆前曰供養十方諸佛便歸方丈僧問離却百非兼四句請師盡力與提綱師曰落在甚麼處曰恁麼則人天有賴去也師曰莫將惡水潑人好杭州靈隱山廣嚴院咸澤禪師初參保福福問汝名甚麼師曰咸澤福曰忽遇枯涸者如何師曰誰是枯涸者福曰我是師曰和尚莫謾人好福曰却是汝謾我師後承長慶印記住廣嚴道場今法安院僧問如何是覿面相呈事師下禪牀曰伏惟尊體起居萬福問不與萬法為侶者是甚麼人師曰城中青史樓雲外高峰塔問如何是佛法大意師曰幽㵎泉清高峰月白問如何是廣嚴家風師曰一塢白雲三間茆屋曰畢竟如何師曰既無維那兼少典座問如何是廣嚴家風師曰師子石前靈水響雞籠山上白猿啼福州報慈院慧朗禪師上堂從上諸聖為一大事因緣故出現於世遞相告報是汝諸人還會麼若不會大不容易僧問如何是一大事師曰莫錯相告報麼曰恁麼則學人不疑也師曰爭奈一翳在目問三世諸佛盡是傳語人未審傳甚麼人語師曰聽曰未審是甚麼語師曰你不是鍾期問如何是學人眼師曰不可更撒沙福州長慶常慧禪師僧問王侯請命法嗣怡山鎖口之言請師不謬師曰得曰恁麼則深領尊慈師曰莫鈍置人好問不犯宗風不傷物義請師滿口道師曰今日豈不是開堂問𦦨續雪峰印傳超覺不違於物不負於人不在當頭即今何道師曰違負即道曰恁麼則善副來言淺深已辨師曰也須識好惡福州石佛院靜禪師上堂若道素面相呈猶添脂粉縱離添過猶有負𠍴諸人且作麼生體悉僧問學人欲見和尚本來面目師曰洞上有言親體取曰恁麼則不得見去也師曰灼然客路如天遠侯門似海深福州枕峰觀音院清換禪師上堂諸禪德若要論禪說道舉唱宗風祇如當人分上以一毛端上有無量諸佛轉大法輪於一塵中現寶王剎佛說衆生說山河大地一時說未嘗間斷如毗沙門王始終不求外寶既各有如是家風阿誰缺少不可更就別人處分也僧問如何是法界性師曰汝身中有萬象曰如何體得師曰虗谷尋聲更求本末福州東禪契訥禪師上堂未曾暫失全體現前恁麼道亦是分外既恁麼道不得向兄弟前合作麼生道莫是無道處不受道麼莫錯會好僧問如何是現前三昧師曰何必更待道問己事未明乞師指示師曰何不禮謝問如何是東禪家風師曰一人傳虗萬人傳實福州長慶院弘辨妙果禪師上堂於座前側立曰大衆各歸堂得也未還會得麼若也未會山僧謾諸人去也遂升座僧問海衆雲臻請師開方便門示真實相師曰這箇是方便門曰恁麼則大衆側聆去也師曰空側聆作麼福州東禪院可隆了空禪師僧問如何是道師曰正是道曰如何是道中人師曰分明向汝道上堂大好省要自不仙陀若是聽響之流不如歸堂向火珍重問如何是普賢第一句師曰落第二句也福州仙宗院守玭禪師久不上堂大衆入方丈參師曰今夜與大衆同請假未審還給假也無若未聞給假即先言者負珍重僧問十二時中常在底人還消得人天供養也無師曰消不得曰為甚麼消不得師曰為汝常在曰祇如常不在底人還消得也無師曰驢年問請師答無賓主話師曰向無賓主處問將來撫州永安院懷烈淨悟禪師上堂顧視左右曰患謇作麼便歸方丈上堂良久曰幸自可憐生又被污却也上堂大衆正是著力處切莫容易僧問怡山親聞一句請師為學人道師曰向後莫錯舉似人福州閩山令含禪師上堂還恩恩滿賽願願圓便歸方丈僧問既到妙峰頂誰人為伴侶師曰到曰甚麼人為伴侶師曰喫茶去問明明不會乞師指示師曰指示且置作麼生是你明明底事曰學人不會再乞師指師曰八棒十三新羅國龜山和尚有人舉裴相國啓建法會問僧看甚麼經曰無言童子經公曰有幾卷曰兩卷公曰既是無言為甚麼却有兩卷僧無對師代曰若論無言非唯兩卷吉州資國院道殷禪師僧問如何是祖師西來意師曰普通八年遭梁怪直至如今不得雪問千山萬山如何是龍須山師曰千山萬山曰如何是山中人師曰對面千里問不落有無請師道師曰汝作麼生問福州祥光院澄靜禪師僧問如何是道師曰長安路上曰向上事如何師曰谷聲萬籟起松老五雲披問如何是和尚家風師曰門下平章事宮闈較幾重杭州報慈院從瓌禪師福州陳氏子僧問承古有言今人看古教未免心中閙欲免心中閙應須看古教如何是古教師曰如是我聞曰如何是心中閙師曰那畔雀兒聲杭州龍華寺契盈廣辨周智禪師僧問如何是龍華境師曰翠竹搖風寒松鎖月曰如何是境中人師曰切莫唐突問如何是三世諸佛道場師曰莫別瞻禮曰恁麼則亘古亘今師曰是甚麼年中太傅王延彬居士一日入招慶佛殿指鉢盂問殿主這箇是甚麼鉢主曰藥師鉢公曰祇聞有降龍鉢主曰待有龍即降公曰忽遇拏雲浪來時作麼生主曰他亦不顧公曰話墮也玄沙曰盡你神力走向甚麼處去保福曰歸依佛法僧百丈恆作覆鉢勢雲門曰他日生天莫孤負老僧長慶謂太傅曰雪峰竪拂子示僧其僧便出去若據此僧合喚轉痛與一頓公曰是甚麼心行慶曰洎合放過公到招慶煎茶朗上座與明招把銚忽翻茶銚公問茶爐下是甚麼朗曰捧爐神公曰既是捧爐神為甚麼翻却茶朗曰事官千日失在一朝公拂袖便出明招曰朗上座喫却招慶飯了却向外邊打野榸朗曰上座作麼生招曰非人得其便保福展禪師法嗣潭州延壽寺慧輪禪師僧問寶劒未出匣時如何師曰不在外曰出匣後如何師曰不在內問如何是一色師曰青黃赤白曰大好一色師曰將謂無人也有一箇半箇漳州保福可儔禪師僧問如何是和尚家風師曰雲在青天水在瓶問如何是吹毛劒師曰瞥落也曰還用也無師曰莫鬼語舒州海會院如新禪師上堂良久曰禮繁即亂便下座僧問從上宗乘如何舉唱師曰轉見孤獨曰親切處乞師一言師曰不得雪也聽他問如何是迦葉頓領底事師曰汝若領得我即不吝曰恁麼則不煩於師去也師曰又須著棒爭得不煩問牛頭橫說竪說猶未知向上關捩子如何是向上關捩師曰賴遇娘生臂短問如何是祖師意師曰要道何難曰便請師道師曰將謂靈利又不仙陀洪年漳江慧廉禪師僧問師登寶座曲為今時四衆攀瞻請師接引師曰甚麼處屈汝曰恁麼則垂慈方便路直下不孤人也師曰也須收取好問如何是漳江境師曰地藏皺眉曰如何是境中人師曰普賢斂袂問如何是漳江水師曰苦問如何是漳江第一句師曰到別處不得錯舉福州報慈院文欽禪師僧問如何是諸佛境師曰雨來雲霧暗晴乾日月明問如何是妙覺明心師曰今冬好晚稻出自秋雨成問如何是妙用河沙師曰雲生碧岫雨降青天問如何是平常心合道師曰喫茶喫飯隨時過看水看山實暢情泉州萬安院清運資化禪師僧問諸佛出世震動乾坤和尚出世未審如何師曰向汝道甚麼曰恁麼則不異諸聖去也師曰莫亂道問如何是萬安家風師曰苔羹倉米飯曰忽遇上客來將何祇待師曰飯後三巡茶問如何是萬安境師曰一塔松蘿望海青漳州報恩院道熙禪師初與保福送書上泉州王太尉尉問漳南和尚近日還為人也無師曰若道為人即屈著和尚若道不為人又屈著太尉來問太尉曰道取一句尉曰待鐵牛能齧草木馬解含煙師曰某甲惜口喫飯尉良久又問驢來馬來師曰驢馬不同途尉曰爭得到這裏師曰特謝太尉領話住後僧問明言妙句即不問請師真實道將來師曰不阻來意泉州鳳凰山從琛洪忍禪師僧問如何是和尚家風師曰門風相似即無阻矣汝不是其人曰忽遇其人時又如何師曰不可預搔待癢問學人根思遲回方便門中乞師傍瞥師曰傍瞥曰深領師旨安敢言乎師曰太多也上堂有僧出禮拜起退身立師曰我不如汝僧應諾師曰無人處放下著問如何是學人自己事師曰暗算流年事可知問如何是鳳凰境師曰雪夜觀明月問如何是西來意師曰作人醜差曰為人何在師曰莫屈著汝麼福州永隆院明慧瀛禪師上堂謂言侵早起更有夜行人似則似是即不是珍重問無為無事人為甚麼却是金鎖難師曰為斷粗纖貴重難留曰為甚麼道無為無事人逍遙實快樂師曰為閙亂且要斷送僧參師曰不要得許多般數速道速道僧無對上堂日出卯用處不須生善巧便下座僧問如何是進向得本源師曰依而行之洪州清泉山守清禪師福州人也僧問如何是佛師曰問曰如何是祖師曰答問和尚見古人得箇甚麼便住此山師曰情知汝不肯曰爭知某甲不肯師曰鑒貌辨色問親切處乞師一言師曰莫過於此問古人面壁為何事師曰屈曰恁麼則省心力去也師曰何處有恁麼人問諸餘即不問如何是向上事師曰消汝三拜不消汝三拜漳州報恩院行崇禪師僧問如何是佛法大意師曰碓搗磨磨問曹溪一路請師舉揚師曰莫屈著曹溪麼曰恁麼則羣生有賴師曰也是老鼠喫鹽問不涉公私如何言論師曰喫茶去問丹霞燒木佛意作麼生師曰時寒燒火向曰翠微迎羅漢意作麼生師曰別是一家春潭州嶽麓山和尚上堂良久曰昔日毗盧今朝嶽麓珍重僧問如何是聲色外句師曰猿啼鳥呌問師唱誰家曲宗風嗣阿誰師曰五音六律問截舌之句請師舉揚師曰日能熱月能涼朗州德山德海禪師僧問靈山一會何人得聞師曰闍黎得聞曰未審靈山說箇甚麼師曰即闍黎會問如何是該天括地句師曰十界搖動問從上宗乘以何為驗師曰從上且置即今作麼生曰大衆總見師曰話墮也問如何是祖師西來意師曰擘泉州後招慶和尚僧問末後一句請師商量師曰塵中人自老天際月常明問如何是和尚家風師曰一瓶兼一鉢到處是生涯問如何是佛法大意師曰擾擾忩忩晨雞暮鐘鼎州梁山簡禪師問僧甚處來曰藥山來師曰還將得藥來否曰和尚住山也不錯師便休洪州建山澄禪師僧問如何是法王劒師曰可惜許曰如何是人王劒師曰塵埋牀下履風動架頭巾問一代時教接引今時未審祖宗如何示人師曰一代時教已有人問了也曰和尚如何示人師曰惆悵庭前紅莧樹年年生葉不生花問故歲已去新歲到來還有不受歲者也無師曰作麼生曰恁麼則不受歲也師曰城上已吹新歲角窗前猶點舊年燈曰如何是舊年燈師曰臘月三十日泉州招慶院省僜淨修禪師初參保福福一日入大殿覩佛像乃舉手問師曰佛恁麼意作麼生師曰和尚也是橫身福曰一橛我自收取師曰和尚非唯橫身福然之後住招慶開堂升座良久乃曰大衆向後到處遇道伴作麼生舉似他若有人舉得試對衆舉看若舉得免孤負上祖亦免埋沒後來古人道通心君子文外相見還有這箇人麼況是曹溪門下子孫合作麼生理論合作麼生提唱僧問如何得不傷於己不負於人師曰莫屈著汝這問麼曰恁麼上來已蒙師指也師曰汝又屈著我作麼問當鋒一句請師道師曰嗄僧再問師曰瞌睡漢問僧近離甚處曰報恩師曰僧堂大小曰和尚試道看師曰何不待問問學人全身不會請師指示師曰還解笑得麼乃曰叢林先達者不敢相觸忤若是初心後學未信直須信取未省直須省取不用掠虗諸人本分去處未有一時不顯露未有一物解蓋覆得如今若要知不用移絲髮地不用少許工夫但向博地凡夫位中承當取豈不省心力既能省得便與諸佛齊肩依而行之緣此事是箇白淨去處今日須得白淨身心合他始得自然合古合今脫生離死古人云識心達本解無為法方號沙門如今諸官大衆各須體取好莫全推過師僧分上佛法平等上至諸佛下至一切共同此事既然如此誰有誰無王事之外亦須努力適來說如許多般蓋不得已而已莫道從上宗門合恁麼語話祇如從上宗門合作麼生還相悉麼若有人相悉山僧今日雪得去也久立大衆珍重示坐禪方便頌曰四威儀內坐為先澄濾身心漸坦然瞥爾有緣隨濁界當須莫續是天年修持祇學從功路至理寧論在那邊一切時中常管帶因緣相湊豁通玄示執坐禪者曰大道分明絶點塵何須長坐始相親遇緣儻解無非是處憒那能有故新散誕肯齊支遁侶逍遙曷與慧休鄰或遊泉石或闤闠可謂煙霞物外人福州康山契穩法寶禪師初開堂僧問威音王佛已後次第相承未審師今一會法嗣何方師曰象骨舉手龍溪點頭問圓明湛寂非師意學人因底却無明師曰辨得也未曰恁麼則識性無根去也師曰隔靴搔癢泉州西明院琛禪師僧問如何是和尚家風師曰竹箸瓦碗曰忽遇上客來時如何祇待師曰黃虀倉米飯問如何是祖師西來意師曰問取露柱看鼓山晏國師法嗣杭州天竺子儀心印水月禪師溫州樂清陳氏子初遊方謁鼓山問曰子儀三千里外遠投法席今日非時上來乞師非時答話山曰不可鈍置仁者師曰省力處如何山曰汝何費力師於此有省後回浙中錢忠懿王命開法於羅漢光福二道場上堂久立大衆更待甚麼不辭展拓却恐誤於禪德轉迷歸路時寒珍重僧問如何是從上來事師曰住曰如何薦師曰可惜龍頭翻成蛇尾有僧禮拜起將問話師曰如何且置僧乃問祇如興聖之子還有相親分也無師曰祇待局終不知柯爛問如何是維摩默師曰謗曰文殊因何讚師曰同案領過曰維摩又如何師曰頭上三尺巾手裏一枝拂問如何是諸佛出身處師曰大洋海裏一星火曰學人不會師曰燒盡魚龍問丹霞燒木佛意旨如何師曰寒即圍爐向猛火曰還有過也無師曰熱即竹林溪畔坐問如何是法界義宗師曰九月九日浙江潮問諸餘即不問如何是光福門下超毗盧越釋迦底人師曰諸餘奉納曰恁麼則平生慶幸去也師曰慶幸事作麼生僧罔措師便喝將下堂僧問下堂一句乞師分付師曰擕履已歸西國去此山空有老猿啼問鼓山有掣鼓奪旗之說師且如何師曰敗將不忍誅曰或遇良將又如何師曰念子孤魂賜汝三奠問世尊入滅當歸何所師曰鶴林空變色真歸無所歸曰未審必定何之師曰朱實殞徑風繁英落素秋曰我師將來復歸何所師曰子今欲識吾歸處東西南北柳成絲問如何修行即得與道相應師曰高卷吟中箔濃煎睡後茶建州白雲智作真寂禪師永真朱氏子容若梵僧禮鼓山披剃一日鼓山上堂召大衆衆皆回眸山披襟示之衆罔措唯師朗悟厥旨入室印證又參次山召曰近前來師近前山曰南泉喚院主意作麼生師斂手端容退身而立山莞然奇之住後上堂還有人向宗乘中致得一問來麼待山僧向宗乘中答時有僧出禮拜師便歸方丈問如何是枯木裏龍吟師曰火裏蓮生曰如何是髑髏裏眼睛師曰泥牛入海問如何是主中主師曰汝還具眼麼曰恁麼則學人歸堂去也師曰猢猻入布袋問如何是延平津師曰萬古水溶溶曰如何是延平劒師曰速須退步曰未審津與劒是同是異師曰可惜許次遷奉先僧問如何是奉先境師曰一任觀看曰如何是境中人師曰莫無禮問如何是奉先家風師曰即今在甚麼處曰恁麼則大衆有賴也師曰干汝甚麼事問如何是為人一句師曰不是奉先道不得鼓山智嚴了覺禪師上堂多言復多語由來反相誤珍重僧問石門之句即不問請師方便示來機師曰問取露柱問國王出世三邊靜法王出世有何恩師曰還會麼曰幸遇明朝輒伸呈獻師曰吐却著曰若不禮拜幾成無孔鐵鎚師曰何異無孔鐵鎚福州龍山智嵩妙虗禪師上堂幸自分明須作這箇節目作麼到這裏便成節目便成增語便成塵玷未有如許多事時作麼生僧問古佛化導今祖重興人天輻輳於禪庭至理若為於開示師曰亦不敢孤負大衆曰恁麼則人天不謬殷勤請頓使凡心作佛心師曰仁者作麼生曰退身禮拜隨衆上下師曰我識得汝也泉州鳳凰山彊禪師僧問燈傳鼓嶠道化溫陵不跨石門請師通信師曰若不是今日攔胸撞出曰恁麼則今日親聞師子吼他時終作鳳凰兒師曰又向這裏塗汙人問白浪滔天境何人住太虗師曰靜夜思堯鼓回頭聞舜琴福州龍山文義禪師上堂若舉宗乘即院寂徑荒若留委問更待箇甚麼還有人委悉麼出來驗看若無人委悉且莫掠虗好便下座問如何是人王師曰威風人盡懼曰如何是法王師曰一句令當行曰二王還分不分師曰適來道甚麼福州鼓山智嶽了宗禪師本郡人也初遊方至鄂州黃龍問久嚮黃龍及乎到來祇見赤斑蛇龍曰汝祇見赤斑蛇且不識黃龍師曰如何是黃龍龍曰滔滔地師曰忽遇金翅鳥來又作麼生龍曰性命難存師曰恁麼則被他吞却去也龍曰謝闍黎供養師便禮拜住後上堂我若全舉宗乘汝向甚麼處領會所以道古今常露體用無妨不勞久立珍重問虗空還解作用也無師拈起拄杖曰這箇師僧好打僧無語襄州定慧禪師僧問如何是佛向上事師曰無人不驚曰學人未委在師曰不妨難向問不借時機用如何話祖宗師曰闍黎還具慙愧麼僧便喝師休去福州鼓山清諤宗曉禪師僧問亡僧遷化向甚麼處去也師曰時寒不出手金陵淨德院冲煦慧悟禪師福州和氏子僧問如何是大道師曰我無小徑曰如何是小徑師曰我不知大道金陵報恩院清護崇因妙行禪師福州長樂陳氏子六歲禮鼓山披削於國師言下發明開堂日僧問諸佛出世天花亂墜和尚出世有何祥瑞師曰昨日新雷發今朝細雨飛問如何是諸佛玄旨師曰草鞋木履開寶三年示寂茶毗收舍利三百餘粒并靈骨歸於建州雞足山臥雲院建塔龍華照禪師法嗣台州瑞巖師進禪師僧問如何是瑞巖境師曰重重疊嶂南來遠北向皇都咫尺間曰如何是境中人師曰萬里白雲朝瑞嶽微微細雨灑簾前曰未審如何親近此人師曰將謂闍黎親入室元來猶隔萬重關台州六通院志球禪師僧問全身佩劒時如何師曰落曰當者如何師曰熏天炙地問如何是六通境師曰深目江山一任看曰如何是境中人師曰古今自去來曰離此二途還有向上事也無師曰有曰如何是向上事師曰雲水千徒與萬徒問擁毳玄徒請師指示師曰紅爐不墜鴈門關曰如何是紅爐不墜鴈門關師曰青霄豈吝衆人攀曰還有不知者也無師曰有曰如何是不知者師曰金榜上無名問如何是和尚家風師曰萬家明月朗問如何是第二月師曰山河大地杭州雲龍院歸禪師僧問久戰沙場為甚麼功名不就師曰過在這邊曰還有升進處也無師曰冰消瓦解杭州功臣院道間禪師僧問如何是功臣家風師曰俗人東畔立僧衆在西邊問如何是學人自己師曰如汝與我曰恁麼則無二去也師曰十萬八千福州報國院照禪師上堂我若全機汝向甚麼處摸索蓋為根器不等便成不具慚愧還委得麼如今與諸仁者作箇入底門路乃敲繩牀兩下曰還見麼還聞麼若見便見若聞便聞莫向意識裏卜度却成妄想顛倒無有出期珍重佛塔被雷霹有問祖佛塔廟為甚麼却被雷霹師曰通天作用曰既是通天作用為甚麼却霹佛師曰作用何處見有佛曰爭奈狼籍何師曰見甚麼台州白雲乃禪師僧問荊山有玉非為寶囊裏真金賜一言師曰我家本貧曰慈悲何在師曰空慙道者名翠巖參禪師法嗣杭州龍冊寺子興明悟禪師僧問正位中還有人成佛否師曰誰是衆生曰若恁麼則總成佛去也師曰還我正位來曰如何是正位師曰汝是衆生問如何是無價珍師曰卞和空抱璞曰忽遇楚王還進也無師曰凡聖相繼續問古人拈布毛意作麼生師曰闍黎舉不全曰如何舉得全師乃拈起袈裟溫州雲山佛㠗院知默禪師僧問如何是佛㠗家風師曰送客不離三步內邀賓祇在草堂前上堂山僧如今看見諸上座恁麼行腳喫辛喫苦盤山涉㵎終不為觀看州縣參尋名山勝跡莫非為此一大事如今且要諸人於本分參問中通箇消息來雲山敢與證明非但雲山證明乃至禪林佛剎亦與證明還有麼若無不如散去便下座鏡清怤禪師法嗣越州清化師訥禪師僧問十二時中如何得不疑惑去師曰好曰恁麼則得遇於師去也師曰珍重僧來禮拜師曰子亦善問吾亦善答曰恁麼則大衆久立師曰抑逼大衆作甚麼問去却賞罰如何是吹毛劒師曰錢塘江裏好渡船問如何是西來意師曰可煞新鮮衢州南禪遇緣禪師因有俗士謂之鐵腳忽騎馬至僧問師既是鐵腳為甚麼却騎馬師曰腰帶不因遮腹痛幞頭豈是禦天寒官人問師和尚恁麼後生為甚麼却為尊宿師曰千歲祇言朱頂鶴朝生便是鳳凰兒上堂此箇事得恁麼難道時有僧出曰請師道師曰睦州溪苔錦軍石耳問衆手淘金誰是得者師曰溪畔披砂徒自困家中有寶速須還曰恁麼即始終不從人得去也師曰饒君便有擎山力未免肩頭有擔胝福州資福院智遠禪師福州人也參鏡清問如何是諸佛出身處清曰大家要知師曰如斯則衆眼難瞞去也清曰理能縛豹師因此發悟玄旨住後僧問師唱誰家曲宗風嗣阿誰師曰雪嶺峰前月鏡湖波裡明問諸佛出世天雨四華地搖六動和尚今日有何祥瑞師曰一物不生全體露目前光彩阿誰知問如何是直示一句師曰是甚麼師乃曰還會麼會去即今便了不會塵沙算劫祇據諸賢分上古佛心源明露現前匝天遍地森羅萬象自己家風佛與衆生本無差別涅槃生死幻化所為性地真常不勞修證珍重衢州烏巨山儀晏開明禪師吳興許氏子於唐乾符三年將誕之夕異香滿室紅光如晝光啓中隨父鎮信安強為娶師不願遂遊歷諸方機契鏡清歸省父母乃於郭南創別舍以遂師志舍旁陳司徒廟有凜禪師像師往瞻禮失師所之後郡守展祀祠下見師入定于廟後叢竹間蟻蠹其衣敗葉沒䏶或者云是許鎮將之子也自此三昧或出或入子湖訥禪師未知師所造淺深問曰子所住定蓋小乘定耳時方啜茶師呈起橐曰是大是小訥駭然尋謁栝蒼唐山德嚴禪師嚴問汝何姓曰姓許嚴曰誰許汝曰不別嚴默識之遂與剃染嘗令摘桃浹旬不歸往尋見師攀桃倚石泊然在定嚴鳴指出之開運中遊江郎巖覩石龕謂弟子慧興曰豫入定此中汝當壘石塞門勿以吾為念興如所戒明年興意師長往啓龕視師素髮被肩胸臆尚暖徐自定起了無異容復回烏巨侍郎慎公鎮信安馥師之道命義學僧守榮詰其定相師不與之辨榮意輕之時信安人競圖師像而尊事皆獲舍利榮因愧服禮像謝𠎝亦獲舍利歎曰此後不敢以淺解測度矣錢忠懿王感師見夢遣使圖像至適王患目疾展像作禮如夢所見隨雨舍利目疾頓瘳因錫號開明及述偈讚寶器供具千計端拱初太宗皇帝聞師定力詔本州加禮津發赴闕師力辭僧再至諭旨特令肩輿入對便殿命坐賜茗咨問禪定奏對簡盡深契上旨丐歸復詔入對得請還山送車塞途淳化元年示寂壽一百十五臘五十七闍維白光屬天舍利五色人以骨塑像至今州郡雨暘禱之如嚮斯答報恩嶽禪師法嗣潭州妙濟院師浩傳心禪師僧問擬即第二頭不擬即第三首如何是第一頭師曰收問古人斷臂當為何事師曰我寧可斷臂問如何是學人眼師曰須知我好心問如何是香山劒師曰異曰還露也無師曰不忍見問如何是松門第一句師曰切不得錯舉問如何是妙濟家風師曰左右人太多問如何是佛法大意師曰兩口一無舌問如何是香山一路師曰滔滔地曰到者如何師曰息汝平生問如何是世尊密語師曰阿難亦不知曰為甚麼不知師曰莫非仙陀問如何是香山寶師曰碧眼胡人不敢定曰露者如何師曰龍王捧不起僧舉聖僧塑像被虎咬問師既是聖僧為甚麼被大蟲咬師曰疑殺天下人問如何是無慚愧底人師曰闍黎合喫棒安國禪師法嗣福州白鹿師貴禪師開堂日僧問西峽一派不異馬頭白鹿千峰何似雞足師曰大衆驗看問如何是白鹿家風師曰向汝道甚麼曰恁麼則便知時去也師曰知時底人合到甚麼田地曰不可更口喃喃也師曰放過即不可問牛頭未見四祖時百鳥銜花供養見後為甚麼不來師曰曙色未分人盡望及乎天曉也如常福州羅山義聰禪師上堂僧問如何是出窟師子師曰甚麼處不震裂曰作何音響師曰聾者不聞問手指天地唯我獨尊為甚麼却被傍觀者責師曰謂言胡鬚赤曰祇如傍觀者有甚麼長處師曰路見不平所以按劒師乃曰若有分付處羅山即不具眼若無分付處即勞而無功所以維摩昔日對文殊且問如今會也無久立珍重福州安國院從貴禪師僧問禪宮大敞法侶雲臻向上一路請師決擇師曰素非時流上堂禪之與道拈向一邊著佛之與祖是甚麼破草鞋恁麼告報莫屈著諸人麼若道屈著即且須行腳若道不屈著也須合取口始得珍重上堂直是不遇梁朝安國也謾人不過珍重僧問請師舉唱宗乘師曰今日打禾明日搬柴問牛頭未見四祖時如何師曰香爐對繩牀曰見後如何師曰門扇對露柱問如何是和尚家風師曰若問家風即答家風曰學人不問家風時作麼生師曰胡來漢去問諸餘即不問省要處乞師一言師曰還得省要也未復曰純陀獻供珍重福州怡山長慶藏用禪師上堂衆集以扇子拋向地上曰愚人謂金是土智者作麼生後生可畏不可總守愚去也還有人道得麼出來道看時有僧出禮拜退後而立師曰別更作麼生曰請和尚明鑑師曰千年桃核問如何是伽藍師曰長溪莆田曰如何是伽藍中人師曰新羅白水問如何是靈泉正主師曰南山北山問如何是和尚家風師曰齊前廚蒸南國飯午後爐煎北苑茶問法身還受苦也無師曰地獄豈是天堂曰恁麼則受苦去也師曰有甚麼罪過福州永隆院彥端禪師上堂大衆雲集師從座起作舞謂衆曰會麼對曰不會師曰山僧不捨道法而現凡夫事作麼生不會問本自圓成為甚麼却分明晦師曰汝自撿責看福州林陽瑞峰院志端禪師本州人也初參安國見僧問如何是萬象之中獨露身國舉一指其僧不薦師於是冥契玄旨乃入室白曰適來見那僧問話志端有箇省處國曰汝見甚麼道理師亦舉一指曰這箇是甚麼國然之師禮謝住後上堂舉拂子曰曹溪用不盡底時人喚作頭角生山僧拈來拂蚊子薦得乾坤陷落僧問如何是西來意師曰木馬走似煙石人趂不及問如何是禪師曰今年旱去年曰如何是道師曰冬田半折耗問如何是學人自己師與一踏僧作接勢師便與一摑僧無語師曰賺殺人問如何是迥絶人煙處佛法師曰巔山峭峙碧芬芳曰恁麼則一真之理華野不殊師曰不是這箇道理問如何是佛法大意師曰竹箸一文一雙有僧夜參師曰阿誰曰某甲師曰泉州砂糖舶上檳榔僧良久師曰會麼曰不會師曰你若會即廓清五蘊吞盡十方開寶元年八月遺偈曰來年二月二別汝暫相棄燒灰散四林免占檀那地明年正月二十八日州民競入山瞻禮師尚無恙參問如常至二月一日州牧率諸官同至山詰伺經宵二日齊罷上堂辭衆時圓應長老出問雲愁露慘大衆嗚呼請師一言未在告別師垂一足應曰法鏡不臨於此土寶月又照於何方師曰非君境界應曰恁麼則漚生漚滅還歸水師去師來是本常師長噓一聲下座歸方丈安坐至亥時問衆曰世尊滅度是何時節衆曰二月十五日子時師曰吾今日前時前言訖長往福州仙宗院明禪師上堂曰幸有如是門風何不烜赫地紹續取去若也紹得不在三界若出三界即壞三界若在三界即礙三界不礙不壞是出三界是不出三界恁麼徹去堪為佛法種子人天有賴時有僧問拏雲不假風雷便迅浪如何透得身師曰何得棄本逐末福州安國院祥禪師上堂良久失聲曰大是無端雖然如此事不得已於中若有未覯者更開方便還會麼時有僧問不涉方便乞師垂慈師曰汝問我答即是方便問應物現形如水中月如何是月師提起拂子僧曰古人為甚麼道水月無形師曰見甚麼問如何是宗乘中事師曰淮軍散後問如何是和尚家風師曰衆眼難謾睡龍溥禪師法嗣漳州保福院清豁禪師福州人也少而聰敏禮鼓山國師落髮稟具後謁大章山如庵主語具如庵主章後參睡龍龍問曰豁闍黎見何尊宿來還悟也未曰清豁嘗訪大章得箇信處龍於是上堂集衆召曰豁闍黎出來對衆燒香說悟處老僧與汝證明師出衆乃拈香曰香已拈了悟即不悟龍大悅而許之上堂山僧今與諸人作箇和頭和者默然不和者說良久曰和與不和切在如今山僧帶些子事珍重僧問家貧遭劫時如何師曰不能盡底去曰為甚麼不能盡底去師曰賊是家親曰既是家親為甚麼翻成家賊師曰內既無應外不能為曰忽然捉敗時如何師曰內外絶消息曰捉敗後功歸何所師曰賞亦未曾聞曰恁麼則勞而無功也師曰功即不無成而不處曰既是成功為甚麼不處師曰不見道太平本是將軍致不使將軍見太平問如何是西來意師曰胡人泣漢人悲師忽捨衆欲入山待滅乃遺偈曰世人休說路行難鳥道羊腸咫尺間珍重苧溪溪畔水汝歸滄海我歸山即往貴湖卓庵未幾謂門人曰吾滅後將遺骸施諸蟲蟻勿置墳塔言訖入湖頭山坐磐石儼然長往門人稟遺命延留七日竟無蟲蟻之所侵食遂就闍維散於林野金輪觀禪師法嗣南嶽金輪和尚僧問如何是金輪第一句師曰鈍漢問如何是金輪一隻箭師曰過也曰臨機一箭誰是當者師曰倒也白兆圓禪師法嗣鼎州大龍山智洪弘濟禪師僧問如何是佛師曰即汝便是曰如何領會師曰更嫌鉢盂無柄那問如何是微妙師曰風送水聲來枕畔月移山影到牀前問如何是極則處師曰懊惱三春月不及九秋光問色身敗壞如何是堅固法身師曰山花開似錦㵎水湛如藍襄州白馬山行靄禪師僧問如何是清淨法身師曰井底蝦蟇吞却月問如何是白馬正眼師曰面南看北斗安州白兆竺乾院懷楚禪師僧問如何是句句須行玄路師曰㳂路直到湖南問如何是師子兒師曰德山嗣龍潭問如何是和尚為人一句師曰與汝素無冤讐一句元在這裏曰未審在甚麼方所師曰這鈍漢蘄州四祖山清皎禪師福州王氏子僧問師唱誰家曲宗風嗣阿誰師曰楷師巖畔祥雲起寶壽峰前震法雷臨終遺偈曰吾年八十八滿頭垂白髮顒顒鎮雙峰明明千江月黃梅揚祖教白兆承宗訣日日告兒孫勿令有斷絶蘄州三角山志操禪師僧問教法甚多宗歸一貫和尚為甚麼說得許多周由者也師曰為你周由者也曰請和尚即古即今師以手敲繩牀晉州興教師普禪師僧問盈龍宮溢海藏真詮即不問如何是教外別傳底法師曰眼裏耳裏鼻裏曰祇此便是否師曰是甚麼僧便喝師亦喝問僧近離甚處曰下寨師曰還逢著賊麼曰今日捉下師曰放汝三十棒蘄州三角山真鑑禪師僧問師唱誰家曲宗風嗣阿誰師曰忽然行正令便見下堂階郢州太陽山行冲禪師僧問如何是無盡藏師良久僧無語師曰近前來僧才近前師曰去南嶽下八世黃龍機禪師法嗣洛京紫蓋善沼禪師僧問死中得活時如何師曰抱鎌刮骨熏天地炮烈棺中求託生問才生便死時如何師曰賴得覺疾眉州黃龍繼達禪師僧問如何是衲師曰針去線不回曰如何是帔師曰橫鋪四世界竪蓋一乾坤曰道滿到來時如何師曰要羹與羹要飯與飯問黃龍出世金翅鳥滿空飛時如何師曰問汝金翅鳥還得飽也無棗樹和尚第二世住問僧發足甚處曰閩中師曰俊哉曰謝師指示師曰屈哉僧作禮師曰我與麼道落在甚麼處僧無語師曰彼自無瘡勿傷之也僧參師乃問未到這裏時在甚處安身立命僧叉手近前師亦叉手近前相竝而立僧曰某甲未到此時和尚與誰竝立師指背後曰莫是伊麼僧無對師曰不獨自謾兼謾老僧僧作禮師曰正是自謾僧鉏地次見師來乃不審師曰見阿誰了便不審曰見師不問訊禮式不全師曰却是孤負老僧其僧歸舉似首座曰和尚近日可畏座曰作麼生僧舉前語座曰和尚近日可謂為人切師聞乃打首座七棒座曰某甲恁麼道未有過在亂打作麼師曰枉喫我多少鹽醬又打七棒僧辭師乃問若到諸方有人問你老僧此間法道作麼生祇對曰待問即道師曰何處有無口底佛曰祇這也還難師竪拂子曰還見麼曰何處有無眼底佛師曰祇這也還難僧繞禪牀一匝而出師曰善能祇對僧便喝師曰老僧不識子曰用識作麼師敲禪牀三下興元府玄都山澄禪師僧問喜得趨方丈家風事若何師曰西風開曉露明月正當天曰如何拯濟師曰金雞樓上一下鼓問如何是沙門行師曰一切不如嘉州黑水和尚初參黃龍便問雪覆蘆花時如何龍曰猛烈師曰不猛烈龍又曰猛烈師又曰不猛烈龍便打師於此有省即便禮拜鄂州黃龍智顒禪師僧問如何是諸佛之本源師曰即此一問是何源曰恁麼則諸佛無異去也師曰延平劒已成龍去猶有刻舟求底人眉州昌福達禪師僧問學人來問師則對不問時師意如何師曰謝師兄指示問本來則不問如何是今日事師曰師兄這問大好曰學人不會時如何師曰謾得即得問國有寶刀誰人得見師曰師兄遠來不易曰此刀作何形狀師曰要也道不要也道曰請師道師曰難逢難遇問石牛水上臥時如何師曰異中還有異妄計不浮沉曰便恁麼去時如何師曰翅天日落把土成金呂巖真人字洞賓京川人也唐末三舉不第偶於長安酒肆遇鍾離權授以延命術自爾人莫之究嘗遊廬山歸宗書鐘樓壁曰一日清間自在身六神和合報平安丹田有寶休尋道對境無心莫問禪未幾道經黃龍山覩紫雲成蓋疑有異人乃入謁值龍擊鼓升堂龍見意必呂公也欲誘而進厲聲曰座傍有竊法者呂毅然出問一粒粟中藏世界半升鐺內煮山川且道此意如何龍指曰這守尸鬼呂曰爭奈囊有長生不死藥龍曰饒經八萬劫終是落空亡呂薄訝飛劒脅之劒不能入遂再拜求指歸龍詰曰半升鐺內煮山川即不問如何是一粒粟中藏世界呂於言下頓契作偈曰棄却瓢囊摵碎琴如今不戀汞中金自從一見黃龍後始覺從前錯用心龍囑令加護後謁潭州智度覺禪師有曰余遊韶郴東下湘江今見覺公觀其禪學精明性源淳潔促膝靜坐收光內照一衲之外無餘衣一鉢之外無餘食達生死岸破煩惱殼方今佛衣寂寂兮無傳禪理懸懸兮幾絶扶而興者其在吾師乎聊作一絶奉記達者推心方濟物聖賢傳法不離真請師開說西來意七祖如今未有人明招謙禪師法嗣處州報恩契從禪師開堂升座乃曰烈士鋒前還有俊鷹俊鷂麼放一箇出來看良久曰所以道烈士鋒前少人陪雲雷擊鼓劒輪開誰是大雄師子種滿身鋒刃但出來時有僧出師曰好著精彩僧擬伸問師曰甚麼處去也僧乃問師子未出窟時如何師曰鋒鋩難擊曰出窟後如何師曰藏身無路曰欲出不出時如何師曰命似懸絲曰向去事如何師曰拶問如何是和尚家風師曰還奈何麼問十二時中如何即是師曰金剛頂上看曰恁麼則人天有賴師曰汝又誑呼人天作麼婺州普照瑜禪師上堂三十年後大有人向這裏亡鋒結舌去在良久曰還會麼灼然若不是真師子兒爭識得上來之機時有僧問師子未出窟時如何師曰衆獸徒然曰出窟後如何師曰狐絶萬里曰欲出不出時如何師曰當衝者喪曰向去事如何師曰決在臨鋒僧禮拜師有頌曰決在臨鋒處天然師子機嚬呻出三界非祖莫能知婺州雙溪保初禪師上堂未透徹不須呈十方世界廓然明孤峰頂上通機照不用看他北斗星僧問九夏靈峰劒請師不露鋒師曰未拍金鎖前何不問曰千般徒設用難出髑髏前師曰背後礙殺人處州涌泉究禪師上堂良久曰還有虎狼禪客麼有則放出一箇來僧才出師曰還知喪命處麼曰學人咨和尚師曰甚麼處去也曰師子未出窟時如何師曰抖㖃地曰出窟後如何師曰蓋天蓋地曰欲出不出時如何師曰一切人辨不得曰向去事如何師曰俊鷂亦迷蹤衢州羅漢義禪師上堂衆集僧才出師曰不是好底僧禮拜起問龍泉寶劒請師揮師曰甚麼處去也曰恁麼則龍溪南面盡鋒鋩師曰收取問不落古今請師道師曰還怪得麼曰猶落古今師曰莫錯羅漢琛禪師法嗣襄州清溪山洪進禪師在地藏時居第一座一日地藏上堂二僧出禮拜藏曰俱錯二僧無語下堂請益修山主修曰汝自巍巍堂堂却禮拜擬問他人豈不是錯師聞之不肯修乃問未審上座又作麼生師曰汝自迷暗焉可為人修憤然上方丈請益藏指廊下曰典座入庫頭去也修乃省過又一日師問修山主曰明知生是不生之理為甚麼為生死之所流修曰筍畢竟成竹去如今作篾使還得麼師曰汝向後自悟去在修曰某所見祇如此上座意旨又如何師指曰這箇是監院房那箇是典座房修即禮謝住後僧問衆盲摸象各說異端忽遇明眼人又作麼生師曰汝但舉似諸方師經行次衆僧隨從乃謂衆曰古人有甚麼言句大家商量時有從上座出衆擬問次師曰這沒毛驢渙然省悟升州清涼院休復悟空禪師北海王氏子幼出家十九納戒嘗自謂曰苟尚能詮則為滯筏將趣凝寂復患墮空既進退莫決捨二何之乃參尋宗匠依地藏經年不契直得成病入涅槃堂一夜藏去看乃問復上座安樂麼師曰某甲為和尚因緣背藏指燈籠曰見麼師曰見藏曰祇這箇也不背師於言下有省後修山主問訊地藏乃曰某甲百劫千生曾與和尚違背來此者又值和尚不安藏遂竪起拄杖曰祇這箇也不背師忽然契悟後繼法眼住崇壽江南國主創清涼道場延請居之上堂古聖才生下便周行七步目顧四方云天上天下唯我獨尊他便有這箇方便奇特祇如諸上座初生下時有甚麼奇特試舉看若道無即對面諱却若道有又作麼生通得箇消息還會麼上座幸然有奇特事因甚麼不知去珍重僧問如何是佛師曰汝是衆生曰還肯也無師曰虗施此問問如何是西來意師曰汝道此土還有麼問省要處乞師一言師曰珍重問如何是道師曰本來無一物何處有塵埃僧禮拜師曰莫錯會問如何是一塵入正受師曰色即空曰如何是諸塵三昧起師曰空即色問諸餘即不問如何是悟空一句師曰兩句也問牛頭未見四祖時為甚麼百鳥銜華師曰未見四祖曰見後為甚麼不銜華師曰見四祖問如何是自己事師曰幾處問人來問古人得箇甚麼即便休歇去師曰汝得箇甚麼即不休歇去問如何是學人出身處師曰千般比不得萬般況不及曰請和尚道師曰古亦有今亦有問如何是亡僧面前觸目菩提師曰問取髑髏後人問毒龍奮迅萬象同然時如何師曰你甚麼處得這箇問頭問忠座主講甚麼經曰法華經師曰若有說法華經處我現寶塔當為證明大德講甚麼人證明忠無對法燈代云謝和尚證明天福八年十月朔日遣僧命法眼禪師至囑付訖又致書辭國主取三日夜子時入滅國主令本院至時擊鐘及期大衆普集師端坐警衆曰無棄光影語絶告寂時國主聞鏡登高臺遙禮深加哀慕仍致祭茶毗收舍利建塔撫州龍濟紹修禪師初與法眼同參地藏所得謂已臻極暨同辭至建陽途中談次眼忽問古人道萬象之中獨露身是撥萬象不撥萬象師曰不撥眼曰說甚麼撥不撥師懵然不知却回地藏藏問子去未久何以却來師曰有事未決豈憚跋涉山川藏曰汝跋涉許多山川也還不惡師未喻旨乃問古人道萬象之中獨露身意旨如何藏曰汝道古人撥萬象不撥萬象師曰不撥藏曰兩箇也師駭然沈思而却問未審古人撥萬象不撥萬象藏曰汝喚甚麼作萬象師方省悟再辭地藏覲于法眼眼語意與地藏開示前後如一師後居龍濟山不務聚徒而學者奔至上堂具足凡夫法凡夫不知具足聖人法聖人不會聖人若會即是凡夫凡夫若知即是聖人此兩語一理二義若人辨得不妨於佛法中有箇入處若辨不得莫道不疑好珍重僧問見色便見心露柱是色如何是心師曰幸然未會且莫詐明頭問如何得出三界師曰是三界則一任出曰不是三界又如何師曰甚麼處不是三界問當陽舉唱誰是委者師曰非汝不委問如何是萬法主師曰把將萬法來問承古有言須彌納芥子芥子納須彌如何是須彌師曰穿破汝心曰如何是芥子師曰塞却汝眼曰如何納得師曰把將須彌與芥子來曰前言何在師曰前有甚麼言問僧甚處來曰翠巖師曰翠巖有何言句示徒曰尋常道出門逢彌勒入門見釋迦師曰與麼道又爭得曰和尚又如何師曰出門逢阿誰入門見甚麼僧於言下有省上堂聲色不到處病在見聞言詮不及處過在唇吻僧問離却聲色請和尚道師曰聲色裏問將來問如何是學人心師曰阿誰恁麼問問劫火洞然大千俱壞未審這箇還壞也無師曰不壞曰為甚麼不壞師曰為同於大千上堂卷簾除却障閉戶生窒礙祇這障與礙古今無人會會得是障礙不會不自在問巨夜之中以何為眼師曰暗問纖毫不隔為甚麼之不見師曰作家弄影漢問古鏡未磨時如何師曰照破天地曰磨後如何師曰黑漆漆地問如何是普眼師曰纖毫不見曰為甚麼不見師曰為伊眼太大問如何是大敗壞底人師曰劫壞不曾遷曰此人還知有佛法也無師曰若知有佛法渾成顛倒曰如何得不顛倒去師曰直須知有佛法曰如何是佛法師曰大敗壞問如何是學人常在底心師曰還曾問荷玉麼曰學人不會師曰若不會夏末了問取曹山去師有頌曰風動心搖樹雲生性起塵若明今日事昧却本來人又欲識解脫道諸法不相到眼耳絶見聞聲色閙浩浩又初心未入道不得閙浩浩鐘聲裏薦取鼓聲裏顛倒又諸佛不出世四十九年說祖師不西來少林有妙訣又萬法是心光諸緣唯性曉本無迷悟人祇要今日了潞府延慶院傳殷禪師僧問見色便見心燈籠是色那箇是心師曰汝不會古人意曰如何是古人意師曰燈籠是心問若能轉物即同如來未審轉甚麼物師曰道甚麼僧擬進語師曰這漆桶衡嶽南臺守安禪師僧問人人盡有長安路如何得到師曰即今在甚麼處問寂寂無依時如何師曰寂寂底聻因示頌曰南臺靜坐一爐香終日凝然萬慮亡不是息心除妄想都緣無事可思量杭州天龍寺清慧秀禪師上堂諸上座多少無事十二時中在何世界安身立命且子細點檢看何不覓箇歇處因甚麼却與別人點檢若恁麼去早落第二頭也時有僧問承師有言恁麼去早落第二頭學人總不恁麼上來如何辨白師曰汝却作家曰恁麼則今日得遇於師也師曰且莫詐明頭天龍機禪師法嗣高麗雪嶽令光禪師僧問如何是和尚家風師曰分明記取問如何是諸法之根源師曰謝指示仙宗符禪師法嗣福州仙宗洞明真覺禪師僧問拏雲不假風雷便濬浪如何透得身師曰何得棄本逐末泉州福清行欽廣法禪師上堂還有人鑑得麼若有人鑑得是甚麼湖裏破草鞋若也鑑不出落地作金聲無事久立僧問如何是佛法大意師曰諸上座大家道取問如何是談真逆俗師曰客作漢問甚麼曰如何是順俗違真師曰喫茶去問如何是然燈前師曰然燈後曰如何是然燈後師曰然燈前曰如何是正然燈師曰喫茶去問如何是第二月師曰汝問我答國泰禪師法嗣婺州齊雲寶勝禪師僧問如何是齊雲水師曰龍潭常徹底擬問即波瀾曰莫祇這箇便是麼師曰古殿無香煙誰人辨清濁曰未審深深處如何師曰闍黎欲識深深處直須腳下絶雲生白龍希禪師法嗣福州廣平玄旨禪師上堂還有人證明麼若有人證明亦免孤負上祖埋沒後來若是尋言數句大藏分明若是祖宗門中怪及甚麼處恁麼道亦是傍瞥之辭僧問如何是廣平境師曰地負名山秀溪連海水清曰如何是境中人師曰汝問我答問如何是法身體師曰廓落虗空絶玷瑕曰如何是體中物師曰一輪明月散秋江曰未審體與物分不分師曰適來道甚麼曰恁麼則不分也師曰穿耳胡僧笑點頭福州升山白龍清慕禪師僧問如何是白龍密用一機師曰汝每日用甚麼曰恁麼則徒勞側聆師喝曰出去問一切衆生日用而不知如何是日用底師曰別祇對你爭得問不責上來聲前一句請師道師曰莫是不辨麼福州靈峯志恩禪師僧問如何是吹毛劒師曰我進前汝退後曰恁麼則學人喪身命去也師曰不打水魚自驚問如何是佛師曰更是阿誰曰既然如此為甚麼迷妄有差殊師曰但自不亡羊何須泣岐路問如何是靈峰境師曰萬疊青山如飣出兩條緑水若圖成曰如何是境中人師曰明明密密密密明明福州東禪玄亮禪師僧問本無迷悟為甚麼却有佛有衆生師曰話墮也問祖祖相傳傳法印師今繼嗣嗣何人師曰特謝證明曰恁麼則白龍當時親授記今日應聖度迷津師曰汝莫錯認定盤星漳州報劬院玄應定慧禪師泉州晉江吳氏子漳州刺史陳文皓創院請師開法僧問如何是第一義師曰如何是第一義曰學人請益師何以倒問學人師曰汝適來請益甚麼曰第一義師曰汝謂之倒問邪問如何是古佛道場師曰今夏堂中千五百僧開寶八年將順世先七日書辭陳公仍示偈曰今年六十六世壽有延促無生火熾然有為薪不續出谷與歸源一時俱備足及期誠門人曰吾滅後不得以喪服哭泣言訖而寂招慶𭅕禪師法嗣泉州報恩院宗顯明慧禪師僧問昔日靈山一會迦葉親聞未審今日誰是聞者師曰却憶七葉巖中尊問昔日覺城東際象王回旋五衆咸臻今日太守臨筵如何提接師曰眨上眉毛著曰恁麼則一機顯處萬緣喪盡師曰何必繁辭問如何是西來意師曰日裏看鴟毛問學人都致一問請師道師曰不是創住這箇師僧也難容問離四句絶百非請師道師曰青紅花滿庭問不涉思量處從上宗乘請師直道師良久僧曰恁麼則聽響之流徒勞側耳師曰早是粘泥問如何是人王師曰奉對不敢造次曰如何是法王師曰莫孤負好曰未審人王與法王對談何事師曰非汝所聆金陵龍光院澄禪師廣州人也新到參師問甚處來曰江南來師曰汝還禮拜渡江船子麼曰和尚為甚麼教某禮拜渡江船子師曰是汝善知識永興北院可休禪師僧問如何是西來意師曰遍滿天下曰莫便是也無師曰是即牢收取問大作業底人來師還接否師曰不接曰為甚麼不接師曰幸是好人家男女郴州太平院清海禪師僧問古人道不從請益得祖師為甚麼道誰得作佛師曰悟了方知問從上宗乘次第指授未審今日如何舉唱師曰透出白雲深洞裏名華異草嶺頭生連州慈雲慧深普廣禪師僧問匿王請佛既奉法於當時我后延師蓋興宗於此日幸施方便無吝舉揚師曰不煩再問問如何是大圓鏡師曰著問如何是向上事師曰分明聽取郢州興陽山道欽禪師僧問如何是興陽境師曰松竹乍栽山影緑水流穿過院庭中問如何是佛師曰更是甚麼報恩資禪師法嗣處州福林澄禪師僧問如何是伽藍師曰沒幡幀曰如何是伽藍中人師曰瞻禮有分問下堂一句請師不吝師曰間吟唯憶龐居士天上人間不可陪翠峰欣禪師法嗣處州報恩守真禪師僧問如何是佛法大意師曰閃爍烏飛急奔騰兔走頻鷲嶺遠禪師法嗣襄州鷲嶺通禪師僧問世尊得道地神報虗空神和尚得道未審甚麼人報師曰謝汝報來龍華球禪師法嗣杭州仁王院俊禪師僧問古人道向上一路千聖不傳如何是不傳底事師曰向上問將來曰恁麼則上來不當去也師曰既知如是踏步上來作甚麼酒仙遇賢禪師姑蘇長洲林氏子母夢吞大珠而孕生多異祥貌偉怪口容雙拳七歲嘗沈大淵而衣不潤遂去家師嘉禾永安可依三十剃染圓具往參龍華發明心印回居明覺院唯事飲酒醉則成歌頌警道俗因號酒仙偈曰緑水紅桃華前街後巷走百餘遭張三也識我李四也識我識我不識我兩箇拳頭那箇大兩箇之中一箇大曾把虗空一𭣟破摩挲令教却恁麼拈取須彌枕頭臥楊子江頭浪最深行人到此盡沈吟他時若到無波處還似有波時用心金斝又聞泛玉山還報頽莫教更漏促趂取月明回貴買朱砂畫月算來枉用工夫醉臥緑楊陰下起來強說真如泥人再三叮囑莫教失却衣珠一六二六其事已足一九二九我要喫酒長伸兩腳眠一𮄔起來天地還依舊門前緑樹無啼鳥庭下蒼苔有落花聊與東風論箇事十分春色屬誰家秋至山寒水冷春來柳緑花紅一點動隨萬變江村煙雨濛濛有不有空不空笊籬撈取西北風生在閻浮世界人情幾多愛惡祇要喫些酒子所以倒街臥路死後却産娑婆不願超生淨土何以故西方淨土且無酒酟師於祥符二年上元凌晨浴罷就室合拳右舉左張其口而化延壽輪禪師法嗣廬山歸宗道詮禪師吉州劉氏子僧問承聞和尚親見延壽來是否師曰山前麥熟也未問九峰山中還有佛法也無師曰有曰如何是九峰山中佛法師曰石頭大底大小底小尋屬江南國絶僧徒例試經業師之衆並習禪觀乃述一喝聞于州牧曰此擬忘言合太虗免教和氣有親疏誰知道德全無用今日為僧貴識書州牧閲之與僚佐議曰旃檀林中必無雜樹唯師一院特奏免試南康知軍張南金具疏集道俗迎請坐歸宗道場僧問如何是歸宗境師曰千邪不如一直問如何是佛師曰待得雪消後自然春到來問深山巖谷中還有佛法也無師曰無曰佛法遍在一切處為甚麼却無師曰無人到問古人道不是風動不是幡動時如何師曰來日路口有市問如何是學人自己師曰牀窄先臥粥稀後坐雍熙二年順寂塔于牛首庵潭州龍興裕禪師僧問如何是學人自己師曰張三李四曰比來問自己為甚麼却道張三李四師曰汝且莫草草問諸餘即不問如何是和尚家風師曰家風即且置阿那箇是汝不問底諸餘保福儔禪師法嗣漳州隆壽無逸禪師開堂升座良久曰諸上座若是上根之士早已掩耳中下之流競頭側聽雖然如此猶是不得已而言諸上座他時後日到處有人問著今日事且作麼生舉似他若也舉得舌頭鼓論若也舉不得如無三寸且作麼生舉大龍洪禪師法嗣鼎州大龍山景如禪師僧問如何是佛法大意師便喝僧曰尊意如何師曰會麼曰不會師又喝問太陽一皓人皆羡鼓聲絶罷意如何師曰季秋凝後好晴天鼎州大龍山楚勛禪師上堂良久曰大衆祇恁麼各自散去已是重宣此義了也久立又奚為然久立有久立底道理知了經一小劫如一食頃不知便見茫然還知麼有知者出來大家相共商量僧出提坐具曰展即遍周沙界縮即絲髮不存展即是不展即是師曰你從甚麼處得來曰恁麼則展去也師曰沒交涉問如何是大龍境師曰諸方舉似人曰如何是境中人師曰你為甚麼謾我問亡僧遷化向甚麼處去師曰阿彌陀佛問善法堂中師子吼未審法嗣嗣何人師曰猶自恁麼問興元府普通院從善禪師僧問法輪再轉時如何師曰助上座喜曰合談何事師曰異人掩耳曰便恁麼領會時如何師曰錯問佩劒叩松關時如何師曰莫亂作曰誰不知有師曰出白馬靄禪師法嗣襄州白馬智倫禪師僧問如何是佛師曰真金也須失色問如何是和尚出身處師曰牛抵墻曰學人不會意旨如何師曰已成八字白兆楚禪師法嗣唐州保壽祐禪師僧問如何是佛法大意師曰近前來僧近前師曰會麼曰不會師曰石火電光已經塵劫問如何是為人底一句師曰開口入耳曰如何理會師曰逢人告人南嶽下九世黃龍達禪師法嗣眉州黃龍禪師僧問如何是密室師曰斫不開曰如何是密室中人師曰非男女相問國內按劒者是誰師曰昌福曰忽遇尊貴時如何師曰不遺清溪進禪師法嗣相州天平山從禪師僧問如何得出三界師曰將三界來與汝出問如何是和尚家風師曰顯露地問如何是佛師曰不指天地曰為甚麼不指天地師曰唯我獨尊問如何是天平師曰八凹九凸問洞深杳杳清溪水飲者如何不升墜師曰更夢見甚麼問大衆雲集合談何事師曰香煙起處森羅見廬山圓通緣德禪師臨安黃氏子事本邑東山勤老宿剃染遍遊諸方江南國主於廬山建院請師開法上堂諸上座明取道眼好是行腳本分事道眼若未明有甚麼用處祇是移盤喫飯漢道眼若明有何障礙若未明得強說多端也無用處無事切須尋究僧問如何是四不遷師曰地水火風問如何是古佛心師曰水鳥樹林曰學人不會師曰會取學人問久負沒絃琴請師彈一曲師曰負來多少時也曰未審作何音調師曰話墮也珍重問如何是佛法大意師曰過去燈明佛本光瑞如是本朝遣帥問罪江南後主納土矣而胡則者據守九江不降大將軍曹翰部曲渡江入寺禪者驚走師淡坐如平日翰至不起不揖翰怒訶曰長老不聞殺人不眨眼將軍乎師熟視曰汝安知有不懼生死和尚邪翰大奇增敬而已曰禪者何為而散師曰擊鼓自集翰遣校擊之禪無至者翰曰不至何也師曰公有殺心故爾師自起擊之禪者乃集翰再拜問決勝之䇿師曰非禪者所知也太平興國二年十月七日升堂曰脫離世緣乃在今日囑令門人壘青石為塔乃曰他日塔作紅色吾再至也言訖而逝諡道濟禪師清涼復禪師法嗣升州奉先寺慧同淨照禪師魏府張氏子僧問教中道唯一堅密身一切塵中見又道佛身充滿於法界普見一切羣生前於此二途請師說師曰唯一堅密身一切塵中見問如何是古佛心師曰汝擬阿那箇不是問如何是常在底人師曰更問阿誰龍濟修禪師法嗣河東廣原禪師僧問如何是佛法大意師曰聽取一偈剎剎現形儀塵塵具覺知性源常鼓浪不悟未曾移南臺安禪師法嗣襄州鷲嶺善美禪師僧問如何是鷲嶺境師曰峴山對碧玉江水往南流曰如何是境中人師曰有甚麼事問百川異流還歸大海未審大海有幾滴師曰汝還到海也未曰到海後如何師曰明日來向汝道歸宗詮禪師法嗣瑞州九峰義詮禪師僧問如何是祖師西來意師曰有力者負之而趨隆壽逸禪師法嗣隆壽法騫禪師泉州施氏子漳州刺史陳洪銛請開法上堂今日隆壽出世三世諸佛森羅萬象同時出世同時轉法輪諸人還見麼僧問如何是隆壽境師曰無汝插足處曰如何是境中人師曰未識境在有僧來參次日請問心要師曰昨日相逢序起居今朝相見事還如如何却覓呈心要心要如何特地踈
