body:
  text: 南嶽下三世百丈海禪師法嗣洪州黃檗希運禪師閩人也幼於本州黃檗山出家額間隆起如珠音辭朗潤志意沖淡後遊天台逢一僧與之言笑如舊相識熟視之目光射人乃偕行屬澗水暴漲捐笠植杖而止其僧率師同渡師曰兄要渡自渡彼即褰衣躡波若履平地回顧曰渡來渡來師曰咄這自了漢吾早知當斫汝脛其僧歎曰真大乘法器我所不及言訖不見師後遊京師因人啓發乃往參百丈丈問巍巍堂堂從何方來師曰巍巍堂堂從嶺南來丈曰巍巍堂堂當為何事師曰巍巍堂堂不為別事便禮拜問曰從上宗乘如何指示丈良久師曰不可教後人斷絶去也丈曰將謂汝是箇人乃起入方丈師隨後入曰某甲特來丈曰若爾則他後不得孤負吾丈一日問師甚麼處去來曰大雄山下採菌子來丈曰還見大蟲麼師便作虎聲丈拈斧作斫勢師即打丈一摑丈吟吟而笑便歸上堂曰大雄山下有一大蟲汝等諸人也須好看百丈老漢今日親遭一口師在南泉普請擇菜次泉問甚麼處去曰擇菜去泉曰將甚麼擇師竪起刀泉曰祇解作賓不解作主師以刀點三下泉曰大家擇菜去泉一日曰老僧有牧牛歌請長老和師曰某甲自有師在師辭南泉泉門送提起師笠曰長老身材沒量大笠子大小生師曰雖然如此大千世界總在裏許泉曰王老師聻師戴笠便行師在鹽官殿上禮佛次時唐宣宗為沙彌問曰不著佛求不著法求不著僧求長老禮拜當何所求師曰不著佛求不著法求不著僧求常禮如是事彌曰用禮何為師便掌彌曰大粗生師曰這裏是甚麼所在説粗説細隨後又掌裴相國鎮宛陵建大禪苑請師説法以師酷愛舊山還以黃檗名之公一日拓一尊佛於師前跪曰請師安名師召曰裴休公應諾師曰與汝安名竟公禮拜師因有六人新到五人作禮中一人提起坐具作一圓相師曰我聞有一隻獵犬甚惡僧曰尋羺羊聲來師曰羺羊無聲到汝尋曰尋羺羊迹來師曰羺羊無迹到汝尋曰尋羺羊蹤來師曰羺羊無蹤到汝尋曰與麼則死羺羊也師便休去明日升堂曰昨日尋羺羊僧出來僧便出師曰昨日公案未了老僧休去你作麼生僧無語師曰將謂是本色衲僧元來祇是義學沙門便打趂出師一日揑拳曰天下老和尚總在這裏我若放一線道從汝七縱八橫若不放過不消一揑僧問放一線道時如何師曰七縱八橫曰不放過不消一揑時如何師曰普裴相國一日請師至郡以所解一編示師師接置於座略不披閲良久曰會麼裴曰未測師曰若便恁麼會得猶較些子若也形於紙墨何有吾宗裴乃贈詩一章曰自從大士傳心印額有圓珠七尺身挂錫十年棲蜀水浮杯今日渡漳濵一千龍象隨高步萬里香花結勝因擬欲事師為弟子不知將法付何人師亦無喜色自爾黃檗門風盛于江表矣一日上堂大衆雲集乃曰汝等諸人欲何所求以拄杖趂之大衆不散師却復坐曰汝等諸人盡是噇酒糟漢恁麼行腳取笑於人但見八百一千人處便去不可圖他熱閙也老漢行腳時或遇草根下有一箇漢便從頂門上一錐看他若知痛癢可以布袋盛米供養他可中總似汝如此容易何處更有今日事也汝等既稱行腳亦須著些精神好還知道大唐國內無禪師麼時有僧問諸方尊宿盡聚衆開化為甚麼却道無禪師師曰不道無禪祇是無師闍黎不見馬大師下有八十四人坐道場得馬師正法眼者止三兩人廬山歸宗和尚是其一夫出家人須知有從上來事分始得且如四祖下牛頭橫説竪説猶未知向上關棙子有此眼目方辨得邪正宗黨且當人事宜不能體會得但知學言語念向皮袋裏安著到處稱我會禪還替得汝生死麼輕忽老宿入地獄如箭我才見汝入門來便識得了也還知麼急須努力莫容易事持片衣口食空過一生明眼人笑汝久後總被俗漢算將去在宜自看遠近是阿誰面上事若會即便會若不會即散去珍重問如何是西來意師便打自餘施設皆被上機中下之流莫窺涯涘唐大中年終於本山諡斷際禪師福州長慶大安禪師號懶安郡之陳氏子受業於黃檗山習律乘嘗自念言我雖勤苦而未聞玄極之理乃孤錫遊方將往洪井路出上元逢一老父謂師曰師往南昌當有所得師即造百丈禮而問曰學人欲求識佛何者即是丈曰大似騎牛覔牛師曰識得後如何丈曰如人騎牛至家師曰未審始終如何保任丈曰如牧牛人執杖視之不令犯人苗稼師自茲領旨更不馳求同參祐禪師創居溈山師躬耕助道及祐歸寂衆請接踵住持上堂汝諸人總來就安求覔甚麼若欲作佛汝自是佛擔佛傍家走如渴鹿趂陽焰相似何時得相應去汝欲作佛但無許多顛倒攀緣妄想惡覺垢淨衆生之心便是初心正覺佛更向何處別討所以安在溈山三十來年喫溈山飯屙溈山屎不學溈山禪祇看一頭水牯牛若落路入草便把鼻孔拽轉來才犯人苗稼即鞭撻調伏既久可憐生受人言語如今變作箇露地白牛常在面前終日露迥迥地趂亦不去汝諸人各自有無價大寶從眼門放光照見山河大地耳門放光領釆一切善惡音響如是六門晝夜常放光明亦名放光三昧汝自不識取影在四大身中內外扶持不教傾側如人負重擔從獨木橋上過亦不教失腳且道是甚麼物任持便得如是且無絲髮可見豈不見志公和尚云內外追尋覔總無境上施為渾大有珍重僧問一切施為是法身用如何是法身師曰一切施為是法身用曰離却五蘊如何是本來身師曰地水火風受想行識曰這箇是五蘊師曰這箇異五蘊問此陰已謝彼陰未生時如何師曰此陰未謝那箇是大德曰不會師曰若會此陰便明彼陰問大用現前不存軌則時如何師曰汝用得但用僧乃脫膊繞師三匝師曰向上事何不道取僧擬開口師便打曰這野狐精出去有僧上法堂顧視東西不見師乃曰好箇法堂祇是無人師從門裏出曰作麼僧無對雪峯因入山採得一枝木其形似蛇於背上題曰本自天然不假雕琢寄與師師曰本色住山人且無刀斧痕僧問佛在何處師曰不離心又問雙峯上人有何所得師曰法無所得設有所得得本無得問黃巢軍來和尚向甚麼處回避師曰五蘊山中曰忽被他捉著時如何師曰惱亂將軍師大化閩堪唐中和三年歸黃檗示寂塔于楞伽山諡圓智禪師杭州大慈山寰中禪師蒲坂盧氏子頂骨圓聳其聲如鏡少丁母憂盧于墓所服闋思報罔極乃於并州童子寺出家嵩嶽登戒習諸律學後參百丈受心印辭往南嶽常樂寺結茅于山頂一日南泉至問如何是庵中主師曰蒼天蒼天泉曰蒼天且置如何是庵中主師曰會即便會莫忉忉泉拂袖而出後住大慈上堂山僧不解答話祇能識病時有僧出師便歸方丈法眼云衆中喚作病在目前不識玄覺云且道大慈識病不識病此僧出來是病不是病若言是病每日行住不可總是病若言不是病出來又作麼生趙州問般若以何為體師曰般若以何為體州大笑而出明日州掃地次師曰般若以何為體州置帚拊掌大笑師便歸方丈僧辭師問甚麼處去曰江西去師曰我勞汝一段事得否曰和尚有甚麼事師曰將取老僧去得麼曰更有過於和尚者亦不能將去師便休僧後舉似洞山山曰闍黎爭合恁麼道曰和尚作麼生山曰得法眼別云和尚若去某甲提笠子山又問其僧大慈別有甚麼言句曰有時示衆曰説得一丈不如行取一尺説得一尺不如行取一寸山曰我不恁麼道曰和尚作麼生山曰説取行不得底行取説不得底雲居云行時無説路説時無行路不説不行時合行甚麼路洛浦云行説俱到即本分事無行説俱不到即本分事在後屬武宗廢教師短褐隱居大中歲重剃染大揚宗旨咸通三年不疾而逝僖宗諡性空大師天台平田普岸禪師洪州人也於百丈門下得旨後聞天台勝槩聖賢間出思欲高蹈方外遠追遐躅乃結茅剃草宴寂林下日居月諸為四衆所知創平田禪院居之上堂神光不昧萬古徽猷入此門來莫存知解便下座僧參師打一拄杖其僧近前把住拄杖師曰老僧適來造次僧却打師一拄杖師曰作家作家僧禮拜師把住曰是闍黎造次僧大笑師曰這箇師僧今日大敗也臨濟訪師到路口先逢一嫂在田使牛濟問嫂平田路向甚麼處去嫂打牛一棒曰這畜生到處走到此路也不識濟又曰我問你平田路向甚麼處去嫂曰這畜生五歲尚使不得濟心語曰欲觀前人先觀所使便有抽釘楔之意及見師師問你還曾見我嫂也未濟曰已收下了也師遂問近離甚處濟曰江西黃檗師曰情知你見作家來濟曰特來禮拜和尚師曰已相見了也濟曰賓主之禮合施三拜師曰既是賓主之禮禮拜著有偈示衆曰大道虗曠常一真心善惡莫思神清物表隨緣飲更復何為終于本院遺塔存焉瑞州五峯常觀禪師僧問如何是五峯境師曰險曰如何是境中人師曰塞僧辭師曰甚麼處去曰臺山去師竪一指曰若見文殊了却來這裏與汝相見僧無語師問僧甚麼處來曰莊上來師曰汝還見牛麼曰見師曰見左角見右角僧無語師代曰見無左右仰山別云還辨左右麼又僧辭師曰汝諸方去莫謗老僧在這裏曰某甲不道和尚在這裏師曰汝道老僧在甚麼處僧竪起一指師曰早是謗老僧也潭州石霜山性空禪師僧問如何是祖師西來意師曰如人在千尺井中不假寸繩出得此人即答汝西來意僧曰近日湖南暢和尚出世亦為人東語西話師喚沙彌拽出這死尸著沙彌即仰山山後問耽源如何出得井中人源曰咄癡漢誰在井中山復問溈山溈召慧寂山應諾溈曰出也仰山住後常舉前語謂衆曰我在耽源處得名溈山處得地福州古靈神贊禪師本州大中寺受業後行腳遇百丈開悟却回受業本師問曰汝離吾在外得何事業曰並無事業遂遣執役一日因澡身命師去垢師乃拊背曰好所佛堂而佛不聖本師回首視之師曰佛雖不聖且能放光本師又一日在窗下看經蜂子投窗紙求出師覩之曰世界如許廣濶不肯出鑽他故紙驢年去遂有偈曰空門不肯出投窗也大癡百年鑽故紙何日出頭時本師置經問曰汝行腳遇何人吾前後見汝發言異常師曰某甲蒙百丈和尚指箇歇處今欲報慈德耳本師於是告衆致齋請師説法師乃登座舉唱百丈門風曰靈光獨耀逈脫根塵體露真常不拘文字心性無染本自圓成但離妄緣即如如佛本師於言下感悟曰何期垂老得聞極則事師後住古靈聚徒數載臨遷化剃浴聲鐘告衆曰汝等諸人還識無聲三昧否衆曰不識師曰汝等靜聽莫別思惟衆皆側聆師儼然順寂塔存本山廣州和安寺通禪師婺州雙林寺受業自幼寡言時人謂之不語通因禮佛次有禪者問座主禮底是甚麼師曰是佛禪者乃指像曰這箇是何物師無對至夜具威儀禮問今日所問某甲未知意旨如何禪者曰座主幾夏邪師曰十夏禪者曰還曾出家也未師轉茫然禪者曰若也不會百夏奚為乃命同參馬祖及至江西祖已圓寂遂謁百丈頓釋疑情有人問師是禪師否師曰貧道不曾學禪師良久召其人其人應諾師指棕櫚樹子其人無對師一日召仰山將牀子來山將到師曰却送本處著山從之師召慧寂山應諾師曰牀子那邊是甚麼物山曰枕子師曰枕子這邊是甚麼物山曰無物師復召慧寂山應諾師曰是甚麼山無對師曰去江州龍雲臺禪師僧問如何是祖師西來意師曰昨夜欄中失却牛京兆衛國院道禪師新到參師問何方來曰河南來師曰黃河清也未僧無對溈山代云小小狐兒要過但過用疑作甚麼師不安不見客有人來謁乃曰久聆和尚道德忽承法體違和略請和尚相見師將鉢鐼盛鉢榰令侍者擎出呈之其人無對鎮州萬歲和尚僧問大衆雲集合談何事師曰序品第一歸宗柔別云禮拜了去洪州東山慧禪師遊山見一巖僧問此巖還有主也無師曰有曰是甚麼人師曰三家村裏覔甚麼曰如何是巖中主師曰汝還氣急麼小師行腳回師問汝離吾在外多少時邪曰十年師曰不用指東指西直道將來曰對和尚不敢謾語師喝曰這打野榸漢師同大于南用到茶堂有僧近前不審用曰我既不納汝汝亦不見我不審阿誰僧無語師曰不得平白地恁麼問伊用曰大于亦無語邪于把定其僧曰是你恁麼纍我亦然便打一摑用大笑曰朗月與青天大于侍者到師問金剛正定一切皆然秋去冬來且作麼生者曰不妨和尚借問師曰即今即得去後作麼生者曰誰敢問著某甲師曰大于還得麼者曰猶要別人點檢在師曰輔弼宗師不廢光彩侍者禮拜清田和尚與瑫上座煎茶次師敲繩牀三下瑫亦敲三下師曰老僧敲有箇善巧上座敲有何道理瑫曰某甲敲有箇方便和尚敲作麼生師舉起盞子瑫曰善知識眼應須恁麼茶罷瑫却問和尚適來舉起盞子意作麼生師曰不可更別有也百丈山涅槃和尚一日謂衆曰汝等與我開田我與汝説大義衆開田了歸請説大義師乃展兩手衆罔措洪覺範林間録云百丈第二代法正禪師大智之高弟其先當誦涅槃經不言姓名時呼為涅槃和尚住成法席師功最多使衆開田方説大義者乃師也黃檗古靈諸大士皆推尊之唐文人黃武翊撰其碑甚詳柳公權書妙絶今古而傳燈所載百丈惟政禪師又係於馬祖法嗣之列誤矣及觀正宗記則有惟政法正然百丈第代可數明教但皆見其名不能辨而俱存也今當以柳碑為正南泉願禪師法嗣趙州觀音院亦曰東院從諗禪師曹州郝鄉人也姓郝氏童稚於本州扈通院從師披剃未納戒便抵池陽參南泉值泉偃息而問曰近離甚處師曰瑞像泉曰還見瑞像麼師曰不見瑞像祇見臥如來泉便起坐問汝是有主沙彌無主沙彌師曰有主沙彌泉曰那箇是你主師近前躬身曰仲冬嚴寒伏惟和尚尊候萬福泉器之許其入室他日問泉曰如何是道泉曰平常心是道師曰還可趣向也無泉曰擬向即乖師曰不擬爭知是道泉曰道不屬知不屬不知知是妄覺不知是無記若真達不疑之道猶如太虗廓然蕩豁豈可強是非邪師於言下悟理乃往嵩嶽琉璃壇納戒仍返南泉一日問泉曰知有底人向甚麼處去泉曰山前檀越家作一頭水牯牛去師曰謝師指示泉曰昨夜三更月到窗泉曰今時人須向異類中行始得師曰異即不問如何是類泉以兩手拓地師近前一踏踏倒却向涅槃堂裏呌曰悔悔泉令侍者問悔箇甚麼師曰悔不更與兩踏南泉上堂師出問明頭合暗頭合泉便下座歸方丈師曰這老和尚被我一問直得無言可對首座曰莫道和尚無語好自是上座不會師便打一掌曰此掌合是堂頭老漢喫師到黃檗檗見來便閉方丈門師乃把火於法堂內呌曰救火救火檗開門捉住曰道道師曰賊過後張弓到寶壽壽見來於禪牀上背坐師展坐具禮拜壽下禪牀師便出又到道吾才入堂吾曰南泉一隻箭來也師曰看箭吾曰過也師曰中又到茱萸執拄杖於法堂上從東過西萸曰作甚麼師曰探水萸曰我這裏一滴也無探箇甚麼師以杖倚壁便下師將遊五臺有大德作偈留曰無處青山不道場何須䇿杖禮清涼雲中縱有金毛現正眼觀時非吉祥師曰作麼生是正眼德無對法眼代云請上座領某甲情同安顯代云是上座眼師自此道化被於北地衆請住觀音院上堂如明珠在掌胡來胡現漢來漢現老僧把一枝草為丈六金身用把丈六金身為一枝草用佛是煩惱煩惱是佛僧問未審佛是誰家煩惱師曰與一切人煩惱曰如何免得師曰用免作麼掃地次僧問和尚是大善知識為甚麼掃地師曰塵從外來曰既是清淨伽藍為甚麼有塵師曰又一點也師與官人遊園次兔見乃驚走遂問和尚是大善知識兔見為甚麼走師曰老僧好殺問覺華未發時如何辨真實師曰開也曰是真是實師曰真是實實是真曰甚麼人分上事師曰老僧有分闍黎有分曰某甲不招納時如何師佯不聞僧無語師曰去石幢子被風吹折僧問陀羅尼幢子作凡去作聖去師曰也不作凡亦不作聖曰畢竟作甚麼師曰落地去也僧辭師曰甚處去曰諸方學佛法去師竪起拂子曰有佛處不得住無佛處急走過三千里外逢人不得錯舉曰與麼則不去也師曰摘楊花摘楊花問承聞和尚親見南泉是否師曰鎮州出大蘿蔔頭大衆晚參師曰今夜答話去也有解問者出來時有一僧便出禮拜師曰比來拋甎引玉却引得箇墼子保壽云射虎不真徒勞沒羽長慶問覺上座云那僧才出禮拜為甚麼便收伊為墼子覺云適來那邊亦有人恁麼問慶云向伊道甚麼覺云也向伊恁麼道玄覺云甚麼處却成墼子去叢林中道才出來便成墼子祇如每日出入行住坐臥不可總成墼子且道這僧出來具眼不具眼上堂金佛不度爐木佛不度火泥佛不度水真佛內裏坐菩提涅槃真如佛性盡是貼體衣服亦名煩惱實際理地甚麼處著一心不生萬法無咎汝但究理坐看三二十年若不會截取老僧頭去夢幻空華徒勞把捉心若不異萬法一如既不從外得更拘執作麼如羊相似亂拾物安向口裏老僧見藥山和尚道有人問著但教合取狗口老僧亦教合取狗口取我是垢不取我是淨一似獵狗專欲得物喫佛法在甚麼處千人萬人盡是覔佛漢子於中覔一箇道人無若與空王為弟子莫教心病最難醫未有世界早有此性世界壞時此性不壞一從見老僧後更不是別人祇是箇主人公這箇更向外覔作麼正恁麼時莫轉頭換腦若轉頭換腦即失却也僧問承師有言世界壞時此性不壞如何是此性師曰四大五陰曰此猶是壞底如何是此性師曰四大五陰法眼云是一箇兩箇是壞不壞且作麼生會試斷看師因老宿問近離甚處曰滑州宿曰幾程到這裏師曰一躂到宿曰好箇捷疾鬼師曰萬福大王宿曰參堂去師應喏喏尼問如何是密密意師以手掐之尼曰和尚猶有這箇在師曰却是你有這箇在僧辭師問甚麼處去曰閩中去師曰彼中兵馬隘你須回避始得曰向甚麼處回避師曰恰好問如何是賓中主師曰山僧不問婦曰如何是主中賓師曰山僧無丈人有僧遊五臺問一婆子曰臺山路向甚麼處去婆曰驀直去僧便去婆曰好箇師僧又恁麼去後有僧舉似師師曰待我去勘過明日師便去問臺山路向甚麼處去婆曰驀直去師便去婆曰好箇師僧又恁麼去師歸院謂僧曰臺山婆子為汝勘破了也玄覺云前來僧也恁麼道趙州去也恁麼道甚麼處是勘破婆子處又云非唯被趙州勘破亦被這僧勘破問恁麼來底人師還接否師曰接曰不恁麼來底師還接否師曰接曰恁麼來者從師接不恁麼來者如何接師曰止止不須説我法妙難思師因出路逢一婆婆問和尚住甚麼處師曰趙州東院西婆無語師歸問衆僧合使那箇西字或言東西字或言棲泊字師曰汝等總作得鹽鐵判官曰和尚為甚恁麼道師曰為汝總識字法燈別衆僧云已知去處問如何是囊中寶師曰合取口法燈別云莫説似人有一婆子令人送錢請轉藏經師受施利了却下禪牀轉一匝乃曰傳語婆轉藏經已竟其人回舉似婆婆曰比來請轉全藏如何祇為轉半藏玄覺云甚麼處是欠半藏處且道那婆子具甚麼眼便與麼道因僧侍次遂指火問曰這箇是火你不得喚作火老僧道了也僧無對復策起火曰會麼曰不會師曰此去舒州有投子和尚汝往禮拜問之必為汝説因緣相契不用更來不相契却來其僧到投子子問近離甚處曰趙州子曰趙州有何言句僧舉前話子曰汝會麼曰不會乞師指示子下禪牀行三步却坐問曰會麼曰不會子曰你歸舉似趙州其僧却回舉似師師曰還會麼曰不會師曰投子與麼不較多也有新到謂師曰某甲從長安來橫擔一條拄杖不曾撥著一人師曰自是大德拄杖短同安顯別云老僧這裏不曾見恁麼人僧無對法眼代云呵呵同安顯代云也不短僧寫師真呈師曰且道似我不似我若似我即打殺老僧不似我即燒却真僧無對玄覺代云留取供養問如何是祖師西來意師曰庭前柏樹子曰和尚莫將境示人師曰我不將境示人曰如何是祖師西來意師曰庭前柏樹子問僧發足甚處曰雪峯師曰雪峯有何言句示人曰尋常道盡十方世界是沙門一隻眼你等諸人向甚處屙師曰闍黎若回寄箇鍬子去師謂衆曰我向行腳到南方火爐頭有箇無賓主話直至如今無人舉著上堂至道無難唯嫌揀擇才有語言是揀擇是明白老僧不在明白裏是汝還護惜也無時有僧問既不在明白裏護惜箇甚麼師曰我亦不知僧曰和尚既不知為甚道不在明白裏師曰問事即得禮拜了退別僧問至道無難唯嫌揀擇是時人窠窟否師曰曾有人問我老僧直得五年分疏不下又問至道無難唯嫌揀擇如何是不揀擇師曰天上天下唯我獨尊曰此猶是揀擇師曰田庫奴甚處是揀擇僧無語問至道無難唯嫌揀擇才有語言是揀擇和尚如何為人師曰何不引盡此語僧曰某甲祇念得到這裏師曰至道無難唯嫌揀擇問如何是道師曰墻外底曰不問這箇師曰你問那箇曰大道師曰大道透長安問道人相見時如何師曰呈漆器上堂兄弟若從南方來者即與下載若從北方來者即與上載所以道近上人問道即失道近下人問道即得道師因與文遠行乃指一片地曰這裏好造箇巡鋪文遠便去路傍立曰把將公驗來師遂與一摑遠曰公驗分明過師與文遠論義曰鬪劣不鬪勝勝者輸果子遠曰請和尚立義師曰我是一頭驢遠曰我是驢胃師曰我是驢糞遠曰我是糞中蟲師曰你在彼中作甚麼遠曰我在彼中過夏師曰把將果子來新到參師問甚麼處來曰南方來師曰佛法盡在南方汝來這裏作甚麼曰佛法豈有南北邪師曰饒汝從雪峯雲居來祇是箇擔板漢崇壽稠云和尚是據客置主人問如何是佛師曰殿裏底曰殿裏者豈不是泥龕塑像師曰是曰如何是佛師曰殿裏底問學人乍入叢林乞師指示師曰喫粥了也未曰喫粥了也師曰洗鉢盂去其僧忽然省悟上堂才有是非紛然失心還有答話分也無僧舉似洛浦浦扣齒又舉似雲居居曰何必僧回舉似師師曰南方大有人喪身失命曰請和尚舉師才舉前語僧指傍僧曰這箇師僧喫却飯了作恁麼語話師休去問久嚮趙州石橋到來祇見略彴師曰汝祇見略彴且不見石橋曰如何是石橋師曰度驢度馬曰如何是略彴師曰箇箇度人後有如前問師如前答又僧問如何是石橋師曰過來過來雲居錫云趙州為當扶石橋扶略彴師聞沙彌喝參向侍者曰教伊去者乃教去沙彌便珍重師曰沙彌得入門侍者在門外雲居錫云甚麼處是沙彌入門侍者在門外這裏若會得便見趙州問僧甚麼處來曰從南來師曰還知有趙州關否曰須知有不涉關者師曰這販私鹽漢問如何是西來意師下禪牀立曰莫祇這箇便是否師曰老僧未有語在問菜頭今日喫生菜喫熟菜頭拈起菜呈之師曰知恩者少負恩者多問狗子還有佛性也無師曰無曰上至諸佛下至螻蟻皆有佛性狗子為甚麼却無師曰為伊有業識在師問一婆子甚麼處去曰偷趙州筍去師曰忽遇趙州又作麼生婆便與一掌師休去師一日於雪中臥曰相救相救有僧便去身邊臥師便起去問如何是趙州一句師曰老僧半句也無曰豈無和尚在師曰老僧不是一句師問新到曾到此間麼曰曾到師曰喫茶去又問僧僧曰不曾到師曰喫茶去後院主問曰為甚麼曾到也云喫茶去不曾到也云喫茶去師召院主主應喏師曰喫茶去問二龍爭珠誰是得者師曰老僧祇管看問空劫中還有人修行也無師曰汝喚甚麼作空劫曰無一物是師曰這箇始稱得修行喚甚麼作空劫僧無語問如何是玄中玄師曰汝玄來多少時邪曰玄之久矣師曰闍黎若不遇老僧幾被玄殺問萬法歸一一歸何所師曰老僧在青州作得一領布衫重七斤問夜生兜率晝降閻浮於其中間摩尼珠為甚麼不現師曰道甚麼其僧再問師曰毗婆尸佛早留心直至如今不得妙問院主甚麼處來主曰送生來師曰鴉為甚麼飛去主曰怕某甲師曰汝十年知事作恁麼語話主却問鴉為甚麼飛去師曰院主無殺心師拓起鉢曰三十年後若見老僧留取供養若不見即撲破別僧曰三十年後敢道見和尚師乃撲破師在東司上見遠侍者過驀召文遠遠應諾師曰東司上不可與汝説佛法僧辭師問甚麼處去曰雪峯去師曰雪峯忽若問和尚有何言句汝作麼生祇對曰某甲道不得請和尚道師曰冬即言寒夏即道熱又曰雪峯更問汝畢竟事作麼生僧又曰道不得師曰但道親從趙州來不是傳語人其僧到雪峯一依前語祇對峯曰也須是趙州始得玄沙聞曰大小趙州敗闕也不知雲居錫云甚麼處是趙州敗闕若檢得出是上座眼問如何是出家師曰不履高名不求苟得問澄澄絶點時如何師曰這裏不著客作漢問如何是祖師意師敲牀腳僧曰祇這莫便是否師曰是即脫取去問如何是毗盧圓相師曰老僧自幼出家不曾眼花曰豈不為人師曰願汝常見毗盧圓相官人問和尚還入地獄否師曰老僧末上入曰大善知識為甚麼入地獄師曰我若不入阿誰教化汝真定帥王公攜諸子入院師坐而問曰大王會麼王曰不會師曰自小持齋身已老見人無力下禪牀王尤加禮重翌日令客將傳語師下禪牀受之侍者曰和尚見大王來不下禪牀今日軍將來為甚麼却下禪牀師曰非汝所知第一等人來禪牀上接中等人來下禪牀接末等人來三門外接因侍者報大王來也師曰萬福大王者曰未到在師曰又道來也師到一庵主處問有麼有麼主竪起拳頭師曰水淺不是泊船處便行又到一庵主處問有麼有麼主亦竪起拳頭師曰能縱能奪能殺能活便作禮問僧一日看多少經曰或七八或十卷師曰闍黎不會看經曰和尚一日看多少師曰老僧一日祇看一字文遠侍者在佛殿禮拜次師見以拄杖打一下曰作甚麼者曰禮佛師曰用禮作甚麼者曰禮佛也是好事師曰好事不如無上堂正人説邪法邪法悉皆正邪人説正法正法悉皆邪諸方難見易識我這裏易見難識問如何是趙州師曰東門西門南門北門問初生孩子還具六識也無師曰急水上打毬子僧却問投子急水上打毬子意旨如何子曰念念不停留問和尚姓甚麼師曰常州有曰甲子多少師曰蘇州有問十二時中如何用心師曰汝被十二時辰使老僧使得十二時乃曰兄弟莫久立有事商量無事向衣鉢下坐窮理好老僧行腳時除二時粥飯是雜用心處除外更無別用心處若不如是大遠在僧問如何是古佛心師曰三箇婆子排班拜問如何是不遷義師曰一箇野雀兒從東飛過西問學人有疑時如何師曰大宜小宜曰大疑師曰大宜東北角小宜僧堂後問柏樹子還有佛性也無師曰有曰幾時成佛師曰待虗空落地時曰虗空幾時落地師曰待柏樹子成佛時問如何是毗盧師師便起立僧曰如何是法身主師便坐僧禮拜師曰且道坐者是立者是師謂衆曰你若一生不離叢林不語五年十載無人喚你作啞漢已後佛也不奈你何你若不信截取老僧頭去師魚鼓頌曰四大由來造化功有聲全貴裏頭空莫嫌不與凡夫説祇為宮商調不同師因趙王問師尊年有幾箇齒在師曰祇有一箇王曰爭喫得物師曰雖然一箇下下咬著師寄拂子與王曰若問何處得來但説老僧平生用不盡者師之玄言布於天下時謂趙州門風皆悚然信伏矣唐乾寧四年十一月二日右脅而寂壽一百二十歲諡真際大師湖南長沙景岑招賢禪師初住鹿苑為第一世其後居無定所但徇緣接物隨宜説法時謂之長沙和尚上堂我若一向舉揚宗教法堂裏須草深一丈事不獲已向汝諸人道盡十方世界是沙門眼盡十方世界是沙門全身盡十方世界是自己光明盡十方世界在自己光明裏盡十方世界無一人不是自己我常向汝諸人道三世諸佛法界衆生是摩訶般若光光未發時汝等諸人向甚麼處委悉光未發時尚無佛無衆生消息何處得山河國土來時有僧問如何是沙門眼師曰長長出不得又曰成佛成祖出不得六道輪回出不得僧曰未審出箇甚麼不得師曰晝見日夜見星曰學人不會師曰妙高山色青又青問教中道而常處此菩提座如何是座師曰老僧正坐大德正立問如何是大道師曰沒却汝問諸佛師是誰師曰從無始劫來承誰覆蔭曰未有諸佛已前作麼生師曰魯祖開堂亦與師僧東道西説問學人不據地時如何師曰汝向甚麼處安身立命曰却據地時如何師曰拖出死尸著問如何是異類師曰尺短寸長問如何是諸佛師師曰不可更拗直作曲邪曰請和尚向上説師曰闍黎眼瞎耳聾作麼遊山歸首座問和尚甚處去來師曰遊山來座曰到甚麼處師曰始從芳草去又逐落花回座曰大似春意師曰也勝秋露滴芙蕖師遣僧問同參會和尚曰和尚見南泉後如何會默然僧曰和尚未見南泉已前作麼生會曰不可更別有也僧回舉似師師示偈曰百尺竿頭不動人雖然得入未為真百尺竿頭須進步十方世界是全身僧便問祇如百尺竿頭如何進步師曰朗州山澧州水曰不會師曰四海五湖皇化裏有客來謁師召尚書其人應諾師曰不是尚書本命曰不可離却即今抵對別有第二主人師曰喚尚書作至尊得麼曰恁麼總不祇對時莫是弟子主人否師曰非但祇對與不祗對時無始劫來是箇生死根本有偈曰學道之人不識真祇為從來認識神無始劫來生死本癡人喚作本來人有秀才看千佛名經問曰百千諸佛但見其名未審居何國土還化物也無師曰黃鶴樓崔皓題後秀才還曾題也未曰未曾師曰得間題取一篇好問南泉遷化向甚麼處去師曰東家作驢西家作馬曰學人不會此意如何師曰要騎即騎要下即下皓月供奉問天下善知識證三德涅槃也未師曰大德問果上涅槃因中涅槃曰問果上涅槃師曰天下善知識未證曰為甚麼未證師曰功未齊於諸聖曰功未齊於諸聖何為善知識師曰明見佛性亦得名為善知識曰未審功齊何道名證大涅槃師示偈曰摩訶般若照解脫甚深法法身寂滅體三一理圓常欲識功齊處此名常寂光曰果上三德涅槃已蒙開示如何是因中涅槃師曰大德是月又問教中説幻意是有邪師曰大德是何言歟曰恁麼則幻意是無邪師曰大德是何言歟曰恁麼則幻意是不有不無邪師曰大德是何言歟曰如某三明盡不契於幻意未審和尚如何明教中幻意師曰大德信一切法不思議否曰佛之誠言那敢不信師曰大德言信二信之中是何信曰如某所明二信之中是名緣信師曰依何教門得生緣信曰華嚴云菩薩摩訶薩以無障無礙智慧信一切世間境界是如來境界又華嚴云諸佛世尊悉知世法及諸佛法性無差別決定無二又華嚴云佛法世間法若見其真實一切無差別師曰大德所舉緣信教門甚有來處聽老僧與大德明教中幻意若人見幻本來真是則名為見佛人圓通法法無生滅無滅無生是佛身月又問蚯蚓斷為兩段兩頭俱動未審佛性在阿那頭師曰動與不動是何境界曰言不干典非智者之所談祇如和尚言動與不動是何境界出自何經師曰灼然言不干典非智者之所談大德豈不見首楞嚴云當知十方無邊不動虗空并其動搖地水火風均名六大性真圓融皆如來藏本無生滅師示偈曰最甚深最甚深法界人身便是心迷者迷心為衆色悟時剎境是真心身界二塵無實相分明達此號知音月又問如何是陀羅尼師指禪牀右邊曰這箇師僧却誦得曰別還有人誦得否師又指禪牀左邊曰這箇師僧亦誦得曰某甲為甚麼不聞師曰大德豈不知道真誦無響真聽無聞曰恁麼則音聲不入法界性也師曰離色求觀非正見離聲求聽是邪聞曰如何是不離色是正見不離聲是真聞師示偈曰滿眼本非色滿耳本非聲文殊常觸目觀音塞耳根會三元一體達四本同真堂堂法界性無佛亦無人僧問南泉道三世諸佛不知有貍奴白牯却知有為甚麼三世諸佛不知有師曰未入鹿苑時猶較些子曰貍奴白牯為甚麼却知有師曰汝爭怪得伊僧問和尚繼嗣何人師曰我無人得繼嗣曰還參學也無師曰我自參學曰師意如何師有偈曰虗空問萬象萬象答虗空誰人親得聞木叉丱角童問如何是平常心師曰要眠即眠要坐即坐曰學人不會意旨如何師曰熱即取涼寒即向火問向上一路請師道師曰一口針三尺線曰如何領會師曰益州布楊州絹問動是法王苗寂是法王根如何是法王師指露柱曰何不問大士師與仰山玩月次山曰人人盡有這箇祇是用不得師曰恰是倩汝用山曰你作麼生用師劈𮌎與一踏山曰㘞直下似箇大蟲長慶云前彼此作家後彼此不作家乃別云邪法難扶自此諸方稱為岑大蟲問本來人還成佛也無師曰汝見大唐天子還自種田割稻麼曰未審是何人成佛師曰是汝成佛僧無語師曰會麼曰不會師曰如人因地而倒依地而起地道甚麼三聖令秀上座問曰南泉遷化向甚麼處去師曰石頭作沙彌時參見六祖秀曰不問石頭見六祖南泉遷化向甚麼處去師曰教伊尋思去秀曰和尚雖有千尺寒松且無抽條石筍師默然秀曰謝和尚答話師亦默然秀回舉似三聖聖曰若恁麼猶勝臨濟七步然雖如此待我更驗看至明日三聖上問承聞和尚昨日答南泉遷化一則語可謂光前絶後今古罕聞師亦默然僧問如何是文殊師曰墻壁瓦礫是曰如何是觀音師曰音聲語言是曰如何是普賢師曰衆生心是曰如何是佛師曰衆生色身是曰河沙諸佛體皆同何故有種種名字師曰從眼根返源名文殊耳根返源名觀音從心返源名普賢文殊是佛妙觀察智觀音是佛無緣大慈普賢是佛無為妙行三聖是佛之妙用佛是三聖之真體用則有河沙假名體則總名一薄伽梵問色即是空空即是色此理如何師曰聽老僧偈礙處非墻壁通處沒虗空若人如是解心色本來同又曰佛性堂堂顯現住性有情難見若悟衆生無我我面何如佛面問第六第七識及第八識畢竟無體云何得名轉第八為大圓鏡智師示偈曰七生依一滅一滅持七生一滅滅亦滅六七永無遷問蚯蚓斷為兩段兩頭俱動未審佛性在阿那頭師曰妄想作麼曰其如動何師曰汝豈不知火風未散問如何轉得山河國土歸自己去師曰如何轉得自己成山河國土去曰不會師曰湖南城下好養民米賤柴多足四鄰僧無語師示偈曰誰問山河轉山河轉向誰圓通無兩畔法性本無歸華嚴座主問虗空為是定有為是定無師曰言有亦得言無亦得虗空有時但有假有虗空無時但無假無曰如和尚所説有何教文師曰大德豈不聞首楞嚴云十方虗空生汝心內猶如片雲點太清裏豈不是虗空生時但生假名又云汝等一人發真歸源十方虗空悉皆消殞豈不是虗空滅時但滅假名老僧所以道有是假有無是假無又問經云如淨琉璃中內現真金像此意如何師曰以淨琉璃為法界體以真金像為無漏智體能生智智能達體故云如淨琉璃中內現真金像問如何是上上人行處師曰如死人眼曰上上人相見時如何師曰如死人手問善財為甚麼無量劫遊普賢身中世界不遍師曰你從無量劫來還遊得遍否曰如何是普賢身師曰含元殿裏更覔長安問如何是學人心師曰盡十方世界是你心曰恁麼則學人無著身處也師曰是你著身處曰如何是著身處師曰大海水深又深曰學人不會師曰魚龍出入任升沉問有人問和尚即隨因緣答無人問和尚時如何師曰困則睡健則起曰教學人作麼生會師曰夏天赤骨力冬寒須得被問亡僧遷化甚麼處去也師示偈曰不識金剛體却喚作緣生十方真寂滅誰在復誰行師讚南泉真曰堂堂南泉三世之源金剛常住十方無邊生佛無盡現已却還久依南泉有投機偈曰今日還鄉入大門南泉親道遍乾坤法法分明皆祖父回頭慙愧好兒孫泉答曰今日投機事莫論南泉不道遍乾坤還鄉盡是兒孫事祖父從來不出門勸學偈曰萬丈竿頭未得休堂堂有路少人遊禪師願達南泉去滿目青山萬萬秋臨濟云赤肉團上有一無位真人師因有偈曰萬法一如不用揀一如誰揀誰不揀即今生死本菩提三世如來同箇眼誡斫松竹偈曰千年竹萬年松枝枝葉葉盡皆同為報四方玄學者動手無非觸祖公鄂州茱萸山和尚初住隨州護國上堂擎起一橛竹曰還有人虗空裏釘得橛麼時有靈虗上座出衆曰虗空是橛師擲下竹便下座趙州到雲居居曰老老大大何不覔箇住處曰甚麼處住得居曰山前有箇古寺基州曰和尚自住取後到師處師曰老老大大何不覔箇住處州曰向甚處住師曰老老大大住處也不知州曰三十年弄馬騎今日却被驢撲雲居錫云甚麼處是趙州被驢撲處衆僧侍立次師曰祇恁麼白立無箇説處一場氣悶僧擬問師便打曰為衆竭力便入方丈有行者參師曰會去看趙州麼曰和尚敢道否師曰非但茱萸一切人道不得曰和尚放某甲過師曰這裏從前不通人情曰要且慈悲心在師便打曰醒後來為汝衢州子湖巖和蹤禪師澶州人也姓周氏幽州開元寺出家依年受具後入南泉之室乃抵于衢州之馬蹄山結茅宴居唐開元二年邑人翁遷貴施山下子湖創院師於門下立牌曰子湖有一隻狗上取人頭中取人心下取人足擬議即喪身失命臨濟會下二僧參方揭簾師喝曰看狗僧回顧師便歸方丈與勝光和尚鉏園次驀按钁回視光曰事即不無擬心即差光便問如何是事被師攔胸踏倒從此有省尼到參師曰汝莫是劉鐵磨否曰不敢師曰左轉右轉曰和尚莫顛倒師便打師一夜於僧堂前呌曰有賊衆皆驚動有一僧在堂內出師把住曰維那捉得也捉得也曰不是某甲師曰是即是祇是汝不肯承當有偈示衆曰三十年來住子湖二時齋粥氣力粗無事上山行一轉借問時人會也無廣明中無疾歸寂塔于本山荊南白馬曇照禪師常曰快活快活及臨終時呌苦苦又曰閻羅王來取我也院主問曰和尚當時被節度使拋向水中神色不動如今何得恁麼地師舉枕子曰汝道當時是如今是院主無對法眼代云此時但掩耳出去終南山雲際師祖禪師初參南泉問摩尼珠人不識如來藏裏親收得如何是藏泉曰與汝往來者是師曰不往來者如何泉曰亦是曰如何是珠泉召師祖師應諾泉曰去汝不會我語師從此信入鄧州香嚴下堂義端禪師上堂兄弟彼此未了有甚麼事相共商量我三五日即發去也如今學者須了却今時莫愛他向上人無事兄弟縱學得種種差別義路終不代得自己見解畢竟著力始得空記持他巧妙章句即轉加煩亂去汝若欲相應但恭恭地盡莫停留纖毫直似虗空方有少分以虗空無鎖閉無壁落無形段無心眼時有僧問古人相見時如何師曰老僧不曾見古人曰今時血脈不斷處如何似羡師曰有甚麼仰羡處問某甲不問間事請和尚答話師曰更從我覔甚麼曰不為間事師曰汝教我道乃曰兄弟佛是塵法是塵終日馳求有甚麼休歇但時中不用挂情情不挂物無善可取無惡可棄莫教他籠著始是學處也問某甲曾辭一老宿宿曰去則親良朋附善友某今辭和尚未審有何指示師曰禮拜著僧禮拜師曰禮拜一任禮拜不得認奴作郎上堂僧問如何是直截根源師乃擲下拄杖便歸方丈上堂語是謗寂是誑語寂向上有路在老僧口門窄不能與汝説得便下座上堂問正因為甚麼無事師曰我不曾停留乃曰假饒重重剝得淨盡無停留權時施設亦是方便接人若是那邊事無有是處池州靈鷲間禪師上堂是汝諸人本分事若教老僧道即是與蛇畫足時有僧問與蛇畫足即不問如何是本分事師曰闍黎試道看僧擬再問師曰畫足作麼明水和尚問如何是頓獲法身師曰一透龍門雲外望莫作黃河點額魚仰山問寂寂無言如何視聽師曰無縫塔前多雨水僧問二彼無言時如何師曰是常曰還有過常者無師曰有曰請師唱起師曰玄珠自朗耀何須壁外光問今日供養西川無染大師未審還來否師曰本自無所至今豈隨風轉曰恁麼則供養何用師曰功力有為不換義相涉洛京嵩山和尚僧問古路坦然時如何師曰不前曰為甚麼不前師曰無遮障處問如何是嵩山境師曰日從東出月向西頽曰學人不會師曰東西也不會問六識俱生時如何師曰異曰為甚麼如此師曰同日子和尚因亞溪來參師作起勢溪曰這老山鬼猶見某甲在師曰罪過罪過適來失祇對溪欲進語師便喝溪曰大陳當前不妨難禦師曰是是溪曰不是不是趙州云可憐兩箇漢不識轉身句蘇州西禪和尚僧問三乘十二分教則不問如何是祖師西來的的意師舉拂子示之其僧不禮拜竟參雪峯峯問甚麼處來曰浙中來峯曰今夏甚麼處曰西禪峯曰和尚安否曰來時萬福峯曰何不且在彼從容曰佛法不明峯曰有甚麼事僧舉前話峯曰汝作麼生不肯伊曰是境峯曰汝見蘇州城裏人家男女否曰見峯曰汝見路上林木池沼否曰見峯曰凡覩人家男女大地林沼總是境汝還肯否曰肯峯曰祇如舉起拂子汝作麼生不肯僧乃禮拜曰學人取次發言乞師慈悲峯曰盡乾坤是箇眼汝向甚麼處蹲坐僧無語宣州刺史陸亘大夫問南泉古人瓶中養一鵝鵝漸長大出瓶不得如今不得毀瓶不得損鵝和尚作麼生出得泉召大夫陸應諾泉曰出也陸從此開解即禮謝暨南泉圓寂院主問曰大夫何不哭先師陸曰院主道得即哭院主無對長慶代云合哭不合哭池州甘贄行者一日入南泉設齋黃檗為首座行者請施財座曰財法二施等無差別甘曰恁麼道爭消得某甲嚫便將出去須臾復入曰請施財座曰財法二施等無差別甘乃行嚫又一日入寺設粥仍請南泉念誦泉乃白椎曰請大衆為貍奴白牯念摩訶般若波羅蜜甘拂袖便出泉粥後問典座行者在甚處座曰當時便去也泉便打破鍋子甘常接待往來有僧問曰行者接待不易甘曰譬如餧驢餧馬僧休去有住庵僧緣化什物甘曰有一問若道得即施乃書心字問是甚麼字曰心字又問妻甚麼字妻曰心字甘曰某甲山妻亦合住庵其僧無語甘亦無施又問一僧甚麼處來曰溈山來甘曰曾有僧問溈山如何是西來意溈山舉起拂子上座作麼生會溈山意曰借事明心附物顯理甘曰且歸溈山去好保福聞之乃仰手覆手鹽官安國師法嗣襄州關南道常禪師僧問如何是西來意師舉拄杖曰會麼曰不會師便打師每見僧來參禮多以拄杖打趂或曰遲一刻或曰打動關南鼓而時輩鮮有唱和者洪州雙嶺玄真禪師初問道吾無神通菩薩為甚麼足迹難尋吾曰同道者方知師曰和尚還知否吾曰不知師曰何故不知吾曰去你不識我語師後於鹽官處悟旨焉杭州徑山鑒宗禪師湖州錢氏子依本州開元寺大德高間出家學通淨名思益經後往鹽官決擇疑滯唐咸通三年住徑山有小師洪諲以講論自矜諲即法濟大師師謂之曰佛祖正法直截亡詮汝算海沙於理何益但能莫存知見泯絶外緣離一切心即汝真性諲茫然遂禮辭遊方至溈山方悟玄旨乃嗣溈山師咸通七年示滅諡無上大師歸宗常禪師法嗣福州芙蓉山靈訓禪師初參歸宗問如何是佛宗曰我向汝道汝還信否曰和尚誠言安敢不信宗曰即汝便是師曰如何保任宗曰一翳在眼空華亂墜法眼云若無後語有甚麼歸宗也師辭宗問甚麼處去師曰歸嶺中去宗曰子在此多年裝束了却來為子説一上佛法師結束了上去宗曰近前來師乃近前宗曰時寒途中善為師聆此言頓忘前解歸寂諡弘照大師漢南高亭和尚有僧自夾山來禮拜師便打僧曰特來禮拜何得打某甲僧再禮拜師又打趂僧回舉似夾山山曰汝會也無曰不會山曰賴汝不會若會即夾山口啞新羅大茅和尚上堂欲識諸佛師向無明心內識取欲識常住不凋性向萬物遷變處識取僧問如何是大茅境師曰不露鋒曰為甚麼不露鋒師曰無當者五臺山智通禪師自稱大禪佛初住歸宗會下忽一夜連呌曰我大悟也衆駭之明日上堂衆集宗曰昨夜大悟底僧出來師出曰某甲宗曰汝見甚麼道理便言大悟試説看師曰師姑元是女人作宗異之師便辭去宗門送與提笠子師接得笠子戴頭上便行便不回顧後居臺山法華寺臨終有偈曰舉手攀南斗回身倚北辰出頭天外看誰是我般人大梅常禪師法嗣新羅國迦智禪師僧問如何是西來意師曰待汝裏頭來即與汝道問如何是大梅的旨師曰酪本一時拋杭州天龍和尚上堂大衆莫待老僧上來便上來下去便下去各有華藏性海具足功德無礙光明各各參取珍重僧問如何得出三界去師曰汝即今在甚麼處佛光滿禪師法嗣杭州刺史白居易字樂天久參佛光得心法兼稟大乘金剛寶戒元和中造于京兆興善法堂致四問語見與善章十五年牧杭州訪鳥窠和尚有問答語句見鳥窠章嘗致書于濟法師以佛無上大慧演出教理安有徇機高下應病不同與平等一味之説相反援引維摩及金剛三昧等六經闢二義而難之又以五蘊十二緣説名色前後不類立理而徵之並鉤深索隱通幽洞微然未覩法師酬對後來亦鮮有代答者復受東都凝禪師八漸之目各廣一言而為一偈釋其旨趣自淺之深猶貫珠焉凡守任處多訪祖道學無常師後為賓客分司東都罄己俸修龍門香山寺寺成自撰記凡為文動關教化無不贊美佛乘見于本集其歷官次第歸全代祀即史傳存焉五泄默禪師法嗣福州龜山正元禪師宣州蔡氏子嘗述偈示徒一曰滄溟幾度變桑田唯有虗空獨湛然已到岸人休戀筏未曾度者要須船二曰尋師認得本心源兩岸俱玄一不全是佛不須更覔佛祇因如此便忘緣咸通十年終于本山諡性空大師蘇溪和尚僧問如何是定光佛師曰鴨吞螺師曰還許學人轉身也無師曰眼睛突出盤山積禪師法嗣鎮州普化和尚者不知何許人也師事盤山密受真訣而徉狂出言無度暨盤山順世乃於北地行化或城市或冢間振一鐸曰明頭來明頭打暗頭來暗頭打四方八面來旋風打虗空來連架打一日臨濟令僧捉住曰總不恁麼來時如何師拓開曰來日大悲院裏有齋僧回舉似濟濟曰我從來疑著這漢凡見人無高下皆振鐸一聲時號普化和尚或將鐸就人耳邊振之或附其背有回顧者即展手曰乞我一錢非時遇食亦喫嘗暮入臨濟院喫生菜濟曰這漢大似一頭驢師便作驢鳴濟謂直歲曰細抹草料著師曰少室人不識金陵又再來臨濟一隻眼到處為人開師見馬步使出喝道師亦喝道作相撲勢馬步使令人打五棒師曰似即似是即不是師嘗於闤闠間搖鐸唱曰覔箇去處不可得時道吾遇之把住問曰汝擬去甚麼處師曰汝從甚麼處來吾無語師掣手便去臨濟一日與河陽木塔長老同在僧堂內坐正説師每日在街市掣風掣顛知他是凡是聖師忽入來濟便問汝是凡是聖師曰汝且道我是凡是聖濟便喝師以手指曰河陽新婦子木塔老婆禪臨濟小廝兒却具一隻眼濟曰這賊師曰賊賊便出去唐咸通初將示滅乃入市謂人曰乞我一箇直裰人或與披襖或與布裘皆不受振鐸而去臨濟令人送與一棺師笑曰臨濟廝兒饒舌便受之乃辭衆曰普化明日去東門死也郡人相率送出城師厲聲曰今日葬不合青烏乃曰明日南門遷化人亦隨之又曰明日出西門方吉人出漸稀出已還返人意稍怠第四日自擎棺出北門外振鐸入棺而逝郡人奔走出城揭棺視之已不見唯聞空中鐸聲漸遠莫測其由麻谷徹禪師法嗣壽州良遂禪師參麻谷谷見來便將鉏頭去鉏草師到鉏草處谷殊不顧便歸方丈閉却門師次日復去谷又閉門師乃敲門谷問阿誰師曰良遂才稱名忽然契悟曰和尚莫謾良遂良遂若不來禮拜和尚洎被經論賺過一生谷便開門相見及歸講肆謂衆曰諸人知處良遂總知良遂知處諸人不知東寺會禪師法嗣吉州薯山慧超禪師洞山來禮拜次師曰汝已住一方又來這裏作麼曰良價無奈疑何特來見和尚師召良價價應諾師曰是甚麼價無語師曰好箇佛祇是無光焰西堂藏禪師法嗣虔州處微禪師僧問三乘十二分教體理得妙與祖意是同是別師曰須向六句外鑒不得隨聲色轉曰如何是六句師曰語底默底不語不默總是總不是汝合作麼生僧無對問仰山汝名甚麼山曰慧寂師曰那箇是慧那箇是寂山曰祇在目前師曰猶有前後在山曰前後且置和尚見箇甚麼師曰喫茶去章敬腪禪師法嗣京兆大薦福寺弘辨禪師唐宣宗問禪宗何有南北之名對曰禪門本無南北昔如來以正法眼付大迦葉展轉相傳至二十八祖菩提達磨來遊此方為初祖暨第五祖弘忍大師在蘄州東山開法時有二弟子一名慧能受衣法居嶺南為六祖一名神秀在北揚化其後神秀門人普寂者立秀為第六祖而自稱七祖其所得法雖一而開導發悟有頓漸之異故曰南頓北漸非禪宗本有南北之號也帝曰云何名戒對曰防非止惡謂之戒帝曰云何為定對曰六根涉境心不隨緣名定帝曰云何為慧對曰心境俱空照覽無惑名慧帝曰何為方便對曰方便者隱實覆相權巧之門也被接中下曲施誘迪謂之方便設為上根言捨方便但説無上道者斯亦方便之談乃至祖師玄言忘功絶謂亦無出方便之迹帝曰何為佛心對曰佛者西天之語唐言覺謂人有智慧覺照為佛心心者佛之別名有百千異號體唯其一無形狀非青黃赤白男女等相在天非天在人非人而現天現人能男能女非始非終無生無滅故號靈覺之性如陛下日應萬機即是陛下佛心假使千佛共傳而不念別有所得也帝曰如今有人念佛如何對曰如來出世為天人師善知識隨根器而説法為上根者開最上乘頓悟至理中下者未能頓曉是以佛為韋提希權開十六觀門令念佛生於極樂故經云是心是佛是心作佛心外無佛佛外無心帝曰有人持經念佛持呪求佛如何對曰如來種種開讚皆為最上一乘如百川衆流莫不朝宗于海如是差別諸數皆歸薩婆若海帝曰祖師既契會心印金剛經云無所得法如何對曰佛之一化實無一法與人但示衆人各各自性同一法藏當時然燈如來但印釋迦本法而無所得方契然燈本意故經云無我無人無衆生無壽者是法平等修一切善法不住於相帝曰禪師既會祖意還禮佛轉經否對曰沙門釋子禮佛轉經蓋是住持常法有四報焉然依佛戒修身參尋知識漸修梵行履踐如來所行之迹帝曰何為頓見何為漸修對曰頓明自性與佛同儔然有無始染習故假漸修對治令順性起用如人喫飯不一口便飽師是日辨對七刻賜紫方袍號圓智禪師仍勑修天下祖塔各令守護福州龜山智具禪師揚州柳氏子初謁章敬敬問何所而至師曰至無所至來無所來敬雖默然師亦自悟住後上堂動容瞬目無出當人一念淨心本來是佛仍説偈曰心本絶塵何用洗身中無病豈求醫欲知是佛非身處明鑑高懸未照時後值武宗沙汰有偈示衆曰勑命如雷下翠微風前垂淚脫禪衣雲中有寺不容住塵裏無家何處歸明月分形處處新白衣寧墜解空人誰言在俗妨修道金粟曾為居士身忍仙林下坐禪時曾被歌王割截肢況我聖朝無此事祇令休道亦何悲暨宣宗中興乃不復披緇咸通六年終于本山諡歸寂禪師金州操禪師請米和尚齋不排坐位米到展坐具禮拜師下禪牀米乃坐師位師却席地而坐齋訖米便去侍者曰和尚受一切人欽仰今日坐位被人奪却師曰三日後若來即受救在米三日後果來曰前日遭賊僧問鏡清古人道前日遭賊意旨如何清云祇見錐頭利不見鑿頭方朗州古堤和尚尋常見僧來但曰去汝無佛性僧無對或有對者莫契其旨仰山到參師曰去汝無佛性山叉手近前三步應喏師笑曰子甚麼處得此三昧來山曰我從耽源處得名溈山處得地師曰莫是溈山的子麼山曰世諦即不無佛法即不敢山却問和尚從甚處得此三昧師曰我從章敬處得此三昧山嘆曰不可思議來者難為湊泊河中府公畿和尚僧問如何是道如何是禪師以偈示之曰有名非大道是非俱不禪欲識箇中意黃葉止啼錢永泰湍禪師法嗣湖南上林戒靈禪師初參溈山山曰大德作甚麼來師曰介胃全具山曰盡卸了來與大德相見師曰卸了也山咄曰賊尚未打卸作甚麼師無對仰山代曰請和尚屏却左右溈山以手揖曰喏喏師後參永泰方諭其旨五臺山祕魔巖和尚常持一木叉每見僧來禮拜即叉却頸曰那箇魔魅教汝出家那箇魔魅教汝行腳道得也叉下死道不得也叉下死速道速道學徒鮮有對者法眼代云乞命法燈代但引頸示之玄覺代云老兒家放下義子得也霍山通和尚訪師才見不禮拜便攛入懷裏師拊通背三下通起拍手曰師兄三千里外賺我來三千里外賺我來便回湖南祇林和尚每叱文殊普賢皆為精魅手持木劒自謂降魔才見僧來參便曰魔來也魔來也以劒亂揮歸方丈如是十二年後置劒無言僧問十二年前為甚麼降魔師曰賊不打貧兒家曰十二年後為甚麼不降魔師曰賊不打貧兒家華嚴藏禪師法嗣黃州齊安禪師上堂言不落句佛祖徒施玄韻不墜誰人知得僧問如何識得自己佛師曰一葉明時消不盡松風韻罷怨無人曰如何是自己佛師曰草前駿馬實難窮妙盡還須畜生行有人問師年多少師曰五六四三不得類豈同一二實難窮師有偈曰猛熾焰中人有路旋風頂上屹然棲鎮常歷劫誰差互杲日無言運照齊南嶽下四世黃檗運禪師法嗣睦州陳尊宿諱道明江南陳氏之後也生時紅光滿室祥雲蓋空旬日方散目有重瞳面列七星形相奇特與衆奪倫因往開元寺禮佛見僧如故知歸白父母願求出家父母聽許為僧後持戒精嚴學通三藏遊方契旨於黃檗後為四衆請住觀音院常百餘衆經數十載學者叩激隨問遽答詞語峻險既非循轍故淺機之流往往嗤之唯玄學性敏者欽伏由是諸方歸慕咸以尊宿稱後歸開元今改兜率居房織蒲鞋以養母故有陳蒲鞋之號巢寇入境師標大草屨於城門巢欲棄之竭力不能舉歎曰睦州有大聖人舍城而去遂免擾攘一日晚參謂衆曰汝等諸人還得箇入頭處也未若未得箇入頭處須覔箇入頭處若得箇入頭處已後不得孤負老僧時有僧出禮拜曰某甲終不敢孤負和尚師曰早是孤負我了也又曰明明向你道尚自不會何況蓋覆將來又曰老僧在此住持不曾見箇無事人到來汝等何不近前時有一僧方近前師曰維那不在汝自領去三門外與二十棒曰某甲過在甚麼處師曰枷上更著杻師尋常見衲僧來即閉門或見講僧乃召曰座主主應諾師曰擔板漢或曰這裏有桶與我取水一日在廊階上立僧問陳尊宿房在何處師脫草屨驀頭打僧便走師召大德僧回首師指曰却從那邊去天使問三門俱開從那門入師喚尚書使應諾師曰從信門入使又見畫壁問曰二尊者對談何事師摑露柱曰三身中那箇不説法座主參師問莫是講唯識論否曰不敢師曰朝去西天暮歸唐土會麼曰不會師曰吽吽五戒不持師問一長老了即毛端吞巨海始知大地一微塵長老作麼生曰問阿誰師曰問長老曰何不領話師曰汝不領話我不領話問座主講甚麼經曰講涅槃經師曰問一段義得麼曰得師以腳踢空吹一吹曰是甚麼義曰經中無此義師曰脫空謾語漢五百力士揭石義却道無師見僧乃曰見成公案放汝三十棒曰某甲如是師曰三門頭金剛為甚麼舉拳曰金剛尚乃如是師便打問如何是向上一路師曰要道有甚麼難曰請師道師曰初三十一中九下七問以一重去一重即不問不以一重去一重時如何師曰昨朝栽茄子今日種冬瓜問如何是曹溪的的意師曰老僧愛瞋不愛喜曰為甚麼如是師曰路逢劒客須呈劒不是詩人莫説詩問僧甚處來曰瀏陽師曰彼中老宿祇對佛法大意道甚麼曰遍地無行路師曰老宿實有此語否曰實有師拈拄杖打曰這念言語漢師問一長老若有兄弟來將何祇對曰待他來師曰何不道曰和尚欠少甚麼師曰請不煩葛藤僧參師曰汝豈不是行腳僧曰是師曰禮佛也未曰禮那土堆作麼師曰自領出去問某甲講兼行腳不會教意時如何師曰灼然實語當懺悔曰乞師指示師曰汝若不問老僧即緘口無言汝既問老僧不可緘口去也曰請師便道師曰心不負人面無慙色問一句道盡時如何師曰義墮也曰甚麼處是學人義墮處師曰三十棒教誰喫問高揖釋迦不拜彌勒時如何師曰昨日有人問趂出了也曰和尚恐某甲不實邪師曰拄杖不在苕帚柄聊與三十上堂我見百丈不識好惡大衆才集以拄杖一時打下復召大衆衆回首乃云是甚麼有甚共語處又黃檗和尚亦然復召大衆衆回首乃云月似彎弓少雨多風猶較些子問僧近離甚處僧便喝師曰老僧被你一喝僧又喝師曰三喝四喝後作麼生僧無語師便打曰這掠虗漢秀才訪師稱會二十四家書師以拄杖空中點一點曰會麼秀才罔措師曰又道會二十四家書永字八法也不識上堂裂開也在我揑聚也在我時有僧問如何是裂開師曰三九二十七菩提涅槃真如解脫即心即佛我且與麼道你又作麼生曰某甲不與麼道師曰盞子撲落地碟子成七片曰如何是揑聚師乃斂手而坐問教意祖意是同是別師曰青山自青山白雲自白雲曰如何是青山師曰還我一滴雨來曰道不得請師道師曰法華鋒前陳涅槃句後收問僧今夏在甚麼處曰待和尚有住處即説師曰狐非師子類燈非日月明問僧甚處來僧瞪目視之師曰驢前馬後漢曰請師鑒師曰驢前馬後漢道將一句來僧無對師看經次陳操尚書問和尚看甚麼經師曰金剛經書曰六朝翻譯此當第幾師舉起經曰一切有為法如夢泡幻影看經次僧問和尚看甚麼經師曰涅槃經茶毗品最在後問僧今夏在甚處曰徑山曰這喫夜飯漢曰尊宿叢林何言喫夜飯師以棒趂出師聞一老宿難親近躬往相訪才入方丈宿便喝師側掌曰兩重公案宿曰過在甚麼處師曰這野狐精便退問僧近離甚處曰江西師曰踏破多少草鞋僧無對與講僧喫茶次師曰我救汝不得也曰某甲不曉乞師垂示師拈油餅曰這箇是甚麼曰色法師曰這入鑊湯漢紫衣大德到禮拜師拈帽子帶問曰這箇喚作甚麼曰朝天帽師曰恁麼則老僧不卸也復問所習何業曰唯識師曰作麼生説曰三界唯心萬法唯識師指門扇曰這箇是甚麼曰是色法師曰簾前賜紫對御談經何得不持五戒德無對問某甲乍入叢林乞師指示師曰你不解問曰和尚作麼生師曰放汝三十棒自領出去問教意請師提綱師曰但問將來與你道曰請和尚道師曰佛殿裏燒香三門頭合掌問如何是展演之言師曰量才補職曰如何是不展演之言師曰伏惟尚饗焦山借斧頭次師呼童子取斧來童取斧至曰未有繩墨且斫粗師便喝又問童曰作麼生是你斫頭童遂作斫勢師曰斫你老爺頭不得師問秀才先輩治甚經才曰治易師曰易中道百姓日用而不知且道不知箇甚麼才曰不知其道師曰作麼生是道才無對僧問一氣還轉得一大藏教也無師曰有甚饆羅鎚子快下將來問如何是一代時教師曰上大人丘乙己問如何是禪師曰猛火著油煎僧參師曰汝是新到否曰是師曰且放下葛藤會麼曰不會師曰擔枷陳狀自領出去僧便出師曰來來我實問你甚處來曰江西師曰泐潭和尚在汝背後怕你亂道見麼僧無對問寺門前金剛拓即乾坤大地不拓即絲髮不逢時如何師曰吽吽我不曾見此師却問先跳三千倒退八百你合作麼生曰諾師曰先責一紙罪狀好便打其僧擬出師曰來我共你葛藤拓即乾坤大地你且道洞庭湖水深多少曰不曾量度師曰洞庭湖又作麼生曰祇為今時師曰祇這葛藤尚不會便打問如何是觸途無滯底句師曰我不恁麼道曰師作麼生道師曰箭過西天十萬里却向大唐國裏等候看華嚴經次僧問看甚麼經師曰大光明雲青色光明雲紫色光明雲却指面前曰那邊是甚麼雲曰南邊是黑雲師曰今日須有雨問以字不成八字不是是何章句師彈指一聲曰會麼曰不會師曰上來講讚無限勝因蝦蟇𨁝跳上天蚯蚓驀過東海問僧近離甚處曰河北師曰彼中有趙州和尚你曾到否曰某甲近離彼中師曰趙州有何言句示徒僧舉喫茶話師乃呵呵大笑曰慚愧却問趙州意作麼生曰祇是一期方便師曰苦哉趙州被你將一杓屎潑了也便打師却問沙彌你作麼生會彌便設拜師亦打其僧往沙彌處問適來和尚打你作甚麼彌曰若不是我和尚不打某甲新到參方禮拜師叱曰闍黎因何偷常住果子喫曰學人才到和尚為甚麼道偷果子師曰贓物見在問僧近離甚處曰仰山師曰五戒也不持曰某甲甚麼處是妄語師曰這裏不著沙彌師臨終召門人曰此處緣息吾當逝矣乃跏趺而寂郡人以香薪焚之舍利如雨乃收靈骨塑像于寺壽九十八臘七十六杭州千頃山楚南禪師福州張氏子初參芙蓉蓉見曰吾非汝師汝師江外黃檗是也師禮辭遂參黃檗檗問子未現三界影像時如何師曰即今豈是有邪檗曰有無且置即今如何師曰非今古檗曰吾之法眼已在汝躬住後上堂諸子設使解得三世佛教如瓶注水及得百千三昧不如一念修無漏道免被人天因果繫絆時有僧問無漏道如何修師曰未有闍黎時體取曰未有某甲時教誰體師曰體者亦無問如何是易師曰著衣喫飯不用讀經看教不用行道禮拜燒身煉頂豈不易邪曰如何是難師曰微有念生便具五陰三界輪回生死皆從汝一念生所以佛教諸菩薩云佛所護念師雖應機無倦而常寂然處定或逾月或浹旬文德六年五月遷化塔于院之西隈大順二年宣州孫儒寇錢塘發塔覩師全身儼然爪髮俱長拜謝而去福州烏石山靈觀禪師時稱老觀尋常扄戶人罕見之唯一信士每至食時送供方開一日雪峯伺便扣門師開門峯驀胸搊住曰是凡是聖師唾曰這野狐精便推出閉却門峯曰也祇要識老兄剗草次問僧汝何處去曰西院禮拜安和尚去時竹上有一青蛇師指蛇曰欲識西院老野狐精祇這便是師問西院此一片地堪著甚麼物院曰好著箇無相佛師曰好片地被兄放不淨污了也引麵次僧參師引麵示之僧便去師至暮問小師適來僧在何處小師曰當時便去也師曰是即是祇得一橛玄覺云甚麼處是少一橛問如何是佛師出舌示之其僧禮謝師曰住住你見甚麼便禮拜曰謝和尚慈悲出舌相示師曰老僧近日舌上生瘡僧到敲門行者開門便出去僧入禮拜問如何是西來意師曰適來出去者是甚麼人僧擬近前師便推出閉却門曹山行腳時問如何是毗盧師法身主師曰我若向你道即別有也曹山舉似洞山山曰好箇話頭祇欠進語何不問為甚麼不道曹却來進前語師曰若言我不道即啞却我口若言我道即謇却我舌曹山歸舉似洞山山深肯之杭州羅漢院宗徹禪師湖州吳氏子上堂僧問如何是祖師西來意師曰骨銼也師對機多用此語時號骨銼和尚問如何是南宗北宗師曰心為宗曰還看教也無師曰教是心問性地多昏如何了悟師曰煩雲風卷太虗廓清曰如何得明去師曰一輪皎潔萬里騰光相國裴休居士字公美河東聞喜人也守新安日屬運禪師初於嶺南黃檗山捨衆入大安精舍混迹勞侶掃灑殿堂公入寺燒香主事祇接因觀壁畫乃問是何圖相主事對曰高僧真儀公曰真儀可觀高僧何在主事無對公曰此間有禪人否曰近有一僧投寺執役頗似禪者公曰可請來詢問得否於是遽尋檗至公覩之欣然曰休適有一問諸德吝辭今請上人代酬一語檗曰請相公垂問公舉前話檗朗聲曰裴休公應諾檗曰在甚麼處公當下知旨如獲髻珠曰吾師真善知識也示人剋的若是何故汩沒於此乎寺衆愕然自此延入府署執弟子禮屢辭不已復堅請住黃檗山荐興祖道有暇即躬入山頂謁或渴聞玄論即請入州中公既通徹祖意復博綜教相諸方禪學咸謂裴相不浪出黃檗之門也至遷鎮宣城還思瞻禮亦創精藍迎請居之雖圭峯該通禪講為裴之所重未若歸心於黃檗而傾竭服膺者也又撰圭峯碑云休與師於法為昆仲於義為交友於恩為善知識於教為內外護斯可見矣仍集黃檗語要親書序引冠於編首留鎮山門又親書大藏經五百函號迄今寶之又圭峯禪師著禪源詮原人論及圓覺經疏注法界觀皆為之序公篤志內典深入法會有發願文傳於世長慶安禪師法嗣益州大隨法真禪師梓州王氏子妙齡夙悟決志尋師於慧義寺出家圓具後南遊初見藥山道吾雲巖洞山次至嶺外大溈會下數載食不至充臥不求暖清苦鍊行操履不羣溈深器之一日問曰闍黎在老僧此間不曾問一轉話師曰教某甲向甚麼處下口溈曰何不道如何是佛師便作手勢掩溈口溈歎曰子真得其髓從此名傳四海爾後還蜀寄錫天彭堋口山龍懷寺於路旁煎茶普施三年因往後山見一古院號大隨羣峯矗秀澗水清冷中有一樹圍四丈餘南開一門中空無礙不假斤斧自然一菴時目為木禪菴師乃居之十餘載影不出山聲聞于外四方玄學千里趨風蜀主欽尚遣使屢徵師皆辭以老病署神照大師上堂此性本來清淨具足萬德但以染淨二緣而有差別故諸聖悟之一向淨用而成覺道凡夫迷之一向染用沒溺輪回其體不二故般若云無二無二分無別無斷故僧問劫火洞然大千俱壞未審這箇壞不壞師曰壞曰恁麼則隨他去也師曰隨他去僧不肯後到投子舉前話子遂裝香遙禮曰西川古佛出世謂其僧曰汝速回去懺悔僧回大隨師已歿僧再至投子子亦遷化問如何是大人相師曰肚上不貼榜問僧甚處去曰西山住菴去師曰我向東山頭喚汝汝便來得麼曰不然師曰汝住菴未得問生死到來時如何師曰遇茶喫茶遇飯喫飯曰誰受供養師曰合取鉢盂庵側有一龜僧問一切衆生皮裏骨這箇衆生為甚骨裏皮師拈草履覆龜背上僧無語問如何是諸佛法要師舉拂子曰會麼曰不會師曰麈尾拂子問如何是學人自己師曰是我自己曰為甚麼却是和尚自己師曰是汝自己問如何是大隨一面事師曰東西南北問佛法遍在一切處教學人向甚麼處駐足師曰大海從魚躍長空任鳥飛問父子至親岐路各別時如何師曰為有父子問如何是無縫塔師曰高五尺曰學人不會師曰鶻崙甎問和尚百年後法付何人師曰露柱火爐曰還受也無師曰火爐露柱行者領衆參師問參得底人喚東作甚麼曰不可喚作東師咄曰臭驢漢不喚作東喚作甚麼者無語問如何是和尚家風師曰赤土畫簸箕曰未審此理如何師曰簸箕有脣米跳不出問僧講甚麼教法曰百法論師拈杖曰從何而起曰從緣而起師曰苦哉苦哉問僧甚處去曰峨嵋禮普賢去師舉拂子曰文殊普賢總在這裏僧作圓相拋向後乃禮拜師喚侍者取一貼茶與這僧衆僧參次師以口作患風勢曰還有人醫得吾口麼衆僧競送藥以至俗士聞之亦多送藥師並不受七日後師自摑口令正乃曰如許多時鼓這兩片皮至今無人醫得即端坐而逝韶州靈樹如敏禪師閩人也廣主劉氏奕世欽重署知聖大師僧問佛法至理如何師展手而已問如何是和尚家風師曰千年田八百主曰如何是千年田八百主師曰郎當屋舍沒人修問如何是西來意師曰童子莫徭兒曰乞師指示師曰汝從虔州來問是甚麼得恁麼難會師曰火官頭上風車子有尼送瓷鉢與師師拓起問曰這箇出在甚麼曰出在定州法燈別云不遽此間師乃撲破尼無對保福代云欺敵者亡問和尚年多少師曰今日生來朝死又問和尚生緣甚麼處師曰日出東月落西師四十餘年化被嶺表頗有異迹廣主將興兵躬入院請師決臧否師已先知怡然坐化主怒知事曰和尚何時得疾對曰不曾有疾適封一函子令呈大王主開函得一帖子云人天眼目堂中上座主悟師旨遂寢兵乃召第一座開堂説法即雲門也龕塔葬儀廣主具辦諡靈樹禪師真身塔焉福州靈雲志勤禪師本州長溪人也初在溈山因見桃華悟道有偈曰三十年來尋劍客幾回落葉又抽枝自從一見桃華後直至如今更不疑溈覽偈詰其所悟與之府契溈曰從緣悟達永無退失善自護持有僧舉似玄沙沙云諦當甚諦當敢保老兄未徹在衆疑此語沙問地藏我恁麼道汝作麼生會藏云不是桂琛即走殺天下人住後上堂諸仁者所有長短盡至不常且觀四時草木華落華開何況塵劫來天人七趣地水火風成壞輪轉因果將盡三惡道苦毛髮不曾添減唯根帶神識常存上根者遇善友伸明當處解脫便是道場中下癡愚不能覺照沈迷三界流轉生死釋尊為伊天上人間設教證明顯發智道汝等還會麼僧問如何得出離生老病死師曰青山元不動浮雲任去來問君王出陳時如何師曰春明門外不問長安曰如何得覲天子師曰盲鶴下清池魚從腳底過問如何是佛法大意師曰驢事未去馬事到來曰學人不會師曰彩氣夜常動精靈日少逢雪峯有偈送雙峯末句云雷罷不停聲師別云雷震不問聲峯聞乃曰靈雲山頭古月現峯後問曰古人道前三三後三三意旨如何師曰水中魚天上鳥峯曰意作麼生師曰高可射兮深可釣僧問諸方悉皆雜食未審和尚如何師曰獨有閩中異雄雄鎮海涯問久戰沙場為甚麼功名不就師曰君王有道三邊靜何勞萬里築長城曰罷却干戈束手歸朝時如何師曰慈雲普潤無邊剎枯樹無華爭奈何長生問混沌未分時含生何來師曰如露柱懷胎曰分後如何師曰如片雲點太清曰未審太清還受點也無師不答曰恁麼則含生不來也師亦不答曰直得純清絶點時如何師曰猶是真常流注曰如何是真常流注師曰似鏡長明曰向上更有事也無師曰有曰如何是向上事師曰打破鏡來與汝相見僧問如何是西來意師曰井底種林檎曰學人不會師曰今年桃李貴一顆直千金問摩尼珠不隨衆色未審作何色師曰白色曰恁麼則隨衆色也師曰趙璧本無瑕相如誑秦主問僧甚處去曰雪峯去師曰我有一信寄雪峯得麼曰便請師脫隻履拋向面前僧便去至雪峯峯問甚處來曰靈雲來峯曰靈雲安否曰有一信相寄峯曰在那裏僧脫隻履拋向峯面前峯休去福州壽山師解禪師嘗參洞山山問闍黎生緣何處師曰和尚若實問某甲即是閩中人也曰汝父名甚麼師曰今日蒙和尚致此一問直得忘前失後住後上堂諸上座幸有真實言語相勸諸兄弟合各自體悉凡聖情盡體露真常但一時卸却從前虗妄攀緣塵垢心如虗空相似他時後日合識得些子好惡閩帥問壽山年多少師曰與虗空齊年曰虗空年多少師曰與壽山齊年饒州嶤山和尚僧問如何是西來意師曰仲冬嚴寒問如何是和尚深深處師曰待汝舌頭落地即向汝道問如何是丈六金身師曰判官斷案相公改長慶問從上宗乘此間如何言論師曰有願不負先聖慶曰不負先聖作麼生師曰不露慶曰恁麼則請師領話師曰甚麼處去來慶曰祇守甚麼處去來泉州國歡崇福院文矩慧日禪師福州黃氏子生而有異及長為縣獄卒每每棄役往神光觀和尚及西院安禪師所吏不能禁後謁萬歲塔談空禪師落髮不披袈裟不受具戒唯以雜綵為挂子復至神光光曰我非汝師汝禮西院去師擕一小青竹杖入西院法堂院遙見笑曰入涅槃堂去師應諾輪竹杖而入時有五百許僧染時疾師以杖次第點之各隨點而起閩王禮重創院以居之厥後頗多靈迹唐乾寧中示滅台州浮江和尚雪峯領衆到問即今有二百人寄此過夏得麼師將拄杖畫一畫著不得即道峯休去潞州淥水和尚僧問如何是祖師西來意師曰還見庭前華藥欄麼僧無語廣州文殊院圓明禪師福州陳氏子參大溈得旨後造雪峯請益法無異味嘗遊五臺山覩文殊化現乃隨方建院以文殊為額開寶中樞密使李崇矩巡護南方因入院覩地藏菩薩像問僧地藏何以展手僧曰手中珠被賊偷却也李却問師既是地藏為甚麼遭賊師曰今日捉下也李禮謝之趙州諗禪師法嗣洪州新興嚴陽尊者諱善信初參趙州問一物不將來時如何州曰放下著師曰既是一物不將來放下箇甚麼州曰放不下擔取去師於言下大悟住後僧問如何是佛師曰土塊曰如何是法師曰地動也曰如何是僧師曰喫粥喫飯問如何是新興水師曰面前江裏問如何是應物現形師曰與我拈牀子過來師常有一蛇一虎隨從手中與食揚州光孝院慧覺禪師僧問覺華才綻遍滿娑婆祖印西來合談何事師曰情生智隔曰此是教意師曰汝披甚麼衣服問一棒打破虗空時如何師曰困即歇去師問相國宋齊丘曰還會道麼宋曰若是道也著不得師曰是有著不得是無著不得宋曰總不恁麼師曰著不得底聻宋無對師領衆出見露柱乃合掌曰不審世尊僧曰和尚是露柱師曰啼得血流無用處不如緘口過殘春問遠遠投師師意如何師曰官家嚴切不許安排曰豈無方便師曰且向火倉裏一宿師到崇壽法眼問近離甚處師曰趙州眼曰承聞趙州有庭前柏樹子話是否師曰無眼曰往來皆謂僧問如何是祖師西來意州曰庭前柏樹子上座何得言無師曰先師實無此語和尚莫謗先師好張居士問爭奈老何師曰年多少張曰八十也師曰可謂老也曰究竟如何師曰直至千歲也未在俗士問某甲平生殺牛還有罪否師曰無罪曰為甚麼無罪師曰殺一箇還一箇隴州國清院奉禪師僧問祖意教意是同是別師曰雨滋三草秀春風不裹頭曰畢竟是一是二師曰祥雲競起巖洞不虧問如何是和尚家風師曰臺盤椅子火爐窗牖問如何是出家人師曰銅頭鐵額鳥觜鹿身曰如何是出家人本分事師曰早起不審夜問珍重問牛頭未見四祖時為甚麼百鳥銜花師曰如陝府人送錢財與鐵牛曰見後為甚麼不銜花師曰木馬投明行八百問十二時中如何降伏其心師曰敲冰求火論劫不逢問十二分教是止啼之義離却止啼請師一句師曰孤峯頂上雙角女問如何是佛法大意師曰釋迦是牛頭獄卒祖師是馬面阿旁問如何是西來意師曰東壁打西壁問如何是撲不破底句師曰不隔毫氂時人遠嚮婺州木陳從朗禪師僧問放鶴出籠和雪去時如何師曰我道不一色因金剛倒僧問既是金剛不壞身為甚麼却倒地師敲禪牀曰行住坐臥師將歸寂有偈曰三十年來住木陳時中無一假功成有人問我西來意展似眉毛作麼生婺州新建禪師不度小師有僧問和尚年老何不畜一童子侍奉師曰有瞽聵者為吾討來僧辭師問甚處去曰府下開元寺去師曰我有一信附與了寺主汝將去得否曰便請師曰想汝也不奈何杭州多福和尚僧問如何是多福一叢竹師曰一莖兩莖斜曰學人不會師曰三莖四莖曲問如何是衲衣下事師曰大有人疑著在曰為甚麼如是師曰月裏藏頭益州西睦和尚上堂有俗士舉手曰和尚便是一頭驢師曰老僧被汝騎士無語去後三日再來白言某甲三日前著賊師拈杖趂出師有時驀喚侍者者應諾師曰更深夜靜共伊商量長沙岑禪師法嗣明州雪竇常通禪師邢州李氏子參長沙沙問何處人師曰邢州人沙曰我道汝不從彼來師曰和尚還曾住此否沙然之乃容入室住後僧問如何是密室師曰不通風信曰如何是密室中人師曰諸聖求覩不見僧作禮師曰千聖不能思萬聖不能議乾坤壞不壞虗空包不包一切無比倫三世唱不起問如何是三世諸佛出身處師曰伊不肯知有汝三世僧良久師曰薦否不然者且向著佛不得處體取時中常在識盡功亡瞥然而起即是傷他而況言句乎天祐二年七月示寂塔於寺西南隅茱萸和尚法嗣石梯和尚因侍者請浴師曰既不洗塵亦不洗體汝作麼生者曰和尚先去某甲將皂角來師呵呵大笑有新到於師前立少頃便出去師曰有甚麼辨白處僧再回師曰辨得也曰辨後作麼生師曰埋却得也曰蒼天蒼天師曰適來却恁麼如今還不當僧乃出去一日見侍者拓鉢赴堂乃喚侍者者應諾師曰甚處去者曰上堂齋去師曰我豈不知汝上堂齋去者曰除此外別道箇甚麼師曰我祇問汝本分事者曰和尚若問本分事某甲實是上堂齋去師曰汝不謬為吾侍者子湖蹤禪師法嗣台州勝光和尚僧問如何是和尚家風師曰福州荔枝泉州刺桐問如何是佛法兩字師曰要道即道曰請師道師曰穿耳胡僧笑點頭龍華照和尚來師把住曰作麼生照曰莫錯師乃放手照曰久嚮勝光師默然照乃辭師門送曰自此一別甚麼處相見照呵呵而去漳州浮石和尚上堂山僧開箇卜鋪能斷人貧富定人生死僧問離却生死貧富不落五行請師直道師曰金木水火土紫桐和尚僧問如何是紫桐境師曰汝眼裡著沙得麼曰大好紫桐境也不識師曰老僧不諱此事其僧擬出去師下禪牀擒住曰今日好箇公案老僧未得分文入手曰賴遇某甲是僧師拓開曰禍不單行日容遠和尚因奯上座參師拊掌三下曰猛虎當軒誰是敵者奯曰俊鷂沖天阿誰捉得師曰彼此難當奯曰且休未要斷這公案師將拄杖舞歸方丈奯無語師曰死却這漢也關南常禪師法嗣襄州關南道吾和尚始經村墅聞巫者樂神云識神無忽然省悟後參常禪師印其所解復遊德山之門法味彌著住後凡上堂戴蓮華笠披襴執簡擊鼓吹笛口稱魯三郎神識神不識神神從空裏來却往空裏去便下座有時曰打動關南鼓唱起德山歌僧問如何是祖師西來意師以簡揖曰喏有時執木劒橫肩上作舞僧問手中劒甚處得來師擲於地僧却置師手中師曰甚處得來僧無對師曰容汝三日內下取一轉語其僧亦無對師自代拈劒橫肩上作舞曰須恁麼始得趙州訪師師乃著豹皮裩執吉獠棒在三門下翹一足等候才見州便高聲唱喏而立州曰小心祇候著師又唱喏一聲而去問如何是和尚家風師下禪牀作女人拜曰謝子遠來無可祇待問灌溪作麼生溪曰無位師曰莫同虗空麼溪曰這屠兒師曰有生可殺即不倦漳州羅漢和尚初參關南問如何是大道之源南打師一拳師遂有省乃為歌曰咸通七載初參道到處逢言不識言心裏疑團若栲栳三春不樂止林泉忽遇法王氈上坐便陳疑懇向師前師從氈上那伽起袒膊當胸打一拳駭散疑團獦狚落舉頭看見日初圓從茲蹬蹬以碣碣直至如今常快活只聞肚裏飽膨脝更不東西去持鉢又述偈曰宇內為間客人中作野僧任從他笑我隨處自騰騰高安大愚禪師法嗣瑞州末山尼了然禪師因灌溪間和尚到曰若相當即住不然即推倒禪牀便入堂內師遣侍者問上座遊山來為佛法來溪曰為佛法來師乃升座溪上參師問上座今日離何處曰路口師曰何不蓋却溪無對末山代云爭得到這裏始禮拜問如何是末山師曰不露頂曰如何是末山主師曰非男女相溪乃喝曰何不變去師曰不是神不是鬼變箇甚麼溪於是伏膺作園頭三載僧到參師曰太縷生曰雖然如此且是師子兒師曰既是師子兒為甚麼被文殊騎僧無對問如何是古佛心師曰世界傾壞曰世界為甚麼傾壞師曰寧無我身杭州天龍和尚法嗣婺州金華山俱胝和尚初住庵時有尼名實際來戴笠子執錫繞師三匝曰道得即下笠子如是三問師皆無對尼便去師曰日勢稍晚何不且住尼曰道得即住師又無對尼去後師斷曰我雖處丈夫之形而無丈夫之氣不如棄庵往諸方參尋知識去其夜山神告曰不須離此將有肉身菩薩來為和尚説法也逾旬果天龍和尚到庵師乃迎禮具陳前事龍竪一指示之師當下大悟自此凡有學者參問師唯舉一指無別提唱有一供過童子每見人問事亦竪指祇對人謂師曰和尚童子亦會佛法凡有問皆如和尚竪指師一日潛袖刀子問童曰聞你會佛法是否童曰是師曰如何是佛童竪起指頭師以刀斷其指童呌喚走出師召童子童回首師曰如何是佛童舉手不見指頭豁然大悟師將順世謂衆曰吾得天龍一指頭禪一生用不盡言訖示滅長慶代衆云美食不中飽人喫玄沙云我當時若見拗折指頭玄覺云且道玄沙恁麼道意作麼生雲居錫云祇如玄沙恁麼道肯伊不肯伊若肯何言拗折指頭若不肯俱胝過在甚麼處先曹山云俱胝承當處鹵莽祇認得一機一境一等是拍手拊掌是他西園奇怪玄覺又云且道俱胝還悟也無若悟為甚麼道承當處鹵莽若不悟又道用一指頭禪不盡且道曹山意在甚麼處南嶽下五世睦州陳尊宿法嗣睦州刺史陳操尚書齋次拈起糊餅問僧江西湖南還有這箇麼曰尚書適來喫箇甚麼公曰敲鐘謝響又齋僧次躬自行餅一僧展手擬接公却縮手僧無語公曰果然果然問僧有箇事與上座商量得麼曰合取狗口公自摑口曰某甲罪過曰知過必改公曰恁麼則乞上座口喫飯得麼又齋僧自行食次乃曰上座施食僧曰三德六味公曰錯僧無對又與僚屬登樓次見數僧行來有一官人曰來者總是行腳僧公曰不是曰焉知不是公曰待來勘過須臾僧至樓前公驀喚上座僧皆舉首公謂諸官曰不信道又與禪者頌曰禪者有玄機機玄是復非欲了機前旨咸於句下違光孝覺禪師法嗣升州長慶道巘禪師廬州人也初侍光孝便領悟微言即於湖南大光山剃度既化緣彌盛出住長慶上堂彌勒朝入伽藍暮成正覺説偈曰三界上下法我説皆是心離於諸心法更無有可得看他恁麼道也太殺惺惺若比吾徒猶是鈍漢所以一念見道三世情盡如印印泥更無前後諸子生死事大快須薦取莫為等間業識茫茫蓋為迷己逐物世尊臨入涅槃文殊請再轉法輪世尊咄曰吾四十九年住世不曾説一字汝請吾再轉法輪是吾曾轉法輪邪然今時衆中建立箇賓主問答事不獲已蓋為初心耳僧問如何是長慶境師曰闍黎履踐看問如何是佛法大意師曰今日三月三曰學人不會師曰止止不須説我法妙難思便下座咸平二年示寂
