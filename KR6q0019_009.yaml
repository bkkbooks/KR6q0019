body:
  text: 溈仰宗南嶽下三世百丈海禪師法嗣潭州溈山靈祐禪師福州長谿趙氏子年十五出家依本郡建善寺法常律師剃髮於杭州龍興寺究大小乘教二十三遊江西參百丈丈一見許之入室遂居參學之首侍立次丈問誰師曰某甲丈曰汝撥爐中有火否師撥之曰無火丈躬起深撥得少火舉以示之曰汝道無這箇聻師由是發悟禮謝陳其所解丈曰此乃暫時岐路耳經云欲識佛性義當觀時節因緣時節既至如迷忽悟如忘忽憶方省己物不從他得故祖師云悟了同未悟無心亦無法祇是無虗妄凡聖等心本來心法元自備足汝今既爾善自護持次日同百丈入山作務丈曰將得火來麼師曰將得來丈曰在甚處師乃拈一枝柴吹兩吹度與百丈丈曰如蟲禦木司馬頭陀自湖南來謂丈曰頃在湖南尋得一山名大溈是一千五百人善知識所居之處丈曰老僧住得否陀曰非和尚所居丈曰何也陀曰和尚是骨人彼是肉山設居徒不盈千丈曰吾眾中莫有人住得否陀曰待歷觀之時華林覺為第一座丈令侍者請至問曰此人如何陀請謦欵一聲行數步陀曰不可丈又令喚師師時為典座陀一見乃曰此正是溈山主人也丈是夜召師入室囑曰吾化緣在此溈山勝境汝當居之嗣續吾宗廣度後學而華林聞之曰某甲忝居上首典座何得住持丈曰若能對眾下得一語出格當與住持即指淨瓶問曰不得喚作淨瓶汝喚作甚麼林曰不可喚作木𣔻也丈乃問師師踢倒淨瓶便出去丈笑曰第一座輸却山子也師遂往焉是山峭絕敻無人煙猿猱為伍橡栗充食經于五七載絕無來者師自念言我本住持為利益於人既絕往還自善何濟即捨庵而欲他往行至山口見虵虎狼豹交橫在路師曰汝等諸獸不用攔吾行路吾若於此山有緣汝等各自散去吾若無緣汝等不用動吾從路過一任汝喫言訖蟲虎四散而去師乃回庵未及一載安上座即懶安也同數僧從百丈來輔佐於師安曰某與和尚作典座待僧及五百人不論時節即不造粥便放某甲下自後山下居民稍稍知之率眾共營梵宇連帥李景讓奏號同慶寺相國裴公休甞咨玄奧繇是天下禪學輻輳焉上堂夫道人之心質直無偽無背無面無詐妄心一切時中視聽尋常更無委曲亦不閉眼塞耳但情不附物即得從上諸聖祇說濁邊過患若無如許多惡覺情見想習之事譬如秋水澄渟清淨無為澹泞無礙喚他作道人亦名無事人時有僧問頓悟之人更有修否師曰若真悟得本他自知時修與不修是兩頭語如今初心雖從緣得一念頓悟自理猶有無始曠劫習氣未能頓淨須教渠淨除現業流識即是修也不可別有法教渠修行趣向從聞入理聞理深妙心自圓明不居惑地縱有百千妙義抑揚當時此乃得坐披衣自解作活計始得以要言之則實際理地不受一塵萬行門中不捨一法若也單刀直入則凡聖情盡體露真常理事不二即如如佛仰山問如何是祖師西來意師指燈籠曰大好燈籠仰曰莫祇這便是麼師曰這箇是甚麼仰曰大好燈籠師曰果然不見一日師謂眾曰如許多人祇得大機不得大用仰山舉此語問山下庵主曰和尚恁麼道意旨如何主曰更舉看仰擬再舉被庵主踏倒仰歸舉似師師呵呵大笑師在法堂坐庫頭擊木魚火頭擲却火杪拊掌大笑師曰眾中也有恁麼人遂喚來問你作麼生火頭曰某甲不喫粥肚飢所以歡喜師乃點頭後鏡清怤云將知溈山眾裏無人臥龍球云將知溈山眾裏有人師摘茶次謂仰山曰終日摘茶祇聞子聲不見子形仰撼茶樹師曰子祇得其用不得其體仰曰未審和尚如何師良久仰曰和尚祇得其體不得其用師曰放子三十棒仰曰和尚棒某甲喫某甲棒教誰喫師曰放子三十棒玄覺云且道過在甚麼處上堂僧出曰請和尚為眾說法師曰我為汝得徹困也僧禮拜後人舉似雪峯峯曰古人得恁麼老婆心切玄沙云山頭和尚蹉過古人事也雪峯聞之乃問沙曰甚麼處是老僧蹉過古人事處沙曰大小溈山被那僧一問直得百雜碎峯乃駭然師坐次仰山入來師曰寂子速道莫入陰界仰曰慧寂信亦不立師曰子信了不立不信不立仰曰祇是慧寂更信阿誰師曰若恁麼即是定性聲聞仰曰慧寂佛亦不立師問仰山涅槃經四十卷多少是佛說多少是魔說仰曰總是魔說師曰已後無人奈子何仰曰慧寂即一期之事行履在甚麼處師曰祇貴子眼正不說子行履仰山蹋衣次提起問師曰正恁麼時和尚作麼生師曰正恁麼時我這裏無作麼生仰曰和尚有身而無用師良久却拈起問曰汝正恁麼時作麼生仰曰正恁麼時和尚還見伊否師曰汝有用而無身師後忽問仰山汝春間有話未圓今試道看仰曰正恁麼時切忌勃訴師曰停囚長智師一日喚院主主便來師曰我喚院主汝來作甚麼主無對曹山代云也知和尚不喚某甲又令侍者喚第一座座便至師曰我喚第一座汝來作甚麼座亦無對曹山代云若令侍者喚恐不來法眼云適來侍者喚師問雲巖聞汝久在藥山是否巖曰是師曰如何是藥山大人相巖曰涅槃後有師曰如何是涅槃後有巖曰水灑不著巖却問師百丈大人相如何師曰巍巍堂堂煒煒煌煌聲前非聲色後非色蚊子上鐵牛無汝下觜處師過淨瓶與仰山山擬按師却縮手曰是甚麼仰曰和尚還見箇甚麼師曰若恁麼何用更就吾覓仰曰雖然如此仁義道中與和尚提瓶挈水亦是本分事師乃過淨瓶與仰山師與仰山行次指栢樹子問曰前面是甚麼仰曰栢樹子師却問耘田翁翁亦曰栢樹子師曰這耘田翁向後亦有五百眾師問仰山何處來仰曰田中來師曰禾好刈也未仰作刈禾勢師曰汝適來作青見作黃見作不青不黃見仰曰和尚背後是甚麼師曰子還見麼仰拈禾穗曰和尚何曾問這箇師曰此是鵝王擇乳師問仰山天寒人寒仰曰大家在這裏師曰何不直說仰曰適來也不曲和尚如何師曰直須隨流上堂仲冬嚴寒年年事晷運推移事若何仰山進前叉手而立師曰我情知汝答這話不得香嚴曰某甲偏答得這話師躡前問嚴亦進前叉手而立師曰賴遇寂子不會師一日見劉鐵磨來師曰老牸牛汝來也磨曰來日臺山大會齋和尚還去麼師乃放身作臥勢磨便出去有僧來禮拜師作起勢僧曰請和尚不用起師曰老僧未曾坐僧曰某甲未曾禮師曰何故無禮僧無對同安代云和尚不怪僧問如何是道師曰無心是道曰某甲不會師曰會取不會底好曰如何是不會底師曰祇汝是不是別人復曰今時人但直下體取不會底正是汝心正是汝佛若向外得一知一解將為禪道且沒交涉名運糞入不名運糞出汙汝心田所以道不是道問如何是百丈真師下禪牀叉手立曰如何是和尚真師却坐師坐次仰山從方丈前過師曰若是百丈先師見子須喫痛棒始得仰曰即今事作麼生師曰合取兩片皮仰曰此恩難報師曰非子不才廼老僧年邁仰曰今日親見百丈師翁來師曰子向甚麼處見仰曰不道見祇是無別師曰始終作家師問仰山即今事且置古來事作麼生仰叉手近前師曰猶是即今事古來事作麼生仰退後立師曰汝屈我我屈汝仰便禮拜仰山香嚴侍立次師舉手曰如今恁麼者少不恁麼者多嚴從東過西立仰從西過東立師曰這箇因緣三十年後如金擲地相似仰曰亦須是和尚提唱始得嚴曰即今亦不少師曰合取口師坐次仰山入來師以兩手相交示之仰作女人拜師曰如是如是師方丈內坐次仰山入來師曰寂子近日宗門令嗣作麼生仰曰大有人疑著此事師曰寂子作麼生仰曰慧寂祇管困來合眼健即坐禪所以未曾說著在師曰到這田地也難得仰曰據慧寂所見祇如此一句也著不得師曰汝為一人也不得仰曰自古聖人盡皆如此師曰大有人笑汝恁麼祇對仰曰解笑者是慧寂同參師曰出頭事作麼生仰繞禪牀一匝師曰裂破古今仰山香嚴侍立次師曰過去現在未來佛佛道同人人得箇解脫路仰曰如何是人人解脫路師回顧香嚴曰寂子借問何不答伊嚴曰若道過去未來現在某甲却有箇祇對處師曰子作麼生祇對嚴珍重便出師却問仰山曰智閑恁麼祇對還契寂子也無仰曰不契師曰子又作麼生仰亦珍重出去師呵呵大笑曰如水乳合一日師翹起一足謂仰山曰我每日得他負載感伊不徹仰曰當時給孤園中與此無別師曰更須道始得仰曰寒時與他襪著也不為分外師曰不負當初子今已徹仰曰恁麼更要答話在師曰道看仰曰誠如是言師曰如是如是師問仰山生住異滅汝作麼生會仰曰一念起時不見有生住異滅師曰子何得遣法仰曰和尚適來問甚麼師曰生住異滅仰曰却喚作遣法師問仰山妙淨明心汝作麼生會仰曰山河大地日月星辰師曰汝祇得其事仰曰和尚適來問甚麼師曰妙淨明心仰曰喚作事得麼師曰如是如是石霜會下有二禪客到云此間無一人會禪後普請搬柴仰山見二禪客歇將一橛柴問曰還道得麼俱無對仰曰莫道無人會禪好仰歸舉似師曰今日二禪客被慧寂勘破師曰甚麼處被子勘破仰舉前話師曰寂子又被吾勘破雲居錫云甚處是溈山勘破仰山處師睡次仰山問訊師便回面向壁仰曰和尚何得如此師起曰我適來得一夢你試為我原看仰取一盆水與師洗面少頃香嚴亦來問訊師曰我適來得一夢寂子為我原了汝更與我原看嚴乃點一椀茶來師曰二子見解過於鶖子師因泥壁次李軍容來具公裳直至師背後端笏而立師回首見便側泥盤作接泥勢李便轉笏作進泥勢師便拋下泥盤同歸方丈僧問不作溈山一頂笠無由得到莫傜村如何是溈山一頂笠師喚曰近前來僧近前師與一踏上堂老僧百年後向山下作一頭水牯牛左脇下書五字曰溈山僧某甲當恁麼時喚作溈山僧又是水牯牛喚作水牯牛又是溈山僧畢竟喚作甚麼即得仰山出禮拜而退雲居膺代曰師無異號資福寶曰當時但作此相拓呈之新羅和尚作此相拓呈之又曰同道者方知芭蕉徹作此相拓呈之又曰說也說了也注也注了也悟取好乃述偈曰不是溈山不是牛一身兩號實難酬離却兩頭應須道如何道得出常流師敷揚宗教凡四十餘年達者不可勝數大中七年正月九日盥漱敷坐怡然而寂壽八十三臘六十四塔于本山諡大圓禪師塔曰清淨南嶽下四世溈山祐禪師法嗣袁州仰山慧寂通智禪師韶州懷化葉氏子年九歲於廣州和安寺投通禪師出家即不語通十四歲父母取歸欲與婚媾師不從遂斷手二指跪致父母前誓求正法以答劬勞父母乃許再詣通處而得披剃未登具即遊方初謁耽源已悟玄旨後參溈山遂升堂奧耽源謂師曰國師當時傳得六代祖師圓相共九十七箇授與老僧乃曰吾滅後三十年南方有一沙彌到來大興此教次第傳受無令斷絕我今付汝汝當奉持遂將其本過與師師接得一覧便將火燒却耽源一日問前來諸相甚宜秘惜師曰當時看了便燒却也源曰吾此法門無人能會唯先師及諸祖師諸大聖人方可委悉子何得焚之師曰慧寂一覧已知其意但用得不可執本也源曰然雖如此於子即得後人信之不及師曰和尚若要重錄不難即重集一本呈上更無遺失源曰然耽源上堂師出眾作此相以手拓呈了却叉手立源以兩手相交作拳示之師進前三步作女人拜源點頭師便禮拜師浣衲次耽源曰正恁麼時作麼生師曰正恁麼時向甚麼處見後參溈山溈問汝是有主沙彌無主沙彌師曰有主曰主在甚麼處師從西過東立溈異之師問如何是真佛住處溈曰以思無思之妙返思靈𦦨之無窮思盡還源性相常住事理不二真佛如如師於言下頓悟自此執侍前後盤桓十五載後參巖頭頭舉起拂子師展坐具巖拈拂子置背後師將坐具搭肩上而出巖曰我不肯汝放祇肯汝收掃地次溈問塵非掃得空不自生如何是塵非掃得師掃地一下溈曰如何是空不自生師指自身又指溈溈曰塵非掃得空不自生離此二途又作麼生師又掃地一下又指自身并指溈溈一日指田問師這丘田那頭高這頭低師曰却是這頭高那頭低溈曰你若不信向中間立看兩頭師曰不必立中間亦莫住兩頭溈曰若如是著水看水能平物師曰水亦無定但高處高平低處低平溈便休有施主送絹與溈山師問和尚受施主如是供養將何報答溈敲禪牀示之師曰和尚何得將眾人物作自己用師在溈山為直歲作務歸溈問甚麼處去來師曰田中來溈曰田中多少人師插鍬叉手溈曰今日南山大有人刈茅師拔鍬便行玄沙云我若見即踏倒鍬子僧問鏡清仰山插鍬意旨如何清云狗銜赦書諸侯避道云祇如玄沙踏倒意旨如何清云不奈船何打破戽斗云南山刈茅意旨如何清云李靖三兄久經行陣雲居錫云且道鏡清下此一判著不著師在溈山牧牛時踢天泰上座問曰一毛頭師子現即不問百億毛頭百億師子現又作麼生師便騎牛歸侍立溈山次舉前話方了却見泰來師曰便是這箇上座溈遂問百億毛頭百億師子現豈不是上座道泰曰是師曰正當現時毛前現毛後現泰曰現時不說前後溈山大笑師曰師子腰折也便下去一日第一座舉起拂子曰若人作得道理即與之師曰某甲作得道理還得否座曰但作得道理便得師乃掣將拂子去雲居錫云甚麼處是仰山道理一日雨下天性上座謂師曰好雨師曰好在甚麼處性無語師曰某甲却道得性曰好在甚麼處師指雨性又無語師曰何得大智而默師隨溈山遊山到磐陀石上坐師侍立次忽鵶銜一紅柿落在面前溈拾與師師接得洗了度與溈溈曰子甚處得來師曰此是和尚道德所感溈曰汝也不得無分即分半與師玄沙云大小溈山被仰山一坐至今起不得溈山問師忽有人問汝汝作麼生祇對師曰東寺師叔若在某甲不致寂寞溈曰放汝一箇不祇對罪師曰生之與殺祇在一言溈曰不負汝見別有人不肯師曰阿誰溈指露柱曰這箇師曰道甚麼溈曰道甚麼師曰白鼠推遷銀臺不變師問溈山大用現前請師辨白溈山下座歸方丈師隨後入溈問子適來問甚麼話師再舉溈曰還記得吾答語否師曰記得溈曰你試舉看師便珍重出去溈曰錯師回首曰閑師弟若來莫道某甲無語好師問東寺曰借一路過那邊還得否寺曰大凡沙門不可祇一路也別更有麼師良久寺却問借一路過那邊得否師曰大凡沙門不可祇一路也別更有麼寺曰祇有此師曰大唐天子決定姓金師在溈山前坡牧牛次見一僧上山不久便下來師乃問上座何不且留山中僧曰祇為因緣不契師曰有何因緣試舉看曰和尚問某名甚麼某答歸真和尚曰歸真何在某甲無對師曰上座却回向和尚道某甲道得也和尚問作麼生道但曰眼裏耳裏鼻裏僧回一如所教溈曰脫空謾語漢此是五百人善知識語師臥次夢入彌勒內院眾堂中諸位皆足惟第二位空師遂就座有一尊者白槌曰今當第二座說法師起白槌曰摩訶衍法離四句絕百非諦聽諦聽眾皆散去及覺舉似溈溈曰子已入聖位佛便禮拜師侍溈行次忽見前面塵起溈曰面前是甚麼師近前看了却作此相溈點頭溈山示眾曰一切眾生皆無佛性鹽官示眾曰一切眾生皆有佛性鹽官有二僧往探問既到溈山聞溈山舉揚莫測其涯若生輕慢因一日與師言話次乃勸曰師兄須是勤學佛法不得容易師乃作此相以手拓呈了却拋向背後遂展兩手就二僧索二僧罔措師曰吾兄直須勤學佛法不得容易便起去時二僧却回鹽官行三十里一僧忽然有省乃曰當知溈山道一切眾生皆無佛性信之不錯便回溈山一僧更前行數里因過水忽然有省自歎曰溈山道一切眾生皆無佛性灼然有他恁麼道亦回溈山久依法席溈山同師牧牛次溈曰此中還有菩薩也無師曰有溈曰汝見那箇是試指出看師曰和尚疑那箇不是試指出看溈便休師送果子上溈山溈接得問子甚麼處得來師曰家園底溈曰堪喫也未師曰未敢甞先獻和尚溈曰是阿誰底師曰慧寂底溈曰既是子底因甚麼教我先甞師曰和尚甞千甞萬溈便喫曰猶帶酸澀在師曰酸澀莫非自知溈不答赤干行者聞鐘聲乃問有耳打鐘無耳打鐘師曰汝但問莫愁我答不得干曰早箇問了也師喝曰去師夏末問訊溈山次溈曰子一夏不見上來在下面作何所務師曰某甲在下面鉏得一片畬下得一籮種溈曰子今夏不虗過師却問未審和尚一夏之中作何所務溈曰日中一食夜後一寢師曰和尚今夏亦不虗過道了乃吐舌溈曰寂子何得自傷己命溈山一日見師來即以兩手相交過各撥三下却竪一指師亦以兩手相交過各撥三下却向胸前仰一手覆一手以目瞻視溈山休去溈山餧鵶生飯回頭見師曰今日為伊上堂一上師曰某甲隨例得聞溈曰聞底事作麼生師曰鵶作鵶鳴鵲作鵲噪溈曰爭奈聲色何師曰和尚適來道甚麼溈曰我祇道為伊上堂一上師曰為甚麼喚作聲色溈曰雖然如此驗過也無妨師曰大事因緣又作麼生驗溈竪起拳師曰終是指東畵西溈曰子適來問甚麼師曰問和尚大事因緣溈曰為甚麼喚作指東畫西師曰為著聲色故某甲所以問過溈曰竝未曉了此事師曰如何得曉了此事溈曰寂子聲色老僧東西師曰一月千江體不分水溈曰應須與麼始得師曰如金與金終無異色豈有異名溈曰作麼生是無異名底道理師曰瓶盤釵釧券盂盆溈曰寂子說禪如師子吼驚散狐狼野干之屬師後開法王莽山問僧近離甚處曰廬山師曰曾到五老峯麼曰不曾到師曰闍黎不曾遊山雲門云此語皆為慈悲之故有落草之談上堂汝等諸人各自回光返照莫記吾言汝無始劫來背明投暗妄想根深卒難頓所以假設方便奪汝麤識如將黃葉止啼有甚麼是處亦如人將百種貨物與金寶作一鋪貨賣祇擬輕重來機所以道石頭是真金鋪我這裏是雜貨鋪有人來覓鼠糞我亦拈與他來覓真金我亦拈與他時有僧問鼠糞即不要請和尚真金師曰嚙鏃擬開口驢年亦不會僧無對師曰索喚則有交易不索喚則無我若說禪宗身邊要一人相伴亦無豈況有五百七百眾邪我若東說西說則爭頭向前采拾如將空拳誑小兒都無實處我今分明向汝說聖邊事且莫將心湊泊但向自己性海如實而修不要三明六通何以故此是聖末邊事如今且要識心達本但得其本不愁其末他時後日自具去在若未得本縱饒將情學他亦不得汝豈不見溈山和尚云凡聖情盡體露真常事理不二即如如佛問如何是祖師意師以手於空作此相示之僧無語師謂第一座曰不思善不思惡正恁麼時作麼生座曰正恁麼時是某甲放身命處師曰何不問老僧座曰正恁麼時不見有和尚師曰扶我教不起師因歸溈山省覲溈問子既稱善知識爭辨得諸方來者知有不知有有師承無師承是義學是玄學子試說看師曰慧寂有驗處但見僧來便竪起拂子問伊諸方還說這箇不說又曰這箇且置諸方老宿意作麼生溈歎曰此是從上宗門中牙爪溈問大地眾生業識茫茫無本可據子作麼生知他有之與無師曰慧寂有驗處時有一僧從面前過師召曰闍黎僧回首師曰和尚這箇便是業識茫茫無本可據溈曰此是師子一滴乳迸散六斛驢乳師問僧甚處來曰幽州師曰我恰要箇幽州信米作麼價曰某甲來時無端從市中過踏折他橋梁師便休師見僧來竪起拂子僧便喝師曰喝即不無且道老僧過在甚麼處曰和尚不合將境示人師便打有梵師從空而至師曰近離甚處曰西天師曰幾時離彼曰今早師曰何太遲生曰遊山翫水師曰神通遊戲則不無闍黎佛法須還老僧始得曰特來東土禮文殊却遇小釋迦遂出梵書貝多葉與師作禮乘空而去自此號小釋迦師住東平時溈山令僧送書并鏡與師師上堂提起示眾曰且道是溈山鏡東平鏡若道是東平鏡又是溈山送來若道是溈山鏡又在東平手裏道得則留取道不得則撲破去也眾無語師遂撲破便下座僧參次便問和尚還識字否師曰隨分僧以手畫此相拓呈師以衣袖拂之僧又作此相拓呈師以兩手作背拋勢僧以目視之師低頭僧遶師一匝師便打僧遂出去師坐次有僧來作禮師不顧其僧乃問師識字否師曰隨分僧乃右旋一匝曰是甚麼字師於地上書十字酬之僧又左旋一匝曰是甚字師改十字作卍字僧畫此相以兩手拓如脩羅掌日月勢曰是甚麼字師乃畫此相對之僧乃作婁至德勢師曰如是如是此是諸佛之所護念汝亦如是吾亦如是善自護持其僧禮謝騰空而去時有一道者見經五日後遂問師師曰汝還見否道者曰某甲見出門騰空而去師曰此是西天羅漢故來探吾道道者曰某雖覩種種三昧不辨其理師曰吾以義為汝解釋此是八種三昧是覺海變為義海體則同然此義合有因有果即時異時總別不離隱身三昧也師問僧近離甚處曰南方師舉拄杖曰彼中老宿還說這箇麼曰不說師曰既不說這箇還說那箇否曰不說師召大德僧應諾師曰參堂去僧便出師復召曰大德僧回首師曰近前來僧近前師以拄杖頭上點一下曰去劉侍御問了心之旨可得聞乎師曰若要了心無心可了無了之心是名真了師一日在法堂上坐見一僧從外來便問訊了向東邊义手立以目視師師乃垂下左足僧却過西邊义手立師垂下右足僧向中間义手立師收雙足僧禮拜師曰老僧自住此未曾打著一人拈拄杖便打僧便騰空而去陸希聲相公欲謁師先作此相封呈師開封於相下面書云不思而知落第二頭思而知之落第三首遂封回韋宙相公機語相似茲不重出公見即入山師乃門迎公纔入門便問三門俱開從何門入師曰從信門入公至法堂又問不出魔界便入佛界時如何師以拂子倒點三下公便設禮又問和尚還持戒否師曰不持戒曰還坐禪否師曰不坐禪公良久師曰會麼曰不會師曰聽老僧一頌滔滔不持戒兀兀不坐禪釅茶三兩椀意在钁頭邊師却問承聞相公看經得悟是否曰弟子因看涅槃經有云不斷煩惱而入涅槃得箇安樂處師竪起拂子曰祇如這箇作麼生入曰入之一字也不消得師曰入之一字不為相公公便起去法燈云上座且道入之一字為甚麼人又云相公且莫煩惱龐居士問久嚮仰山到來為甚麼却覆師竪起拂子士曰恰是師曰是仰是覆士乃打露柱曰雖然無人也要露柱證明師擲拂子曰若到諸方一任舉似師指雪師子問眾有過得此色者麼眾無對雲門云當時便好與推倒師問雙峰師弟近日見處如何曰據某見處實無一法可當情師曰汝解猶在境曰某祇如此師兄又如何師曰汝豈不知無一法可當情者溈山聞曰寂子一句疑殺天下人玄覺云經道實無有法然燈傳與我授記他道實無一法可當情為甚麼道解猶在境且道利害在甚麼處師臥次僧問曰身還解說法也無師曰我說不得別有一人說得曰說得底人在甚麼處師推出枕子溈山聞曰寂子用劒刃上事師閉目坐次有僧潛來身邊立師開目於地上作此相顧視其僧僧無語師擕拄杖行次僧問和尚手中是甚麼師便拈向背後曰見麼僧無對師問一僧汝會甚麼曰會卜師提起拂子曰這箇六十四卦中阿那卦收僧無對師自代云適來是雷天大壯如今變為地火明夷問僧名甚麼曰靈通師曰便請入燈籠曰早箇入了也法眼別云喚甚麼作燈籠問古人道見色便見心禪牀是色請和尚離却色指學人心師曰那箇是禪牀指出來看僧無語玄覺云忽然被伊却指禪牀作麼生對伊有僧云却請和尚道玄覺代拊掌三下問如何是毗盧師師乃叱之僧曰如何是和尚師師曰莫無禮師共一僧語旁有僧曰語底是文殊默底是維摩師曰不語不默底莫是汝否僧默然師曰何不現神通曰不辭現神通祇恐和尚收作教師曰鑒汝來處未有教外底眼問天堂地獄相去幾何師將拄杖畫地一畫師住觀音時出牓云看經次不得問事有僧來問訊見師看經旁立而待師卷却經問會麼曰某甲不看經爭得會師曰汝已後會去在其僧到巖頭頭問甚處來曰江西觀音來頭曰和尚有何言句僧舉前話頭曰這箇老師我將謂被故紙埋却元來猶在僧思𨜶問禪宗頓悟畢竟入門的意如何師曰此意極難若是祖宗門下上根上智一聞千悟得大總持其有根微智劣若不安禪靜慮到這裏總須茫然曰除此一路別更有入處否師曰有曰如何即是師曰汝是甚處人曰幽州人師曰汝還思彼處否曰常思師曰能思者是心所思者是境彼處樓臺林苑人馬駢闐汝反思底還有許多般也無曰某甲到這裏總不見有師曰汝解猶在心信位即得人位未在曰除却這箇別更有意也無師曰別有別無即不堪也曰到這裏作麼生即是師曰據汝所解祇得一玄得坐披衣向後自看𨜶禮謝之師接機利物為宗門標準再遷東平將順寂數僧侍立師以偈示之曰一二二三子平目復仰視兩口一無舌即是吾宗旨至日午陞座辭眾復說偈曰年滿七十七無常在今日日輪正當午兩手攀屈膝言訖以兩手抱膝而終閱明年南塔涌禪師遷靈骨歸仰山塔于集雲峰下諡智通禪師妙光之塔鄧州香嚴智閑禪師青州人也厭俗辭親觀方慕道在百丈時性識聰敏參禪不得洎丈遷化遂參溈山山問我聞汝在百丈先師處問一答十問十答百此是汝聰明靈利意解識想生死根本父母未生時試道一句看師被一問直得茫然歸寮將平日看過底文字從頭要尋一句酬對竟不能得乃自歎曰畫餅不可充飢屢乞溈山說破山曰我若說似汝汝已後罵我去我說底是我底終不干汝事師遂將平昔所看文字燒却曰此生不學佛法也且作箇長行粥飯僧免役心神乃泣辭溈山直過南陽覩忠國師遺跡遂憩止焉一日芟除草木偶拋瓦礫擊竹作聲忽然省悟遽歸沐浴焚香遙禮溈山讚曰和尚大慈恩逾父母當時若為我說破何有今日之事乃有頌曰一擊忘所知更不假修持動容揚古路不墮悄然機處處無蹤跡聲色外威儀諸方達道者咸言上上機溈山聞得謂仰山曰此子徹也仰曰此是心機意識著述得成待某甲親自勘過仰後見師曰和尚讚歎師弟發明大事你試說看師舉前頌仰曰此是夙習記持而成若有正悟別更說看師又成頌曰去年貧未是貧今年貧始是貧去年貧猶有卓錐之地今年貧錐也無仰曰如來禪許師弟會祖師禪未夢見在師復有頌曰我有一機瞬目視伊若人不會別喚沙彌仰乃報溈山曰且喜閉師弟會祖師禪也玄覺云且道如來禪與祖師禪分不分長慶稜云一時坐却師初開堂溈山令僧送書并拄杖至師接得便哭蒼天蒼天僧曰和尚為甚麼如此師曰祇為春行秋令上堂道由悟達不在語言況是密密堂堂曾無間隔不勞心意暫借回光日用全功迷徒自背僧問如何是香嚴境師曰華木不滋問如何是僊陀婆師敲禪牀曰過這裏來問如何是現在學師以扇子旋轉示之曰見麼僧無語問如何是正命食師以手撮而示之問如何是無表戒師曰待闍黎作俗即說問如何是聲色外相見一句師曰如某甲未住香嚴時且道在甚麼處曰恁麼則亦不敢道有所在師曰如幻人心心所法問如何是直截根源佛所印師拋下拄杖散手而去問如何是佛法大意師曰今年霜降早蕎麥總不收問如何是西來意師以手入懷作拳展開與之僧乃跪膝以兩手作受勢師曰是甚麼僧無對問離四句絕百非請和尚道師曰獵師前不得說本師戒上堂若論此事如人上樹口銜樹枝脚不踏枝手不攀枝樹下忽有人問如何是祖師西來意不對他又違他所問若對他又喪身失命當恁麼時作麼生即得時有虎頭招上座出眾云樹上即不問未上樹時請和尚道師乃呵呵大笑師問僧甚處來曰溈山來師曰和尚近日有何言句曰有僧問如何是西來意和尚竪起拂子師曰彼中兄弟作麼生會曰彼中商量道即色明心附物顯理師曰會即便會著甚死急僧却問師意如何師亦竪起拂子玄沙云祇這香嚴脚跟未點地雲居錫云甚麼處是香巖脚跟未點地處師有偈曰子啐母子覺母殻子母俱亡應緣不錯同道唱和妙玄獨脚師凡示學徒語多簡直有偈頌二百餘篇隨緣對機不拘聲律諸方盛行後諡襲燈禪師杭州徑山洪諲禪師吳興人也僧問掩息如灰時如何師曰猶是時人功幹曰幹後如何師曰耕人田不種曰畢竟如何師曰禾熟不臨場問龍門不假風雷勢便透得者如何師曰猶是一品二品曰此既是階級向上事如何師曰吾不知有汝龍門問如霜如雪時如何師曰猶是污染曰不污染時如何師曰不同色許州全明上座先問石霜一毫穿眾穴時如何霜曰直須萬年去曰萬年後如何霜曰登科任汝登科拔萃任汝萃後問師曰一毫穿眾穴時如何師曰光靴任汝光靴結果任汝結果問如何是長師曰千聖不能量曰如何是短師曰蟭螟眼裏著不滿其僧不肯便去舉似石霜霜曰祇為太近實頭僧却問霜如何是長霜曰不屈曲曰如何是短霜曰雙陸盤中不喝彩佛日長老訪師師問伏承長老獨化一方何以薦遊峰頂日曰朗月當空挂冰霜不自寒師曰莫是長老家風也無日曰峭峙萬重關於中含寶月師曰此猶是文言作麼生是長老家風日曰今日賴遇佛日却問隱密全真時人知有道不得太省無辜時人知有道得於此二途猶是時人升降處未審和尚親道自道如何道師曰我家道處無可道日曰如來路上無私曲便請玄音和一場師曰任汝二輪更互照碧潭雲外不相關日曰為報白頭無限客此回年少莫歸鄉師曰老少同輪無向背我家玄路勿參差日曰一言定天下四句為誰宣師曰汝言有三四我道其中一也無師因有偈曰東西不相顧南北與誰留汝言有三四我道一也無光化四年九月二十八日白眾而化滁州定山神英禪師因樹省和尚行脚時參問不落數量請師道師提起數珠曰是落不落樹曰圓珠三竅時人知有請師圓前話師便打樹拂袖便出師曰三十年後槌胸大哭去在樹住後示眾曰老僧三十年前至定山被他熱謾一上不同小小師見首座洗衣遂問作甚麼座提起衣示之師曰洗底是甚衣座曰關中使䥫錢師喚維那移下座挂搭著襄州延慶山法端禪師僧問蚯蚓斬為兩段兩頭俱動佛性在阿那頭師展兩手洞山別云問底在阿那頭師滅後諡紹真禪師益州應天和尚僧問人人盡有佛性如何是和尚佛性師曰汝喚甚麼作佛性曰恁麼則和尚無佛性也師乃呌快活快活福州九峰慈慧禪師初在溈山山上堂曰汝等諸人祇得大機不得大用師便抽身出去溈召之師更不回顧溈曰此子堪為法器一日辭溈山曰某甲辭違和尚千里之外不離左右溈動容曰善為京兆府米和尚亦謂七師參學後歸受業寺有老宿問月中斷井索時人喚作蛇未審七師見佛喚作甚麼師曰若有佛見即同眾生法眼別云此是甚麼時節問法燈別云喚底不是老宿曰千年桃核師令僧去問仰山曰今時還假悟也無仰曰悟即不無爭奈落在第二頭師深肯之又令僧問洞山曰那箇究竟作麼生洞曰却須問他始得師亦肯之僧問自古上賢還達真正理也無師曰達曰祇如真正理作麼生達師曰當時霍光賣假銀城與單于契書是甚麼人做曰某甲直得杜口無言師曰平地教人作保問如何是衲衣下事師曰醜陋任君嫌不挂雲霞色晉州霍山和尚因仰山一僧到自稱集雲峯下四藤條天下大禪佛參師乃喚維那打鐘著大禪佛驟步而去元康和尚因訪石樓樓纔見便收足坐師曰得恁麼威儀周足樓曰汝適來見箇甚麼師曰無端被人領過樓曰須是與麼始為真見師曰苦哉賺殺幾人來樓便起身師曰見則見矣動則不動樓曰盡力道不出定也師拊掌三下後有僧舉似南泉泉曰天下人斷這兩箇漢是非不得若斷得與他同參蘄州三角山法遇庵主因荒亂宼師入山執刃而問和尚有甚財寶師曰僧家之寶非君所宜宼曰是何寶師震聲一喝宼不悟以刃加之襄州王敬初常侍視事次米和尚至公乃舉筆示之米曰還判得虗空否公擲筆入宅更不復出米致疑明日憑鼓山供養主入探其意米亦隨至潛在屏蔽間偵伺供養主纔坐問曰昨日米和尚有甚麼言句便不相見公曰師子齩人韓獹逐塊米聞此語即省前謬遽出朗笑曰我會也我會也公曰會即不無你試道看米曰請常侍舉公乃竪起一隻筯米曰這野狐精公曰這漢徹也問僧一切眾生還有佛性也無曰有公指壁上畵狗子曰這箇還有也無僧無對公自代曰看齩著汝南嶽下五世仰山寂禪師法嗣袁州仰山西塔光穆禪師僧問如何是正聞師曰不從耳入曰作麼生師曰還聞麼問祖意教意是同是別師曰同別且置汝道瓶觜裏甚麼物出來入去問如何是西來意師曰汝無佛性問如何是頓師作圓相示之曰如何是漸師以手空中撥三下袁州仰山南塔光涌禪師豫章豐城章氏子母乳之夕神光照庭廐馬皆驚因以光涌名之少甚俊敏依仰山剃度北遊謁臨濟復歸侍山山曰汝來作甚麼師曰禮覲和尚山曰還見和尚麼師曰見山曰和尚何似驢師曰某甲見和尚亦不似佛山曰若不似佛似箇甚麼師曰若有所似與驢何別山大驚曰凡聖兩忘情盡體露吾以此驗人二十年無決了者子保任之山每指謂人曰此子肉身佛也僧問文殊是七佛之師文殊還有師否師曰遇緣即有曰如何是文殊師師竪起拂子僧曰莫祇這便是麼師放下拂子叉手問如何是妙用一句師曰水到渠成問真佛住在何處師曰言下無相也不在別處晉州霍山景通禪師初參仰山山閉目坐師乃翹起右足曰如是如是西天二十八祖亦如是中華六祖亦如是和尚亦如是景通亦如是仰山起來打四藤條師因此自稱集雲峰下四藤條天下大禪佛歸宗下亦有大禪佛名智通住後有行者問如何是佛法大意師乃禮拜者曰和尚為甚麼禮俗人師曰汝不見道尊重弟子師問僧甚麼處來僧提起坐具師曰龍頭蛇尾問如何是佛師便打僧亦打師曰汝打我有道理我打汝無道理僧無語師又打趂出師化緣將畢先備薪於郊野徧辭檀信食訖至薪所謂弟子曰日午當來報至日午師自執炬登積薪上以笠置頂後作圓光相手執拄杖作降魔杵勢立終於紅焰中杭州無著文喜禪師嘉禾語溪人也姓朱氏七歲依本邑常樂寺今崇福也國清出家剃染後習律聽教屬會昌沙汰反服韜晦大中初例重懺度於鹽官齊峯寺後謁大慈山性空禪師空曰子何不徧參乎師直往五臺山華嚴寺至金剛窟禮謁遇一老翁牽牛而行邀師入寺翁呼均提有童子應聲出迎翁縱牛引師陞堂堂宇皆耀金色翁踞牀指繡墎命坐翁曰近自何來師曰南方翁曰南方佛法如何住持師曰末法比丘少奉戒律翁曰多少眾師曰或三百或五百師却問此間佛法如何住持翁曰龍蛇混雜凡聖同居師曰多少眾翁曰前三三後三三翁呼童子致茶并進酥酪師納其味心意豁然翁拈起玻瓈盞問曰南方還有這箇否師曰無翁曰尋常將甚麼喫茶師無對師覩日色稍晚遂問翁擬投一宿得否翁曰汝有執心在不得宿師曰某甲無執心翁曰汝曾受戒否師曰受戒久矣翁曰汝若無執心何用受戒師辭退翁令童子相送師問童子前三三後三三是多少童召大德師應諾童曰是多少師復問曰此為何處童曰此金剛窟般若寺也師悽然悟彼翁者即文殊也不可再見即稽首童子願乞一言為別童說偈曰面上無嗔供養具口裏無嗔吐妙香心裏無嗔是珍寶無垢無染是真常言訖均提與寺俱隱但見五色雲中文殊乘金毛師子往來忽有白雲自東方來覆之不見時有滄州菩提寺僧修政等至尚聞山石震吼之聲師因駐錫五臺咸通三年至洪州觀音參仰山頓了心契令充典座文殊甞現於粥鑊上師以攪粥篦便打曰文殊自文殊文喜自文喜殊乃說偈曰苦瓠連根苦甜瓜徹蔕甜修行三大劫却被老僧嫌一日有異僧來求齋食師減己分饋之仰山預知問曰適來果位人至汝給食否師曰輟己迴施仰曰汝大利益後旋浙住龍泉寺僧問如何是涅槃相師曰香煙盡處驗問如何是佛法大意師曰喚院主來這師僧患顛問如何是自己師默然僧罔措再問師曰青天蒙昧不向月邊飛錢王奏賜紫衣署無著禪師將順寂於子夜告眾曰三界心盡即是涅槃言訖跏趺而終白光照室竹樹同色塔于靈隱山之西塢天福二年宣城帥田頵應杭將許思叛渙縱兵大掠發師塔覩肉身不壞爪髮俱長武肅錢王異之遣裨將邵志重加封瘞至皇朝嘉定庚辰遷于淨慈山智覺壽禪師塔左新羅國五觀山順支了悟禪師僧問如何是西來意師豎拂子僧曰莫這箇便是師放下拂子問以字不成八字不是是甚麼字師作圓相示之有僧於師前作五花圓相師畫破作一圓相袁州仰山東塔和尚僧問如何是君王劒師曰落不釆功曰用者如何師曰不落人手問法王與君王相見時如何師曰兩掌無私曰見後如何師曰中間絕像香嚴閑禪師法嗣吉州止觀和尚僧問如何是毗盧師師攔𮌎與一拓問如何是頓師曰非梁陳壽州紹宗禪師僧問如何是西來意師曰好事不出門惡事行千里有官人謂師曰見說江西不立宗師曰遇緣即立曰遇緣立箇甚麼師曰江西不立宗益州南禪無染禪師僧問無句之句師還答也無師曰從來祇明恁麼事曰畢竟如何師曰且問看益州長平山和尚僧問視瞬不及處如何師曰我眨眼也沒工夫問如何是祖師意師曰西天來唐土去益州崇福演教禪師僧問如何是寞廓之言師曰無口得道問如何是西來意師曰今日明日安州大安山清幹禪師僧問從上諸聖從何而證師乃斫額問如何是祖師西來意師曰羊頭車子推明月終南山豐德寺和尚僧問如何是和尚家風師曰觸事面牆問如何是本來事師曰終不更問人均州武當山佛巖暉禪師僧問某甲頃年有疾又中毒藥請師醫師曰二宜湯一椀問如何是佛向上事曰螺髻子曰如何是佛向下事師曰蓮華座江州廬山雙谿田道者僧問如何是啐之機師以手作勢問如何是西來意師曰甚麼處得箇問頭來徑山諲禪師法嗣洪州米嶺和尚常語曰莫過於此僧問未審是甚麼莫過於此師曰不出是僧後問長慶為甚麼不出是慶曰汝擬喚作甚麼雙峰和尚法嗣福州雙峰古禪師本業講經因參先雙峰峰問大德甚麼處住曰城裏峰曰尋常還思老僧否曰常思和尚無由禮覲峰曰祇這思底便是大德師從此領旨即罷講席侍奉數年後到石霜但隨眾而已更不參請眾謂古侍者甞受雙峰印記往往聞于石霜霜欲詰其所悟而未得其便師因辭去霜將拂子送出門首召曰古侍者師回首霜曰擬著即差是著即乖不擬不是亦莫作箇會除非知有莫能知之好去好去師應喏喏即前邁尋屬雙峰示寂師乃繼續住持僧問和尚當時辭石霜石霜恁麼道意作麼生師曰祇教我不著是非玄覺云且道他會石霜意不會南嶽下六世西塔穆禪師法嗣吉州資福如寶禪師僧問如何是應機之句師默然問如何是玄旨師曰汝與我掩却門問魯祖面壁意作麼生師曰沒交涉問如何是從上真正眼師槌𮌎曰蒼天蒼天曰借問有何妨師曰困問這箇還受學也無師曰未曾钁地栽虗空問如何是衲僧急切處師曰不過此問曰學人未問已前請師道師曰噫問如何是一塵入正受師作入定勢曰如何是諸塵三昧起師曰汝問阿誰問如何是一路涅槃門師彈指一聲又展開兩手曰如何領會師曰不是秋月明子自橫行八九問如何是和尚家風師曰飯後三椀茶師一日拈起蒲團示眾曰諸佛菩薩入理聖人皆從這裏出便擲下擘開𮌎曰作麼生眾無對問學人創入叢林一夏將末未蒙和尚指教願垂提拯師拓開曰老僧住持已來未曾瞎却一人眼師有時坐良久周視左右曰會麼眾曰不會師曰不會即謾汝去也師一日將蒲團於頭上曰汝諸人恁麼時難共語眾無對師將坐却曰猶較些子南塔涌禪師法嗣郢州芭蕉山慧清禪師新羅國人也上堂拈拄杖示眾曰你有拄杖子我與你拄杖子你無拄杖子我奪却你拄杖子靠拄杖下座僧問如何是芭蕉水師曰冬溫夏涼問如何是吹毛劍師曰進前三步曰用者如何師曰退後三步問如何是和尚為人一句師曰祇恐闍黎不問上堂會麼相悉者少珍重問不語有問時如何師曰未出三門千里程問如何是自己師曰望南看北斗問光境俱亡復是何物師曰知曰知箇甚麼師曰建州九郎上堂如人行次忽遇前面萬丈深坑背後野火來逼兩畔是荊棘叢林若也向前則墮在坑壍若也退後則野火燒身若也轉側則被荊棘林礙當與麼時作麼生免得若也免得合有出身之路若免不得墮身死漢問如何是提婆宗師曰赤幡在左問僧近離甚處僧曰請師試道看師曰將謂是舶上商人元來是當州小客問不問二頭三首請師直指本來面目師默然正坐問賊來須打客來須看忽遇客賊俱來時如何師曰屋裏有一緉破草鞋曰祇如破草鞋還堪受用也無師曰汝若將去前凶後不吉問北斗藏身意旨如何師曰九九八十一乃曰會麼曰不會師曰一二三四五師謂眾曰我年二十八到仰山參見南塔見上堂曰汝等諸人若是箇漢從孃肚裏出來便作師子吼好麼我於言下歇得身心便住五載僧問古佛未出興時如何師曰千年茄子根曰出興後如何師曰金剛努出眼上堂良久曰也大相辱珍重問如何是祖師意師曰汝問那箇祖師意曰達磨西來意師曰獨自棲棲暗渡江問牛頭未見四祖時如何師曰知曰見後如何師曰知問甚麼物無兩頭甚麼物無背面師曰我身無兩頭我語無背面問如何是透法身句師曰一不得問二不得休曰學人不會師曰第三度來與汝相見越州清化全怤禪師吳郡崑山人也初參南塔塔問從何而來師曰鄂州塔曰鄂州使君名甚麼師曰化下不敢相觸忤曰此地道不畏師曰大丈夫何必相試塔囅丑忍切然而笑遂乃印可時廬陵安福縣宰建應國禪苑迎師聚徒本道上聞賜名清化僧問如何是和尚急切為人處師曰朝看東南暮看西北曰不會師曰徒訪東陽客不識西陽珍問如何是正法眼師曰我却不知曰和尚為甚麼不知師曰不可青天白日尿牀也師後還故國錢氏文穆王特加禮重晉天福二年丁酉歲錢氏戌將闢雲峰山建院亦以清化為名延師開堂僧問如何是佛法大意師曰華表柱頭木鶴飛問路逢達道人不將語默對未審將甚麼對師曰眼裏瞳人吹呌子問和尚年多少師曰始見去年九月九如今又見秋葉黃曰恁麼則無數也師曰問取黃葉曰畢竟事如何師曰六隻骰子滿盆紅問亡僧遷化向甚麼處去師曰長江無間斷聚沫任風飄曰還受祭祀也無師曰祭祀即不無曰如何祭祀師曰漁歌舉櫂谷裏聞聲忠獻王賜紫方袍師不受王改以衲衣仍號純一禪師師曰吾非飾讓也慮後人倣吾而逞欲耳開運四年秋示寂時大風摧震竹木韶州黃連山義初明微禪師僧問三乘十二分教即不問請師開口不答話師曰寶華臺上定古今曰如何是寶華臺上定古今師曰一點墨子輪流不移曰學人全體不會請師指示師曰靈覺雖轉空華不墜問古路無蹤如何進步師曰金烏遶須彌元與劫同時曰恁麼則得達於彼岸也師曰黃河三千年一度清廣主劉氏嚮師道化請入府內說法僧問人王與法王相見時如何師曰兩鏡相照萬象歷然曰法王心要達磨西來五祖付與曹谿自此不傳衣鉢未審碧玉階前將何付囑師曰石羊水上行木馬夜翻駒曰恁麼則我王有感萬國歸朝師曰時人盡唱太平歌問如何是佛師曰胷題卍字背負圓光問如何是道師展兩手示之僧曰佛之與道相去幾何師曰如水如波韶州慧林鴻究妙濟禪師僧問千聖常行此路如何是此路師曰果然不見問魯祖面壁意旨如何師曰有甚麼雪處問如何是急切事師曰鈍漢問如何是和尚家風師曰諸方大例問定慧等學明見佛性此理如何師曰新脩梵宇南嶽下七世資福寶禪師法嗣吉州資福貞邃禪師僧問和尚見古人得何意旨便歇去師作此相示之問如何是古人歌師作此相示之問如何是最初一句師曰未具世界時闍黎亦在此問百丈卷席意旨如何師良久問古人道前三三後三三意旨如何師曰汝名甚麼曰某甲師曰喫茶去上堂隔江見資福剎竿便回去脚跟下好與三十棒況過江來時有僧纔出師曰不堪共語問如何是古佛心師曰山河大地吉州福壽和尚僧問祖意教意是同是別師展手問文殊騎師子普賢騎象王未審釋迦騎甚麼師舉手云㖿㖿潭州鹿苑和尚僧問餘國作佛還有異名也無師作此相示之問如何是鹿苑一路師曰吉獠舌頭問將來問如何是閉門造車師曰南嶽石橋曰如何是出門合轍師曰拄杖頭鞋上堂展手曰天下老和尚諸上座命根總在這裏有僧出曰還收得也無師曰天台石橋側曰某甲不恁麼師曰伏惟尚饗問如何是世尊不說說師曰須彌山倒曰如何是迦葉不聞聞師曰大海枯竭芭蕉清禪師法嗣郢州芭蕉山繼徹禪師初參風穴穴問如何是正法眼師曰泥彈子穴異之次謁先芭蕉蕉上堂舉仰山道兩口一無舌此是吾宗旨師豁然有省住後僧問如何是林溪境師曰有山有水曰如何是境中人師曰三門前佛殿後問如何是深深處師曰石人開石戶石鎻兩頭搖上堂昔日如來於波羅奈國梵王請轉法輪如來不已而已有屈宗風隨機逗教遂有三乘名字流傳於天上人間至今光揚不墜若據祖宗門下天地懸殊上上根機頓超不異作麼生是混融一句還有人道得麼若道得有參學眼若道不得天寬地窄便下座上堂眼中無翳空裏無花水長船高泥多佛大莫將問來我也無答會麼問在答處答在問處便下座問三乘十二分教即不問如何是宗門一句師曰七縱八橫曰如何領會師曰泥裏倒泥裏起問如何是祖師西來意師曰著體汗衫問有一人不舍生死不證涅槃師還提擕也無師曰不提𢹂曰為甚麼不提𢹂師曰林溪粗識好惡問如何是吹毛劒師曰透曰用者如何師曰鈍問寂寂無依時如何師曰未是衲僧分上事曰如何是衲僧分上事師曰要行即行要坐即坐師有偈曰芭蕉的旨不挂唇齒木童唱和石人側耳郢州興陽山清讓禪師僧問大通智勝佛十劫坐道場佛法不現前不得成佛道時如何師曰其問甚諦當曰既是坐道場為甚麼不得成佛道師曰為伊不成佛洪州幽谷山法滿禪師僧問如何是道師良久曰會麼曰學人不會師曰聽取一偈話道語下無聲舉揚奧旨丁寧禪要如今會取不須退後消停郢州芭蕉山遇禪師僧問如何是祖師西來意師曰是星皆拱北無水不朝東曰爭奈學人未會何師曰逢人但恁麼舉郢州芭蕉山圓禪師僧問如何是和尚接人一句師曰要頭截取去曰豈無方便師曰心不負人面無慚色上堂三千大千世界夜來被老僧都合成一塊輥向須彌頂上帝釋大怒拈得撲成粉碎諸上座還覺頭痛也無良久曰莫不識痛痒好珍重彭州承天院辭確禪師僧問學人有一隻箭射即是不射即是師曰作麼生是闍黎箭僧便喝師曰這箇是草箭子曰如何是和尚箭師曰禁忌須屈指禱祈便扣牙問心隨萬境轉阿那箇是轉萬境底心師曰嘉州大像古人鐫問眾罪如霜露慧日能消除時如何師曰亭臺深夜雨樓閣靜時鐘曰為甚麼因緣會遇時果報還自受師曰管筆能書片舌解語開堂日示眾正令提綱猶是揑窠造偽佛法祇對特地謾驀上流問著即參差答著即交互大德擬向甚麼處下口然則如是事無一向權柄在手縱奪臨機有疑請問僧問如何是第一義師曰群峰穿海去滴水下巖來問師唱誰家曲宗風嗣阿誰師曰道頭會尾舉意知心興元府牛頭山精禪師僧問如何是古佛心師曰東海浮漚曰如何領會師曰秤鎚落井問不居凡聖是甚麼人師曰梁朝傅大士曰此理如何師曰楚國孟甞君益州覺城院信禪師僧問如何是出身一路師曰三門前曰如何領會師曰緊峭草鞋郢州芭蕉山閑禪師僧問十語九不中時如何師曰閉門屋裏坐抱首哭蒼天郢州芭蕉山令遵禪師僧問直得無下口處時如何師曰便須進一步曰向甚麼處下脚師曰東山西嶺上慧林究禪師法嗣韶州靈瑞和尚俗士問如何是佛師喝曰汝是村裏人僧問如何是西來意師曰十萬八千里問如何是本來心師曰坐却毗盧頂出沒太虗中問如何是教外別傳底事師曰兩箇靈龜泥裏鬪直至如今困未休曰不會師曰木雞銜卵走燕雀乘虎飛潭中魚不現石女却生兒南嶽下八世報慈韶禪師法嗣蘄州三角山志謙禪師僧問如何是佛師曰速禮三拜僧禮拜師曰一撥便轉郢州興陽詞鐸禪師僧問佛界與眾生界相去多少師曰道不得曰真箇那師曰有些子音釋頵於倫切
