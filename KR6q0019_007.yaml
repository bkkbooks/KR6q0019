body:
  text: 南嶽下二世馬祖一禪師法嗣荊州天王道悟禪師渚宮人姓崔氏子玉之後胤也年十五依長沙寺曇翥律師出家二十三詣嵩山受戒三十參石頭頻沐指示曾未投機次謁忠國師三十四與國師侍者應真南還謁馬祖祖曰識取自心本來是佛不屬漸次不假修持體自如如萬德圓滿師於言下大悟祖囑曰汝若住持莫離舊處師蒙指已便返荊門去郭不遠結草為廬後因節使顧問左右申其端緒節使親臨訪道見其路隘車馬難通極目荒榛曾未修削覩茲發怒令人擒師拋於水中旌斾才歸乃見遍衙火發內外烘焰莫可近之惟聞空中聲曰我是天王神我是天王神節使回心設拜煙焰都息宛然如初遂往江邊見師在水都不濕衣節使重伸懺悔迎請在衙供養於府西造寺額號天王僧龍潭問曰從上相承底事如何師曰不是明汝來處不得潭曰這個眼目幾人具得師曰淺草易為長蘆師常云快活快活及臨終時呌苦苦又云閻羅王來取我也院主問曰和尚當時被節度使拋向水中神色不動如今何得恁麼地師舉枕子曰汝道當時是如今是院主無對便入滅當元和三年戊子十月十三日也年八十二坐六十三夏嗣法一人曰崇信即龍潭也宋大川云以丘玄素符載二碑參合應以天王道悟嗣馬祖龍潭崇信嗣之始為不差誤矣按指月録云天王道悟嗣馬祖龍潭崇信嗣之丘玄素撰唐聞人歸登有南嶽碑圭峰答裴國宗趣狀權德輿馬祖塔銘皆以天王為馬祖嗣佛國白達觀頴呂夏卿張無盡皆有著辨以證傳燈之誤按正名録云諸家證據由在事迹證據中惟張無盡之言最為深切無盡云石頭得藥山山得曹洞教理行果言説婉轉天皇道悟下出周金剛呵風罵雨雖佛祖不敢嬰其鋒恐皇字差誤後得丘玄素符載二碑遍示諸方曰吾嘗疑德山洞山同出石頭下因甚垂手處死活不同今以丘符二碑證之朗然明白方知吾擇法驗人之不謬耳此則直從施設處勘出一言而定千古之疑譬如世人子嗣有訛考核宗譜固可辨明若一滴血則真偽立剖無盡之言可謂滴血而得其真者矣按三刻所載考據的確討論精詳千載疑案一時氷釋矣南嶽下三世天王道悟禪師法嗣澧州龍潭崇信禪師渚宮人也其家賣餅師少而英異初悟和尚蒙祖記莂後居天王寺人莫之測師家於寺巷常日以十餅饋之天王受之每食畢常留一餅曰吾惠汝以蔭子孫師一日自念曰餅是我持去何以返遺我邪其別有旨乎遂造而問焉王曰是汝持來復汝何咎師聞之頗曉玄旨因投出家王曰汝昔崇福善今信吾言可名崇信由是服勤左右一日問曰某自到來不蒙指示心要王曰自汝到來吾未嘗不指汝心要師曰何處指示王曰汝擎茶來吾為汝接汝行食來吾為汝受汝和南時吾便低首何處不指示心要師低頭良久王曰見則直下便見擬思即差師當下開解復問如何保任王曰任性逍遙隨緣放曠但盡凡心別無聖解師後詣澧陽龍潭棲止僧問髻中珠誰人得師曰不賞玩者得曰安著何處師曰有處即道來有尼問如何得為僧去師曰作尼來多少時也曰還有為僧時也無師曰汝即今是甚麼曰現是尼身何得不識師曰誰識汝李翱刺史問如何是真如般若師曰我無真如般若李曰幸遇和尚師曰此猶是分外之言南嶽下四世龍潭信禪師法嗣鼎州德山宣鑒禪師簡州周氏子丱歲出家依年受具精究律藏於性相諸經貫通旨趣常講金剛般若時謂之周金剛嘗謂同學曰一毛吞海海性無虧纖芥投鋒鋒利不動學與無學唯我知焉後聞南方禪席頗盛師氣不平乃曰出家兒千劫學佛威儀萬劫學佛細行不得成佛南方魔子敢言直指人心見性成佛我當摟其窟穴滅其種類以報佛恩遂擔青龍疏鈔出蜀至澧陽路上見一婆子賣餅因息肩買餅點心婆指擔曰這箇是甚麼文字師曰青龍疏鈔婆曰講何經師曰金剛經婆曰我有一問你若答得施與點心若答不得且別處去金剛經道過去心不可得現在心不可得未來心不可得未審上座點那箇心師無語遂往龍潭至法堂曰久嚮龍潭及乎到來潭又不見龍又不現潭引身曰子親到龍潭師無語遂棲止焉一夕侍立次潭曰更深何不下去師珍重便出却回曰外面黑潭點紙燭度與師師擬接潭復吹滅師於此大悟便禮拜潭曰子見箇甚麼師曰從今向去更不疑天下老和尚舌頭也至來日龍潭升座謂衆曰可中有箇漢牙如劒樹口似血盆一棒打不回頭他時向孤峰頂上立吾道去在師將疏鈔堆法堂前舉火炬曰窮諸玄辨若一毫置於太虗竭世樞機似一滴投於巨壑遂焚之於是禮辭直抵溈山挾復子上法堂從西過東從東過西顧視方丈曰有麼有麼山坐次殊不顧盻師曰無無便出至門首乃曰雖然如此也不得草草遂具威儀再入相見才跨門提起坐具曰和尚山擬取拂子師便喝拂袖而出溈山至晚問首座今日新到在否座曰當時背却法堂著草鞋出去也山曰此子已後向孤峰頂上盤結草庵呵佛罵祖去在師住澧陽三十年屬唐武宗廢教避難於獨浮山之石室大中初武陵太守薛廷望再崇德山精舍號古德禪院將訪求哲匠住持聆師道行屢請不下山廷望乃設詭計遣吏以茶鹽誣之言犯禁法取師入州瞻禮堅請居之大闡宗風上堂若也於己無事則勿妄求妄求而得亦非得也汝但無事於心無心於事則虗而靈空而妙若毛端許言之本末者皆為自欺何故毫𨤲繫念三塗業因瞥爾情生萬劫羈鎖聖名凡號盡是虗聲殊相劣形皆為幻色汝欲求之得無纍乎及其厭之又成大患終而無益小參示衆曰今夜不答話問話者三十棒時有僧出禮拜師便打僧曰某甲話也未問和尚因甚麼打某甲師曰汝是甚麼處人曰新羅人師曰未跨船舷好與三十棒法眼云大小德山話作兩橛玄覺云叢林中喚作隔下語且從祇如德山道問話者三十棒意作麼生僧參師問維那今日幾人新到曰八人師曰喚來一時生按著龍牙問學人仗鏌鎁劒擬取師頭時如何師引頸近前曰㘞法眼別云汝向甚麼處下手牙曰頭落也師呵呵大笑牙後到洞山舉前話山曰德山道甚麼牙曰德山無語洞曰莫道無語且將德山落底頭呈似老僧看牙方省便懺謝有僧舉似師師曰洞山老人不識好惡這漢死來多少時救得有甚麼用處僧問如何是菩提師打曰出去莫向這裏屙問如何是佛師曰佛是西天老比丘雪峯問從上宗乘學人還有分也無師打一棒曰道甚麼曰不會至明日請益師曰我宗無語句實無一法與人峯因此有省巖頭聞之曰德山老人一條脊梁骨硬似鐵拗不折然雖如此於唱教門中猶較些子保福問招慶祇如巖頭出世有何言教過於德山便恁麼道慶云汝不見巖頭道如人學射久久方中福云中後如何慶云展闍黎莫不識痛癢福云和尚今日非唯舉話慶云展闍黎是甚麼心行明招云大小招慶錯下名言示衆曰道得也三十棒道不得也三十棒臨濟聞得謂洛浦曰汝去問他道得為甚麼也三十棒待伊打汝接住棒送一送看伊作麼生浦如教而問師便打浦接住送一送師便歸方丈浦回舉似臨濟濟曰我從來疑著這漢雖然如是你還識德山麼浦擬議濟便打巖頭云德山老人尋常祇據一條白棒佛來亦打祖來亦打爭奈較些子東禪齊云祇如臨濟道我從前疑著這漢是肯底語不肯底語為當別有道理試斷看上堂問即有過不問猶乖有僧出禮拜師便打僧曰某甲始禮拜為甚麼便打師曰待汝開口堪作甚麼師令侍者喚義存即雪峯也存上來師曰我自喚義存汝又來作甚麼存無對上堂我先祖見處即不然這裏無祖無佛達磨是老臊胡釋迦老子是乾屎橛文殊普賢是擔屎漢等覺妙覺是破執凡夫菩提涅槃是繫驢橛十二分教是鬼神簿拭瘡疣紙四果聖賢初心十地是守古冢鬼自救不了有僧相看乃近前作相撲勢師曰與麼無禮合喫山僧手裏棒僧拂袖便行師曰饒汝如是也祇得一半僧轉身便喝師打曰須是我打你始得曰諸方有明眼人在師曰天然有眼僧擘開眼曰貓便出師曰黃河三千年一度清師見僧來乃閉門其僧敲門師曰阿誰曰師子兒師乃開門僧禮拜師騎僧項曰這畜生甚處去來雪峰問南泉斬貓兒意旨如何師乃打趂却喚曰會麼峯曰不會師曰我恁麼老婆心也不會僧問凡聖相去多少師便喝師因疾僧問還有不病者也無師曰有曰如何是不病者師曰阿㖿阿㖿師復告衆曰捫空追響勞汝心神夢覺覺非竟有何事言訖安坐而化即唐咸通六年十二月三日也諡見性禪師洪州泐潭寶峯和尚新到參師問其中事即易道不落其中事始終難道曰某甲在途中時便知有此一問師曰更與二十年行腳也不較多曰莫不契和尚意麼師曰苦瓜那堪待客問僧古人有一路接後進初心汝還知否曰請師指出古人一路師曰恁麼則闍黎知了也曰頭上更安頭師曰寶峯不合問仁者曰問又何妨師曰這裏不曾有人亂説道理出去巖頭僧來參師竪起拂子曰落在此機底人未具眼在僧擬近前師曰恰落在此機僧回舉似巖頭頭曰我當時若見奪却拂子看他作麼生師聞乃曰我竪起拂子從伊奪總不將物時又作麼生巖頭聞得又曰無星稱子有甚辨處南嶽下五世德山鑒禪師法嗣鄂州巖頭全奯禪師泉州柯氏子少禮青原誼公落髮往長安寶壽寺稟戒習經律諸部優遊禪苑與雪峰欽山為友自杭州大慈山邐迤造于臨濟屬濟歸寂乃謁仰山才入門提起坐具曰和尚仰山取拂子擬舉師曰不妨好手後參德山執坐具上法堂瞻視山曰作麼師便喝山曰老僧過在甚麼處師曰兩重公案乃下參堂山曰這箇阿師稍似箇行腳人至來日上問訊山曰闍黎是昨日新到否曰是山曰甚麼處學得這虗頭來師曰全奯終不自謾山曰他後不得孤負老僧一日參德山方跨門便問是凡是聖山便喝師禮拜有人舉似洞山山曰若不是奯公大難承當師曰洞山老人不識好惡錯下名言我當時一手擡一手搦雪峰在德山作飯頭一日飯遲德山擎鉢下法堂峰曬飯巾次見德山乃曰鐘未鳴鼓未響托鉢向甚麼處去德山便歸方丈峰舉似師師曰大小德山未會末後句在山聞令侍者喚師去問汝不肯老僧那師密啓其意山乃休明日升堂果與尋常不同師至僧堂前拊掌大笑曰且喜堂頭老漢會末後句他後天下人不奈伊何雖然也祇得三年活山果三年後示滅一日與雪峰欽山聚話峰驀指一碗水欽曰水清月現峰曰水清月不現師踢却水碗而去師與雪峰同辭德山山問甚麼處去師曰暫辭和尚下山去曰子他後作麼生師曰不忘曰子憑何有此説師曰豈不聞智過於師方堪傳受智與師齊減師半德曰如是如是當善護持二士禮拜而退師住鄂州巖頭值沙汰於湖邊作渡子兩岸各挂一板有人過渡打板一下師曰阿誰或曰要過那邊去師乃舞棹迎之一日因一婆抱一孩兒來乃曰呈橈舞棹即不問且道婆手中兒甚處得來師便打婆曰婆生七子六箇不遇知音祇這一箇也不消得便拋向水中師後庵于洞庭臥龍山徒侶臻萃僧問無師還有出身處也無師曰聲前古毳爛問堂堂來時如何師曰刺破眼上堂吾嘗究涅槃經七八年覩三兩段義似衲僧説話又曰休休時有一僧出禮拜請師舉師曰吾教意如字三點第一向東方下一點點開諸菩薩眼第二向西方下一點點諸菩薩命根第三向上方下一點點諸菩薩頂此是第一段義又曰吾教意如摩醯首羅擘開面門竪亞一隻眼此是第二段義又曰吾教意猶如塗毒鼓擊一聲遠近聞者皆喪此是第三段義時小嚴上座問如何是塗毒鼓師以兩手按膝亞身曰韓信臨朝底嚴無語夾山下一僧到石霜才跨門便道不審霜曰不必闍黎僧曰恁麼則珍重又到師處如前道不審師噓一噓僧曰恁麼則珍重方回步師曰雖是後生亦能管帶其僧歸舉似夾山山上堂曰前日到巖頭石霜底阿師出來如法舉似前話其僧舉了山曰大衆還會麼衆無對山曰若無人道得山僧不惜兩莖眉毛道去也乃曰石霜雖有殺人刀且無活人劒巖頭亦有殺人刀亦有活人劒師與羅山卜塔基羅山中路忽曰和尚師回顧曰作麼山舉手指曰這裏好片地師咄曰瓜州賣瓜漢又行數里歇次山禮拜問曰和尚豈不是三十年前在洞山而不肯洞山師曰是又曰和尚豈不是嗣德山又不肯德山師曰是山曰不肯德山即不問祇如洞山有何虧闕師良久曰洞山好佛祇是無光山禮拜僧問利劍斬天下誰是當頭者師曰暗僧擬再問師咄曰這鈍漢出去問不歷古今時如何師曰卓朔地曰古今事如何師曰任爛問僧甚處來曰西京來師曰黃巢過後還收得劒麼曰收得師引頸近前曰㘞曰師頭落也師呵呵大笑僧後到雪峰峰問甚處來曰巖頭來峰曰巖頭有何言句僧舉前話峰便打三十棒趂出問二龍爭珠誰是得者師曰俱錯僧問雪峰聲聞人見性如夜見月菩薩人見性如晝見日未審和尚見性如何峰打拄杖三下僧後舉前語問師師與三摑問如何是三界主師曰汝還解喫鐵棒麼德山一日謂師曰我這裏有兩僧入山住庵多時汝去看他怎生師遂將一斧去見兩人在庵內坐師乃拈起斧曰道得也一下斧道不得也一下斧二人殊不顧師擲下斧曰作家作家歸舉似德山山曰汝道他如何師曰洞山門下不道全無若是德山門下未夢見在僧參於左邊作一圓相又於右邊作一圓相又於中心作一圓相欲成未成被師以手一撥僧無語師便喝出僧欲跨門師却喚回問汝是洪州觀音來否曰是師曰祇如適來左邊一圓相作麼生曰是有句師曰右邊圓相聻曰是無句師曰中心圓相作麼生曰是不有不無句師曰祇如吾與麼又作麼生曰如刀畫水師便打瑞巖問如何是毗盧師師曰道甚麼巖再問師曰汝年十七八未問弓折箭盡時如何師曰去問如何是巖中的的意師曰謝指示曰請和尚答話師曰珍重問三界競起時如何師曰坐却著曰未審師意如何師曰移取廬山來即向汝道問起滅不停時如何師喝曰是誰起滅問輪中不得轉時如何師曰澀問路逢猛虎時如何師曰拶問如何是道師曰破草鞋與拋向湖裏著問萬丈井中如何得到底師曰吽僧再問師曰腳下過也問古帆未挂時如何師曰小魚吞大魚又僧如前問師曰後園驢喫草邇後人或問佛問法問道問禪者師皆作噓聲師嘗謂衆曰老漢去時大吼一聲了去唐光啓之後中原盜起衆皆避地師端居晏如也一日賊大至責以無供饋遂倳刃焉師神色自若大呌一聲而終聲聞數十里即光啓三年丁未四月八日也門人後焚之獲舍利四十九粒衆為起塔諡清嚴禪師福州雪峰義存禪師泉州南安曾氏子家世奉佛師生惡葷茹於襁褓中聞鐘梵之聲或見幡花像設必為之動容年十二從其父遊莆田玉澗寺見慶玄律師遽拜曰我師也遂留侍焉十七落髮謁芙蓉常照大師照撫而器之後往幽州寶剎寺受戒久歷禪會緣契德山唐咸通中回閩中雪峰創院徒侶翕然懿宗錫號真覺禪師仍賜紫袈裟初與巖頭至澧州鼇山鎮阻雪頭每日祇是打睡師一向坐禪一日喚曰師兄師兄且起來頭曰作甚麼師曰今生不著便共文邃箇漢行腳到處被他帶纍今日到此又祇管打睡頭喝曰噇眠去每日牀上座恰似七村裏土地他時後日魔魅人家男女去在師自點胸曰我這裏未穩在不敢自謾頭曰我將謂你他日向孤峰頂上盤結草庵播揚大教猶作這箇語話師曰我實未穩在頭曰你若實如此據你見處一一通來是處與你證明不是處與你剗却師曰我初到鹽官見上堂舉色空義得箇入處頭曰此去三十年切忌舉著又見洞山過水偈曰切忌從他覓迢迢與我疏渠今正是我我今不是渠頭曰若與麼自救也未徹在師又曰後問德山從上宗乘中事學人還有分也無德山打一棒曰道甚麼我當時如桶底脫相似頭喝曰你不聞道從門入者不是家珍師曰他後如何即是頭曰他後若欲播揚大教一一從自己胸襟流出將來與我蓋天蓋地去師於言下大悟便作禮起連聲呌曰師兄今日始是鼇山成道師在洞山作飯頭淘米次山問淘沙去米淘米去沙師曰沙米一時去山曰大衆喫箇甚麼師遂覆却米盆山曰據子因緣合在德山洞山一日問師作甚麼來師曰斫槽來山曰幾斧斫成師曰一斧斫成山曰猶是這邊事那邊事作麼生師曰直得無下手處山曰猶是這邊事那邊事作麼生師休去汾陽代云某甲早困也師辭洞山山曰子甚處去師曰歸嶺中去山曰當時從甚麼路出師曰從飛猿嶺出山曰今回向甚麼路去師曰從飛猿嶺去山曰有一人不從飛猿嶺去子還識麼師曰不識山曰為甚麼不識師曰他無面目山曰子既不識爭知無面目師無對住後僧問和尚見德山得箇甚麼便休去師曰我空手去空手歸問祖意教意是同是別師曰雷聲震地室內不聞又曰闍黎行腳為甚麼事問我眼本正因師故邪時如何師曰迷逢達磨曰我眼何在師曰得不從師問剃髮染衣受佛依蔭為甚麼不許認佛師曰好事不如無師問座主如是兩字盡是科文作麼生是本文主無對五雲代云更分三段著問如何是佛師曰寐語作甚麼問如何是覿面事師曰千里未是遠問如何是大人相師曰瞻仰即有分問文殊與維摩對談何事師曰義墮也問寂然無依時如何師曰猶是病曰轉後如何師曰船子下楊州問承古有言師便作臥勢良久起曰問甚麼僧再舉師曰虗生浪死漢問箭頭露鋒時如何師曰好手不中的曰盡眼沒標的時如何師曰不妨隨分好手問古人道路逢達道人不將語默對未審將甚麼對師曰喫茶去問僧甚處來曰神光來師曰晝喚作日光夜喚作火光作麼生是神光僧無對師自代曰日光火光栖典座問古人有言知有佛向上事方有語話分如何是語話師把住曰道道棲無對師遂踏倒栖當下汗流問僧甚處來曰近離浙中師曰船來陸來曰二途俱不涉師曰爭得到這裏曰有甚麼隔礙師便打問古人道覿面相呈時如何師曰是曰如何是覿面相呈師曰蒼天蒼天師謂衆曰此箇水牯牛年多少衆皆無對師自代曰七十九也僧曰和尚為甚麼作水牯牛去師曰有甚麼罪過問僧甚處去曰禮拜徑山和尚去師曰徑山若問汝此間佛法如何汝作麼生祇對曰待問即道師便打後舉問鏡清這僧過在甚麼處清曰問得徑山徹困師曰徑山在浙中因甚麼問得徹困清曰不見道遠問近對師曰如是如是一日謂長慶曰吾見溈山問仰山從上諸聖向甚麼處去他道或在天上或在人間汝道仰山意作麼生慶曰若問諸聖出沒處恁麼道即不可師曰汝渾不肯忽有人問汝作麼生道慶曰但道錯師曰是汝不錯慶曰何異於錯問僧甚處來曰江西師曰與此間相去多少曰不遙師竪起拂子曰還隔這箇麼曰若隔這箇即遙去也師便打出問學人乍入叢林乞師指箇入路師曰寧自碎身如微塵終不敢瞎却一僧眼問四十九年後事即不問四十九年前事如何師以拂子驀口打僧辭去參靈雲問佛未出世時如何雲舉拂子曰出世後如何雲亦舉拂子其僧却回師曰返太速乎曰某甲到彼問佛法不契乃回師曰汝問甚麼事僧舉前話師曰汝問我為汝道僧便問佛未出世時如何師舉起拂子曰出世後如何師放下拂子僧禮拜師便打後僧舉問玄沙沙云汝欲會麼我與汝説箇喻如人賣一片園東西南北一時結契了也中心樹子猶屬我在崇壽稠云為當打伊解處別有道理師舉六祖道不是風動不是幡動仁者心動乃曰大小祖師龍頭蛇尾好與二十拄杖時太原孚上座侍立不覺咬齒師曰我適來恁麼道也好喫二十拄杖師行腳時參烏石觀和尚才敲門石問誰師曰鳳凰兒石曰來作麼師曰來啖老觀石便開門搊住曰道道師擬議石拓開閉却門師住後示衆曰我當時若入得老觀門你這一隊噇酒糟漢向甚麼處摸索師問慧全汝得入處作麼生全曰共和尚商量了師曰甚麼處商量曰甚麼處去來師曰汝得入處又作麼生全無對師便打全坦問平田淺草麈鹿成羣如何射得麈中主師喚全坦坦應諾師曰喫茶去問僧甚處來曰溈山來師曰溈山有何言句曰某甲曾問如何是祖師西來意溈山據坐師曰汝肯他否曰某甲不肯他師曰溈山古佛汝速去懺悔玄沙云山頭老漢蹉過溈山也閩王問曰擬欲蓋一所佛殿去時如何師曰大王何不蓋取一所空王殿曰請師樣子師展兩手雲門云一舉四十九僧問學人道不得處請師道師曰我為法惜人師舉拂子示一僧其僧便出去長慶舉似王延彬太傅了乃曰此僧合喚轉與一頓棒王曰和尚是甚麼心行曰幾放過師問長慶古人道前三三後三三意作麼生慶便出去鵝湖別云喏問僧甚處來曰藍田來師曰何不入草長慶云險上堂南山有一條鱉鼻蛇汝等諸人切須好看長慶出曰今日堂中大有人喪身失命雲門以拄杖攛向師前作怕勢有僧舉似玄沙沙曰須是稜兄始得然雖如是我即不然曰和尚作麼生沙曰用南山作麼一日有兩僧來師以手拓庵門放身出曰是甚麼僧亦曰是甚麼師低頭歸庵僧辭去師問甚麼處去曰湖南師曰我有箇同行住巖頭附汝一書去書曰某書上師兄某一自鼇山成道後迄至于今飽不飢同參某書上僧到巖頭問甚麼處來曰雪峰來有書達和尚頭接了乃問僧別有何言句僧遂舉前話頭曰他道甚麼曰他無語低頭歸庵頭曰噫我當初悔不向伊道末後句若向伊道天下人不奈雪老何僧至夏末請益前話頭曰何不早問曰未敢容易頭曰雪峰雖與我同條生不與我同條死要識末後句祇這是上堂盡大地撮來如粟米粒大拋向面前漆桶不會打鼓普請看長慶問雲門曰雪峰與麼道還有出頭不得處麼門曰有曰作麼生門曰不可總作野狐精見解又曰狼籍不少問僧甚麼處去曰識得即知去處師曰你是了事人亂走作麼曰和尚莫塗汙人好師曰我即不塗汙你古人吹布毛作麼生與我説來看曰殘羹餿飯已有人喫了師休去有一僧在山下卓庵多年不剃頭畜一長柄杓溪邊舀水時有僧問如何是祖師西來意主曰溪深杓柄長師聞得乃曰也甚奇怪一日將剃刀同侍者去訪才相見便舉前話問是庵主語否主曰是師曰若道得即不剃你頭主便洗頭胡跪師前師即與剃却師領徒南遊時黃涅槃預知師至搘䇿前迎抵蘇溪邂逅師問近離何處槃曰辟支巖師曰巖中還有主麼槃以竹䇿敲師轎師乃出轎相見槃曰曾郎萬福師遽展丈夫拜槃作女人拜師曰莫是女人麼槃又設兩拜遂以竹策畫地右繞師轎三匝師曰某甲三界內人你三界外人你前去某甲後來槃回師隨至止囊山憩數曰槃供事隨行徒衆一無所缺上堂此事如一片田地相似一任諸人耕種無有不承此恩力者玄沙曰且作麼生是這田地師曰看沙曰是即是某甲不與麼師曰你作麼生沙曰祇是人人底三聖問透網金鱗以何為食師曰待汝出網來向汝道聖曰一千五百人善知識話頭也不識師曰老僧住持事繁上堂盡大地是箇解脫門把手拽伊不肯入時一僧出曰和尚怪某甲不得又一僧曰用入作甚麼師便打玄沙謂師曰某甲如今大用去和尚作麼生師將三箇木毬一時拋出沙作斫牌勢師曰你親在靈山方得如此沙曰也是自家事一日升座衆集定師輥出木毬玄沙遂捉來安舊處師一日在僧堂內燒火閉却前後門乃呌曰救火救火玄沙將一片柴從窗櫺中拋入師便開門問古澗寒泉時如何師曰瞪目不見底曰飲者如何師曰不從口入僧舉似趙州州曰不從口入不可從鼻孔裏入僧却問古澗寒泉時如何州曰苦曰飲者如何州曰死師聞得乃曰趙州古佛遙望作禮自此不答話師因閩王封柑橘各一顆遣使送至柬問既是一般顏色為甚名字不同師遂依舊封回王復馳問玄沙沙將一張紙蓋却問僧近離甚處曰覆船師曰生死海未渡為甚麼覆却船僧無語乃回舉似覆船船曰何不道渠無生死僧再至進此語師曰此不是汝語曰是覆船恁麼道師曰我有二十棒寄與覆船二十棒老僧自喫不干闍黎事問大事作麼生師執僧手曰上座將此問誰有僧禮拜師打五棒僧曰過在甚麼處師又打五棒喝出問僧甚處來曰嶺外來師曰還逢達磨也無曰青天白日師曰自己作麼生曰更作麼生師便打師送僧出行三五步召曰上座僧回首師曰途中善為問拈槌竪拂不當宗乘未審和尚如何師竪起拂子僧乃抱頭出去師不顧法眼代云大衆看此一員戰將問三乘十二分教為凡夫開演不為凡夫開演師曰不消一曲楊柳枝師謂鏡清曰古來有老宿引官人巡堂曰此一衆盡是學佛法僧官人曰金屑雖貴又作麼生老宿無對清代曰比來拋甎引玉法眼別云官人何得貴耳賤目上堂舉拂子曰這箇為中下僧問上上人來時如何師舉拂子僧曰這箇為中下師便打問國師三喚侍者意如何師乃起入方丈問僧今夏在甚麼處曰涌泉師曰長時涌暫時涌曰和尚問不著師曰我問不著僧曰是師乃打普請次路逢一獼猴師曰人人有一面古鏡這箇獼猴亦有一面古鏡三聖曰曠劫無名何以彰為古鏡師曰瑕生也聖曰這老漢著甚麼死急話頭也不識師曰老僧住持事繁閩帥施銀交牀僧問和尚受大王如此供養將何報答師以手拓地曰輕打我輕打我僧問疏山云雪峰道輕打我意作麼生山云頭上插瓜虀垂尾腳跟齊問吞盡毗盧時如何師曰福唐歸來還平善否上堂我若東道西道汝則尋言逐句我若羚羊挂角汝向甚麼處捫摸僧問保福祇如雪峰有甚麼言教便似羚羊挂角時福云我不可作雪峯弟子不得師之法席常不減千五百衆梁開平戊辰三月示疾閩帥命醫師曰吾非疾也竟不服藥遺偈付法五月二日朝遊藍田暮歸澡身中夜入滅洪州感潭資國禪師白兆問家內停喪請師慰問師曰苦痛蒼天曰死却爺死却娘師打了趂出師凡接機皆如此天台瑞龍慧恭禪師福州羅氏子謁德山山問會麼曰作麼山曰請相見曰識麼山大笑遂許入室洎山順世乃開法焉泉州瓦棺和尚在德山為侍者一日同入山斫木山將一碗水與師師接得便喫却山曰會麼師曰不會山又將一碗水與師師又接喫却山曰會麼師曰不會山曰何不成褫取不會底師曰不會又成褫箇甚麼山曰子大似箇鐵橛住後雪峰訪師茶話次峰問當時在德山斫木因緣作麼生師曰先師當時肯我峰曰和尚離師太早時面前偶有一碗水峰曰將水來師便度與峰接得便潑却雲門云莫壓良為賤襄州高亭簡禪師參德山隔江才見便云不審山乃搖扇招之師忽開悟乃橫趨而去更不回顧南嶽下六世巖頭奯禪師法嗣台州瑞巖師彥禪師閩之許氏子自幼披緇秉戒無缺初禮巖頭問曰如何是本常理頭曰動也曰動時如何頭曰不是本常理師良久頭曰肯即未脫根塵不肯即永沈生死師遂領悟便禮拜頭每與語徵酬無忒後謁夾山山問甚處來曰臥龍來山曰來時龍還起也未師乃顧視之山曰灸瘡瘢上更著艾燋曰和尚又苦如此作甚麼山休去師乃問山與麼即易不與麼即難與麼與麼即惺惺不與麼不與麼即居空界與麼不與麼請師速道山曰老僧謾闍黎去也師喝曰這老和尚而今是甚時節便出去後有僧舉似巖頭頭云苦哉將我一枝佛法與麼流將去師尋居丹丘瑞巖坐磐石終日如愚每自喚主人公復應諾乃曰惺惺著他後莫受人謾後有僧參玄沙沙問近離甚處云瑞巖沙云有何言句示徒僧舉前話沙云一等是弄精魂也甚奇怪乃云何不且在彼住云已遷化也沙云而今還喚得應麼僧無對師統衆嚴整江表稱之僧問頭上寶蓋現足下雲生時如何師曰披枷帶鎖漢曰頭上無寶蓋足下無雲生時如何師曰猶不杻在曰畢竟如何師曰齋後困鏡清問天不能覆地不能載豈不是師曰若是即被覆載清曰若不是瑞巖幾遭也師自稱曰師彥僧問如何是佛師曰石牛曰如何是法師曰石牛兒曰恁麼即不同也師曰合不得曰為甚麼合不得師曰無同可同合甚麼問作麼生商量即得不落階級師曰排不出曰為甚麼排不出師曰他從前無階級曰未審居何位次師曰不坐普光殿曰還理化也無師曰名聞三界重何處不歸朝一日有村媼作禮師曰汝速歸救取數千物命媼回舍見兒婦拾田螺歸媼遂放之水濵師之異迹頗多茲不繁録逝後塔于本山諡空照禪師懷州玄泉彥禪師僧問如何是道中人師曰日落投孤店問如何是佛師曰張家三箇兒曰學人不會師曰孟仲季也不會問如何是聲前一句師曰吽曰轉後如何師曰是甚麼福州羅山道間禪師長溪陳氏子出家於龜山年滿受具遍歷諸方嘗謁石霜問去住不寧時如何霜曰直須盡却師不契乃參巖頭亦如前問頭曰從他去住管他作麼師於是服膺閩帥飲其法味請居羅山號法寶禪師開堂升座方斂衣便曰珍重時衆不散良久師又曰未識底近前來僧出禮拜師抗聲曰也大苦哉僧擬伸問師乃喝出問如何是奇特一句師曰道甚麼問當鋒事如何辨明師舉如意僧曰乞和尚垂慈師曰大遠也問急急相投請師一接師曰會麼曰不會師曰箭過也問九女不擕誰是哀提者師曰高聲問僧擬再問師曰甚麼處去也僧來參師問名甚麼曰明教師曰還會教也未曰隨分師竪起拳曰靈山會上喚這箇作甚麼曰拳教師笑曰若恁麼喚作拳教復展兩足曰這箇是甚麼教僧無語師曰莫喚作腳教麼師在禾山送同行矩長老出門次把拄杖向面前一攛矩無對師曰石牛攔古路一馬生雙駒後僧舉似疏山山云石牛攔古路一馬生三寅僧辭保福福問甚處去曰禮拜羅山福曰汝向羅山道保福秋間上府朝覲大王置四十箇問頭問和尚忽若一句不相當莫言不道僧舉似師師呵呵大笑曰陳老師自入福建道洪塘橋下一寨未曾見有箇毛頭星現汝與我向從展道陳老師無許多問頭祇有一口劒一劒下須有分身之意亦有出身之路若不明便須成末僧回舉似福福曰我當時也祇是謔伊至秋朝覲師特為辦茶筵請福福不赴却向僧曰我中間曾有謔語恐和尚問著僧歸舉似師曰汝向他道猛虎終不食伏肉僧又去福遂來無軫上座問祇如巖頭道洞山好佛祇是無光未審洞山有何虧闕便道無光師召軫軫應諾師曰灼然好箇佛祇是無光曰大師為甚麼撥無軫話師曰甚麼處是陳老師撥你話處快道快道軫無語師打三十棒趂出軫舉似招慶慶一夏罵詈至夏末自來問師乃分明舉似慶便作禮懺悔曰洎錯怪大師僧舉寒山詩問白鶴銜苦桃時如何師曰貞女室中吟曰千里作一息時如何師曰送客郵亭外曰欲往蓬萊山時如何師曰欹枕獼猴曰將此充糧食時如何師曰古劒髑髏前問如何是百草頭上盡是祖師意師曰刺破汝眼問如何是道師曰時著壁問前是萬丈洪崖後是虎狼師子正當恁麼時如何師曰自在問三界誰為主師曰還解喫飯麼臨遷化上堂集衆良久展左手主事罔測乃令東邊師僧退後又展右手又令西邊師僧退後乃曰欲報佛恩無過流通大教歸去也歸去也珍重言訖莞爾而寂福州香溪從範禪師新到參師曰汝豈不是鼓山僧僧曰是師曰額上珠為何不現僧無對僧辭師門送復召上座僧回首師曰滿肚是禪曰和尚是甚麼心師行大笑而已師披衲衣次説偈曰迦葉上行衣披來須捷機才分招的箭密露不藏龜福州聖壽嚴禪師補衲次僧參師提起示之曰山僧一衲衣展似衆人見雲水兩條分莫教露針線速道速道僧無對師曰如許多時作甚麼來吉州靈巖慧宗禪師福州陳氏子受業於龜山僧問如何是靈巖境師曰松檜森森密密遮曰如何是境中人師曰夜夜有猿啼問如何是學人自己本分事師曰拋却真金拾瓦礫作麼雪峰存禪師法嗣福州玄沙師備宗一禪師閩之謝氏子幼好垂釣泛小艇於南臺江狎諸漁者唐咸通初年甫三十忽慕出塵乃棄舟投芙蓉訓禪師落髮往豫章開元寺受具布衲芒屨食才接氣常終日宴坐衆皆異之與雪峯本法門昆仲而親近若師資峯以其苦行呼為頭陀一日峰問阿那箇是備頭陀師曰終不敢誑於人異日峰召曰備頭陀何不遍參去師曰達磨不來東土二祖不往西天峰然之暨登象骨山乃與師同力締搆玄徒臻萃師入室咨決罔替晨昏又閲楞嚴發明心地由是應機敏捷與修多羅冥契諸方玄學有所未決必從之請益至與雪峰徵詰亦當仁不讓峰曰備頭陀再來人也雪峰上堂要會此事猶如古鏡當臺胡來胡現漢來漢現師出衆曰忽遇明鏡來時如何峰曰胡漢俱隱師曰老和尚腳跟猶未點地在住後上堂佛道間曠無有程途無門解脫之門無意道人之意不在三際故不可升沈建立乖真非屬造化動則起生死之本靜則醉昏沉之鄉動靜雙泯即落空亡動靜雙收瞞頇佛性必須對塵對境如枯木寒灰臨時應用不失其宜鏡照諸像不亂光輝鳥飛空中不雜空色所以十方無影像三界絶行蹤不墮往來機不住中間意鐘中無鼓響鼓中無鐘聲鐘鼓不相交句句無前後如壯士展臂不藉他力師子遊行豈求伴侶九霄絶翳何在穿通一段光明未曾昏昧若到這裏體寂寂常的的日赫焰無邊表圓覺空中不動搖吞爍乾坤迥然照夫佛出世者元無出入故曰無體道本如如法爾天真不同修證祇要虗間不昧作用不涉塵泥箇中纖毫道不盡即為魔王眷屬句前後句是學人難處所以一句當天八萬門永絶生死直饒得似秋潭月影靜夜鐘聲隨扣擊以無虧觸波瀾而不散猶是生死岸頭事道人行處如火銷冰終不却成冰箭既離弦無返回勢所以牢籠不肯住呼喚不回頭古聖不安排至今無處所若到這裏步步登玄不屬邪正識不能識智不能知動便失宗覺即迷旨二乘膽顫十地魂驚語路處絶心行處滅直得釋迦掩室於摩竭淨名杜口於毗耶須菩提唱無説而顯道釋梵絶聽而雨花若與麼見前更疑何事沒棲泊處離去來今限約不得心思路絶不因莊嚴本來真淨動用語笑隨處明了更無欠少今時人不悟箇中道理妄自涉事涉塵處處染著頭頭繫絆縱悟則塵境紛紜名相不實便擬凝心斂念攝事歸空閉目藏睛終有念起旋旋破除細想才生即便遏捺如此見解即是落空亡底外道魂不散底死人冥冥漠漠無覺無知塞耳偷鈴徒自欺誑這裏分別則不然也不是隈門傍戶句句現前不得商量不涉文墨本絶塵境本無位次權名箇出家兒畢竟無蹤迹真如凡聖地獄人天祇是療狂子之方虗空尚無改變大道豈有升沉悟則縱橫不離本際若到這裏凡聖也無立處若向句中作意則沒溺殺人若向外馳求又落魔界如如向上沒可安排恰似焰爐不藏蚊蚋此理本來平坦何用剗除動靜揚眉是真解脫道不強為意度建立乖真若到這裏纖毫不受指意則差便是千聖出頭來也安一字不得久立珍重上堂我今問汝諸人且承當得箇甚麼事在何世界安身立命還辨得麼若辨不得恰似揑目生花見事便差知麼如今目前見有山河大地色空明暗種種諸物皆是狂勞花相喚作顛倒知見夫出家人識心達本源故號為沙門汝今既已剃髮披衣為沙門相即便有自利利他分如今看著盡黑漫漫地墨汁相似自救尚不得爭解為得人仁者佛法因緣事大莫作等間相似聚頭亂説雜話趂讚過時光陰難得可惜許大丈夫兒何不自省察看是甚麼事祇如從上宗乘是諸佛頂族汝既承當不得所以我方便勸汝但從迦葉門接續頓超去此一門超凡聖因果超毗盧妙莊嚴世界海超他釋迦方便門直下永劫不教有一物與汝作眼見何不自急急究取未必道我且待三生兩生久積淨業仁者宗乘是甚麼事不可由汝用工莊嚴便得去不可他心宿命便得去會麼祇如釋迦出頭來作許多變弄説十二分教如瓶灌水大作一場佛事向此門中用一點不得用一毛頭伎倆不得知麼如同夢事亦如寐語沙門不應出頭來不同夢事蓋為識得知麼識得即是大出脫大徹頭人所以超凡越聖出生離死離因離果超毗盧越釋迦不被凡聖因果所謾一切處無人識得汝知麼莫祇長戀生死愛網被善惡業拘將去無自由分饒汝鍊得身心同虗空去饒汝到精明湛不搖處不出識陰古人喚作如急流水流急不覺妄為恬靜恁麼修行盡出他輪回際不得依前被輪回去所以道諸行無常直是三乘功果如是可畏若無道眼亦不究竟何似如今博地凡夫不用一毫工夫便頓超去解省心力麼還願樂麼勸汝我如今立地待汝搆去更不教汝加功煉行如今不恁麼更待何時還肯麼便下座上堂汝諸人如在大海裏坐沒頭浸却了更展手問人乞水喫夫學般若菩薩須具大根器有大智慧始得若有智慧即今便出脫得去若是根機遲鈍直須勤苦耐志日夜忘疲無眠失食如喪考妣相似恁麼急切盡一生去更得人荷挾尅骨究實不妨易得搆去且況如今誰是堪任受學底人仁者莫祇是記言記語恰似念陀羅尼相似踏步向前來口裏哆哆和和地被人把住詰問著沒去處便嗔道和尚不為我答話恁麼學事大苦知麼有一般坐繩牀和尚稱善知識問著便搖身動手點眼吐舌瞪視更有一般説昭昭靈靈靈臺智性能見能聞向五蘊身田裏作主宰恁麼為善知識大賺人知麼我今問汝汝若認昭昭靈靈是汝真實為甚麼瞌睡時又不成昭昭靈靈若瞌睡時不是為甚麼有昭昭時汝還會麼這箇喚作認賊為子是生死根本妄想緣氣汝欲識根由麼我向汝道昭昭靈靈祇因前塵色聲香等法而有分別便道此有昭昭靈靈若無前塵汝此昭昭靈靈同於龜毛兔角仁者真實在甚麼處汝今欲得出他五蘊身田主宰但識取汝祕密金剛體古人向汝道圓成正遍遍周沙界我今少分為汝智者可以譬喻得解汝還見南閻浮提日麼世間人所作興營養身活命種種心行作業莫非皆承日光成立祇如日體還有許多般心行麼還有不周遍處麼欲識金剛體亦須如是看祇如今山河大地十方國土色空明暗及汝身心莫非盡承汝圓成威光所現直是天人羣生類所作業次受生果報有情無情莫非承汝威光乃至諸佛成道成果接物利生莫非盡承汝威光祇如金剛體還有凡夫諸佛麼有汝心行麼不可道無便得當去也知麼汝既有如是奇特當陽出身處何不發明取因何却隨他向五蘊身田中鬼趣裏作活計直下自謾去忽然無常殺鬼到來眼目譸張身見命見恁麼時大難支荷如生脫龜殼相似大苦仁者莫把瞌睡見解便當却去未解蓋覆得毛頭許汝還知麼三界無安猶如火宅且汝未是得安樂底人祇大作羣隊干他人世這邊那邊飛走野鹿相似但求衣食若恁麼爭行他王道知麼國王大臣不拘執汝父母放汝出家十方施主供汝衣食土地龍神呵護汝也須具慚愧知恩始得莫孤負人好長連牀上排行著地銷將去道是安樂未在皆是粥飯將養得汝爛冬瓜相似變將去土裏埋將去業識茫茫無本可據沙門因甚麼到恁麼地祇如大地上蠢蠢者我喚作地獄劫住如今若不了明朝後日入驢胎馬肚裏牽犂拽耙銜鐵負鞍碓搗磨磨水火裏燒煮去大不容易受大須恐懼好是汝自纍知麼若是了去直下永劫不曾教汝有這箇消息若不了此煩惱惡業因緣不是一劫兩劫得休直與汝金剛齊壽知麼師因參次聞燕子聲乃曰深談實相善説法要便下座時有僧請益曰某甲不會師曰去誰信汝鼓山來師作一圓相示之山曰人人出這箇不得師曰請知汝向驢胎馬腹裏作活計山曰和尚又作麼生師曰人人出這箇不得山曰和尚與麼道却得某甲為甚麼道不得師曰我得汝不得上堂衆集遂將拄杖一時趂下却回向侍者道我今日作得一解險入地獄如箭射者曰喜得和尚再復人身僧侍立次師以杖指面前地上白點曰還見麼曰見如是三問僧亦如是答師曰你也見我也見為甚麼道不會師嘗訪三斗庵主才相見主曰莫怪住山年深無坐具師曰人人盡有庵主為甚麼無主曰且坐喫茶師曰庵主元來有在侍雪峰次有二僧從階下過峰曰此二人堪為種草師曰某甲不與麼峰曰汝作麼生師曰便好與三十棒因雪峰指火曰三世諸佛在火焰裏轉大法輪師曰近日王令稍嚴峰曰作麼生師曰不許攙奪行市雲門曰火焰為三世諸佛説法三世諸佛立地聽南際到雪峰峰令訪師師問古人道此事唯我能知長老作麼生際曰須知有不求知者歸宗柔別拊掌三下師曰山頭和尚喫許多辛苦作麼雪峰普請畬田次見一蛇以杖挑起召衆曰看看以刀芟為兩段師以杖拋於背後更不顧視衆愕然峰曰俊哉侍雪峰遊山次峰指面前地曰這一片地好造箇無縫塔師曰高多少峯乃顧視上下師曰人天福報即不無和尚若是靈山授記未夢見在峯曰你又作麼生師曰七尺八尺雪峰曰世界闊一尺古鏡闊一尺世界闊一丈古鏡闊一丈師指火爐曰火爐闊多少峯曰如古鏡闊師曰老和尚腳跟未點地在師初住普應院遷止玄沙天下叢林皆望風而賓之閩帥王公待以師禮學徒餘八百室戶不閉上堂良久曰我為汝得徹困也還會麼僧問寂寂無言時如何師曰寐語作麼曰本分事請師道師曰瞌睡作麼曰學人即瞌睡和尚如何師曰爭得恁麼不識痛癢又曰可惜如許大師僧千道萬里行腳到這裏不消箇瞌睡寐語便屈却去問如何是學人自己師曰用自己作麼問從上宗乘如何理論師曰少人聽曰請和尚直道師曰患聾作麼又曰仁者如今事不獲已教我抑下如是威光苦口相勸百千方便如此如彼共汝相知聞盡成顛倒知見將此咽喉唇吻祇成得箇野狐精業謾汝我還肯麼祇如有過無過唯我自知汝爭得會若是恁麼人出頭來甘伏呵責夫為人師匠大不易須是善知識始得知我如今恁麼方便助汝猶尚不能搆得可中純舉宗乘是汝向甚麼處安措還會麼四十九年是方便祇如靈山會上有百萬衆唯有迦葉一人親聞餘盡不聞汝道迦葉親聞底事作麼生不可道如來無説説迦葉不聞聞便得當去不可是汝修因成果福智莊嚴底事知麼且如道吾有正法眼藏付囑大迦葉我道猶如話月曹溪竪拂子還如指月所以道大唐國內宗乘中事未曾見有一人舉唱設有人舉唱盡大地人失却性命如無孔鐵鎚相似一時亡鋒結舌去汝諸人賴遇我不惜身命共汝顛倒知見隨汝狂意方有伸問處我若不共汝恁麼知聞去汝向甚麼處得見我會麼大難努力珍重師有偈曰萬里神光頂後相沒頂之時何處望事已成意亦休此箇來蹤觸處周智者撩著便提取莫待須臾失却頭又曰玄沙遊徑別時人切須知三冬陽氣盛六月降霜時有語非關舌無言切要詞會我最後句出世少人知問四威儀外如何奉王師曰汝是王法罪人爭會問事問古人拈槌竪拂還當宗乘也無師曰不當曰古人意作麼生師舉拂子僧曰宗乘中事如何師曰待汝悟始得問如何是金剛力士師吹一吹閩王送師上船師扣船召曰大王爭能出得這裏去王曰在裏許得多少時也歸宗柔別云不因和尚不得到這裏師問文桶頭下山幾時歸曰三五日師曰歸時有無底桶子將一擔歸文無對歸宗柔代云和尚用作甚麼師垂語曰諸方老宿盡道接物利生祇如三種病人汝作麼生接患盲者拈槌竪拂他又不見患聾者語言三昧他又不聞患啞者教伊説又説不得若接不得佛法無靈驗時有僧出曰三種病人還許學人商量否師曰許汝作麼生商量其僧珍重出師曰不是不是羅漢曰桂琛現有眼耳口和尚作麼生接師曰慚愧便歸方丈中塔曰三種病人即今在甚麼處又一僧曰非唯謾他兼亦自謾法眼云我當時見羅漢舉此僧語我便會三種病人雲居錫云祇如此僧會不會若道會玄沙又道不是若道不會法眼為甚麼道我因此僧語便會三種病人上座無事上來商量大家要知有僧請益雲門門曰汝禮拜著僧禮拜起門以拄杖挃之僧退後門曰汝不是患盲麼復喚近前來僧近前門曰汝不是患聾麼門曰會麼曰不會門曰汝不是患啞麼僧於是有省長慶來師問除却藥忌作麼生道慶曰放憨作麼師曰雪峰山橡子拾食來這裏雀兒放糞師因僧禮拜師曰因我得禮汝普請斫柴次見一虎天龍曰和尚虎師曰是汝虎歸院後天龍問適來見虎云是汝未審尊意如何師曰娑婆世界有四種極重事若人透得不妨出得陰界東禪齊云上座古人見了道我身心如大地虛空如今人還透得麼師問長生維摩觀佛前際不來後際不去今則無住汝作麼生觀生曰放皎然過有箇道處師曰放汝過作麼生道生良久師曰教阿誰委悉生曰徒勞側耳師曰情知汝向鬼窟裏作活計崇壽稠別長生云喚甚麼作如來問古人皆以瞬視接人未審和尚以何接人師曰我不以瞬視接人曰學人為甚道不得師曰畐塞汝口爭解道得法眼云古人恁麼道甚奇特且問上座口是甚麼問凡有言句盡落裷䙡不落裷䙡請和尚商量師曰拗折稱衡來與汝商量問承古有言舉足下足無非道場如何是道場師曰沒却你曰為甚麼得恁麼難見師曰祇為太近法眼曰也無可得近直下是上座師在雪峰時光侍者謂師曰師叔若學得禪某甲打鐵船下海去師住後問光曰打得鐵船也未光無對法眼代云和尚終不恁麼法燈代云請和尚下船玄覺代云貪兒思舊債師一日遣僧送書上雪峰峰開緘見白紙三幅問僧會麼曰不會峰曰不見道君子千里同風僧回舉似師曰山頭老漢蹉過也不知曰和尚如何師曰孟春猶寒也不解道師問鏡清教中道不見一法為大過患且道不見甚麼法清指露柱曰莫是不見這箇法麼同安顯別云也知和尚不造次師曰浙中清水白米從汝喫佛法未會在問承和尚有言盡十方世界是一顆明珠學人如何得會師曰盡十方世界是一顆明珠用會作麼僧便休師來日却問其僧盡十方世界是一顆明珠汝作麼生會曰盡十方世界是一顆明珠用會作麼師曰知汝向鬼窟裏作活計玄覺云一般恁麼道為甚麼却成鬼窟去問如何是無縫塔師曰這一縫大小韋監軍來謁乃曰曹山和尚甚奇怪師曰撫州取曹山幾里韋指傍僧曰上座曾到曹山否曰曾到韋曰撫州取曹山幾里曰百二十里韋曰恁麼則上座不到曹山韋却起禮拜師曰監軍却須禮此僧此僧却具慚愧雲居錫云甚麼處是此僧具慙愧若檢得出許上座有行腳眼問如何是清淨法身師曰膿滴滴地問如何是親切底事師曰我是謝三郎西天有聲明三藏至閩帥請師辨驗師以鐵火筯敲銅爐問是甚麼聲藏曰銅鐵聲法眼別云請大師為大王法燈別云聽和尚問師曰大王莫受外國人謾藏無對法眼代云大師久受大王供養法燈代云却是和尚謾大王師南遊莆田縣排百戲迎接來日師問小塘長老昨日許多喧閙向甚麼處去也塘提起衲衣角師曰料掉沒交涉法眼別云昨日有多少喧閙法燈別云今日更好笑問僧乾闥婆城汝作麼生會曰如夢如幻法眼別敲物示之師與地藏在方丈説話夜深侍者閉却門師曰門總閉了汝作麼生得出去藏曰喚甚麼作門法燈別云和尚莫欲歇去師以杖拄地問長生曰僧見俗見男見女見汝作麼生見曰和尚還見皎然見處麼師曰相識滿天下問承和尚有言聞性遍周沙界雪峯打鼓這裏為甚麼不聞師曰誰知不聞問險惡道中以何法津梁師曰以眼為津梁曰未得者如何師曰快救取好師舉志公云每日拈香擇火不知身是道場乃曰每日拈香擇火不知真箇道場玄覺云祇如此二尊宿語還有親疏也無師與韋監軍喫果子韋問如何是日用而不知師拈起果子曰喫韋喫果子了再問師曰祇這是日用而不知普請搬柴師曰汝諸人盡承吾力一僧曰既承師力何用普請師叱之曰不普請爭得柴歸師問明真大師善財參彌勒彌勒指歸文殊文殊指歸佛處汝道佛指歸甚麼處曰不知師曰情知汝不知法眼別云喚甚麼作佛大普玄通到禮覲師曰你在彼住莫誑惑人家男女曰玄通祇是開箇供養門晚來朝去爭敢作恁麼事師曰事難曰真情是難師曰甚麼處是難處曰為伊不肯承當師便入方丈拄却門僧問學人乍入叢林乞師指箇入路師曰還聞偃溪水聲麼曰聞師曰從這裏入泉守王公請師登樓先語客司曰待我引大師到樓前便升却梯客司稟旨公曰請大師登樓師視樓復視其人乃曰佛法不是此道理法眼云未舁梯時日幾度登樓師與泉守在室中説話有一沙彌揭簾入見却退步而出師曰那沙彌好與二十拄杖守曰恁麼即某甲罪過同安顯別云祖師來也師曰佛法不是恁麼鏡清云不為打水有僧問不為打水意作麼生清云青山碾為塵敢保沒間人梁開平戊辰示寂閩帥為之樹塔福州長慶慧稜禪師杭州鹽官人也姓孫氏稟性淳淡年十三於蘇州通玄寺出家登戒歷參禪苑後參靈雲問如何是佛法大意雲曰驢事未去馬事到來師如是往來雪峰玄沙二十年間坐破七箇蒲團不明此事一日捲簾忽然大悟乃有頌曰也大差也大差捲起簾來見天下有人問我解何宗拈起拂子劈口打峯舉謂玄沙曰此子徹去也沙曰未可此是意識著述更須勘過始得至晚衆僧上來問訊峰謂師曰備頭陀未肯汝在汝實有正悟對衆舉來師又有頌曰萬象之中獨露身唯人自肯乃方親昔時謬向途中覓今日看來火裏冰峯乃顧沙曰不可更是意識著述師問峰曰從上諸聖傳受一路請師垂示峯良久師設禮而退峯乃微笑師入方丈參峯曰是甚麼師曰今日天晴好普請自此酬問未嘗爽於玄旨師在西院問詵上座曰這裏有象骨山汝曾到麼曰不曾到師曰為甚麼不到曰自有本分事在師曰作麼生是上座本分事詵乃提起衲衣角師曰為當祇這箇別更有曰上座見箇甚麼師曰何得龍頭蛇尾保福辭歸雪峰謂師曰山頭和尚或問上座信作麼生祇對師曰不避腥羶亦有少許曰信道甚麼師曰教我分付阿誰曰從展雖有此語未必有恁麼事師曰若然者前程全自闍黎師與保福遊山福問古人道妙峯山頂莫祇這箇便是也無師曰是即是可惜許僧問鼓山祇如長慶恁麼道意作麼生山云孫公若無此語可謂髑髏遍野師來往雪峰二十九載天祐三年泉州刺史王延彬請住招慶開堂日公朝服趨隅曰請師説法師曰還聞麼公設拜師曰雖然如此恐有人不肯僧問如何是正法眼師曰有願不撒沙一日王太傅入院見方丈門閉問演侍者曰有人敢道太師在否演曰有人敢道太師不在否法眼別云大傅識太師閩帥請居長慶號超覺太師上堂良久曰還有人相悉麼若不相悉欺謾兄弟去也祇今有甚麼事莫有窒塞也無復是誰家屋裏事不肯擔荷更待何時若是利根參學不到這裏還會麼如今有一般行腳人耳裏總滿也假饒收拾得底還當得行腳事麼僧問行腳事如何學師曰但知就人索取曰如何是獨脫一路師曰何煩更問問名言妙義教有所詮不涉三科請師直道師曰珍重師乃曰明明歌詠汝尚不會忽被暗裡來底事汝作麼生僧問如何是暗來底事師曰喫茶去中塔代云便請和尚相伴問如何是不隔毫端底事師曰當不當問如何得不疑不惑去師乃展兩手僧不進語師曰汝更問我與汝道僧再問師露膊而坐僧禮拜師曰汝作麼生會曰今日風起師曰恁麼道未定人見解汝於古今中有甚麼節要齊得長慶若舉得許汝作話主其僧但立而已師却問汝是甚處人曰向北人師曰南北三千里外學妄語作麼僧無對上堂良久曰莫道今夜較些子便下座僧問衆手淘金誰是得者師曰有伎倆者得曰學人還得也無師曰大遠在上堂撞著道伴交肩過一生參學事畢上堂淨潔打疊了也却近前問我覓我劈脊與你一棒有一棒到你你須生慚愧無一棒到你你又向甚麼處會問羚羊挂角時如何師曰草裏漢曰挂角後如何師曰亂呌喚曰畢竟如何師曰驢事未去馬事到來問如是何合聖之言師曰大小長慶被汝一問口似匾擔曰何故如此師曰適來問甚麼上堂我若純舉唱宗乘須閉却法堂門所以道盡法無民僧問不怕無民請師盡法師曰還委落處麼問如何是西來意師曰香嚴道底一時坐却上堂總似今日老胡有望保福曰總似今日老胡絶望玄覺云恁麼道是相見語不是相見語安國和尚得師號師去作賀國出接師曰師號來邪曰來也師曰是甚麼號曰明真師乃展手國曰甚麼處去來師曰幾不問過問僧甚處來曰鼓山來師曰鼓山有不跨石門底句有人借問汝作麼生道曰昨夜報慈宿師曰劈脊棒汝又作麼生曰和尚若行此棒不虗受人天供養師曰幾合放過問古人有言相逢不拈出舉意便知有時如何師曰知有也未僧又問保福福云此是誰語云丹霞語福云去莫妨我打睡師入僧堂舉起疏頭曰見即不見還見麼衆無對法眼代云縱受得到別處亦不敢呈人師到羅山見製龕子以杖敲龕曰太煞頂備山曰拙布置師曰還肯入也無山乃吽吽上堂大衆集定師乃拽出一僧曰大衆禮拜此僧又曰此僧有甚麼長處便教大衆禮拜衆無對僧問如何是文彩未生時事師曰汝先舉我後舉其僧但立而已法眼別云請和尚舉師曰汝作麼生舉曰某甲截舌有分保福遷化僧問保福拋却殼漏子向甚麼處去也師曰且道保福在那箇殼漏子裏法眼別云那箇是保福殼漏子閩帥夫人崔氏奉道自稱練師遣使送衣物至曰練師令就大師請回信師曰傳語練師領取回信須臾使却來師前唱喏便回師明日入府練師曰昨日謝大師回信師曰却請昨日回信看練師展兩手帥問師曰練師適來呈信還愜大師意否師曰猶較些子法眼別云這一轉語大王自道取曰未寧大師意旨如何師良久帥曰不可思議大師佛法深遠後唐長興三年歸寂王氏建塔漳州保福院從展禪師福州陳氏子年十五禮雪峰為受業師遊吳楚間後歸執侍峰一日忽召曰還會麼師欲近前峰以杖拄之師當下知歸嘗以古今方便詢于長慶一日慶謂師曰寧説阿羅漢有三毒不可説如來有二種語不道如來無語祇是無二種語師曰作麼生是如來語慶曰聾人爭得聞師曰情知和尚向第二頭道慶曰汝又作麼生師曰喫茶去雲居錫云甚麼處是長慶向第二頭道處因舉盤山道光境俱亡復是何物洞山道光境未亡復是何物師曰據此二尊宿商量猶未得勦絶乃問長慶如今作麼生道得勦絶慶良久師曰情知和尚向鬼窟裏作活計慶却問作麼生師曰兩手扶犂水過膝長慶問見色便見心還見船子麼師曰見曰船子且置作麼生是心師却指船子歸宗柔別云和尚祇解問人雪峰上堂曰諸上座望州亭與汝相見了也烏石嶺與汝相見了也僧堂前與汝相見了也師舉問鵝湖僧堂前相見即且置祇如望州亭烏石嶺甚麼處相見鵝湖驟步歸方丈師低頭入僧堂粱貞明四年漳州刺史王公創保福禪苑迎請居之開堂日王公禮跪三請躬自扶掖升座師乃曰須起箇笑端作麼然雖如此再三不容推免諸仁者還識麼若識得便與古佛齊肩時有僧出方禮拜師曰晴乾不肯去直待雨淋頭問郡守崇建精舍大闡真風便請和尚舉揚宗教師曰還會麼曰恁麼則羣生有賴也師曰莫塗汙人好又僧出禮拜師曰大德好與莫覆却船子僧問泯默之時將何為則師曰落在甚麼處曰不會師曰瞌睡漢出去上堂此事如擊石火似閃電光搆得搆不得未免喪身失命僧問未審搆得底人還免喪身失命也無師曰適來且置闍黎還搆得麼曰若搆不得未免大衆怪笑師曰作家作家曰是甚麼心行師曰一杓屎攔面潑也不知臭師見僧以杖打露拄又打其僧頭僧作忍痛聲師曰那箇為甚麼不痛僧無對玄覺代云貪行拄杖問摩騰入漢一藏分明達磨西來將何指示師曰上座行腳事作麼生曰不會師曰不會會取莫傍家取人處分若是久在叢林粗委些子遠近可以隨處任真其有初心後學未知次序山僧所以不惜口業向汝道塵劫來事祇在如今還會麼然佛法付囑國王大臣郡守昔同佛會今方如是若是福祿榮貴則且不論祇如當時受佛付囑底事還記得麼若識得便與千聖齊肩儻未識得直須諦信此事不從人得自己亦非言多去道轉遠直道言語道斷心行處滅猶未是在久立珍重上堂有人從佛殿後過見是張三李四從佛殿前過為甚麼不見且道佛法利害在甚麼處僧曰為有一分粗境所以不見師乃叱之自代曰若是佛殿即不見曰不是佛殿還可見否師曰不是佛殿見箇甚麼問十二時中如何據驗師曰恰好據驗曰學人為甚麼不見師曰不可更揑目去也問主伴重重極十方而齊唱如何是極十方而齊唱師曰汝何不教別人問問因言辨意時如何師曰因甚麼言僧低頭良久師曰掣電之機徒勞佇思師因僧侍立問曰汝得恁麼粗心僧曰甚麼處是某甲粗心處師拈一塊土度與僧曰拋向門前著僧拋了却來曰甚麼處是某甲粗心處師曰我見築著磕著所以道汝粗心師問羅山僧問巖頭浩浩塵中如何辨主頭曰銅沙鑼裏滿盛油意作麼生山召師師應諾山曰獼猴入道場山却問明招忽有人問你又作麼生招曰箭穿紅日影師問羅山巖頭道與麼與麼不與麼不與麼意作麼生山召師師應諾山曰雙明亦雙暗師禮謝三日後却問前日蒙和尚垂慈祇為看不破山曰盡情向汝道了也師曰和尚是把火行山曰若與麼據汝疑處問將來師曰如何是雙明亦雙暗山曰同生亦同死師又禮謝而退別有僧問師同生亦同死時如何師曰彼此合取狗口曰和尚收取口喫飯其僧却問羅山同生亦同死時如何山曰如牛無角曰同生不同死時如何山曰如虎戴角師見僧喫飯乃拓鉢曰家常僧曰和尚是甚麼心行有尼到參師問阿誰侍者報曰覺師姑師曰既是覺師姑用來作麼尼曰仁義道中即不無師別云和尚是甚麼心行師聞長生卓庵乃往相訪茶話次生曰曾有僧問祖師西來意某甲舉拂子示之不知得不得師曰某甲爭敢道得不得有箇問有人讚歎此事如虎戴角有人輕毀此事分文不直一等是恁麼事因甚麼毀讚不同生曰適來出自偶爾老宿云毀又爭得又老宿云惜取眉毛好太原孚云若無智眼難辨得失師問僧殿裏底是甚麼曰和尚定當看師曰釋迦佛曰和尚莫謾人好師曰却是汝謾我閩帥遣使送朱記到師上堂提起印曰去即印住住即印破僧曰不去不住用印奚為師便打僧曰恁麼則鬼窟裏全因今日也師持印歸方丈問僧甚處來曰江西師曰學得底那曰拈不出師曰作麼生法眼別云謾語僧無對師舉洞山真讚云徒觀紙與墨不是山中人僧問如何是山中人師曰汝試邈掠看曰若不黠兒幾成邈掠師曰汝是黠兒曰和尚是甚麼心行師曰來言不豐僧數錢次師乃展手曰乞我一錢曰和尚因何到恁麼地師曰我到恁麼地曰若到恁麼地將取一文去師曰汝因甚到恁麼地問僧甚處來曰觀音師曰還見觀音麼曰見師曰左邊見右邊見曰見時不歷左右法眼別云如和尚見問如何是入火不燒入水不溺師曰若是水火即被燒溺師問飯頭鑊闊多少曰和尚試量看師以手作量勢曰和尚莫謾某甲師曰却是汝謾我問欲達無生路應須識本源如何是本源師良久却問侍者這僧問甚麼其僧再舉師乃喝出曰我不患聾問學人近入叢林乞師全示入路師曰若教全示我却禮拜汝師問僧汝作甚麼業來得恁麼長大曰和尚短多少師却蹲身作短勢僧曰和尚莫謾人好師曰却是汝謾我師令侍者屈隆壽長老云但獨自來莫將侍者來壽曰不許將來爭解離得師曰太煞恩愛壽無對師代曰更謝和尚上足傳示閩帥奏命服一日示微疾僧入丈室問訊師曰吾與汝相識年深有何方術相救曰方術甚有聞説和尚不解忌口法燈別云和走解忌口麼又謂衆曰吾旬日來氣力困劣別無他祇是時至也僧問時既至矣師去即是住即是師曰道道曰恁麼則某甲不敢造次師曰失錢遭罪言訖而寂福州鼓山神晏興聖國師大梁李氏子幼惡葷羶樂聞鐘梵年十二時有白氣數道騰于所居屋壁師題壁曰白道從茲速改張休來顯現作妖祥定祛邪行歸真見必得超凡入聖鄉題罷氣即隨滅年甫志學遘疾甚亟夢神人與藥覺而頓愈明年又夢梵僧告曰出家時至矣遂依衛州白鹿山規禪師披削嵩嶽受具謂同學曰古德云白四羯磨後全體戒定慧豈準繩而可拘也於是杖錫遍扣禪關而但記語言存乎知解及造雪嶺朗然符契一日參雪峰峰知其緣熟忽起搊住曰是甚麼師釋然了悟亦忘其了心唯舉手搖曳而已峰曰子作道理邪師曰何道理之有峰審其懸解撫而印之後閩帥常詢法要創鼓山禪苑請舉揚宗旨上堂良久曰南泉在日亦有人舉要且不識南泉即今莫有識南泉者麼試出來對衆驗看時有僧出禮拜才起師曰作麼生僧近前曰咨和尚師曰不才請退乃曰經有經師論有論師律有律師有函有號有部有帙各有人傳持且佛法是建立教禪道乃止啼之説他諸聖出興蓋為人心不等巧開方便遂有多門受疾不同處方還異在有破有居空叱空二患既除中道須遣鼓山所以道句不當機言非展事承言者喪滯句者迷不唱言前寧談句後直至釋迦掩室淨名杜口大士梁時童子當日一問二問三問盡有人了也諸仁者合作麼生時有僧出禮拜師曰高聲問曰學人咨和尚師喝曰出去曰己事未明以何為驗師抗聲曰似未聞那其僧再問師曰一點隨流食咸不重問如何是包盡乾坤底句師曰近前來僧近前師曰鈍置殺人曰如何紹得師曰犴𤞞無風徒勞展掌曰如何即是師曰錯曰學人便承當時如何師曰汝作麼生承當法燈別云莫費力問如何是學人正立處師曰不從諸聖行法燈別云汝擬亂走問千山萬山那箇是正山師曰用正山作麼法燈別云千山萬山師與招慶相遇次慶曰家常師曰太無厭生慶曰且欵欵師却曰家常慶曰今日未有火師曰太鄙吝生慶曰穩便將取去上堂垂語曰鼓山門下不得咳嗽時有僧咳嗽一聲師曰作甚麼曰傷風師曰傷風即得僧問如何是宗門中事師乃側掌吽吽問如何是向上關棙子師便打問如何是鼓山正主師曰瞎作麼師問保福古人道非不非是不是意作麼生福拈起茶盞師曰莫是非好問如何是真實人體師曰即今是甚麼體曰究竟如何師曰爭得到恁麼地問如何是佛法大意師曰金烏一點萬里無雲上堂欲知此事如一口劒僧問學人是死尸如何是劒師曰拽出這死尸著僧應喏便歸僧堂結束而去師至晚聞得乃曰好與拄杖東禪齊云這僧若不肯鼓山有甚過若肯何得便發去又云鼓山拄杖賞伊罰伊具眼底試商量看問僧鼓山有不跨石門句汝作麼生道僧曰請師便打問如何是古人省心力處師曰汝何費力問言滿天下無口過如何是無口過師曰有甚麼過問如何是教外別傳底事師曰喫茶去師與閩帥瞻仰佛像帥問是甚麼佛師曰請大王鑒帥曰鑒即不是佛師曰是甚麼帥無對長慶代云久承大師在衆何得造次僧問從上宗乘如何舉唱師以拂子驀口打問如何是省要處師曰汝還恥麼師復曰今為諸仁者刺頭入他諸聖化門裏抖擻不出所以向諸人道教排不到祖不西來三世諸佛不能唱十二分教載不起凡聖攝不得古今傳不得忽爾是箇漢未通箇消息向他恁麼道被他驀口摑還怪得他麼雖然如此也不得亂摑鼓山尋常道更有一人不跨石門須有不跨石門句作麼生是不跨石門句鼓山自住三十餘年五湖四海來者向高山頂上看山玩水未見一人快利通得箇消息如今還有人通得也未若通得亦不昧諸兄弟若無不如散去珍重師有偈曰直下猶難會尋言轉更賖若論佛與祖特地隔天涯師舉問僧汝作麼生會僧無語乃謂侍者曰某甲不會請代一轉語者曰和尚與麼道猶隔天涯在僧舉似師師喚侍者問汝為這僧代語是否者曰是師便打趂出院杭州龍華寺靈照真覺禪師高麗人也萍遊閩越升雪峰之堂冥符玄旨居唯一衲服勤衆務閩中謂之照布衲一夕指半月問溥上座曰那一片甚麼處去也溥曰莫妄想師曰失却一片也衆雖歎美而恬淡自持初住婺州齊雲山上堂良久忽舒手顧衆曰乞取些子乞取些子又曰一人傳虗萬人傳實僧問草童能歌舞未審今時還有無師下座作舞曰沙彌會麼曰不會師曰山僧踏曲子也不會問還丹一粒點鐵成金至理一言轉凡成聖請師一點師曰還知齊雲點金成鐵麼曰點金成鐵前之未聞至理一言敢希垂示師曰句下不薦後悔難追次遷越州鏡清上堂今日盡令去也時有僧出曰請師盡令師乃吽吽問如何是學人本分事師曰鏡清不惜口問請師雕琢師曰八成曰為甚麼不十成師曰還知鏡清生修理麼問僧甚處來曰五峰來師曰來作甚麼曰禮拜和尚師曰何不自體曰禮了也師曰鏡湖水淺問如何是第一句師曰莫錯下名言曰豈無方便師曰烏頭養雀兒問向上一路千聖不傳未審甚麼人傳得師曰千聖也疑我曰莫便是傳也無師曰晉帝斬嵆康問釋迦掩室於摩竭淨名杜口於毗耶此意如何師曰東廊下兩兩三三上堂諸方以毗盧法身為極則鏡清這裏即不然須知毗盧有師法身有主僧問如何是毗盧師法身主師曰二公爭敢論問古人道見色便見心此即是色阿那箇是心師曰恁麼問莫欺山僧麼問未剖以前請師斷師曰落在甚麼處曰失口即不可師曰也是寒山送拾得僧禮拜師曰住住闍黎失口山僧失口曰惡虎不食子師曰驢頭出馬頭回師驀問一僧記得麼曰記得師曰道甚麼曰道甚麼師曰淮南小兒入寺問是甚麼即俊鷹俊鷂趂不及師曰闍黎別問山僧別答曰請師別答師曰十里行人較一程問金屑雖貴眼裏著不得時如何師曰著不得還著得麼僧禮拜師曰深沙神問菩提樹下度衆生如何是菩提樹師曰大似苦練樹曰為甚麼似苦練樹師曰素非良馬何勞鞭影晉天福丁未示寂塔于杭之大慈山明州翠巖令參永明禪師安吉州人也僧問不借三寸請師道師曰茶堂裏貶剝去問國師三喚侍者意旨如何師曰抑逼人作麼上堂一夏與兄弟東語西話看翠巖眉毛在麼長慶云生也雲門云關保福云作賊人心虛翠巖芝云為衆竭力禍出私門問凡有言句盡是點汙如何是向上事師曰凡有言句盡是點汙問如何是省要處師曰大衆笑汝問還丹一粒點鐵成金至理一言轉凡成聖學人上來請師一點師曰不點曰為甚麼不點師曰恐汝落凡聖曰乞師至理師曰侍者點茶來問古人拈槌堅拂意旨如何師曰邪法難扶問僧繇為甚寫志公真不得師曰作麼生合殺問險惡道中以何為津梁師曰藥山再三叮囑問不帶凡聖當機何示師曰莫向人道翠巖靈利問妙機言句盡皆不當宗乘中事如何師曰禮拜著曰學人不會師曰出家行腳禮拜也不會師後遷龍册而終焉越州鏡清寺道怤順德禪師永嘉陳氏子六歲不葷茹親黨強啖以枯魚隨即嗢噦遂求出家于本州開元寺受具遊方抵閩謁雪峰峰問甚處人曰溫州人峰曰恁麼則與一宿覺是鄉人也曰祇如一宿覺是甚麼處人峰曰好喫一頓棒且放過一日師問祇如古德豈不是以心傳心峰曰兼不立文字語句師曰祇如不立文字語句師如何傳峰良久師禮謝峰曰更問我一轉豈不好師曰就和尚請一轉問頭峰曰祇恁麼為別有商量師曰和尚恁麼即得峰曰於汝作麼生師曰孤負殺人雪峰謂衆曰堂堂密密地師出問是甚麼堂堂密密峰起立曰道甚麼師退步而立雪峰垂語曰此事得恁麼尊貴得恁麼綿密師曰道怤自到來數年不聞和尚恁麼示誨峰曰我向前雖無如今已有莫有所妨麼曰不敢此是和尚不已而已峰曰致使我如此師從此信入而且隨衆時謂之小怤布衲普請次雪峰舉溈山道見色便見心汝道還有過也無師曰古人為甚麼事峯曰雖然如此要共汝商量師曰恁麼則不如道怤鉏地去師再參雪峰峰問甚處來師曰嶺外來峰曰甚麼處逢見達磨師曰更在甚麼處峰曰未信汝在師曰和尚莫恁麼粘泥好峰便休師後遍歷諸方益資權智因訪先曹山山問甚麼處來師曰昨日離明水山曰甚麼時到明水師曰和尚到時到山曰汝道我甚麼時到師曰適來猶記得山曰如是如是師初住越州鏡清唱雪峰之旨學者奔湊副使皮光業者日休之子辭學宏贍屢擊難之退謂人曰怤師之高論人莫窺其極也新到參師拈起拂子僧曰久嚮鏡清猶有這箇在師曰鏡清今日失利問學人啐請師師曰還得活也無曰若不活遭人怪笑師曰也是草裏漢問僧近離甚處曰三峰師曰夏在甚處曰五峰師曰放你三十棒曰過在甚麼處師曰為汝出一叢林入一叢林師一日於僧堂自擊鐘曰玄沙道底玄沙道底僧問玄沙道甚麼師乃畫一圓相僧曰若不久參爭知與麼師曰失錢遭罪師住菴時有行者至徐徐近繩牀取拂子提起問某甲喚這箇作拂子庵主喚作甚麼師曰不可更安名立字也行者乃擲却拂子曰著甚死急問僧外面是甚麼聲曰蛇咬蝦蟇聲師曰將謂衆生苦更有苦衆生師問靈雲行腳事大乞師指南雲曰浙中米作麼價師曰若不是道怤洎作米價會却問如何是靈源一直道師曰鏡湖水可煞深問如何是清淨法身師曰紅日照青山曰如何是法身向上事師曰風吹雪不寒問僧趙州喫茶話汝作麼生會僧便出去師曰邯鄲學唐步問學人未達其源請師方便師曰是甚麼源曰其源師曰若是其源爭受方便僧禮拜退侍者問和尚適來莫是成褫伊麼師曰無曰莫是不成褫伊麼師曰無曰未審意旨如何師曰一點水墨兩處成龍師在帳中坐有僧問訊師撥開曰當斷不斷反招其亂曰既是當斷為甚麼不斷師曰我若盡法直恐無民曰不怕無民請師盡法師曰維那拽出此僧著又曰休休我在南方識伊和尚來普請鉏草次浴頭請師浴師不顧如是三請師舉钁作打勢頭便走師召曰來來頭回首師曰向後遇作家分明舉似頭後到保福舉前話語未了福以手掩其口頭却回舉似師師曰饒伊恁麼也未作家師問荷玉甚處來曰天台來師曰阿誰問汝天台曰和尚何得龍頭蛇尾帥曰鏡清今日失利師看經次僧問和尚看甚麼經師曰我與古人鬪百草師却問汝會麼曰少年也曾恁麼來師曰如今作麼生僧舉拳師曰我輸汝也問辨不得提不起時如何師曰爭得到這裏曰恁麼則禮拜去也師曰鏡清今日失利師見僧學書乃問學甚麼書曰請和尚鑒師曰一點未分三分著地曰今日又似遇人又似不遇人師曰鏡清今日失利僧問聲前絶妙請師指歸師曰許由不洗耳曰為甚麼如此師曰猶繫腳在曰某甲祇如此師意又如何師曰無端夜來鴈驚起後池秋錢王命居天龍寺後創龍册寺延請居焉上堂如今事不得已向汝道各自驗看實箇親切既恁麼親切到汝分上因何特地生踈祇為拋家日久流浪年深一向緣塵致見如此所以喚作背覺合塵亦名捨父逃逝今勸兄弟未歇歇去好未徹徹去好大丈夫兒得恁麼無氣槩還惆悵麼終日茫茫地且覓取箇管帶路好也無人問我管帶一路僧問如何是管帶一路師噓噓曰要棒喫即道曰恁麼則學人罪過也師曰幾被汝打破蔡州問僧近離甚處曰石橋師曰本分事作麼生曰近離石橋師曰我豈不知你近離石橋本分事作麼生曰和尚何不領話師便打僧曰某甲話在師曰你但喫棒我要這話行僧問一等明機雙扣為甚麼却遭違貶師曰打水魚頭痛驚林鳥散忙問十二時中以何為驗師曰得力即向我道僧曰諾師曰十萬八千猶可近問如何是方便門速易成就師曰速易成就曰爭奈學人領覽未的師曰代得也代却問如何是人無心合道師曰何不問道無心合人曰如何是道無心合人師曰白雲乍可來青嶂明月那教下碧天問新年頭還有佛法也無師曰有曰如何是新年頭佛法師曰元正啓祚萬物咸新曰謝師答話師曰鏡清今日失利問學人問不到處請師不答和尚答不到處學人即不問師乃搊住曰是我道理是汝道理曰和尚若打學人學人也打和尚師曰得對相耕去問承師有言諸方若不是走人便是籠人人未審和尚如何師曰被汝致此一問直得當門齒落上堂衆集定師拋下拄杖曰大衆動著也二十棒不動著也二十棒時有僧出拈得頭上戴出去師曰鏡清今日失利問僧門外甚麼聲曰雨滴聲師曰衆生顛倒迷己逐物曰和尚作麼生師曰洎不迷己曰洎不迷己意旨如何師曰出身猶可易脫體道應難問如何是同相師將火筯插向爐中曰如何是別相師又將火筯插向一邊法眼別云問不當理有僧引一童子到曰此童子常愛問人佛法請和尚驗看師乃令點茶童子點茶來師啜了過盞槖與童子子近前接師却縮手曰還道得麼子曰問將來法眼別云和尚更喫茶否僧曰此童子見解如何師曰也祇是一兩生持戒僧晉天福初示滅塔于龍册山漳州報恩院懷嶽禪師泉州人也僧問十二時中如何行履師曰動即死曰不動時如何師曰猶是守古冢鬼問如何是學人出身處師曰有甚麼纏縛汝曰爭奈出身不得何師曰過在阿誰問如何是報恩一靈物師曰喫如許多酒糟作麼曰還露腳手也無師曰這裏是甚麼處所問牛頭未見四祖時如何師曰萬里一片雲曰見後如何師曰廓落地問黑雲陡暗誰當雨者師曰峻處先傾問宗乘不却如何舉唱師曰山不自稱水無間斷問佛未出世時如何師曰汝爭得知問撥塵見佛時如何師曰甚麼年中得見來問師子在窟時如何師曰師子是甚麼家具曰師子出窟時如何師曰師子在甚麼處問如何是目前佛師曰快禮拜臨遷化上堂山僧十二年來舉揚宗教諸人怪我甚麼處若要聽三經五論此去開元寺咫尺言訖告寂福州安國院弘明真禪師泉州陳氏子參雪峰峰問甚麼處來曰江西來峰曰甚麼處見達磨曰分明向和尚道峰曰道甚麼曰甚麼處去來一日雪峰見師忽搊住曰盡乾坤是箇解脫門把手拽伊不肯入曰和尚怪弘不得峰拓開曰雖然如此爭奈背後許多師僧何師舉國師碑文云得之於心猗蘭作旃檀之樹失之於旨甘露乃蒺藜之園問僧曰一語須具得失兩意汝作麼生道僧舉拳曰不可喚作拳頭也師不肯亦舉拳別云祇為喚這箇作拳頭出世囷山後閩帥命居安國大闡玄風僧問如何是西來意師曰是即是莫錯會問如何是第一句師曰問問問學人上來未盡其機請師盡機師良久僧禮拜師曰忽到別處人問汝作麼生舉曰終不敢錯舉師曰未出門已見笑具問如何是達磨傳底心師曰素非後躅問不落有無之機請師全道師曰汝試斷看問如何是一毛頭事師拈起袈裟僧曰乞師指示師曰抱璞不須頻下淚來朝更獻楚王看問寂寂無言時如何師曰更進一步問凡有言句皆落因緣方便不落因緣方便事如何師曰桔槔之士頻逢抱甕之流罕遇問向上一路千聖不傳未審和尚如何傳師曰且留口喫飯著問如何是高尚底人師曰河濵無洗耳之叟磻溪絶垂釣之人問十二時中如何救得生死師曰執鉢不須窺衆樂履冰何得步參差問學人擬問宗乘師還許也無師曰但問僧擬問師便喝出問目前生死如何免得師曰把將生死來問知有底人為甚麼道不得師曰汝爺名甚麼問如何是活人劒師曰不敢瞎却汝曰如何是殺人刀師曰祇這箇是問不犯鋒鋩如何知音師曰驢年去問苦澀處乞師一言師曰可煞沈吟曰為甚麼如此師曰也須相悉好問常居正位底人還消得人天供養否師曰消不得曰為甚麼消不得師曰是甚麼心行曰甚麼人消得師曰著衣喫飯底消得師舉稜和尚住招慶時在法堂東角立謂僧曰這裏好致一問僧便問和尚為何不居正位稜曰為汝恁麼來曰即今作麼生稜曰用汝眼作麼師舉畢乃曰他家恁麼問別是箇道理汝今作麼生道後安國曰恁麼則大衆一時散去得也師自代曰恁麼即大衆一時禮拜泉州睡龍山道溥弘教禪師福唐鄭氏子初住五峰上堂莫道空山無祇待便歸方丈僧問凡有言句不出大千頂未審頂外事如何師曰凡有言句不是大千頂曰如何是大千頂師曰摩醯首羅天猶是小千界問初心後學近入叢林方便門中乞師指示師敲門枋僧曰向上還有事也無師曰有曰如何是向上事師再敲門枋南嶽金輪可觀禪師福唐薛氏子參雪峰峰曰近前來師方近前作禮峰與一踏師忽契悟師事十二載復歷叢林住後上堂我在雪峰遭他一踏直至如今眼不開不知是何境界僧問如何是西來意師曰不是大衆夜參後下堂師召大衆衆回首師曰看月衆乃看師曰月似彎弓少雨多風衆無對問古人道毗盧有師法身有主如何是毗盧師法身主師曰不可牀上安牀問如何是日用事師拊掌三下僧曰學人未領此意師曰更待甚麼問從上宗乘如何為人師曰我今日未喫茶曰請師指示師曰過也問正則不問請師傍指師曰抱取貓兒去問僧甚處來曰華光師便推出閉却門僧無對問路逢達道人不將語默對未審將何對師咄曰出去問僧作麼生是覿面事曰請師鑒師曰恁麼道還當麼曰故為即不可師曰別是一著問如何是靈源一路師曰踏過作麼雪峰院主有書來招曰山頭和尚年尊也長老何不再入嶺一轉師回書曰待山頭和尚別有見解即再入嶺僧問如何是雪峰見解師曰我也驚福州大普山玄通禪師本郡人也僧問驪龍頷下珠如何取得師乃拊掌瞬視問方便以前事如何師便推出其僧問如何是祖師西來意師曰咬骨頭漢出去問撥塵見佛時如何師曰脫枷來商量問急急相投請師接師曰鈍漢福州長生山皎然禪師本郡人久依雪峰一日與僧斫樹次峯曰斫到心且住師曰斫却著峰曰古人以心傳心汝為甚麼道斫却師擲下斧曰傳峯打一拄杖而去僧問雪峰如何是第一句峰良久僧舉似師師曰此是第二句峰再令其僧來問如何是第一句師曰蒼天蒼天普請次雪峰問古人道誰知席帽下元是昔愁人古人意作麼生師側戴笠子曰這箇是甚麼人語峰問師持經者能荷擔如來作麼生是荷擔如來師乃捧雪峰向禪床上普請次雪峰負一束藤路逢一僧便拋下僧擬取峰便踏倒歸謂師曰我今日踏這僧快師曰和尚却替這僧入涅槃堂始得峰便休去雪峰問光境俱亡復是何物師曰放皎然過有道處峰曰放汝過作麼生道曰皎然亦放和尚過峰曰放汝二十棒師便禮拜住後僧問古人有言無明即佛性煩惱不須除如何是無明即佛性師忿然作色舉拳呵曰今日打這師僧去也曰如何是煩惱不須除師以手拏頭曰這師僧得恁麼發人業問路逢達道人不將語默對未審將甚麼對師曰上紙墨堪作甚麼閩帥署禪主大師莫知所終信州鵝湖智孚禪師福州人也僧問萬法歸一一歸何所師曰非但闍黎一人忙問虗空講經以何為宗師曰闍黎不是聽衆出去問五逆之子還受父約也無師曰雖有自裁未免傷己問如何是佛向上人師曰情知闍黎不奈何曰為甚麼不奈何師曰未必小人得見君子問在前一句請師道師曰腳跟下探取甚麼曰即今見問師曰看闍黎變身不得問雪峰拋下拄杖意作麼生師以香匙拋下地僧曰未審此意如何師曰不是好種出去問如何是鵝湖第一句師曰道甚麼曰如何即是師曰妨我打睡問不問不答時如何師曰問人焉知問迷子未歸家時如何師曰不在途曰歸後如何師曰正迷在問如何是源頭事師曰途中覓甚麼問如何是一句師曰會麼曰恁麼莫便是否師曰蒼天蒼天鏡清問如何是即今底師曰何更即今清曰幾就支荷師曰語逆言順師一日不赴堂侍者來請赴堂師曰我今日在莊喫油糍飽者曰和尚不曾出入師曰你但去問取莊主者方出門忽見莊主歸謝和尚到莊喫油糍杭州西興化度院師郁悟真禪師泉州人也僧問如何是西來意師舉拂子僧曰不會師曰喫茶去問如何是一塵師曰九世剎那分曰如何含得法界師曰法界在甚麼處問溪谷各異師何明一師曰汝喘作麼問學人初機乞師指示入路師曰汝怪化度甚麼處問如何是隨色摩尼珠師曰青黃赤白曰如何是不隨色摩尼珠師曰青黃赤白問如何是西來意師曰是東來西來問牛頭未見四祖時如何師曰鳥獸俱迷曰見後如何師曰山深水冷問維摩與文殊對談何事師曰唯有門前鏡湖水清風不改舊時波漳州隆壽紹卿興法禪師泉州陳氏子因侍雪峰山行見芋葉動峰指動葉示之師曰紹卿甚生怕怖峰曰是汝屋裏底怕怖甚麼師於此有省尋居龍溪僧問古人道摩尼殿有四角一角常露如何是常露底角師舉拂子問糧不畜一粒如何濟得萬人飢師曰俠客面前如奪劒看君不是黠兒郎問耳目不到處如何師曰汝無此作曰恁麼即聞也師曰真箇聾漢福州遷宗院行仁慧禪師泉州王氏子上堂我與釋迦同參汝道參甚麼人時有僧出禮拜擬伸問師曰錯便下座問如何是西來意師曰熊耳不曾藏問直下事乞師方便師曰不因汝問我亦不道問如何是西來意師曰白日無間人福州蓮華永福院從弇超證禪師僧問儒門以五常為極則未審宗門以何為極則師良久僧曰恁麼則學人造次也師曰好與拄杖問教中道唯有一乘法如何是一乘法師曰汝道我在這裏作甚麼曰恁麼則不知教意也師曰雖然如此却不孤負汝問不向問處領猶是學人問處和尚如何師曰喫茶去上堂長慶道盡法無民永福即不然若不盡法又爭得民時有僧曰請師盡法師曰我不要汝納稅問諸餘即不問聊徑處乞師垂慈師曰不快禮三拜問大衆雲集請師説法師曰聞麼曰若更佇思應難得及師曰實即得問摩尼殿有四角一角常露如何是常露底角師曰不可更點師一日上堂於座邊立謂衆曰二尊不並化便歸方丈襄州雲蓋雙泉院歸本禪師京兆府人也初謁雪峰禮拜次峰下禪牀跨背而坐師於此有省住後僧問如何是雙泉師曰可惜一雙眉曰學人不會師曰不曾煩禹力湍流事不知問如何是西來的的意師乃搊住其僧變色師曰我這裏無這箇師手指纖長特異於人號手相大師韶州林泉和尚僧問如何是一塵師曰不覺成丘山洛京南院和尚僧問如何是法法不生師曰生也有儒者博覽古今時呼為張百會謁師師問莫是張百會麼曰不敢師以手於空畫一畫曰會麼曰不會師曰一尚不會甚麼處得百會來越州洞巖可休禪師僧問如何是洞巖正主師曰開著問如何是和尚親切為人處師曰大海不宿死尸問如何是向上一路師舉衣領示之問學人遠來請師方便師曰方便了也定州法海院行周禪師僧問風恬浪靜時如何師曰吹倒南墻問如何是道中寶師曰不露光曰莫便是否師曰是即露也杭州龍井通禪師僧問如何是龍井龍師曰意氣天然別神工畫不成曰為甚麼畫不成師曰出羣不帶角不與類中同曰還解行雨也無師曰普潤無邊際處處皆結粒曰還有宗門中事也無師曰有曰如何是宗門中事師曰從來無形段應物不曾虧杭州龍興宗靖禪師台州人也初參雪峰誓充飯頭勞逾十載嘗於衆堂中袒一膊釘簾峰覩而記曰汝向後住持有千僧其中無一人衲子也師悔過回浙住六通院錢王命居龍興寺有衆千餘唯三學講誦之徒果如雪峰所志僧問如何是六通奇特之唱師曰天下舉將去問如何是六通家風師曰一條布衲一斤有餘問如何是學人進前一路師曰誰敢謾汝曰豈無方便師曰早是屈抑也問如何是和尚家風師曰早朝粥齋時飯曰更請和尚道師曰老僧困曰畢竟作麼生師大笑而已福州南禪契璠禪師上堂若是名言妙句諸方總道了也今日衆中還有超第一義者致將一問來若有即不孤負於人僧問如何是第一義師曰何不問第一義曰見問師曰已落第二義也問古佛曲調請師和師曰我不和汝雜亂底曰未審為甚麼人和師曰甚麼處去來越州越山師鼐鑒真禪師初參雪峰而染指後因閩王請於清風樓齋坐久舉目忽覩日光豁然頓曉而有偈曰清風樓上赴官齋此日平生眼豁開方信普通年遠事不從𦵇嶺帶將來歸呈雪峰峰然之住後僧問如何是佛身師曰你問阿那箇佛身曰釋迦佛身師曰舌覆三千界師臨終示偈曰眼光隨色盡耳識逐聲消還源無別旨今日與明朝乃跏趺而逝泉州福清院玄訥禪師高麗人也泉守王公問如何是宗乘中事師叱之僧問如何是觸目菩提師曰闍黎失却半年糧曰為甚麼如此師曰祇為圖他一斗米問如何是清淨法身師曰蝦蟇曲問教云唯一堅密身一切塵中現如何是堅密身師曰驢馬貓兒曰乞師指示師曰驢馬也不會問如何是物物上辨明師展一足示之衢州南臺仁禪師僧問如何是南臺境師曰不知貴曰畢竟如何師曰闍黎即今在甚麼處泉州東禪和尚初開堂僧問人王迎請法王出世如何提唱宗乘即得不謬於祖風師曰還奈得麼曰若不下水焉知有魚師曰莫間言語問如何是佛法最親切處師曰過也問學人末後來請師最先句師曰甚處去來問如何是學人己分事師曰苦問如何是佛法大意師曰幸自可憐生剛要異鄉邑杭州大錢山從襲禪師雪峰之上足也自本師印解洞曉宗要常曰擊關南鼓唱雪峰歌後入浙中謁錢王王欽服道化命居此山而闡法焉僧問不因王請不因衆聚請師直道西來的的意師曰那邊師僧過這邊著曰學人不會乞師再指師曰爭得恁麼不識好惡問閉門造車出門合轍如何是閉門造車師曰造車即不問作麼生是轍曰學人不會乞師指示師曰巧匠施工不露斤斧福州永泰和尚僧問承聞和尚見虎是否師作虎聲僧作打勢師曰這死漢問如何是天真佛師乃拊掌曰不會不會池州和龍壽昌院守訥妙空禪師福州林氏子僧問未到龍門如何湊泊師曰立命難存新到參師問近離甚處曰不離方寸師曰不易來僧亦曰不易來師與一掌問如何是傳底心師曰再三囑汝莫向人説問如何是從上宗乘師曰向闍黎口裏著得麼問省要處請師一接師曰甚是省要建州夢筆和尚僧問如何是佛師曰不誑汝曰莫便是否師曰汝誑他閩王請齋問師還將得筆來也無師曰不是稽山繡管慙非月裏兔毫大王既垂顧問山僧敢不通呈又問如何是法王師曰不是夢筆家風福州極樂元儼禪師僧問如何是極樂家風師曰滿目看不盡問萬法本無根未審教學人承當甚麼師曰莫寐語問久處暗室未達其源今日上來乞師一接師曰莫閉眼作夜好曰恁麼即優曇華拆曲為今時向上宗風如何垂示師曰汝還識也無曰恁麼即息疑去也師曰莫向大衆前寐語問摩騰入漢即不問達磨來梁時如何師曰如今豈謬曰恁麼即理出三乘華開五葉師曰説甚麼三乘五葉出去福州芙蓉山如體禪師僧問如何是古人曲調師良久曰聞麼曰不聞師示頌曰古曲發聲雄今時韻亦同若教第一指祖佛盡迷蹤洛京憩鶴山和尚僧問如何是憩鶴師以兩手鬪云鵓鳩鳩風穴云鶴唳一聲喧宇宙羣雞莫謂報知時問駿馬不入西秦時如何師曰向甚麼處去潭州溈山棲禪師僧問正恁麼時如何親近師曰汝擬作麼生親近曰豈無方便師曰開元龍興大藏小藏問如何是速疾神通師曰新衣成弊帛問如何是黃尋橋師曰賺却多少人問不假忉忉如何是和尚家風師曰莫作野干聲吉州潮山延宗禪師因資福來謁師下禪牀相接福問和尚住此山得幾年也師曰鈍鳥棲蘆困魚止濼曰恁麼則真道人也師曰且坐喫茶問如何是潮山師曰不宿尸曰如何是山中人師曰石上種紅蓮問如何是和尚家風師曰切忌犯朝儀益州普通山普明禪師僧問如何是佛性師曰汝無佛性曰蠢動含靈皆有佛性學人為何却無師曰為汝向外求問如何是玄玄之珠師曰這箇不是曰如何是玄玄珠師曰失却也隨州雙泉山梁家庵永禪師僧問達磨九年面壁意旨如何師曰睡不著師問護國長老隨陽一境是男是女各伸一問問問各別長老將何祇對國以手空中畫一圓相師曰謝長老慈悲國曰不敢師低頭不顧問如何是頓息諸緣去師曰雪上更加霜漳州保福院超悟禪師僧問魚未透龍門時如何師曰養性深潭曰透出時如何師曰才升霄漢衆類難追曰升後如何師曰垂雲普覆潤及大千曰還有不受潤者也無師曰有曰如何是不受潤者師曰直杌撑大陽太原孚上座初在揚州光孝寺講涅槃經有禪者阻雪因往聽講至三因佛性三德法身廣談法身妙理禪者失笑師講罷請禪者喫茶白曰某甲素志狹劣依文解義適蒙見笑且望見教禪者曰實笑座主不識法身師曰如此解説何處不是曰請座主更説一遍師曰法身之理猶若太虗竪窮三際橫亘十方彌綸八極包括二儀隨緣赴感靡不周遍曰不道座主説不是祇是説得法身量邊事實未識法身在師曰既然如是禪德當為我説曰座主還信否師曰焉敢不信曰若如是座主輟講旬日於室內端然靜慮收心攝念善惡諸緣一時放却師一依所教從初夜至五更聞鼓角聲忽然契悟便去扣門禪者曰阿誰師曰某甲禪者咄曰教汝傳持大教代佛説法夜來為甚麼醉酒臥街師曰禪德自來講經將生身父母鼻孔扭揑從今已去更不敢如是禪者曰且去來日相見師遂罷講遍歷諸方名聞宇內嘗遊浙中登徑山法會一日於大佛殿前有僧問上座曾到五臺否師曰曾到曰曾見文殊麼師曰見曰甚麼處見師曰徑山佛殿前見其僧後適閩川舉似雪峰峰曰何不教伊入嶺來師聞乃趣裝而邁初至雪峰廨院憩錫因分柑子與僧長慶問甚麼處將來師曰嶺外將來曰遠涉不易擔負得來師曰柑子柑子次日上山雪峰聞乃集衆師到法堂上顧視雪峰便下看知事明日却上禮拜曰某甲昨日觸忤和尚峰曰知是般事便休峰一日見師乃指日示之師搖手而出峰曰汝不肯我那師曰和尚搖頭某甲擺尾甚麼處是不肯峰曰到處也須諱却一日衆僧晚參峰在中庭臥師曰五州管內祇有這老和尚較些子峰便起去峰嘗問師見説臨濟有三句是否師曰是曰作麼生是第一句師舉目視之峰曰此猶是第二句如何是第一句師叉手而退自此雪峰深器之室中印解師資道契更不他遊而掌浴焉一日玄沙上問訊雪峰峰曰此間有箇老鼠子今在浴室裏沙曰待與和尚勘過言訖到浴室遇師打水沙曰相看上座師曰已相見了沙曰甚麼劫中曾相見師曰瞌睡作麼沙却入方丈白雪峰曰已勘破了峰曰作麼生勘伊沙舉前話峰曰汝著賊也鼓山問師父母未生時鼻孔在甚麼處師曰老兄先道山曰如今生也汝道在甚麼處師不肯山却問作麼生師曰將手中扇子來山與扇子再徵前話師搖扇不對山罔測乃驅師一拳鼓山赴大王請雪峰門送回至法堂乃曰一隻聖箭直射九重城裏去也師曰是伊未在峰曰渠是徹底人師曰若不信待某甲去勘過遂趂至中路便問師兄向甚麼處去山曰九重城裏去師曰忽遇三軍圍繞時如何山曰他家自有通霄路師曰恁麼則離宮失殿去也山曰何處不稱尊師拂袖便回峰問如何師曰好隻聖箭中路折却了也遂舉前話峰乃曰奴渠語在師曰這老凍膿猶有鄉情在師在庫前立有僧問如何是觸目菩提師踢狗子作聲走僧無對師曰小狗子不消一踢保福簽瓜次師至福曰道得與汝瓜喫師曰把將來福度與一片師接得便去師不出世諸方目為太原孚上座後歸維揚陳尚書留在宅供養一日謂尚書日來日講一遍大涅槃經報答尚書書致齋茶畢師遂升座良久揮尺一下曰如是我聞乃召尚書書應諾師曰一時佛在便乃脫去南嶽般若惟徑寶聞禪師福州人也師雪峰而友玄沙深入玄奧一日問鑑上座聞汝注楞嚴是否鑑曰不敢師曰二文殊作麼生注曰請師鑑師乃揚袂而去師嘗續寶林傳四卷紀貞元之後宗門繼踵之源流者又別著南嶽高僧傳皆行于世感潭資國禪師法嗣安州白兆志圓顯教禪師僧問諸佛心印甚麼人傳師曰達磨大師曰達磨爭能傳得師曰汝道甚麼人傳得問如何是直截一路師曰截問如何是佛法大意師曰苦問如何是道師曰普問如何是學人自己師曰失問如何是得無山河大地去師曰不起見問如何是畢鉢羅窟迦葉道場中人師曰釋迦牟尼佛問如何是朱頂王菩薩師曰問那箇赤頭漢作麼音釋謴古困切𤞞余玉切譸竹尤切嗢烏汶切噦乙劣切
